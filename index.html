conseguem tolerar quaisquer interferências em seu trabalho. Mesmo quando apresentam uma ideia já consagrada, conseguem fazê-lo sempre sob um outro ângulo. São criativos, inventivos e têm atitudes positivas e otimistas.","Possuem constituição forte, mais vitalidade que as outras pessoas e são capazes de realizar trabalhos físicos árduos. De espírito elevado, são generosos e muito trabalhadores, além de pouca ou quase nenhuma inveja, maldade ou rancor. Eficientes na profissão, honestos e fidedignos.","Gostam de dar presentes e partilhar as riquezas com amigos e hóspedes, com os quais não poupam despesas. Entusiastas em matéria de religião acreditam que nasceram com uma missão, mesmo que isso signifique sacrifício ou inconveniência. Enfrentam os altos e baixos da vida sem perder o controle e a coragem mas não gostam de ser criticados embora adoram criticar os outros. Têm bom gosto - abominam a desordem, a preguiça, o desleixo, o falso orgulho, a falsa modéstia, falsas promessas, egoísmo e bajulação."],"2":["Para quem nasceu nos dias 2 ou 11 ou 20 ou 29.","Os nascidos no dia 11 são rápidos nas respostas, otimistas e capazes de guiar os outros em meio a situações difíceis. Contando com uma boa orientação e apoio adequado, podem alcançar grande sucesso material.","O número 2 é regido pela Lua e confere ternura, inclinação artística e natureza romântica.","Pacíficos e gentis, natureza imaginativa os torna inventivos, mas lhes falta determinação e têm pouca capacidade para pôr em prática as suas ideias. As mudanças de fases da Lua os influenciam mais que as outras pessoas de outros números psíquicos. Assim como a Lua reflete a luz do Sol, as pessoas de número psíquico 2 tendem a refletir a influência do meio em que vivem. Por sua natureza inconstante, raciocinam com rapidez, envolvem-se emocionalmente com outras pessoas e enfrentam dificuldades com isso.","São amantes da humanidade como um todo e cultivam a filosofia de uma coexistência pacífica–viver e deixar viver. Pelo fato de detestarem discórdias são bons árbitros capazes de conciliar interesses e apaziguar desavenças com tal arte que todas as partes envolvidas saem satisfeitas.","Possuem as qualidades dos bons diplomatas. Devido às preocupações constantes, sustentadas por uma natureza imaginativa e fantasiosa, têm algumas vezes que ouvir palavras ásperas de amigos e parentes. Embora reconheçam seus erros com facilidade e lastimem, dificilmente mudam de atitude, nem melhoram, e cometem os mesmos erros repetidas vezes sofrendo com isso.","São intuitivos. Quando há harmonia entre o seu número psíquico e o seu número de destino revela que, apesar de sua constituição psíquica delicada, reúnem forças e autoconfiança."],"3":["São independentes, bem audazes, ativos, populares, muito trabalhadores, disciplinados, autoconfiantes e pioneiros. Ambiciosos, querem fazer algo grandioso em suas vidas para serem lembrados na posteridade; querem muito vencer na vida. Por esse motivo, são muito conscientes do futuro.","Não gostam de ser subalternos, nem apreciam os serviços de menor importância. Pensam em grandes projetos e tentam criar negócios para si mesmos. Amam o sucesso e desejam ser bem sucedido em tudo o que fazem. Normalmente executam até o fim qualquer trabalho que empreendem. Isso lhes confere credibilidade e confiança. Despendem suas energias em busca de soluções práticas que tornem a existência mais colorida, alegre e desfrutável.","Têm muita consciente de suas responsabilidades, dotados de agudo senso de observação lógica, lutam com mente aberta e chegam a uma boa compreensão da vida. Por ser muito versados na arte da conversação e poder exprimir-se com clareza, são bons oradores conselheiros, professores e até escritores.","Flexíveis em suas ideias adotam com a maior liberdade o melhor de todas as seitas religiosas, e, embora não se comprometam com nenhum credo convencional, na verdade, são profundamente religiosos, acreditam na verdade, em sua aplicação prática e na beleza de sua expressão na vida.","Atraem e estão quase sempre rodeados por pessoas do sexo oposto. Certa fraqueza por sexo constitui um de seus problemas, porém, são seletivos e só se envolvem em relações refinadas que lhes são benéficas.","Normalmente são leais e fieis companheiros, mesmo se não respeitados na relação. São auxiliares universais; quando solicitados, ajudam sem distinção, até mesmo os inimigos. Dedicam-se a todas as boas causas, as quais oferecem, imediatamente, seu apoio irrestrito. Adoram viajar e se beneficiam das viagens que fazem.","Seu maior defeito consiste em ser demasiados ambiciosos, excessivamente otimistas e pra lá de extravagantes."],"4":["As características mais evidentes são: obstinação, teimosia e ceticismo. Mais uma boa dose de coragem e paciência para suportar a dor e o sofrimento sem ansiedade. Em uma discussão ou debate sério, sempre dão seu apoio às partes oprimidas ou injustiçadas. Um certo extremismo os coloca sempre na posição de oposição em se tratando de questões envolvendo governo ou o poder de um modo geral.","Não gostam da mediocridade, ou estão no topo ou na base, nunca se colocam no medianismo. Têm que lutar para crescer e se desenvolver e enfrentam obstáculos constantes em qualquer trabalho que empreendem, seja ele grande ou pequeno.","As críticas e oposições são constantes em toda a sua vida e fazem parte de seu aprendizado. Pelo fato de seu ponto de vista quase sempre divergir, e de se ocupar em defender os fracos e oprimidos das injustiças, acabam por criar problemas para si e também inimigos ocultos. Suas intenções, no entanto, são sempre puras, e sua natureza não é de serem briguentos. São bons e confiáveis amigos.","Interessam-se por todos os tipos de reformas – ambientais, sociais, comunitárias, domésticas. Por esse interesse, poderão sentir-se atraídos pela política, para organizações humanitárias, esotéricas, espirituais, onde poderão ser lideres de ações que causam grandes transformações.","Por sua natureza rebelde, instintivamente se revoltam contra regras e regulamentos que impossibilitem suas ações. Muitas vezes não hesitam nem mesmo em infringir a lei. Possuem bom gosto pelas artes, adoram visitar exposições, frequentar teatro, concertos e adoram avaliar criticamente esses eventos. Podem ser excelentes críticos de artes, mas suas ideias não primam pela clareza.","Suas amizades são poucas porém, quase sempre vitalícias. Sentem-se constantemente mal compreendidos pelas pessoas. Por seu temperamento ser tão reservado, não expressam as emoções e sentimentos, e isso poderá lhes causar problemas cardíacos. Devem desenvolver maneiras que capacitem expressar livremente seus sentimentos, e manifestá-los com sinceridade."],"5":["O Número Psíquico 5 pertence a todas as pessoas nascidas nos dias 5, 14 e 23 de cada mês. As pessoas nascidas no dia 23 geralmente são as mais afortunadas. As pessoas de número psíquico 5 são índole frágil e delicada, são pensadores de alto nível. Estudiosos por natureza,procuram aprender a cada minuto. Suas mentes ativas estão sempre às voltas com um pensamento.","Amam o divertimento e se esforçam para estarem sempre alegres e criar uma atmosfera feliz ao seu redor. Isso, às vezes, consome muito de sua energia, uma vez que ninguém pode fazer todo mundo feliz.","Rápidos em suas decisões e bem impulsivos em seu comportamento, gostam de mudanças e não gostam de fazer planos de longo prazo, embora estejam sempre arquitetando novas maneiras de ganhar dinheiro. Têm propensão a correr riscos, com isso às vezes são levados aos jogos de azar com esperança de enriquecer dessa maneira e rapidamente.","Fazem amizades com muita facilidade e rapidez, mas por serem instáveis por natureza, essas amizades geralmente não duram muito.","São intuitivos por natureza, e podem apreender com precisão a atenção de qualquer pessoa.","Respondem todas as perguntas antes de seus interlocutores terminarem de formulá-las.","São adaptáveis, no entanto não são muito flexíveis em seu próprio lar e não gostam que as pessoas mexam ou alterem a ordem das coisas que arrumam. Têm facilidade para empatia; com as crianças, tornam-se criança; com os jovens, adaptam-se à sua maneira; e com os velhos, descobrem-se sábios.","São pródigos por natureza mas algumas das vezes tornam-se extravagantes. Viajantes por natureza ampliam seus conhecimentos e experiências em suas viagens."],"6":["A sua natureza é magnética, juvenil, delicada, suave no falar; são amantes do luxo, possuem gosto refinado e amam as artes. Atraem facilmente pessoas do sexo oposto e são amados e respeitados por elas. Gastam liberalmente, são sociáveis, e têm muita oportunidade de conhecer gente bonita e bem interessante.","Adoram viajar, principalmente para o exterior. Têm plena consciência de sua aparência física e procuram vestir-se de modo a estar sempre muito apresentáveis e atraentes. Abominam a feiura, sujeira, desordem, e o desregramento. Gostam de manter a sua casa asseada e em ordem; adoram decorar seu lar, sala ou escritório. Amam seu parceiro ou pessoa com quem vivem, em quaisquer circunstâncias, e procuram sempre agradar. Não gostam de permanecer em lugares tumultuados e não dão início a discussões. Se alguém começa uma alteração, fogem da situação e estão sempre prontos a fazer acordos para apaziguar.","Possuem rara inteligência e habilidade de ouvir, ficando assim sabendo das mais secretas revelações das outras pessoas sem muito esforço. São discretos e capazes de guardar segredos. Pensam antes de agir, o que lhes dá tempo, e apreciam esse hábito da morosidade acreditando que é devagar que se vai longe.","Não gostam que alguém vá contra a sua vontade, no entanto, não são impositivos nem exigentes; podem guardar seus sentimentos e ocultar a raiva sob um sorriso encantador. Sentem-se facilmente tocados pelo sofrimento de seus pais e procuram fazer de tudo para ajudá-los. Confiam nos amigos e nos membros de sua família."],"7":["Esse é o Número Psíquico das pessoas nascidas nos dias 7, 16 e 25 de qualquer mês. Dessas, as mais afortunadas são aquelas nascidas no dia 25 – Dia do Progresso.","As pessoas de número psíquico 7 tendem a serem revolucionários. Podem, algumas vezes, tornam-se indecisos, destrutivos, inquietos e muito temperamentais, devido a ter de enfrentar tantos fracassos e tentativas mal sucedidas até acertar. Porém, o fracasso é para eles a chave do sucesso. Pendem para os grandes mistérios da vida, para o esoterismo e para uma busca por desvendar as coisas ocultas.","São verdadeiramente espiritualistas e religiosos, bondosos de coração, românticos, sentimentais e nobres de alma. Tendem a deixar a marca de sua passagem na vida.","Possuem originalidade em sua forma de expressão e independência em seu enfoque da vida. Devido a seu enfoque filosófico, criam uma individualidade muito própria, e dão a velhos valores e verdades, uma nova e atualizada versão.","Advogam a liberdade individual e pessoal e não toleram a injustiça. Podem ser bons oradores e têm o dom de mobilizar a opinião pública em favor de seus argumentos; mesmo seus adversários são obrigados a concordar com seu ponto de vista. Sua personalidade apresenta diversas facetas – a incerteza é sua marca registrada. Externamente, parecem anárquicos e caóticos, mas por dentro são bem organizados e regulares em seu estilo de vida, por meio do qual mantêm sua saúde física e mental.","Amam os mistérios e mantêm ao seu redor um clima misterioso. São muito interessados por conhecimentos ocultos. Acreditam na coexistência pacifica e podem se adaptar a todo e qualquer ambiente desconhecido.","Têm boa memória e natureza flexível, discutem muitos assuntos e aconselham desinteressadamente as pessoas que os procuram em busca de orientação e conselho. Amam as montanhas e a natureza e adoram viajar para o estrangeiro. Podem ser bons escritores, pintores e poetas e podem exprimir suas ideias através de qualquer meio."],"8":["É o número psíquico das pessoas nascidas nos dias 8, 17 e 26 de qualquer mês.","O 8 é o número da segurança e determinação; também de mistérios. Seus nativos são, em geral, mal entendidos, mesmo por seus amigos e parentes mais chegados. São grandes trabalhadores que aceitam desafios sem vacilar; quando desafiados, tornam possível o impossível. São introvertidos, reservados, bem ponderados, profundos, sérios, às vezes melancólicos e mantêm uma aparência calma e bem equilibrada.","Muito sinceros com organizações sociais, grupos, comunidades ou famílias com os quais se associam, dedicando grande parte de suas vidas. Não recebem muita ajuda dos outros, sobretudo porque gostam de fazer tudo sozinhos e não gostam de ser ajudados nem de pedir ajuda. Dotados de forte presença, que às vezes aparenta ser um tanto pesada ou forte demais, possuem personalidade característica e bem definida.","Sua grande força de vontade e natureza sisuda outorga-lhes capacidade para tratar com sucesso qualquer assunto ou projeto. Suas vidas são repletas de lutas, porém, nunca desistem até alcançar os objetivos almejados.","O imprevisível faz parte de suas vidas; súbitas mudanças os mantêm ocupados, adaptando-se às novas circunstâncias. Seus estilos de vida os deixam pouco sociáveis, no entanto, seus poucos amigos têm o privilégio de penetrar nas áreas escondidas de suas almas, e descobrem um ser de índole amorosa, terna, agradável e de personalidade bem equilibrada.","Quando ficam zangados, perturbam todo o seu meio e são capazes de fazer tremer até a mais forte criatura, e não descansam enquanto não derrotarem e subjugarem seu inimigo. Sua estratégia, no entanto é a da paciência para atacar o inimigo no momento certo e assim garantir a sua vitória. Não se contentam com pequenos sucessos; aspiram grandes vitórias e grandes honrarias. Acreditam ser o seu trabalho um culto e almejam realizar grandes coisas, em qualquer negócio ou atividade que empreenderem.","Odeiam a hipocrisia e a falácia.","São materialistas e a segurança econômica é sua meta primordial. Embora não sintam um interesse real e profundo pela religião, vão ao extremo e atingem os mais profundos graus de meditação, quando encontram um mestre eficiente."],"9":["As suas qualidades psíquicas são as de Marte, o Planeta vermelho. Sendo um Planeta de fogo e calor, Marte gera uma intensa energia com a qual não é fácil lidar. Torna inquietos os que têm 9 como número psíquico, estando constantemente envolvidos em atividades.","Não conseguem descansar enquanto não alcançam os objetivos almejados. São combativos e abrem caminho em direção ao topo de qualquer área, com espírito esportivo, porém competitivo. São corajosos e adoram aventuras. Ambiciosos e portadores de grande força de vontade e determinação progridem rapidamente no caminho escolhido.","Reagem rapidamente às situações e captam logo o primeiro sinal adverso. Seus mecanismos internos de defesa são fortes e estão sempre prontos a receber oposição. Muitas vezes criam inimigos por uso excessivo de seus sensores de alarme. Gostam de terminar uma discussão assim que ela começa e não gostam de lastimar ou de ponderar sobre problemas.","São muito otimistas e independentes por natureza e dotados de um suprimento inexaurível de energia, não gostam de viver de caridade ou de estar à mercê dos outros. Livres, sinceros, destemidos, impulsivos e tirânicos; extremistas, acreditam que vão chocar e surpreender o mundo com suas façanhas ousadas, que, algumas vezes acabam em um fim trágico. Mesmo assim enfrentam a situação e não temem nem a morte.","Possuem grande senso de responsabilidade e não gostam de interferências em seu trabalho, nem de serem criticados. Fazem boa opinião de si mesmos e gostam de ser reconhecidos.","Sua natureza muito dominadora lhes acarreta ressentimentos. Durante a juventude terão que enfrentar dificuldades e oposição e suportar provações para conquistar uma posição de respeito na sociedade, no lar, no emprego ou em seu campo de trabalho. Normalmente atingem o sucesso depois dos 40 anos de idade.","Externamente duros e muito inabaláveis, por dentro trazem a doçura e a sensibilidade de uma criança, são compassivos e cuidam bem de seus subordinados.","Os nativos de número psíquico 9 possuem qualidades da organização e de grande habilidade administrativa. Se lhes for concedido pleno poder e controle, seus recursos, seus esforços, suas atitudes otimistas e o conhecimento prático podem ser de grande ajuda às empresas. Sem carta branca tornam-se desinteressados e inativos. Nasceram para o sucesso e possuem todas as qualidades para tanto. Devem evitar a cólera, agressividade e arrogância."]},"diaNatal1":{"1":["Pontos positivos: liderança, criatividade, caráter progressista, vigor, otimismo, fortes convicções, competitividade, independência, sociabilidade.","Pontos negativos: arrogância, egoísmo, ciúme, antagonismo, egoísmo, excesso de orgulho, hesitação, impaciência.","É um líder nato; gosta de mandar em vez de fazer. É criativo e original, tem raciocínio lógico e rápido, e é capaz de discutir sobre os mais variados assuntos, até mesmo aqueles que conhece superficialmente. Tem tendência a ser autoritário, de certa maneira possessivo e um tanto egocêntrico. Ainda que o lado aventureiro da sua natureza queira se expressar, a sua visão altamente pragmática e a preocupação com a segurança sugerem um certo materialismo. Isso indica que mesmo que o idealismo e a visão tenham um papel muito importante na sua vida, a preocupação com o dinheiro, ou com a sua falta, mantém os seus pés firmes no chão. Todavia, você é uma pessoa amável, que tem emoções fortes, inclinações humanitárias e grande capacidade de liderança. Embora não o sendo, o número 1 é considerado “frio”, calculista e pouco comunicativo. Raramente demonstra afeto e compaixão. Contudo, gosta de ser elogiado e admirado. Quando seus projetos ou desejos não se realizam ou são frustrados, o seu sistema metabólico sofre sobremaneira e os nervos e a pressão arterial são sobrecarregados, podendo causar graves danos ao organismo.","Como líder, sente-se terrivelmente frustrado em posição subalterna e, por vezes, torna-se irascível, violento e inconsequente, sendo muito difícil trabalhar e conviver em sua companhia. Precisa também aprender que o mundo não gira ao seu redor, evitando a inclinação a ser autocentrado ou ditatorial.","O nascido no dia 1 necessita saber para poder e querer. Estudar, projetar, manter a consistência no objetivo deve ser sua principal característica, pois tem tendência a deixar tudo pela metade ou a glória aos outros. Individualista e dinâmico, gosta de conhecer gente de diferentes círculos sociais. Como é sociável, aprecia a companhia de outras pessoas, especialmente as que são criativas e que o estimulam a se expressar. Ainda que seja leal e disposto a apoiar entes queridos, tem dúvidas e se sente indeciso nos seus relacionamentos. Para evitar desapontamentos, precisa encarar a sua vida emocional com leveza e lembrar que deseja ser feliz."],"2":["Pontos positivos: gentileza, tato, boas parcerias, receptividade, intuição, consideração, harmonia, em princípio agrada a todos.","Pontos negativos: desconfiança, falta de objetividade, subserviência, excesso de sensibilidade, egoísmo, emotividade e tendência a ser desonesto quando não consegue atingir os objetivos pela maneira correta, ou seja, honestamente.","É um ser diplomata por excelência. É aquele que harmoniza o grupo e a família; o que possui o dom da reconciliação. É cooperativo, aparentemente tímido e vulnerável, de certa maneira passivo, mas sempre atento aos detalhes de seu ambiente.","Amante das diversões e sociável pode ser um grande amigo e uma boa companhia. Mesmo sendo amoroso e afetuoso, deve tomar cuidado na escolha dos seus relacionamentos para que eles sejam duradouros. Pode ser romântico com as pessoas de que gosta e mostrar honestamente os seus sentimentos, mas, para ser feliz, deve procurar segurança financeira. Com todo o seu charme é muito atraente ao sexo oposto, porém não gosta de ser tolhido em seus movimentos. No trabalho sente -se melhor desenvolvendo atividades ligadas a grupos, pois com sua personalidade de certa forma amável e passiva é amado por todos e é sempre excelente profissional. Não suporta ficar parado procurando sempre algo para fazer.","É compreensivo com os sentimentos alheios e incapaz de ferir quem quer que seja. Um dos seus grandes defeitos é a inclinação para subestimar seus dotes e capacidades, tanto intelectuais como profissionais, sendo, muitas vezes, subordinado de pessoas com capacidades inferiores às suas. Evite deixar-se levar pela vontade de ter poder e de controlar, superando a tendência a ser crítico e a exigir a perfeição.","Precisa encontrar o equilíbrio entre ajudar demais e sair de cena subitamente. No caso de se sentir inseguro, pode ser difícil levar adiante os seus planos pessoais, mas se encontrar alguma forma de expressão artística ou criativa, pode transformar seus sonhos em realidade. Com uma excelente habilidade social, pode prosperar como escritor, em atividades educacionais, publicidade, relações públicas, advocacia, diplomacia e atividades artísticas as mais variadas. Caso não seja culturalmente desenvolvido, pode-se tornar cruel, inescrupuloso e até violento, no propósito de atingir seus objetivos."],"3":["Pontos positivos: bem-humorado, feliz, amigável, produtivo, criativo, artístico, amor à liberdade, talento com as palavras, poder para desejar.","Pontos negativos:Entendia-se facilmente, vaidoso, excesso de imaginação, orgulhoso, extravagante, comodista, preguiçoso, hipócrita, esbanjador.","O nativo deste dia é um ser de rara animação, criatividade, expressão e popularidade. Pode parecer irresponsável para alguns que não o conhecem bem, mas na realidade é um ser altamente responsável, e prestativo com tudo e com todos. O três é intuitivo, original, honesto, dedicado à família e aos amigos (aos últimos, às vezes até demais). Sua ambição e sua personalidade atraente podem levá-lo ao topo de qualquer carreira. Seja na área bancária ou no mundo artístico, a sua aversão a ordens alheias pode levá-lo a posições superiores, como gerente ou executivo. Pode se sair particularmente bem na área teatral, como ator, diretor ou dramaturgo. Mas pode também usar a sua habilidade para lidar com as pessoas na área dos negócios, em que pode dar início a novos projetos nos quais ocupe uma posição de liderança.","Como sabe delegar tarefas a seus subordinados, pode ser um excelente administrador ou trabalhar por conta própria. Pelo seu lado extrovertido e amistoso, não suporta ser criticado, apelando para o sentimentalismo daqueles que o criticam ou simplesmente lhe dão “conselhos”. É do tipo que trabalha em inúmeras atividades ao mesmo tempo e que quase sempre as deixa a meio caminho, ou seja, tem muitos começos e poucos fins.","No decorrer de sua longa vida, terá inúmeras frustrações, e estas podem levá-lo a ter certos problemas físicos, principalmente o sistema nervoso abalado e também a contrair certas doenças de pele, que não se sabe como as supera com grande senso de humor. Na realidade, é um ser lutador, criativo e liberal, que usa de seus predicados, principalmente a oratória, como sustentáculo de sua vida."],"4":["Pontos positivos: organização, autodisciplina, firmeza, trabalhador, habilidade, talento com as mãos, pragmático, confiável, preciso.","Pontos negativos: Falta de comunicação, rigidez, falta de sentimentos, procrastinação, autoritarismo, afeições ocultas, ressentimento, severidade.","Os nascidos neste dia são muito disciplinados, constantes, regulares e ordeiros. Perseverantes em seus propósitos, incansáveis trabalhadores, dificilmente deixam de atingir seus objetivos. Normalmente honesto, sincero e conservador, o quatro adapta-se a trabalhos rotineiros, metódicos e que requerem esforço concentrado. Em virtude dos predicados acima descritos, o nascido neste dia sente-se mais à vontade lidando com situações rotineiras, já consagradas pelo uso, evitando o novo ou o incerto.","A sólida estrutura e o poder de organização sugeridos por este dia, indicam que o seu possuidor precisa de estabilidade e ordem. Dotado de energia, habilidades práticas e muita determinação, pode ser bem sucedido se estiver disposto a trabalhar duro. Preocupado com a segurança, quer ter uma base sólida para si mesmo e para os familiares. A maneira pragmática como encara a vida lhe confere um bom senso para os negócios e habilidade para alcançar o sucesso material.","É muito econômico, amigo dos amigos, companheiro leal e dedicado,de grande responsabilidade e respeitador do sexo oposto, gostando também de construir coisas e trabalhar com as mãos. Tem tendência à obstinação, ao apego e à sua maneira de ser. Quando o contrariam ou fazem coisas que não gosta, pode-se tornar rude, ofensivo e dominador, pois se ofende com certa facilidade. Porém, como é uma alma superior, não sabe guardar raiva, ressentimentos ou qualquer sentimento de revolta. Quando não consegue atingir seus objetivos ou os mesmos são adiados por circunstâncias adversas à sua vontade, fica tremendamente frustrado causando-lhe dor de cabeça, melancolia, distúrbios cardíacos e problemas renais.","Em matéria de amor (relacionamentos) a mulher nascida neste dia é mais acessível e menos dramática do que o homem."],"5":["Pontos positivos: versátil, adaptável, progressista, fortes instintos, magnético, sortudo, ousado, amante da liberdade, perspicaz e rápido, curioso, sociável.","Pontos negativos:Pouco confiável, instável, procrastinador, cabeça-dura, inconsistente, excessivamente confiante.","O nascido neste dia é normalmente divertido, alegre, ousado, dotado de poderes psíquicos, imaginação fértil, versatilidade e também amante da liberdade.","Em virtude de ter os ouvidos muito sensíveis (não gosta de receber ordens), vive constantemente em busca de dinheiro, por vezes de maneiras totalmente inusitadas, sem qualquer medo de correr riscos. Gosta de estudar e de saber, para poder conseguir atingir seus objetivos com mais facilidade. Viajar por diversão, estudo ou satisfação do ego, também fazem parte da sua personalidade. É obstinado em seus propósitos (impaciente e impulsivo) e não descansa enquanto não consegue atingir seus objetivos, mesmo que tenha de usar de artifícios pouco convencionais ou prejudicar alguém. Gosta de estar em contato com o público, de preferência sendo o centro das atenções, e no trabalho sente-se melhor em ocupações que o coloquem em contato com pessoas, mas que estas lhe permitam agir e exprimir-se livremente.","As frustrações, principalmente no âmbito profissional, que atrapalham seus planos, causam-lhe insônias, distúrbios psicológicos, falta de controle emocional que podem se transformar em violência. Quando quer ou é incentivado, consegue resultados fantásticos no campo profissional, pois tem grande capacidade de discernimento, amplos conhecimentos e satisfação naquilo que faz. Porém, o seu lado obscuro, o lado “libertino”, leva-o a ter muitos começos e poucos fins. Quase nunca é bem-sucedido no amor (existe é claro, as exceções), levando-o a trocar várias vezes de parceiros ao longo da sua duradoura vida. Tem, ainda, grande habilidade para encantar as pessoas com o seu otimismo e generosidade, mas deve tomar cuidado para não se tornar muito autoritário com quem ama."],"6":["Pontos positivos: Universal, fraterno, compassivo, confiável, idealista, compreensivo, solidário, com inclinação doméstica, humanitarista, equilibrado, artístico.","Pontos negativos: insatisfeito, ansiedade, timidez, irracionalidade, teimosia, falta de harmonia, dominação, egoísmo, desconfiança, cinismo, egocentrismo.","O nascido no dia seis é normalmente sentimental, muito equilibrado, compreensivo, adora a família, a casa, os amigos, os filhos (se os tiver) e é também excelente amante. Tem personalidade magnética e atrai sempre as atenções: em festas, reuniões, cursos, etc.","Profissionalmente sente-se realizado numa posição superior, onde pode contribuir para o desenvolvimento da empresa, das coisas e principalmente das pessoas envolvidas. É perseverante e luta até o fim para atingir seus objetivos. Como é altamente sensível, quando contrariado, ou quando as coisas não correm como quer, pode-se tornar ciumento, nervoso e demonstrar possessividade, levando-o a ter atitudes enérgicas para defender seus princípios ideológicos.","No tocante às frustrações amorosas, estas lhe causam quase sempre complicações nervosas e problemas ósseos. Gosta de se divertir é atencioso, confiável e gentil. Tem uma alegria infantil e sempre será jovial. Naturalmente charmoso e sociável, tem muitos amigos e admiradores.","Nos relacionamentos sérios é uma pessoa romântica, idealista e leal, mas deve evitar se martirizar ou ser muito possessivo.","Pode ser um parceiro dedicado, caloroso, atencioso e amoroso. Prático e econômico, tem tendência a ser idealista e despreocupado. Confiando na sua intuição e aprendendo a se conhecer, pode ter um bom relacionamento com as pessoas. Será excelente profissional no setor social (trabalhar com idosos, crianças, deficientes físicos ou mentais), em áreas esotéricas e religiosas, como professor, decorador, cozinheiro, ou tratando de embelezar o planeta."],"7":["Pontos positivos: culto, confiável, meticuloso, idealista, honesto, com poderes psíquicos, científico, racional, reflexivo.","Pontos negativos: dissimulado, enganoso, pouco amigável, fingido, cético, confuso quando lida com detalhes, inoportuno, indiferente, pouco sentimental, sensível às críticas.","Além da integridade inerente do número sete, ele também possui em larga escala a independência de pensamento, a iniciativa e a ponderação. É também perfeccionista e um tanto arredio a novas amizades. Analítico e ponderado, o nascido neste dia é muitas vezes crítico e concentrado nos seus próprios interesses.","Com uma necessidade constante de ter uma maior autoconsciência, gosta de reunir informações e se interessa por ler, escrever e por assuntos espirituais. A tendência a ser enigmático ou reservado sugere que pode ocasionalmente se sentir incompreendido.","Embora não goste de contrair dívidas, precisa aprender a administrar a sua vida financeira. O desejo de desfrutar de uma boa vida sugere que precisa de algo que o motive e o inspire, pois há o perigo de cair na rotina e perder o rumo. Se o querem ver feliz, falem de religião, de filosofia (pura e simples), de ensino ou qualquer atividade ligada à espiritualidade. Companheiro (ou companheira) dedicado, quando se separa é por demais difícil se adaptar a uma nova relação.","A Numerologia aconselha que se case tarde (após os 30 anos), depois de namorar muito e conhecer plenamente as características do companheiro.","Durante a vida procura mais as coisas filosóficas e abstratas, que o atraem. Gosta sobremaneira que todos o venham consultar; tem tendência a se sufocar pelo trabalho e por isso pode ter ataques de nervosismo e alguma depressão. Normalmente sem vícios (álcool, cigarro e drogas); quando os tem lhe são altamente prejudiciais ao fígado, pâncreas e estômago. Também deve evitar qualquer tipo de jogo (dificilmente ganhará em loterias e seus afins)."],"8":["Pontos positivos: liderança, meticulosidade, trabalhador, autoridade, proteção, poder de cura, bom juízo de valores.","Pontos negativos: impaciência, desperdício, intolerância, excesso de trabalho, dominação, desencoraja-se facilmente, falta de planejamento.","O nascido neste dia é normalmente organizado, muito dedicado aos negócios, criativo e com enorme potencial para ganhar dinheiro. É justo, leal, prático, generoso (quando quer) e tem grande capacidade executiva e grande senso de justiça. Quando as coisas não saem como deseja, pode-se tornar direto (às vezes até demais), agressivo, com acessos de mau-humor e com grande tendência a dominar a todos, indiscriminadamente, sejam eles parentes, amigos ou empregados. Em vista do seu grande potencial para ganhar dinheiro (ou outros bens materiais), será mais bem sucedido como alto executivo, trabalhando por conta própria ou em alguma atividade em que o dinheiro esteja presente e em grande quantidade. Pertence ao mundo dos negócios e, por isso, deve sempre desenvolver a sua capacidade criativa para levar avante os seus projetos. Com a sua percepção aguçada e rápida, sabe avaliar as pessoas e as situações. Muito eficiente no trabalho, tem disposição para trabalhar duro e assumir responsabilidades. No entanto, precisa aprender a administrar ou a delegar a sua autoridade de maneira justa e imparcial.","Manifesta, normalmente, uma aparência austera, fria e calculista; na realidade, é tremendamente carente, sentimental, justo e sempre pronto a ajudar quem necessita dele.","Do outro lado, ou seja, do material, como “adora” dinheiro, vive desconfiado, descrente de quase tudo e até certo ponto pessimista, o que o leva a ter repentes de solidão, mau-humor e até um tanto ranzinza. Apesar disso, dificilmente é derrotado, superando todos os obstáculos que por ventura lhe apareçam pela frente. Qualquer vício lhe é prejudicial à saúde, principalmente o álcool , que pode lhe provocar graves distúrbios ao fígado e estômago."],"9":["Pontos positivos: idealista, humanitário, criativo, sensível, generoso, magnético, poético, caridoso, desapegado, sortudo, popular.","Pontos negativos:Frustrado, fragmentado, inseguro, egoísta, preocupado e pouco prático.","O nativo deste dia é normalmente universalista: sente compaixão por todos e quer melhorar o gênero humano. Benevolência, ponderação e sensibilidade emocional estão associadas a este dia de nascimento. Tolerante e gentil, é na maior parte das vezes generoso e liberal. Sua intuição e seu poder psíquico indicam uma receptividade universal que, se for positivamente canalizada, pode inspirá-lo a buscar o caminho espiritual. Amante da verdade, normalmente generoso, independente, liberal, audacioso, corajoso, combativo, e não tem medo da derrota eventual, pois sabe que conseguirá o que deseja.","Dificilmente tem paz de espírito e tranquilidade, pois tem facilidade em atrair discórdia e desentendimentos, afastando os amigos e as pessoas que o amam. É um ser muito contraditório, pois sendo humanista e bondoso não deveria ser arrogante e revoltoso, mas o é, e dessa maneira, destrói em minutos o que levou anos a construir. Em virtude da sua autoconfiança, normalmente protela tudo, e às vezes acaba ficando em dificuldades financeiras; mas no final acaba se saindo bem.","Não gosta de receber ordens e será mais bem sucedido em assuntos relacionados com a religião, filantropia ou associações beneficentes, nas quais a inspiração, a bondade e a compreensão sejam necessárias.","Quando transmite os seus poderes sentimentais, expressa o seu amor e afeição. Normalmente não se apega a nada nem a ninguém, sejam bens materiais, amigos, companheiros de jornada ou mesmo a pessoa amada, tendo ao longo da sua vida muitos desapontamentos amorosos e também algumas perdas de amizade. Adora viajar e conhecer novos lugares, novos países, novas pessoas. Qualquer vício lhe é tremendamente nocivo ao organismo, seja o hábito de beber, fumar ou qualquer outro, pois possui um organismo muito sensível e os vícios lhe prejudicam terrivelmente o sistema nervoso e o respiratório."],"10":["Pontos positivos: liderança, criatividade, caráter progressista ,vigor, otimismo, fortes convicções, competitividade, independência.","Pontos negativos: arrogância, ciúme, egoísmo, orgulho, antagonismo, falta de controle, hesitação, impaciência. O nativo deste dia é audacioso, progressista, independente, prestativo, amigo, atraente fisicamente, cativante e sempre pronto a ajudar àqueles que lhe pedem auxílio. Pelo seu lado atraente e de certa forma arrogante, normalmente desperta inveja e antipatias. Tem grandes ambições e se esforça para realizá-las, mas talvez precise, antes, superar alguns obstáculos. Vigoroso e original, defende aquilo em que acredita, mesmo quando os outros não concordam. A sua habilidade para dar início às coisas com um espírito pioneiro o encoraja a viajar por lugares distantes e a se arriscar sozinho.","Para ter sucesso profissionalmente, deve desenvolver a espiritualidade, pois caso contrário pode ser envolvido por pessoas inescrupulosas que tudo farão para o arruinar, e caso não possua esta característica, dificilmente terá competência para solucionar seus problemas. Sendo líder por natureza, ou trabalha só, ou em cargos de chefia, de preferência no ramo da engenharia, metalurgia, comércio, vendas ou diretamente com o público, pois é muito convincente. Tem admiração por pessoas que se realizam na vida. Pode ser que sonhe com um amor tão elevado e ideal que acabe sendo difícil encontrar alguém que corresponda às suas expectativas. Como pode alterar entre ser amoroso, espontâneo e afetuoso ou frio e distante. É vital ter um espaço para si mesmo a fim de equilibrar a sua sensibilidade. A sua personalidade naturalmente amigável é a garantia de muitas amizades e a sua hospitalidade sugere que é um bom anfitrião. Deve evitar todo e qualquer tipo de vício, principalmente o fumo, pois as suas vias respiratórias são frágeis e sofrerão terrivelmente com este vício."],"11":["Pontos positivos: equilíbrio, concentração, objetividade, entusiasmo, inspiração, espiritualidade, idealismo, intuição, capacidade de curar, humanitarismo, psiquismo.","Pontos negativos: complexo de superioridade, desonestidade, falta de objetivos, excesso de emotividade, magoa-se facilmente, egoísmo, falta de clareza, dominador, mesquinho, hipersensível.","Apesar de ter como lema a harmonia, a inspiração está sempre presente em sua vida. É um diplomata por excelência; delicado nos termos, ações, possuindo tato e discernimento para qualquer problema ou ocasião.","É um número - mestre, e os seus possuidores quase sempre são carinhosos, sentimentais e necessitam tremendamente de um lar para se sentirem seguros, protegidos, pois não gostam de viver sozinhos.","Inteligente e observador é muitas vezes um parceiro ou amigo leal. Sincero e atencioso, precisa de um relacionamento estável e honesto. Embora possa refinar e melhorar as situações, precisa aprender a diferenciar entre ser autoritário e crítico e ajudar os que estão à sua volta. Parece uma contradição, e é, pois sendo o 11 compreensivo por natureza, não deveria se importar com o pensamento alheio, mas se importa. Como ama a liberdade, necessita estar sempre ocupado para se sentir útil e feliz.","É eficiente profissionalmente e poucos o acompanham em qualquer atividade, apesar de ser mais sonhador do que realizador e, em virtude disso, deve sempre procurar orientação técnica profissional para ser bem sucedido, ter sucesso e ser feliz. Deve, ainda, tomar muito cuidado para que o seu intelecto não sufoque sua intuição, pois sendo psíquico, não pode vacilar ante os problemas. Para atingir seus objetivos, por vezes pode parecer submisso, mas, na realidade, consegue tudo o que deseja, pois é convincente, inteligente e perspicaz. Tem tendência à arrogância e qualquer vício lhe é prejudicial ao organismo."],"12":["Pontos positivos:Criativo, confiante, assertivo, disciplinador, atraente e capacidade de iniciativa .","Pontos negativos: reclusivo, excêntrico, pouco cooperativo, falta de auto-estima, excessivamente sensível","É comunicador nato; pela sua criatividade, expressão, e argumentação, consegue convencer todas as pessoas. Tem gosto artístico, habilidade manual, idealista, quase sempre está de bom humor e dificilmente desiste dos seus ideais. A sua praticidade e agilidade em fazer as coisas, leva-o a assumir mais compromissos do que pode cumprir e, dessa maneira, está sempre atarefado, cheio de trabalho, necessitando aprender a dosar suas energias, pois com certeza vai precisar delas em casos especiais. O nativo deste dia é íntegro em seus propósitos, justo, de caráter leal, franco, liberal, de natureza ativa, qualidades comerciais, diplomacia, aptidão para o comando e gosta de ajudar o próximo. É muito respeitador da fé e das crenças, suas e alheias.","Gosta de ser popular, tendo mesmo tendência para se tornar político ou trabalhar em atividades de interesses sociais. É bondoso por natureza, e por vezes em vista dessa característica, tende a ser explorado pelas pessoas mais chegadas a ele.","O nativo deste dia, quando quer captar simpatias ou simplesmente fazer novas amizades. É capaz de assumir papel de vítima, mantendo as suas “presas” em constante ansiedade e insegurança, ora pelo apaixonado, ora indiferente e distante. Tem natural impaciência e quase sempre se deixa dominar nervosismo, estando sujeito a crises de depressão, insatisfação e se entendia com facilidade. Para evitar este lado negativo da sua personalidade, deve-se manter sempre interessado em algo construtivo, de preferência ligado a atividades intelectuais.","Os eventuais fracassos, as decepções e frustrações (principalmente com os “amigos”), podem lhe causar problemas no sistema nervoso, hipertensão e, em certos casos, problemas renais."],"13":["Pontos positivos: ambicioso, criativo, tem amor pela liberdade, é expressivo e com grande iniciativa.","Pontos negativos: impulsivo, indeciso, autoritário, pouco emotivo e rebelde.","O nativo deste dia é meticuloso, autoritário, sistemático, prático, econômico, trabalhador incansável, sempre lutando em prol dos seus objetivos, não poupando esforços para atingi-los. Como o nome do dia sugere (dia da Perícia), é tremendamente habilidoso em reformas, em transformações e mudanças, quando estas são de seu interesse. Ousado e dinâmico, prefere fazer acontecer a esperar. Está associado ao trabalho duro e pode realizar muito através da determinação e do talento. Como é influenciado pelo ambiente, precisa ser decidido e controlar a direção da sua vida. É alegre e talentoso, podendo se sair bem em profissões artísticas ou de entretenimento.","É justo, bondoso e fica muito chateado quando pressente ou constata que alguém foi injustiçado e também se revolta com as competições desleais ou quando alguém é enganado. É muito amoroso, mas encontra certa dificuldade em expressar seus sentimentos. É prestativo, dedicado, bom amigo, mas quase nunca expressa essas emoções, parecendo isto sim, indiferente, frio, materialista e calculista, reprimindo seus sentimentos, sejam eles de dor, decepções ou mesmo de alegria.","Não sabe viver sem amor, carinho e afeto. Porém,como não expressa esses sentimentos, poucos o compreendem e o conhecem realmente. A sua vida é pautada pelos negócios, pela dedicação à profissão (de preferência em indústrias de grande porte, construção civil ou administração pública), pois sendo íntegro, organizado, honesto e eficiente, rapidamente consegue um lugar de destaque nesses campos. Contrariedades e decepções, principalmente com parentes e amigos, podem lhe causar dores de cabeça, problemas na fala e no sistema respiratório; porém, consegue superar esses inconvenientes de modo admirável."],"14":["Pontos positivos: ações decididas. Trabalhador, sortudo, criativo, pragmático, imaginativo e habilidoso.","Pontos negativos: excessivamente cauteloso ou impulsivo, instável, sem consideração e teimoso.","Potencial intelectual, perspectiva pragmática e forte determinação são algumas das qualidades associadas a esta data de nascimento. Tem grande desejo de estabelecer uma base sólida e ter sucesso através do trabalho duro, podendo alcançar o topo da sua profissão.","Quase sempre vive no presente, pouco se preocupando com o futuro, sendo normalmente líder em qualquer situação ou grupo. É negociante nato; não gosta de ficar parado e está sempre procurando alguma coisa para fazer, para ganhar dinheiro, pouco se importando se terá lucro ou prejuízo. Tem uma boa capacidade de gerenciamento e talento para solucionar problemas além de uma aptidão natural para escrever – que sempre pode usar de forma criativa ou na vida profissional. Um dos seus pontos mais fortes é trabalhar com muita movimentação de capitais, seja como especulador financeiro, agente imobiliário ou negociador.","Admira as pessoas que têm uma maneira pouco convencional ou original de abordar a vida e deseja ter um parceiro que seja disciplinado e trabalhador. Com seu charme e seu comportamento naturalmente assertivo, sempre atrai pessoas que acreditam em você. Para ser feliz no casamento, o cônjuge deve gostar de vida agitada, deve gostar de viajar, de conhecer novos lugares e jamais se prender a um único local, pois caso contrário a união não terá final feliz. Por ser naturalmente bondoso e emotivo, normalmente é presa fácil dos inescrupulosos, principalmente quando querem seus favores.","Por vezes (quando desenvolvido espiritualmente) é profético, com tendências construtivas e destrutivas. Quando o contrariam ou frustram seus ideais, pode ter problemas respiratórios, algumas alergias e até desenvolver doenças imaginárias. Caso consiga controlar a impulsividade e adquira prudência, pode-se tornar muito bem-sucedido financeiramente e também socialmente."],"15":["Pontos positivos: disposição, generosidade, responsabilidade, apreço amabilidade, cooperação e ideias criativas.","Pontos negativos: inquieto, autocentrado, medo de mudar, perda da fé, preocupação e certa indecisão.","Como o dia sugere: “magnetismo pessoal”, esse magnetismo é levado às últimas consequências, pois tanto homens como mulheres lhe acham simpático, agradável, afetuoso e interessante. No comércio ou em um escritório, normalmente é o alvo das atenções, mais é claro, do sexo oposto, sendo dessa maneira, invejado por todos. Não tem grandes problemas financeiros (raramente fica pobre), pois é esperto, inteligente, perseverante e sempre encontra uma maneira de ganhar dinheiro. Não tem veia de avarento, mas é de certa forma apegado ao dinheiro, preferindo gastá-lo com o companheiro (a), na casa ou em algo proveitoso para si. Tem grande calor humano, adora reuniões sociais, ama a vida e as pessoas e não se importa em gastar, principalmente quando está em companhia da pessoa amada.","Deve-se casar (ou unir-se) com pessoa que tenha afinidade com seus propósitos e gostos; caso contrário, a união não dará certo e qualquer separação o faz sofrer em demasia, levando-o inclusive ao isolamento.","Tem a capacidade de atrair oportunidades e condições harmônicas. Entre outros, pode assumir cargos comunitários, direção de espaços esotéricos, ou outros que exijam compreensão e mão firme para manter a ordem e a disciplina em grupos, isto pela sua capacidade, sua responsabilidade e habilidade natural de compreender, unir e harmonizar. Mesmo em idade avançada, parecerá sempre jovem. É honesto, digno de confiança, amável e bondoso. Tem inclinações artísticas, podendo se destacar na oratória, nas artes plásticas, música ou representação. Os seus pontos fracos organicamente são a garganta, os pulmões e o fígado; por isso, qualquer vício lhe é prejudicial, principalmente o álcool e o cigarro."]},"diaNatal2":{"16":["Pontos positivos:Responsabilidade, integridade, intuição, sociabilidade, cooperação e discernimento.","Pontos negativos: preocupação, insatisfação, irritabilidade, egoísmo, ceticismo e falta de solidariedade.","É um extremista! Quem nasce neste dia pode ser o mais miserável dos seres, ou o maior dos ricos.","Dependendo da vida que levar, pode transformar seu possuidor numa pessoa poderosa, rica, um ser de pleno sucesso e felicidade; no outro extremo, pode arruinar, levar ao desmando, transformar o ser em um elemento arrogante, prepotente, orgulhoso e dominador. Aconselha-se que os nascidos neste dia vivam tão altruisticamente quanto possível, que tenham pensamentos positivos, sentimentos elevados e, desta maneira, com absoluta certeza atingirão o sucesso e serão muito felizes. É, também, o número do equilíbrio entre o material e o espiritual. Se teimar em viver fraudulentamente, querendo levar vantagem em tudo e com todos, poderá ver seus planos frustrados, ser traído por amigos e ainda contrair doenças inesperadas.","É analítico, cético (só acredita no que vê ou é comprovado), gosta de conhecer a essência e o âmago das coisas e pessoas e também apresenta acentuado caráter perfeccionista. Pelo seu senso de perspicácia, gosta e consegue desvendar coisas misteriosas e também de acumular conhecimentos.","É um ser de grande sensibilidade, intuição e inspiração, tendo mesmo qualidades psíquicas sem qualquer estudo do assunto. Um dos seus grandes defeitos é gostar que as pessoas que o rodeiam vivam conforme seus moldes e, quando isso não ocorre, torna-se mal-humorado e até colérico. Por esse seu temperamento de presunção, geralmente vive isolado, porém, na realidade tem grande desejo de afeto e principalmente compreensão.","Apesar de tudo isso, não gosta que interfiram na sua vida, nos seus projetos, mesmo quando estes não dão ou não estão dando certo. Em vista da sua grande sensibilidade, que é atrativa em vários segmentos, deve tomar muito cuidado com falsos amigos, descontentamentos, com a ansiedade e principalmente com alguns perigos físicos, como o excesso de velocidade em automóveis. Deveria, portanto, fugir da agitação das grandes cidades, dando preferência a viver no campo ou então perto da água (rios, lagos e oceano).","Pela sua habilidade analítica aguçada, pode trabalhar na área das ciências, da matemática ou da informática. Por outro lado, como habilidade para se comunicar e lidar com as pessoas, pode ser atraído por uma carreira na área de educação, advocacia ou atividades que envolvam o trato com os outros. As frustrações ao longo da vida (que não são poucas), podem levá-lo à obesidade, a ter problemas estomacais, de pele e até algumas doenças imaginárias(hipocondrianismo)."],"17":["Pontos positivos:Ponderação, especialização, capacidade de planejamento, senso para os negócios, trabalhador, científico e atrai dinheiro.","Pontos negativos: distante, teimoso, descuidado, mal-humorado, sensível, crítico, preocupado e desconfiado.","O nativo deste dia é naturalmente um líder inteligente e arguto. Está quase sempre de bom humor e consegue ser simpático até com os opositores. Se quiser ser bem-sucedido profissionalmente, deve trabalhar em grupo, com outras pessoas, e somente em casos esporádicos consegue se sair bem trabalhando só. Nasceu para ser bem sucedido no plano material, através de muito trabalho, persistência e determinação.","Por qualquer destes caminhos que se aventurar, será um vencedor: negócios imobiliários, comércio em geral, como executivo trabalhando com muitos subordinados ou comércio exterior, pois é eficiente profissionalmente, econômico (não avarento) e grande articulador. É popular, está sempre bem humorado (mesmo que seja para disfarçar alguma decepção ou tristeza), e só depende dele ser ou não bem-sucedido financeiramente. Normalmente é bem relacionado com o sexo oposto e está sempre cercado de admiradores, apesar de não gostar de revelar os seus pensamentos ou sentimentos. Busca a companhia de pessoas ambiciosas, determinadas e trabalhadoras. No plano afetivo, as pessoas que mais o atraem são aquelas que demonstram gerar harmonia e paz."],"18":["Pontos positivos: progressista, assertivo, alto poder de intuição, corajoso, resoluto, eficiente, capacidade de aconselhar.","Pontos negativos: emoções descontroladas, falta de ordem, egoísmo, vaidade, ambição desmedida e incapacidade de concluir trabalhos ou projetos.","Dinâmico e ativo, frequentemente deseja o poder e precisa de desafios constantes. Pode, às vezes, ser crítico, difícil de ser agradado ou ter inclinações para a controvérsia. Com sua personalidade e poder marcantes, pode usar esses predicados para ajudar seus semelhantes, dar bons conselhos e resolver problemas alheios. O dia 18 é o dia dos bruxos, dos magos, dos médiuns famosos e dos religiosos poderosos.","É, também, o dia dos seres felizes e infelizes, ou seja, o dia dos extremos. Se agir com dignidade, trabalhar e estudar para o bem da humanidade, com certeza alcançará altos postos e será feliz.","No outro extremo, ou seja, se agir fraudulentamente, sempre querendo levar vantagem em tudo e com todos é certo que se arruinará, mais dia, menos dia. De natureza psíquica, o 18 é profundamente espiritual; tem contato com dimensões superiores, visões, de ampla e irrestrita intuição, comunicativo e altamente sensível a problemas espirituais. É um vencedor nato! É inteligente, tem mente ativa e desperta e consegue se sobressair em quase todas as atividades. Os seus maiores inimigos são seus próprios defeitos: vaidade e ambição. No outro extremo, ou seja, caso não seja evoluído espiritualmente, tem tendência a se entregar ao pessimismo, por medo do desconhecido, do futuro e, quase sempre, nesse estado, acaba sendo presa fácil para as adversidades, terminando na ruína completa. Tem no seu lado positivo, a intuição e independência prestativa e desinteressada, intelectual, emotiva e requintada, gostando de discutir sobre os mais diversos assuntos. No negativo, pode às vezes ser crítico, difícil de ser agradado ou ter inclinações para a controvérsia. Porém, quando quer, consegue superar todos os obstáculos, pois é um grande lutador, encarando todos de frente, sem medo de nada nem de ninguém.","Tem caráter afetivo e também dedicado aos outros. Como é muito prestativo, consegue fazer amizades com facilidade e ter relacionamentos duradouros, pois também é muito amoroso, apesar de ser facilmente vulnerável e explosivo.","Quando as coisas não correm como gostaria, fica frustrado e tem tendência a desanimar, a ter problemas cardíacos, dores de cabeça e a ter o sistema nervoso abalado. Em vista disso, qualquer vício, cigarro e o álcool principalmente, são verdadeiros venenos para o organismo."],"19":["Pontos positivos: dinamismo, criatividade, liderança, progressismo, otimismo, convicções fortes, competitividade, independência, espírito gregário e muita sorte.","Pontos negativos: egocentrismo, preocupação, medo de ser rejeitado, materialismo, impaciência e tendência à depressão quando não consegue atingir os objetivos.","Ambição e humanitarismo são algumas das principais características deste excelente dia. Decisivo e cheio de recursos, possui uma visão penetrante, mas o lado sonhador da sua natureza é compassivo, idealista e criativo. Apesar de ser sensível, a necessidade de ser alguém pode levá-lo a ser dramático e a ser o centro das atenções. Muitas vezes há um forte desejo de estabelecer uma identidade individual.","Para isso, precisa primeiro superar a influência causada pela pressão externa. Para os outros, os nascidos neste dia aparentam ser uma pessoa confiante, resistente e cheia de recursos, mas as tensões internas podem causar instabilidade emocional. Quer mudanças. É versátil e está sempre desejando o melhor para si e também para a família.","É independente, artístico, original e dotado de espírito de iniciativa e criatividade. 19 é o dia do sucesso, da prosperidade e também da felicidade. Esta vibração altamente positiva tem em si embutido também certa tendência à arrogância à teimosia e à vaidade. Possui grande poder de realização, mas se irrita com certa facilidade, tendo acessos de crises de violência que normalmente afetam sua saúde. Apesar desta negatividade, jamais guarda rancor de quem quer que seja e rapidamente esquece qualquer ofensa de que é vítima. Sendo o seu lema o caráter, na mais pura expressão, o seu possuidor é um reformador, e como tal, sempre pensa em uma maneira de transformar o mundo, conquistando dessa maneira, simpatias e a admiração de todos. Quando quer alguma coisa é capaz de gestos teatrais e até atitudes extremas e não aceita seguir o tradicional.","Amigável e popular, não tem dificuldades para fazer amigos e seduzir as pessoas. Em geral atraente, tem muitos admiradores do sexo oposto. Contudo, se se deixar levar pela instabilidade, as suas experiências amorosas podem ser como andar de montanha-russa, com muitas perdas e sucessos. Pelo seu instinto “paternal”, as decepções (principalmente com amigos), frustrações (ideológicas) e fracassos (profissionais), podem afetar o seu coração, a visão e também o sistema auditivo."],"20":["Pontos positivos: boas parcerias, gentileza, tato, receptividade, intuição, consideração, harmonia, presença agradável, embaixador da boa vontade.","Pontos negativos: desconfiança, subserviência, timidez, sensibilidade excessiva, certo egoísmo, tendência a magoar-se com facilidade.","Sensível, intuitivo, adaptável e compreensivo, e gosta de pertencer a um grupo. Em geral,aprecia as atividades cooperativas, nas quais possa interagir, compartilhar experiências e aprender com as outras pessoas. É um ser humano caseiro, ordeiro, pacífico, sempre distribuindo amor e paz a todos os conhecidos e sabe como poucos criar atmosferas agradáveis e harmoniosas. Receptivo e intuitivo, gosta de se comunicar com os outros e, muitas vezes, tem talento para lidar com as pessoas, sendo excelente mediador ou negociador. Se desenvolver os seus dons artísticos, pode escolher uma carreira nas áreas de educação, como professor, ou na área editorial como redator ou jornalista.","Os relacionamentos afetivos têm muita importância em sua vida e é vital que não caia em situações de dependência. Como precisa de companheirismo, não aprecia ficar sozinho por muito tempo.","Felizmente, seu charme, habilidade diplomática e excelente pode de persuasão podem ajudá-lo a ter amigos e amantes. Contudo, os seus sentimentos podem, às vezes, ser extremos e difíceis para as outras pessoas, mesmo quando genuinamente deseja a harmonia. Como é encantador, sociável e divertido, normalmente é um excelente anfitrião.","É tremendamente hábil e é capaz de fazer qualquer serviço mais rápido e melhor do que qualquer outra pessoa. Também tem grande habilidade para tratar com o público, sendo dessa maneira, um bom político ou trabalhar em repartições governamentais voltadas para o povo.","As decepções, frustrações e contrariedades podem lhe causar graves prejuízos ao sistema nervoso."],"21":["Pontos positivos: inspiração, criatividade, uniões por amor e duradouros relacionamentos.","Pontos negativos: dependência, temperamental, nervoso, falta de visão, medo de mudanças.","Apesar de ser idealista e liberal, o nativo deste dia necessita da companhia de outras pessoas, pois dessa irmandade depende o seu sucesso e também o seu bem-estar. Nasceu para manifestar e expressar sentimentos e ideias. É ambicioso, mas dispersivo, e dificilmente consegue acabar o que começa, ou seja, tem muitos começos e poucos fins. Muitas vezes musical e artístico, com queda para o teatro e a oratória, pode ser excelente ator de cinema ou teatro. Espirituoso e divertido e tem uma personalidade brilhante.","Como é amigável, tem uma vida social ativa. Atraído por pessoas independentes e bem-sucedidas, quando se envolve em algum relacionamento precisa de liberdade e autoconfiança. Um dos lados da sua natureza afetiva é ser muito dramático, desconfiado e retraído, causando certo desconforto nos relacionamentos.","Quando casado é excelente companheiro e gosta por demais da família, a ponto de grandes sacrifícios para tornar tudo harmonioso. É por demais emotivo, sujeito a extremos, que o leva quase sempre a um estado de depressão. Em vista dessa sua fragilidade e inconstância, encontrará sérios obstáculos na juventude, mas por fim terá sucesso na idade mais madura, pois tem absoluta certeza de que tudo acabará bem. São suas qualidades positivas: amizade, idealismo e capacidade de entretenimento. Após os 40 anos, a determinação e a vontade em conseguir sucesso material se fortalecerá e as privações antes dessa idade servirão como exemplo e também como um orientador que o conduzirá ao sucesso desejado.","O nascido no dia 21 é considerado como “sortudo”, pois, de maneira inexplicável (para os números), consegue “tudo” o que deseja. Está sempre procurando um parceiro que seja sensível e compreensivo e que tenha fé nas suas habilidades. Cuidado com as doenças psicossomáticas adquiridas das frustrações, decepções e contrariedades."],"22":["Pontos positivos: Intuição elevada, pragmatismo, praticidade, habilidade com as mãos, capacidade de organização, realismo, resolução de problemas e empreendedor.","Pontos negativos: esquemas de enriquecimento rápido, nervosismo, autoritarismo, materialismo, falta de visão, ganância, autopromoção e preguiça.","O nativo deste dia, como especificado é tremendamente prático, adapta- se a qualquer tipo de trabalho e para atingir seus objetivos (caso os tenha) é capaz de feitos heroicos.","Como tem visão futurista e perfeccionista ao extremo, inúmeras vezes deixa de aproveitar as ocasiões que se lhe deparam no dia a dia. Sendo um ser totalmente independente, tanto em considerar as coisas como as pessoas, despreza os convencionalismos e as tradições, o que normalmente lhe é prejudicial profissionalmente.","Ainda com referência ao futurismo do nativo, normalmente não tem grandes ambições materiais e pouco se importa em ganhar ou acumular fortuna e, dessa maneira, está sujeito a muitos altos e baixos durante a vida. Para viver adequadamente, deve manter o equilíbrio entre as emoções e a praticidade. É de certa maneira nervoso, tenso e necessita muito de repouso. Este seu lado negativo, em certos momentos, mostra um certo desequilíbrio emocional, tendendo à intolerância, impaciência, não se entendendo a si próprio e, assim vivendo em constante conflito com os mais próximos.","Sendo um duplo “2”, também na vida real as coisas tendem a acontecer-lhe em dobro, tanto para o bem, como para o mal, portanto, deve fazer um esforço redobrado para viver construtivamente e em harmonia com toda a humanidade. O 22 enxerga longe; em vista disso, deve sempre procurar profissões ou ocupações de caráter mais geral e não aquelas de interesse pessoal. Nasceu para a humanidade e em vista disso, tem enorme responsabilidade com seus semelhantes e para que todos os seus dons (que são muitos) possam se manifestar deve trabalhar como alto executivo, político, escritor de temas universalistas, artista, conferencista ou chanceler. Ainda que tenha visões e convicções fortes, o ser 22 é astuto no que diz respeito aos seus relacionamentos. Como o amor e o companheirismo são tão importantes, muitas vezes cede ou usa as suas habilidades diplomáticas para manter a harmonia nos seus relacionamentos.","Ocasionalmente, quando não recebe a atenção ou afeição de que precisa, pode ficar inseguro ou ciumento.","Em vista do seu alto grau de sensibilidade, está sujeito a distúrbios psíquicos, nervosos e também alterações do sistema glandular, principalmente quando reprimem ou lhe frustram seus ideais. Os vícios, principalmente o cigarro e o álcool são verdadeiros venenos para o seu organismo."],"23":["Pontos positivos: lealdade, responsabilidade, adora viajar, paciente, comunicativo, intuitivo, criativo, versátil, persuasivo e confiável.","Pontos negativos: egoísta, inseguro, teimoso, inflexível, crítico, reservado e preconceituoso.","Se quiser levar uma vida sem maiores problemas, tem de trabalhar ao máximo o seu lado compreensivo.","Sensível e emotivo, o 23 é um idealista, audacioso e romântico. Atraído por pessoas vigorosas, usa os seus poderosos sentimentos expressando de forma dramática o amor que sente. No entanto, algumas vezes, seus relacionamentos pessoais podem ser perturbados devido à instabilidade do seu humor ou ao seu excessivo materialismo. Apesar de ser paciente, nunca descansa até conseguir o que quer. É o número do sucesso material, do dinheiro, e o seu portador precisa aprender a seguir caminhos profissionais, de preferência os de alto nível e não enveredar para os negócios, pois sendo intelectual, pertence ao mundo sensível e não está apto a servir ninguém.","Tem personalidade marcante, rara inteligência (aprende tudo com grande facilidade), inclinação social (gosta de festas e reuniões) e se dá melhor com o sexo oposto do que com o próprio.","Em virtude da sua grande sensibilidade, quando lhe tolhem os objetivos ou reprimem seus ideais, pode sofrer sobremaneira do sistema nervoso. Usualmente é versátil, pensa com rapidez,e é dotado de uma atitude profissional e uma mente cheia de ideias criativas. Gosta de viagens, aventuras e de conhecer pessoas novas. Ainda que esconda os seus sentimentos, a sua natureza idealista e confiável indica que quando fala o que pensa pode ser terrivelmente franco.","Mesmo que às vezes possa ser destemido, deve tomar cuidado para que essa franqueza não seja ofensiva às pessoas. Pode ser um excelente diplomata, político, médico, psiquiatra, psicólogo, terapeuta holístico, escritor metafísico ou até viver no meio artístico, conseguindo com esta profissão fama e alta posição social."],"24":["Pontos positivos: energia, idealismo, habilidades práticas, diplomacia, forte determinação, honestidade, franqueza, justiça, harmonia, alegria, generosidade, amor à casa, ativo e enérgico.","Pontos negativos: materialista, muito econômico, crueldade, aversão à rotina, pouco confiável, dominador, teimoso, vingativo e ciumento.","Quem nasce no dia 24, além dos predicados acima descritos é também grande amigo, amante da verdade e tolerante com as falhas alheias. Esteja onde estiver e com quem, é quase sempre o centro das atenções, não pela beleza física ou porte, mas sim pela inteligência, calor humano e compreensão de tudo e com todos. É muito hábil em trabalhos manuais, sejam eles mecânicos, eletro-eletrônicos, de marcenaria, ou consertos rotineiros os mais variados. Tem, também, gostos gastronômicos - sendo excelente cozinheiro e nas festas que participa é sempre solicitado para fazer os aperitivos ou o churrasco. Em virtude da sua grande sensibilidade, tem tendência a proteger os fracos e oprimidos e a se deixar levar pelo sofrimento alheio.","No amor, caso seja demasiadamente sonhador, ardente e romântico, dificilmente se ajustará à vida monótona do romance, pois se sentirá incompreendido e solitário. Como tem presença marcante e cativante é sempre preferível ir pessoalmente a algum lugar, em vez de telefonar ou escrever.","Pode ser grande médico ou psicólogo, pois é muito sensível e compreensível. É confiável e justo, embora às vezes possa ser reservado, e tem a tendência a acreditar que as ações falam mais alto do que as palavras. Com essa maneira pragmática de encarar a vida, desenvolve um bom senso para os negócios e habilidade para superar os obstáculos e ser bem-sucedido. Mesmo que vencer seja muito importante para este nativo, deve evitar a tendência a ser autocentrado ou ditatorial."],"25":["Pontos positivos: altamente intuitivo, perfeccionista, perceptivo, mente criativa, ponderado, talento para lidar com as pessoas e capacidade para ganhar dinheiro.","Pontos negativos: Impulsivo, impaciente, excessivamente emotivo,crítico, reservado, instável, ciumento e de certa maneira mal-humorado.","O nativo deste dia, além da ambição material inerente ao ser humano, vive constantemente em busca do desejo da moralidade. É um pensador, um estudioso e, em vista disso, profundo conhecedor de vários assuntos, podendo se destacar e ter sucesso nos mais variados segmentos, como ciência, ocultismo, filosofia ou sobre a Natureza na sua mais abrangente expressão. O 25 é perfeccionista, exigente (consigo e com os outros), diplomata, versátil, com grande capacidade intuitiva, senso analítico e perspicaz. É rápido e enérgico, apesar de intuitivo e ponderado. O desejo de perfeição o impele a trabalhar duro e a ser produtivo. No entanto, precisa ser menos impaciente ou crítico quando as coisas não correm de acordo com os seus planos. Como tem dons proféticos e desenvolvida intuição, por vezes é instável e sujeito a vacilações e flutuações na sua personalidade.","Tem como seu grande defeito, subestimar as suas qualidades, sendo ao longo da vida subjugado por pessoas muito inferiores a si. Como é honesto, bondoso e leal, julga que os outros principalmente os “amigos” também o são e, assim, vive sendo usado por essas pessoas, que tudo fazem para lhe tirar dinheiro e também para fazê-lo de empregado. Apesar dessas decepções ou frustrações e fracassos ocasionais, enfrenta tudo com muita valentia, mas pode ter problemas estomacais, como úlceras e sofrer de algum mal cardíaco ou pulmonar, na qual é recomendada a total abstinência ao cigarro. Deve a todo custo evitar o álcool, pois seu organismo frágil não suporta tal vício, embriagando-se com certa facilidade e, dessa forma, metendo-se em confusões que jamais entraria se estivesse sóbrio. Quando se sente inspirado por um ideal ou causa, defende bravamente as suas fortes convicções. Carismático e direto, gosta de pertencer a um grupo maior ou de trabalhar com o público, pois é amigável e sociável, um ser devotado e com fortes laços familiares."],"26":["Pontos positivos:Prático, atencioso, orgulhoso da família, entusiástico, corajoso, justo e perseverante.","Pontos negativos:Teimoso, rebelde, falta de entusiasmo, de persistência e com relacionamentos instáveis.","A justiça na sua mais pura expressão, a perseverança e a moderação são as principais características do nativo deste dia. Tem, também, grande capacidade de discernimento, competência e organização, jamais desistindo dos seus objetivos e ideais, mesmo em algumas ocasiões parecendo indeciso, não sabendo muito bem o que quer. Tem uma maneira pragmática de abordar a vida, habilidade executiva e bom senso para negócios. Normalmente responsável e íntegro, com senso estético natural e amor à vida doméstica, precisa construir uma boa base sólida ou encontrar uma estabilidade verdadeira. Tem personalidade marcante e certo ar de superioridade, que com certeza lhe garantem certas inimizades e algumas perturbações. Quando é contrariado, torna-se agressivo e mal-humorado. O nativo deste dia é normalmente um ser solitário, de certa forma incompreendido, parecendo frio e calculista; na realidade é uma extraordinária alma humana, sempre pronto a ajudar os fracos, os amigos e aqueles que necessitam de ajuda humanitária. Nasceu para mandar. É muito organizado, justo, de aspecto intelectual, com grande cultura e senso de responsabilidade. É também elegante no vestir e despreza o modernismo, preferindo o convencional.","Ainda que possa ser uma pessoa teimosa e com ideias fixas, quando está apaixonado pode ser responsável e dedicado a fazer grandes sacrifícios. Frustrações e decepções podem lhe causar problemas biliares, dores de cabeça, reumatismo e problemas de circulação sanguínea."],"27":["Pontos positivos: versátil, imaginativo, criativo, resoluto, corajoso, compreensivo, inventivo, espiritual, audaz e com grande força mental.","Pontos negativos: brigão, inquieto, nervoso, desconfiado e protelador.","O nativo deste excelente dia é normalmente conhecedor dos mistérios da vida e pode, se quiser, ir a extremos: para o bem ou para o mal, e normalmente com 18 anos já definiu o caminho que vai percorrer.","É um ser idealista e sensível, intuitivo e analítico, com uma mente fértil e criativa, que consegue impressionar as outras pessoas com os seus pensamentos originais. Às vezes pode parecer dissimulado, racional ou distante, mas, na verdade, pode estar ocultando tensões internas. Essas tensões podem incluir tendências impulsivas, indecisão ou desconfiança sobre mudanças. Se desenvolver a sua capacidade de comunicação, pode superar a resistência a expressar os seus sentimentos mais profundos. Por mais que necessite ficar só, deve evitar isolar-se. Pode ter mais paz quando cria uma atmosfera harmônica à sua volta.","Tem personalidade audaciosa, liberal, corajosa, combativa e independente - é também grande amante da liberdade e não suporta dar satisfação dos seus atos, preferindo trabalhar só. Quase sempre bem sucedido no plano material, dificilmente tem maiores problemas de dinheiro, pois sabe como consegui-lo.","Tem elevado senso de fraternidade e mente Universal. É afetuoso, emotivo, nervoso e de certa maneira um tanto extravagante, principalmente em se tratando de sua aparência. O amor, a afeição e dedicação ao semelhante representam muito e é capaz de grandes sacrifícios pelos que ama. É por demais pacífico e jamais procura problemas, o que não quer dizer que seja covarde; muito pelo contrário, pois se pode tornar violento quando atingido por injustiças e ingratidões. Caso não tenha uma existência superior e altruísta, as frustrações, fracassos e decepções podem lhe causar perturbações cardíacas e algum tipo de problema cerebral."],"28":["Pontos positivos: compaixão, progressismo, temperamento artístico, ambição, trabalho, vida doméstica estável e voluntarioso.","Pontos negativos: sonhador, falta de compaixão, autoritário, orgulho, agressividade, falta de confiança, vive se queixando e é excessivamente dependente.","É muito contraditório, pois nasceu com o dom do querer, mas vive se queixando. Livre dessa face doentia poderá se impor a tudo e a todos, pelo seu admirável senso diplomático e espírito de justiça e compreensão. Será mais bem sucedido como chefe ou em atividades independentes, pois não gosta de ser mandado nem criticado. Como tem grande vitalidade e energia física, pode se dedicar a várias atividades ao mesmo tempo sem se cansar. Tem muitos começos e poucos fins, e por isso deixa de aproveitar as oportunidades de se tornar famoso e rico. Tem tendência a aumentar seus aborrecimentos, embora não aparente e nem concorde com isso e, dessa maneira, se sujeita a muitos desapontamentos.","Sempre pronto para a ação e para novos empreendimentos, aceita corajosamente os desafios da vida, e com o seu entusiasmo pode com facilidade inspirar as outras pessoas, se não a se juntar, pelo menos, a apoiá-lo suas aventuras. Para superar todos os pontos negativos, deve desenvolver otimismo, autoconfiança e perseverança de propósitos. Estudar a natureza humana, procurando compreendê-la, deixar de ser egoísta e se elevar sempre, seja no plano material como intelectual, são a base de sustentação para que atinja o sucesso e a felicidade tão almejadas."],"29":["Pontos positivos: inspiração, equilíbrio, paz interior, generosidade, sucesso, criatividade, intuição, misticismo, capacidade de liderança e mundanismo.","Pontos negativos: nervosismo, mau-humor, extremismo, arrogância, orgulho e falta de consideração.","Quem nasce neste dia e souber direcionar sua vida para o bem conseguirá tudo o que desejar. O seu sensível intelecto, combinado com a sua poderosa memória e capacidade de liderança, garante que pode dar uma contribuição valiosa em diversas áreas. Com atração por ocupações e atividades relacionadas ao trato com as pessoas, pode se sobressair em carreiras como as de professor, treinador, publicitário, relações públicas, escritor, advogado ou em qualquer ramo holístico, sobretudo na área de auto-ajuda. Tem grande capacidade auditiva e senso variado de humor, podendo em questão de segundos ir da alegria contagiante à mais negativa das formas: a violência. É um ser altamente espiritualizado e as pessoas que com ele convivem devem também comungar de seus ideais e participarem dos seus projetos, pois caso contrário podem-se tornar seus inimigos. Para conseguir se realizar usa de imaginação, brandura de modos (quando não o contrariam) além de elevado espírito de conciliação. Como é moral e intelectualmente elevado, usa a fé, o idealismo e o conhecimento inspirado para tingir seus objetivos, seus ideais.","Sendo extremista, está sujeito a muitas mudanças comportamentais ao longo de sua duradoura vida e, por isso, deve procurar interesses definidos e manter o ânimo calmo e equilibrado, pois a sua normal agitação o torna disperso, provocando na primeira metade da vida (até os 45 anos), muitos começos e poucos fins.","Há uma grande tendência a se voltar para a religião ou esoterismo após os 45 anos e deve cuidar para não cair no fanatismo e também não induzir os demais, pois como é inspirado e cativante, tem facilidade de convencer quem quer que seja. Para ter sucesso na vida, necessita de harmonia em tudo e com todos, pois tem muita dificuldade em se situar no meio-termo. Normalmente quem nasce neste dia afortunado, tem diversos relacionamentos, sendo considerado por todos os místicos o dia do casamento, dos divórcios e das separações (existem as exceções, é claro!). Pode sofrer inúmeras decepções amorosas e, se encontra a sua “cara-metade”, normalmente casa-se cedo. Porém, necessita controlar suas emoções e evitar atitudes apaixonadas, pois as uniões desfeitas causam-lhe imensos sofrimentos e dificuldades para se ajustar a uma nova relação. Muito observador, precisa aprender a ser menos crítico e ter mais consideração pelas pessoas à sua volta.","Embora possua uma excelente capacidade de raciocínio, em geral julga as situações segundo os seus sentimentos e precisa estar em contato com suas emoções mais profundas. Depois que desenvolve os seus critérios de julgamento e aprende a pensar por si mesmo, pode se tornar menos dependente da opinião das outras pessoas. Tem tendência à obesidade, a sofrer de males estomacais e hepáticos. Por isso, quando se frustra ou as coisas não correm como deseja, ou é traído e enganado, sofre em demasia, principalmente nos órgãos citados.","Uma das características mais incríveis deste número é a cura pura e simples (sem qualquer tipo de remédio) de moléstias de difícil diagnóstico. Fumar lhe é altamente prejudicial à saúde."],"30":["Pontos positivos: amor à diversão, lealdade, amizade, talento com as palavras, criatividade e generosidade.","Pontos negativos: preguiça, obstinação, impaciência, insegurança, indiferença, desperdício de energia e não gosta de ser criticado.","Amável e caloroso, gosta muito de atividades sociais e pode ser excepcionalmente carismático e leal. Estar apaixonado ou emocionalmente satisfeito é um requisito fundamental; na sua busca pela felicidade, deve evitar ser excessivamente indulgente ou impaciente. Detesta ser criticado, pois é altamente sensível e não suporta se ver “despido” de seus princípios e ideais. O 0(zero) à direita do 3(três) mostra claramente que existe uma tendência à auto-anulação, à auto- desvalorização, subestimando-se em demasia. Precisa constantemente se conscientizar de seu grande valor e de sua habilidade em superar dificuldades e, principalmente, impor-se antes a si próprio para depois conquistar o respeito e a admiração dos demais.","O poder do amor é a sua maior virtude e com a sua natureza romântica, seu temperamento apaixonado e sua generosidade, as pessoas se sentem atraídas pelo seu carisma e encanto. Embora esteja disposto a fazer grandes sacrifícios pelos seus entes queridos, precisa superar a tendência a permitir que seus sentimentos controlem a sua mente. Tem personalidade marcante, de certa forma perfeccionista, independente e não suporta ser mandado ou trabalhar cargos ou funções subalternas. Caso não seja moralmente desenvolvido, poderá tentar atingir seus objetivos de forma ilegal, fraudulentamente, usando de artifícios pouco convencionais(chegando mesmo a ser cruel), e como não consegue disfarçar seus sentimentos, quase sempre é pego e acaba se arruinando e arruinando os parentes, principalmente aqueles mais próximos, como filhos, irmãos ou o cônjuge. Fora desse lado negativo, normalmente é compreensivo e tolerante com tudo e com todos (apesar de às vezes pensar que está sempre certo). Quando lhe tolhem seus ideais ou frustram seus objetivos, o seu sistema nervoso sofre sobremaneira."],"31":["Pontos positivos: liderança, criatividade, progressista, vigoroso, otimista, fortes convicções, competitivo, independente e habilidoso.","Pontos negativos: arrogância, ciúme, egoísmo, orgulho, fraqueza de caráter, hesitação e impaciência.","Como o número indica, os seus nativos possuem grande habilidade, capacidade, autoridade, e gostam de segurança econômica, e também dão grande valor às suas realizações, esquecendo-se, em muitos casos, de si próprio. Tem ideias originais, um bom-senso de forma e habilidade para ser bem-sucedido nos negócios, se tiver um plano de ação e co
