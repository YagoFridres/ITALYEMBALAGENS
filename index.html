<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NumCabala · Numerologia Cabalística</title>
<meta name="description" content="Sistema de Numerologia Cabalística — mapas por cliente, PDF personalizado e envio por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>/* NumCabala · layout: barra lateral fixa + área de trabalho; relatório em folhas A4 paginadas */
:root{
  --ink:#2a2140; --ink-2:#5d5574; --ink-3:#8a83a0;
  --paper:#f5f3f8; --card:#ffffff; --line:#e3dfeb; --line-2:#efecf5;
  --gold:#a87b2a; --gold-2:#c9a25a; --gold-soft:#f3e9d4;
  --plum:#3b2a5c; --plum-2:#4c3a70; --plum-3:#2a1d42;
  --ok:#2f7a55; --warn:#b5562f; --wa:#1f9d55;
  --f-display:'Marcellus','Cormorant Garamond',Georgia,serif;
  --f-num:'Cormorant Garamond',Georgia,serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  /* cores do relatório (mudam com o tema escolhido) */
  --r-main:#3b2a5c; --r-acc:#a87b2a; --r-soft:#f6f1fb; --r-soft2:#ece4f6; --r-text:#2a2140;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums lining-nums}
[hidden]{display:none!important}

/* ---------- login ---------- */
#login{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(1200px 600px at 50% -10%,#5a4687 0%,var(--plum) 55%,#241938 100%);z-index:50;padding:16px}
.login-card{width:min(380px,100%);text-align:center;color:#f4eefc}
.login-card .star{width:92px;height:92px;margin:0 auto 18px}
.login-card h1{font-size:34px;letter-spacing:.04em}
.login-card p{margin:.3rem 0 1.6rem;color:#cfc4e6;font-size:14px}
.login-card input[type=password]{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #6d5b94;background:#2c2045;color:#fff;font-size:16px;text-align:center;letter-spacing:.15em}
.login-card input:focus{outline:2px solid var(--gold);border-color:transparent}
.login-card button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--gold);color:#fff;font-weight:600;cursor:pointer}
.login-card label.rem{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;font-size:13px;color:#cfc4e6;cursor:pointer}
.login-err{color:#ffb4a0;min-height:20px;font-size:13px;margin-top:8px}

/* ---------- app shell ---------- */
#app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
nav.side{background:var(--plum);color:#e9e2f7;padding:22px 14px;position:sticky;top:0;height:100vh;align-self:start;overflow:auto;display:flex;flex-direction:column;gap:3px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;border-bottom:1px solid #ffffff1f;margin-bottom:10px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-weight:400;font-size:20px;display:block;line-height:1.1}
.brand small{color:#bfb2da;font-size:12px}
nav.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
nav.side button .ic{width:20px;text-align:center;opacity:.85}
nav.side button:hover{background:var(--plum-2)}
nav.side button.on{background:#fff;color:var(--plum);font-weight:600}
nav.side .sep{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#a99cc7;margin:14px 10px 4px}
nav.side .foot{margin-top:auto;font-size:12px;color:#a99cc7;padding:10px;line-height:1.4}
nav.side .foot button{padding:6px 0;font-size:12px;color:#d9cff0;text-decoration:underline}
main{padding:28px max(16px,3vw) 80px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:30px}
.top p{margin:4px 0 0;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--gold)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--plum);color:#fff;border-color:var(--plum)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.wa{background:var(--wa);color:#fff;border-color:var(--wa)}
.btn.danger{color:var(--warn)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel h2{font-size:20px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);font-weight:500}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;font-size:15px;color:var(--ink);font-weight:400}
label.f textarea{resize:vertical;line-height:1.5}
label.f input:focus,label.f textarea:focus,label.f select:focus{outline:2px solid var(--gold);border-color:transparent}
label.ck{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.hint{font-size:12.5px;color:var(--ink-2);font-weight:400}
.accents{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.accents button{width:38px;height:34px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;font-size:17px}
.accents button:hover{border-color:var(--gold);background:var(--gold-soft)}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--gold-soft);color:#7a5815;font-weight:600}
.badge.ok{background:#e1f2e8;color:var(--ok)}

/* clientes */
.search{flex:1;min-width:200px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff}
.clist{display:grid;gap:10px;margin-top:16px}
.citem{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.citem .av{width:52px;height:52px;border-radius:50%;background:var(--gold-soft);display:grid;place-items:center;font-family:var(--f-num);font-size:26px;font-weight:700;color:var(--gold)}
.citem h3{font-family:var(--f-body);font-weight:600;font-size:16px}
.citem .meta{font-size:13px;color:var(--ink-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:#efecf5;color:var(--ink-2)}
.chip b{color:var(--ink)}
.empty{text-align:center;padding:46px 20px;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat small{display:block;font-size:12px;color:var(--ink-2)}
.stat b{font-family:var(--f-num);font-size:28px;color:var(--plum)}

/* mapa */
.namebox{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0 4px}
.lt{display:flex;flex-direction:column;align-items:center;min-width:26px}
.lt span:first-child{border:1px solid var(--ink);padding:2px 5px;font-weight:600;min-width:26px;text-align:center;background:#fff}
.lt span:last-child{color:#2547a8;font-family:var(--f-num);font-weight:700;font-size:18px}
.lt.vow span:first-child{background:var(--gold-soft)}
.lt.gap{min-width:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;text-align:left;cursor:pointer;font:inherit}
.tile:hover{border-color:var(--gold)}
.tile small{display:block;font-size:11.5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-family:var(--f-num);font-size:32px;font-weight:700;line-height:1.1;color:var(--plum)}
.tile .v.sm{font-size:20px;line-height:1.3}
.tile .v.xs{font-size:16px;line-height:1.3;font-family:var(--f-body);font-weight:600}
.tile .s{font-size:12px;color:var(--ink-3)}
.tile.master{background:linear-gradient(160deg,#fff 40%,var(--gold-soft))}
.tile.master .v{color:var(--gold)}
.sect{margin-top:26px}
.sect>h2{font-size:22px;margin-bottom:6px}
.interp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:12px 0;scroll-margin-top:16px}
.interp.off{opacity:.55}
.interp header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.interp header .n{font-family:var(--f-num);font-weight:700;font-size:26px;color:var(--plum);min-width:34px;text-align:center;line-height:1}
.interp header h3{font-size:18px;flex:1;min-width:160px}
.interp header .acts{display:flex;gap:6px;flex-wrap:wrap}
.interp .txt{white-space:pre-wrap;outline:none;border-radius:8px;padding:6px 8px;margin:0 -8px;line-height:1.6}
.interp .txt:focus{background:#fbf8f1;box-shadow:0 0 0 1px var(--gold)}
.interp .edited{font-size:11px;color:var(--gold);font-weight:600}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.toc a{font-size:12.5px;padding:4px 10px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--ink-2);text-decoration:none}
.toc a:hover{border-color:var(--gold);color:var(--ink)}

/* pirâmide */
.pyr{font-family:'Courier New',monospace;font-weight:700;font-size:15px;line-height:1.55;overflow-x:auto;padding:10px 0;text-align:center;white-space:nowrap}
.pyr .r span{display:inline-block;width:1.45em}
.pyr .r.letters span{color:var(--ink);border-bottom:1px solid var(--line)}
.pyr .r.base span{color:#2547a8}
.pyr .seq{background:#f9d9cf;color:#a3341a;border-radius:3px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font-size:13px}
.tabs button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600}
.scroll{overflow-x:auto}

/* capas */
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:12px}
.cov{position:relative;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;cursor:pointer;aspect-ratio:210/297;display:block;padding:0}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.cov.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.cov .lbl{position:absolute;left:0;right:0;bottom:0;background:#1d1430cc;color:#fff;font-size:11.5px;padding:4px 6px;text-align:center}
.cov .del{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:#fff;color:var(--warn);cursor:pointer;font-weight:700;line-height:24px;padding:0}
.cov.def{display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#fff 0,#f6f1fb 60%,#ece4f6 100%);color:var(--plum);font-family:var(--f-display);text-align:center;font-size:13px}
.themes{display:flex;gap:10px;flex-wrap:wrap}
.theme{border:2px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;background:#fff;display:flex;align-items:center;gap:8px;font-size:13px}
.theme.on{border-color:var(--gold)}
.theme i{width:22px;height:22px;border-radius:50%;display:inline-block}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--plum);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:95;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:#1d143099;display:grid;place-items:center;z-index:80;padding:16px}
.modal>.panel{width:min(560px,100%);max-height:92vh;overflow:auto}
.modal>.panel.wide{width:min(760px,100%)}
.busy{position:fixed;inset:0;background:#1d1430cc;display:grid;place-items:center;z-index:99;color:#fff;font-size:16px;text-align:center;padding:20px}
.busy .bar{width:min(320px,80vw);height:8px;border-radius:99px;background:#ffffff33;margin:14px auto 0;overflow:hidden}
.busy .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
.wa-prev{background:#e7ffdb;border-radius:10px;padding:10px 12px;white-space:pre-wrap;font-size:14px;border:1px solid #cdeec0}

/* ---------- relatório (PDF) ---------- */
#report{display:none}
#report.preview{display:block;background:#d9d4e2;padding:0 0 30px;position:fixed;inset:0;overflow:auto;z-index:70}
#report.preview .bar{position:sticky;top:0;z-index:2;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px;margin:0 0 18px;background:var(--plum)}
.sheets{display:flex;flex-direction:column;align-items:center;gap:18px}
.sheet{width:210mm;height:297mm;background:#fff;position:relative;box-shadow:0 2px 20px #2a214033;color:var(--r-text);overflow:hidden;font-family:var(--f-body);flex:none}
.sheet .body{position:absolute;left:18mm;right:18mm;top:24mm;bottom:20mm;overflow:hidden}
.sheet .rh{position:absolute;left:18mm;right:18mm;top:9mm;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:.8px solid var(--r-acc);padding-bottom:2.2mm;font-size:8.5pt;color:#6d6585}
.sheet .rh b{font-family:var(--f-display);font-weight:400;font-size:11.5pt;color:var(--r-main)}
.sheet .rf{position:absolute;bottom:8mm;left:18mm;right:18mm;display:flex;justify-content:space-between;gap:6mm;font-size:8pt;color:#8a83a0;border-top:.6px solid #e3dfeb;padding-top:2mm}
.sheet .rf .pg{font-family:var(--f-num);font-size:10pt;color:var(--r-main);font-weight:700}
/* capa padrão */
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 38%,#ffffff 0,var(--r-soft) 55%,var(--r-soft2) 100%)}
.cover .frame{position:absolute;inset:10mm;border:1.2px solid var(--r-acc);outline:.8px solid color-mix(in srgb,var(--r-acc) 45%,transparent);outline-offset:3mm;pointer-events:none}
.cover .corner{position:absolute;width:16mm;height:16mm;color:var(--r-acc)}
.cover .eyebrow{font-size:10.5pt;letter-spacing:.38em;text-transform:uppercase;color:var(--r-acc)}
.cover h1{font-size:34pt;margin:5mm 0 2mm;color:var(--r-main);line-height:1.1}
.cover .h1b{font-family:var(--f-num);font-style:italic;font-size:17pt;color:var(--r-main);opacity:.8}
.cover .cname{font-family:var(--f-num);font-size:27pt;font-weight:600;font-style:italic;margin-top:14mm;color:var(--r-text);padding:0 20mm;line-height:1.15}
.cover .cdate{margin-top:3mm;color:#5d5574;font-size:11pt;letter-spacing:.06em}
.cover .rule{width:40mm;height:1px;background:var(--r-acc);margin:7mm auto 0}
.cover .by{position:absolute;bottom:24mm;left:0;right:0;font-size:9.5pt;color:#5d5574;letter-spacing:.05em}
.cover .by b{display:block;font-family:var(--f-display);font-weight:400;font-size:16pt;color:var(--r-main);letter-spacing:0;margin-top:1mm}
.cover img.logo{max-height:30mm;max-width:70mm;margin-bottom:8mm;object-fit:contain}
/* capa com imagem */
.cover-img{background:#000}
.cover-img>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover-img .ov{position:absolute;left:0;right:0;padding:16mm 16mm;text-align:center}
.cover-img .ov.pos-top{top:0;background:linear-gradient(#0009,#0000)}
.cover-img .ov.pos-center{top:50%;transform:translateY(-50%)}
.cover-img .ov.pos-bottom{bottom:0;background:linear-gradient(#0000,#000a)}
.cover-img .ov.light{color:#fff;text-shadow:0 1px 6px #0007}
.cover-img .ov.dark{color:#2a2140;text-shadow:0 1px 6px #fff8}
.cover-img .ov.dark.pos-top{background:linear-gradient(#fffc,#fff0)}
.cover-img .ov.dark.pos-bottom{background:linear-gradient(#fff0,#fffc)}
.cover-img .ov .t1{font-family:var(--f-display);font-size:26pt;line-height:1.1}
.cover-img .ov .t2{font-family:var(--f-num);font-style:italic;font-size:22pt;font-weight:600;margin-top:4mm}
.cover-img .ov .t3{font-size:10.5pt;margin-top:2mm;letter-spacing:.05em}
/* conteúdo */
.sheet h2.pt{font-size:19pt;color:var(--r-main);margin:0 0 4mm;display:flex;align-items:center;gap:3mm}
.sheet h2.pt:after{content:"";flex:1;height:.6px;background:linear-gradient(90deg,var(--r-acc),transparent)}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:2.6mm;margin:3mm 0 5mm}
.rcell{border:.7px solid #e3dfeb;border-radius:2.6mm;padding:2.4mm 2mm;text-align:center;background:#fff}
.rcell.m{background:linear-gradient(160deg,#fff 30%,color-mix(in srgb,var(--r-acc) 14%,#fff))}
.rcell small{display:block;font-size:6.8pt;text-transform:uppercase;letter-spacing:.07em;color:#5d5574;line-height:1.25}
.rcell b{font-family:var(--f-num);font-size:19pt;color:var(--r-main);line-height:1.15;display:block}
.rcell b.sm{font-size:12.5pt;line-height:1.4}
.rcell i{display:block;font-style:normal;font-size:6.8pt;color:#8a83a0}
.rblock{margin:0 0 4.2mm}
.rblock h3{font-size:12.5pt;color:var(--r-main);margin:0 0 1.6mm;display:flex;align-items:center;gap:3mm;font-family:var(--f-display)}
.rblock h3 .n{font-family:var(--f-num);font-weight:700;font-size:14pt;color:#fff;background:var(--r-main);min-width:9mm;height:9mm;border-radius:50%;display:inline-grid;place-items:center;padding:0 1.6mm;flex:none}
.rblock h3 .n.l{border-radius:4.5mm}
.rblock h3 small{font-family:var(--f-body);font-size:8.5pt;color:var(--r-acc);font-weight:600;letter-spacing:.04em}
.rp{margin:0 0 2.2mm;font-size:10.2pt;line-height:1.58;text-align:justify;hyphens:auto;white-space:pre-wrap}
.rp.intro{font-style:italic;color:#5d5574;font-size:9.6pt}
.rp.sub{font-weight:700;color:var(--r-acc);font-size:9.6pt;letter-spacing:.03em;margin-top:3mm;text-align:left}
.rsec{font-family:var(--f-display);font-size:16pt;color:var(--r-main);margin:2mm 0 3mm;padding-bottom:1.4mm;border-bottom:.6px solid var(--r-acc)}
.rname{display:flex;flex-wrap:wrap;gap:1mm;justify-content:center;margin:2mm 0 4mm}
.rname .lt span:first-child{font-size:9.5pt;min-width:6mm;padding:.4mm 1mm;border-color:var(--r-main)}
.rname .lt span:last-child{font-size:11pt;color:var(--r-main)}
.rname .lt.vow span:first-child{background:color-mix(in srgb,var(--r-acc) 18%,#fff)}
.rpyr{font-family:'Courier New',monospace;font-weight:700;font-size:8.6pt;line-height:1.42;text-align:center;white-space:nowrap;margin:2mm 0 4mm}
.rpyr div span{display:inline-block;width:1.5em}
.rpyr .seq{background:#f9d9cf;color:#a3341a}
.rpyr .letters span{color:var(--r-main)}
.rtable{width:100%;border-collapse:collapse;font-size:9pt;margin:1mm 0 4mm}
.rtable th,.rtable td{border-bottom:.6px solid #e3dfeb;padding:1.4mm 1.6mm;text-align:left;vertical-align:top}
.rtable th{font-size:7.5pt;text-transform:uppercase;letter-spacing:.06em;color:#5d5574}
.letter{font-family:var(--f-num);font-size:13pt;line-height:1.6;color:var(--r-text)}
.letter p{margin:0 0 4mm;text-align:justify}
.sign{margin-top:10mm;text-align:right;font-family:var(--f-num);font-style:italic;font-size:16pt;color:var(--r-main)}
.sign small{display:block;font-family:var(--f-body);font-style:normal;font-size:9pt;color:#5d5574}
.closing{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 45%,#fff 0,var(--r-soft) 60%,var(--r-soft2) 100%)}
.closing h2{font-size:24pt;color:var(--r-main)}
.closing p{max-width:130mm;font-family:var(--f-num);font-size:14pt;line-height:1.55;color:#4a4262}
.closing .ct{margin-top:8mm;font-size:10pt;color:#5d5574;line-height:1.8}
.closing .ct b{color:var(--r-main)}
.measure{position:absolute;left:-10000px;top:0;visibility:hidden}

@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important;height:auto}
  #app,#login,.toast,.noprint,.modal,.busy{display:none!important}
  #report,#report.preview{display:block!important;position:static!important;overflow:visible!important;padding:0!important;background:none!important}
  .sheets{display:block;gap:0}
  .sheet{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:820px){
  #app{grid-template-columns:1fr}
  nav.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px}
  nav.side .sep,nav.side .foot{display:none}
  .brand{width:100%}
  nav.side button{width:auto}
  .citem{grid-template-columns:44px 1fr}
  .citem .acts{grid-column:1/-1}
  #report.preview .sheets{zoom:.45}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.rcellx b{font-family:var(--f-num);font-size:30px;color:var(--plum);display:block}
.rcellx span{font-size:12px}

/* ---- documento de impressão dos módulos (fluente, pagina sozinho) ---- */
.printdoc{width:210mm;background:#fff;color:var(--r-text);box-shadow:0 2px 20px #2a214033;padding:16mm 18mm 18mm;margin:0 auto;font-family:var(--f-body);line-height:1.55}
.pd-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--r-acc);padding-bottom:4mm;margin-bottom:6mm}
.pd-brand{display:flex;align-items:center;gap:10px}
.pd-brand img{max-height:16mm;max-width:40mm;object-fit:contain}
.pd-brand b{font-family:var(--f-display);font-weight:400;font-size:15pt;color:var(--r-main);display:block;line-height:1.1}
.pd-brand small{color:var(--ink-2);font-size:9.5pt}
.pd-date{font-size:9pt;color:var(--ink-2)}
.pd-title{font-family:var(--f-display);font-weight:400;font-size:26pt;color:var(--r-main);margin:2mm 0 1mm}
.pd-sub{color:var(--ink-2);font-size:11pt;margin-bottom:5mm}
.pd-body{font-size:11pt}
.pd-body .panel{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:0 0 10px;break-inside:avoid}
.pd-body .panel.empty,.pd-body .hint.noprint{display:none}
.pd-body h2{font-family:var(--f-display);font-weight:400;color:var(--r-main);font-size:16pt;margin:4mm 0 2mm}
.pd-body .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pd-body .tile{border:1px solid var(--line);border-radius:10px;padding:8px 10px;break-inside:avoid}
.pd-body .tile .v{font-family:var(--f-num);font-size:24px;font-weight:700;color:var(--r-main)}
.pd-body .interp{break-inside:avoid;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0}
.pd-body .interp .n{color:#fff;background:var(--r-main);border-radius:50%;min-width:30px;height:30px;display:inline-grid;place-items:center;font-family:var(--f-num);font-weight:700}
.pd-body .pyr,.pd-body .rpyr{font-size:10pt}
.pd-body table.t th,.pd-body table.t td{border-color:var(--line)}
.pd-body .namebox,.pd-body .rname{break-inside:avoid}
.pd-foot{margin-top:8mm;border-top:1px solid var(--line);padding-top:3mm;font-size:8.5pt;color:var(--ink-3);text-align:center}
@media print{
  .printdoc{box-shadow:none;margin:0;padding:12mm 14mm;width:auto}
  #report.preview .sheets{display:block}
}

<script>window.NC_TEXTS={"texts":{"talento":{"1":["Revela um novo talento para empreender e inovar; atuar de forma mais independente e autônoma em relação às características gerais da sua personalidade. Pode ser o desenvolvimento de um novo senso de liderança, com novo impulso. A coragem que faltava para empreender seu próprio negócio, uma nova atividade autônoma ou assumir nova função ou um cargo na empresa onde trabalha. A individualidade recebe um reforço e isso pode surgir positivamente como independência, iniciativa, determinação e espírito empreendedor, ou negativamente como arrogância e prepotência."],"2":["Revela novos talentos colaborativo e diplomático, que talvez estejam faltando a uma personalidade individualista demais; talvez a vontade de servir. Pode ser a sensibilidade que falta ao arrojado demais, que pode surgir como o equilíbrio numa aptidão para julgar, imparcialmente, as questões litigantes. O despertar da percepção intuitiva que leva a uma capacidade de ver as pessoas, as coisas, os eventos, as oportunidades que surgem em seus aspectos mais sutis; uma delicadeza no trato das relações humanas, positivamente, ou dependência em seu aspecto negativo."],"3":["Revela um novo talento criativo que desperta; inspiração, imaginação; talvez uma atitude mais alegre diante da vida, ou a popularidade que desperta favorecendo as relações sociais e o senso de liderança; a superação de uma eventual timidez ao se expor publicamente, com uma expansão na sua capacidade de se expressar, falar em público, escrever. Pode ser aquele dom artístico adormecido que desperta em novo impulso. Negativamente, pode ser que essa superação de uma eventual timidez ao se expor publicamente se torne um falatório infantilizado ou um desleixo ao se vestir."],"4":["Revela um novo talento para organização e administração; uma liderança que surge na forma de um comando disciplinador; uma nova aptidão para construir ou reformar imóveis ou máquinas; um novo talento mais técnico. A praticidade que talvez estivesse faltando para efetivar seus projetos; força de vontade e superação das tendências para as protelações; uma nova disciplina. Objetividade nos julgamentos, nas resoluções, nos aprendizados, nas realizações. Negativamente pode ser um excesso de rigidez ou de exigências."],"5":["Revela um novo talento para uma comunicação mais objetiva; uma versatilidade diante de certa rigidez na personalidade; um certo gosto pela liberdade após a maturidade, que permite se expressar mais criativamente. Um novo senso de observação mais aguçado dos sentidos, da própria sensualidade, das emoções, pensamentos e sentimentos. A coragem que faltava para romper com as estruturas mais conservadoras da personalidade e vir a ser um agente provocador de mudanças e transformações positivas na sociedade. Negativamente pode se tornar um provocador irritante."],"6":["Revela um novo talento para as artes, principalmente cênicas, ou pode ser um reforço nas qualidades de generosidade da personalidade; um novo senso estético na atenção e cuidado para com os que necessitam de sua ajuda e nas relações interpessoais diversas; sensos de familiaridade e de responsabilidade. Um novo talento para conciliar os interesses comuns a todos; uma nova liderança exercida com respeito pela qualidade de vida. Se excedendo nas atenções para com os outros pode se tornar servil demais."],"7":["Revela um novo e primoroso talento pela busca da perfeição nas atividades desenvolvidas; o desenvolvimento de um novo senso de percepção mais refinado, que permite extrair das atividades que empreende o melhor resultado com o menor esforço. O despertar do interesse por autoconhecimento, espiritualidade, assuntos esotéricos, filosofias ou pesquisas científicas. Pode ser o despertar da sensibilidade psíquica. Em seus exageros, tudo isso pode resultar num perfeccionismo intransigente."],"8":["Revela um novo talento para uma liderança visionária e mais carismática; o despertar de novo senso de organização e capacidades administrativas. Pode ser a descoberta do verdadeiro poder interior – o poder espiritual que se exerce no mundo material. O despertar de um novo senso de justiça; de autoridade; de generosidade. Consciência da sua responsabilidade social; espiritualidade prática. Nos excessos de seus atributos pode se exceder em autoridade."],"9":["Revela um novo talento que se expressa numa qualidade mais carismática de liderança e no trato do ser humano em geral; humanização e espiritualidade; novo senso de sabedoria nas avaliações e julgamentos; talvez o despertar de um novo senso de compaixão pela humanidade, de um novo talento artístico, literário, de oratória. Maturidade alcançada por via das reflexões feitas sobre as experiências propostas pela vida. Negativamente pode se tornar manipulação de pessoas."],"11":["Revela um novo talento para uma liderança motivada por ideais superiores e diplomacia; pode ser uma ampliação dos seus talentos caracterizados em sua personalidade. O despertar da inteligência espiritual que conduz à razão equilibrando as emoções com o pensamento elevado; humanização e espiritualidade; amplitude dos horizontes da inteligência e do intelecto. Negativamente pode surgir insegurança e dúvidas sobre suas capacidades."],"22":["Revela um novo e talento para uma liderança focada no idealismo superior e na diplomacia; pode ser uma amplitude dos seus talentos e aptidões caracterizados em sua personalidade; um novo senso de poder e responsabilidade social; uma nova atitude diante da vida, com perspectivas de se autorrealizar em vez de somente desejar oportunidades de enriquecimento material e intelectual. Na extrapolação de seus poderes pode se corromper em sua dignidade."]},"motivacao":{"1":["É normalmente ambicioso, criativo, intelectual, original, inventivo, que não gosta de detalhes; quer liderar, dirigir, dominar, ser elogiado e, por vezes é obstinado e autoritário.","Tem espírito pioneiro, gostando de explorar, não se importando com os riscos que possa ter na busca da sua realização.","É movido pela iniciativa e pela criatividade. Não gosta muito de receber ordens de quem quer que seja e trabalha melhor só ou em cargo de chefia. Ação, honestidade e lealdade, fazem parte desta excelente energia. Às vezes é incompreensível e se recusa a aceitar conselhos, fatos esses que com certeza causarão transtornos à sua carreira e aos seus planos profissionais.","Quando não desenvolvido espiritualmente pode inclinar-se para o egoísmo, vaidade e arrogância excessivas. Torna-se impaciente e dotado de pouca diplomacia e tato para tratar com as pessoas. Por esse motivo, o possuidor deste número enfrenta mais dificuldades do que os outros, principalmente no seu meio profissional, pois o seu jeito exigente, arrogante e ditatorial, vai fazendo inimizades por onde passa. Em alguns casos(não raros) essa dificuldade de convívio se estende aos familiares, amigos e companheiros afetivos.","ORIENTAÇÃO: Cultura, educação e refinamento pessoal são características indispensáveis que devem ser adquiridas para o seu triunfo pessoal, profissional e principalmente afetivo."],"2":["Anseia por amor e compreensão e profissionalmente sente-se mais à vontade em trabalhos cooperativos, na retaguarda, sem muito aparecer.","Ele quer casamento, companheirismo, paz, harmonia e conforto. Manifesta a sua natureza sensível através da suavidade, cordialidade e prestatividade, sendo a sua principal característica a cooperação. Pela sua “aparente” passividade, carência, vulnerabilidade e calma natural, normalmente as pessoas que com ele convivem, quase sempre se aproveitam dessa sua natureza gentil e o usam para proveito próprio.","Normalmente não procura impor suas ideias (por ser conservador) preferindo escutar as dos outros antes de expor as próprias. Está sempre procurando reunir conhecimentos sobre todos os assuntos, e relaciona-se com todas as pessoas sem discriminar raça, credo, classe ou fortuna, numa só amizade e dedicação.","ORIENTAÇÃO: É muito importante para o seu desenvolvimento profissional e pessoal, que aprenda a conviver com o público (ser mais comunicativo) e espalhar conhecimentos para todos, levando-lhes sua mensagem de paz, harmonia e verdade."],"3":["Adora uma plateia; quer ser popular, ter muitos amigos e viver rodeado de beleza. Tem natureza impetuosa entusiástica e sonhadora. É um ser de alta capacidade artística, espírito humano elevado e está sempre procurando levar alegria e prazer aos que o rodeiam. É por demais sincero e tem espírito de liberdade e sociabilidade.","O número três sugere uma pessoa entusiástica, que gosta de se divertir, é sociável e amigável. Contudo, fazer escolhas e amizades é um dos seus grandes desafios, pois como gosta interagir com os outros através de diversões, reuniões sociais e conversas íntimas, às vezes esses não estão ou não são receptivos aos seus interesses e, assim, se afastam desse tipo 'aparecido'.","O 3 tem poderes psíquicos sobre os demais, principalmente no plano espiritual e, em vista desse poder, deve tomar o máximo cuidado com o uso que faz com os mesmos, pois pode comprometer sua paz e seu viver harmônico, quase sempre inadvertidamente, pois mesmo sendo espirituoso e sabendo lidar com as palavras, se sente tímido e inseguro, podendo se isolar ou ficar inibido, achando difícil expressar seus sentimentos.","A realização e a satisfação emocional normalmente derivam da alegria de compartilhar e aprender sobre o amor e a compaixão.","ORIENTAÇÃO: Pelo seu lado altruísta que não sabe dizer não, assumindo mais compromissos do que consegue cumprir, deve evitar os afazeres corriqueiros, estudar filosofia humana e fazer uma coisa de cada vez, indo até o fim, ou seja, terminar o que começa."],"4":["Precisa de ordem e de normas tanto em casa como no trabalho.","Quer trabalhar metodicamente e com afinco em favor dos outros e não gosta muito de inovações. É um conservador nato. É realista e equilibrado e sempre podemos contar com ele. Profissional de alto gabarito é tremendamente dedicado profissão, sendo de certa maneira perfeccionista nos detalhes e na conclusão de um trabalho bem feito.","Gosta de praticidade, de coisas que pode ver, tocar e, principalmente, que se desenvolvem e que protegem. Num nível mais elevado, ele é o ser maduro, sério, firme como uma rocha, gostando de estar protegido contra os embates da vida, ou seja, não gosta de ser pego de surpresa em coisa alguma.","É tremendamente autodisciplinado, trabalhador incansável, obediente, perseverante, sincero, honesto, paciente, obstinado, conservador e deseja a todo custo estabilidade. Normalmente o quatro é astuto, preocupado com a própria segurança e de certa forma atraído para o mundo financeiro, industrial ou negócios em geral. Embora sejam indivíduos um tanto severos e que dificilmente demonstram emoções, são tremendamente leais, honestos e confiáveis.","ORIENTAÇÃO: A ambição material deve vir através dos seus talentos profissionais e esforços continuados. Através desse método pode conseguir tudo o que desejar, mas também deve ter planos que visem beneficiar toda a humanidade. Um outro fator de grande importância é que tendo tendência à teimosia e à rigidez (de ideias e ações), deve aprender a ser mais flexível e adaptável."],"5":["É um ser 'mutável', que gosta de variedade, de experiências incomuns e está sempre à procura de novas oportunidades. Tem percepção arguta, perspicaz e natural curiosidade, o que o leva a querer investigar e elucidar seja que problema for. Amante de novidades, está sempre entusiasmado com o que é novo, moderno, atrativo e incomum.","Poucos o acompanham o ser número cinco em matéria de raciocínio rápido e perspicácia, pois ele se adapta a qualquer meio ou situação. No que tange à sociabilidade, o cinco é versátil, bom falador, amigo, festeiro, fazendo amizades com grande facilidade e, desta maneira, sendo sempre bem-vindo em qualquer roda ou ocasião.","Como possui grande talento e versatilidade, sai-se sempre bem em qualquer função ou atividade, trabalhando somente naquilo que gosta e, assim, jamais se cansando ou mesmo se aborrecendo em suas atividades “corriqueiras”. Liberal e de mente aberta, pode facilmente se adaptar a novas situações ou ter uma atitude progressista. Como é muito habilidoso e eficiente, pode aprender rapidamente e captar as situações com a sua abordagem realista. As viagens e mudanças são partes inerentes do seu estilo de vida.","ORIENTAÇÃO: Como tem fortes inclinações psicológicas e filosóficas, deve adquirir conhecimentos nessas áreas través da dedicação aos estudos experimentais, ser perseverante em seus projetos e objetivos, terminando o que começa."],"6":["É, entre todos os números, o que procura sempre a harmonia pessoal e social. Os atributos principais deste número são o idealismo, a criatividade, o humanitarismo, a compaixão e a visão.","Como é idealista, tem como princípio orientar e consertar tudo o que está errado no mundo. Quer criar raízes e fazer com que sua vida gire em torno do seu lar e das pessoas queridas.","É conciliador, aprecia a fertilidade (adora família grande), tudo que cresce, produz e se expande, entusiasma-se com o milagre da vida, sentindo em tudo a presença do amor. Em vista desse predicado, age como conselheiro confiável e prático e tem amigos que sempre o procuram em épocas difíceis. Por índole, é simpático, intuitivo e persistente. Possui temperamento equilibrado, muito responsável e inclinado aos problemas domésticos (adora uma casa bonita com muitas plantas, animais, bons móveis e tudo na mais perfeita ordem). Tem gostos refinados e se sente bem no conforto e na elegância. Conquista facilmente a popularidade e o êxito social.","ORIENTAÇÃO: Como tem tendência à vaidade e ao egoísmo, deve trabalhar esses atributos negativos através de estudos holísticos e metafísicos. Se aceitar suas limitações e conscientizar-se delas, equilibrará seus sentimentos e pensamentos e poderá ter a harmonia, a paz e a prosperidade tão desejadas."],"7":["Detesta ser mandado, de desconforto físico, barulho e confusão. É observador e pesquisador, gostando de descobrir o porquê de tudo. Não gosta de ter a liberdade tolhida, quer paz e tranquilidade para viver consigo mesmo, para poder sonhar e meditar.","O sete possui intuição, capacidade mental e racional. É considerado o número da espiritualidade e, por isso, normalmente os seus possuidores são introspectivos, silenciosos, perfeccionistas, arredios, estudiosos, possuindo uma sabedoria além do normal. É por demais íntegro e tem o senso de justiça e clemência muito elevado. Está sempre querendo aprender e, principalmente, entender o que quer que seja. Resumindo, está sempre em busca de sabedoria.","Quanto a relacionamentos conjugais ou somente uniões (não oficiais), o número sete deve ter prudência e se unir somente após ponderar os prós e contras, pois se o parceiro não for totalmente compatível com ele, com certeza a união não durará muito, e isso o faz sofrer em demasia. Tem tendência ao ciúme infundado e exigir demais dos parceiros. Como é muito íntegro, não tolera injustiças e está sempre pronto a defender os fracos e oprimidos.","ORIENTAÇÃO: As bebidas alcoólicas, cigarros e drogas, em geral, são venenos para o seu organismo; evite-os. Será muito mais feliz se viver próximo à água, seja ela de rio, lagoa ou mar. Quanto as relações conjugais, o sete deve buscar autoconhecimento nesse campo, pois como está sempre em busca de sabedoria e compreensão, esquece-se de que o parceiro também anseia pelos mesmos predicados."],"8":["Nasceu para o mundo dos grandes negócios e adora lutar contra seus opositores. Normalmente é ambicioso, quer poder, riqueza e sucesso. Em virtude dessa ambição, está sempre motivado e determinado a seguir em frente, em busca dos seus objetivos. É arguto, inteligente, observador, conservador e sabe por instinto enfrentar os embates da vida sem muitos alardes ou desesperos. Não é chegado a ter muitos amigos, mas os que tem, lhe são tremendamente caros, defendendo-os e orientando-os em ocasiões de crises e perturbações.","A sua normal ambição material o torna autoritário e com desejo de dominação. Quando culturalmente desenvolvido, naturalmente adquire espírito intelectual, analítico, bem equilibrado e se torna muito eficiente naquilo que se propõe a fazer. Como tem grande senso natural para os negócios, deve procurar desenvolver suas habilidades inatas de organização e execução.","ORIENTAÇÃO: Deve cultivar a persistência, o senso analítico e agir com diplomacia, paciência e tolerância para conseguir tudo o que deseja. Deve, ainda, aprender a perdoar, compreender e considerar as fraquezas das pessoas quando fizer um julgamento."],"9":["É o ápice da realização intelectual e espiritual.","Busca sempre o conhecimento, quer ensinar, aconselhar e servir à humanidade. Tem um saber subconsciente que, se for desenvolvido, pode-se revelar genial.","É magnético e carismático, mente perceptiva e habilidades psíquicas que apontam para uma receptividade universal. O nove é impessoal, revestido de desinteresse material mas, quando não ciente desses predicados, ou seja, quando não desenvolvido espiritualmente, torna-se vaidoso, gostando de ser elogiado pelas pessoas que o rodeiam.","Embora seja um ser generoso e compassivo, com grande imaginação, pode se iludir ou ficar emocionalmente frustrado quando percebe que as outras pessoas não compreendem as suas perspectivas elevadas. Isso também se dá no âmbito profissional, pois deseja que os colegas ou superiores o compreendam (o que não é muito fácil!) e, assim, frustrando-se, acabando por desistir de suas excelentes ideias. Não tem medo de nada nem de ninguém, e quando aparecem obstáculos em sua vida, sabe muito bem se desvencilhar deles com maestria e energia.","A combinação da inspiração e do idealismo com uma vida interior intensa e sonhos vividos, sugerem que o número nove é um ser universalista, desprovido de egoísmo e cheio de amor para dar.","ORIENTAÇÃO: Deve desenvolver suas qualidades inatas, viajar pelo mundo, conhecer novas pessoas, novos ambientes e novos meios sociais. Caso negligencie a estes “conselhos”, pode-se tornar um ser solitário, introspectivo, tendendo para o isolamento, depressão e desânimo."],"11":["O 11 tem uma postura visionária, pois gostaria de se ver rodeado de pessoas que o admiram, fazendo prevalecer seus pontos de vista, pois pouco valor dá às ideias alheias. Normalmente é atrativo, tanto na parte pessoal como em sociedade. É um ser idealista, e a sua inspiração e a inovação estão sempre presentes. De certa maneira contraditório, pois gosta que suas ideias prevaleçam, por vezes se torna “conciliador” e árbitro das mais diversas contendas, se saindo bem nessa função.","Uma combinação de humildade e confiança o desafia a trabalhar para ter autodomínio material e espiritual. Através da experiência, pode aprender a lidar com os dois lados da sua natureza e desenvolver uma atitude menos extremista, confiando nos seus sentimentos.","É adepto da harmonia das formas, dos métodos persuasivos, da elevação moral das coisas e pessoas e de tudo que tem sentido superior. Apesar de não concordar, é muito vulnerável na sua sensibilidade, magoando-se profundamente com fatos que a outros nem sequer os preocupariam.","ORIENTAÇÃO: Como tem rara intuição e capacidade psíquica que deve desenvolver é aconselhável seguir seus pressentimentos, sem se ater a conselhos alheios ou ideias preconcebidas. Como o medo sempre se relaciona à insegurança em relação ao dinheiro, precisa aprender a superar a tendência a ser arrogante ou calculista. Aprenda a expressar o seu talento único para liberar o seu verdadeiro potencial."],"22":["Apesar de ser reservado, muitas vezes é carinhoso e se preocupa com o bem-estar e a segurança de toda a humanidade, mas nunca perde de vista a sua posição pragmática ou realista. É prático, habilidoso , honesto, cordial, idealista, inspirado e um eficiente organizador com um grande potencial de realização. O 22 , que é um número-mestre, quer dar a sua contribuição para o gênero humano.","Tem necessidade de afeto, carinho e amor. É trabalhador honesto, com uma capacidade de liderança inata, carismático e com uma profunda compreensão das pessoas e de suas motivações. Geralmente culto e mundano, tem muitos amigos e admiradores. Quando determinado, pode atingir o sucesso e a fortuna com a ajuda e o encorajamento dos companheiros de jornada.","A profundidade de seus sentimentos e necessidade de expressão indicam que é um ser dinâmico e motivado quando se sente inspirado. A sua capacidade de resistência e perseverança sugere que você mostre a sua verdadeira personalidade em momentos difíceis e estressantes. Embora seja generoso e entusiasmado, às vezes pode ser egoísta e arrogante.","ORIENTAÇÃO: Se tiver padrões muito elevados, pode se tornar crítico e sentir-se insatisfeito ou antipático. Por isso, deve cultivar a compreensão, a determinação e a persistência. Deve trabalhar sempre em benefício da humanidade, sem se esquecer de si próprio."]},"motivacaoCurta":{"1":["Pontos positivos: liderança, criatividade, atitudes progressistas, independência, vigor físico, convicções fortes, competitividade, otimismo e sociabilidade.","Pontos negativos: arrogância, tendência ao ciúme, egocentrismo, antagonismo, falta de controle em ocasiões que deveria manter a paciência, instabilidade emocional e certa impaciência.","O número um corresponde ao líder, às pessoas influentes, pioneiras, inventivas e planejadoras – embora muitas vezes essas pessoas realizem seus projetos sem levar em conta os envolvidos. Tendem a dominar, consciente ou inconscientemente, todos os seus conhecidos.","Em vista da sua tremenda ousadia, vive a sonhar com grandes empreendimentos, pioneiros, sempre à procura de novidades, visando o presente e o futuro.","O seu êxito profissional, afetivo ou pessoal, depende exclusivamente do seu modo de pensar, falar e proceder, pois como é individualista, dificilmente aceita conselhos ou sugestões de quem quer que seja.","Em virtude da sua personalidade de aspecto arrogante e ditatorial, encontrará, ao longo da vida inúmeras dificuldades de relacionamento, sejam elas de cunho afetivo, pessoal ou mesmo profissional, levando-o a fazer amigos e inimigos com grande facilidade.","Trabalhos subalternos, sem movimentação (como contador, caixa de banco, etc.), o deprimem, e diríamos até, o deixam 'estressado', pouco à vontade e insatisfeito. Deve trabalhar por conta própria ou em cargos de chefia, pois como tem os ouvidos 'sensíveis', não gosta de receber ordens, principalmente quando essa ordem parte de alguém com estudo inferior.","Possui emoções poderosas e habilidades para dar e receber amor. Logo é importante encontrar uma forma de expressar os seus sentimentos em vez de buscar realização em interesses financeiros. Se ficar desanimado, pode cair nos dramas emocionais de outras pessoas, pois a sua sensibilidade precisa encontrar uma via de escape. A ordem e o método são, em geral, benefícios para você, embora um plano de vida definido seja um pré-requisito para fazer bom uso do seu tremendo potencial."],"2":["Pontos positivos: boas parcerias, gentileza, tato, receptividade, intuição, consideração, harmonia, natureza agradável, que demonstra sempre boa vontade em ajudar os outros.","Pontos negativos: desconfiança, subserviência, timidez, egoísmo, ilusão tendência a se magoar facilmente e excesso de sensibilidade.","O dois, apesar de não ser ambicioso, consegue tudo que deseja, mas sempre pela persuasão, nunca pela força. No lado negativo de seu caráter, destaca-se a hesitação constante e a falta de iniciativa, tendo tendência para adiar decisões importantes por qualquer motivo, levando-o a situações delicadas, principalmente no âmbito profissional e afetivo.","Normalmente usa de sua destreza e sabedoria, trabalhando mais nos “bastidores”, ou seja, na retaguarda, para levar alegria e amor a todos os seus conhecidos. É cooperativo, de certa maneira tímido, vulnerável e até passivo, porém sempre atento a todos os detalhes de seu ambiente.","Nasceu para trabalhar em conjunto com outras pessoas, dificilmente se adaptando ao comando, seja de que nível for. É detalhista e prefere fazer uso das suas habilidades inatas lidando com pessoas e satisfazendo seu desejo de eterna harmonia.","Parte do seu sucesso provém do fato de aplicar suas habilidades e saber transformar a teoria em prática. Além disso, o ser dois é muito trabalhador, sempre pensando no sucesso; é, também, de certa forma ambicioso e com grande poder de liderança.","Atento aos detalhes é inventivo e sabe como ninguém solucionar problemas, seja de que nível for. Como é uma pessoa leal, grande parte da sua segurança é construída com amor e amizade; bons relacionamentos são importantes para a sua realização."],"3":["Pontos positivos: humor, felicidade, amizade, lealdade, produtividade, criatividade, franqueza, talento artístico, força de vontade, amor à amizade e talento com as palavras.","Pontos negativos: excesso de imaginação, tendência a se entediar com facilidade, tendência a ser pouco afetivo, extravagância, comodismo, preguiça, hipocrisia, vaidade e ostentação.","O número 3 é da mais alta sabedoria e valor, da harmonia e da ação, do amor-perfeito, da ternura e da força d’alma.","É tremendamente apaixonado pela família (mesmo que não aparente), gosta de receber e dar amor e sente-se muito feliz em poder contribuir para a felicidade alheia. É ambicioso e dificilmente desiste dos seus ideais, seus objetivos.","É um ser criativo e normalmente tem muitos amigos divertidos, além de possuir uma elevada percepção de beleza, cor e forma. O aspecto leve e espirituoso da sua personalidade sugere que gosta de se divertir e de se comunicar, e esses predicados, quando num elemento culturalmente desenvolvido, leva-o à procura de respostas para as questões mais profundas da vida, o que, no final das contas, acaba levando-o a explorar áreas mais espirituais ou místicas.","Detesta receber ordens e trabalhar em uma profissão ou posição inferior, pois como sabe ter poderes e qualidades superiores, também sabe como tirar proveito de qualquer situação que o possa fazer feliz."],"4":["Pontos positivos: capacidade de organização, autodisciplina, firmeza de caráter, trabalhador, sincero, paciente, confiável, perseverante, obstinado e conservador.","Pontos negativos: comportamento destrutivo, pouco comunicativo, rígido, reprimido, pouca sensibilidade, procrastinação, muito econômico, autoritário, afeições ocultas e ressentimentos.","O quatro é o número da perseverança e da imortalidade, da descoberta e da consumação, da firmeza e do propósito, da realização das esperanças, das regras, dos poderes e da vontade.","O novo lhe assusta e sente-se mais à vontade lidando com atividades rotineiras e já consagradas pela experiência. Gosta de construir coisas, mesmo que aparentemente não tenham maior serventia, pois é dotado de grande habilidade manual.","Não suporta pessoas hipócritas, desonestas, preguiçosas e com falta de visão do futuro, e estas deficiências o tornam deprimido e triste.","Não gosta de discussões fúteis, sem motivo aparente. Jamais guarda rancor, ressentimentos ou ódio de qualquer espécie, esquecendo rapidamente qualquer ofensa ou constrangimento.","Sendo um espírito superior, o seu amor ao próximo é, simultaneamente, glória e dever. Usualmente, pode cooperar e se sair bem em trabalhos de equipe; entretanto, como não gosta de receber ordens. É preferível trabalhar por conta própria.","É muito importante ser original, criar as suas próprias ideias e tomar as próprias decisões. Precisa aprender a ser persuasivo e não vigoroso ou autoritário."],"5":["Pontos positivos: Versatilidade, adaptabilidade, instintos fortes, sorte, sedução, ousadia, amor pela liberdade, espirituosidade, curiosidade, sociabilidade e misticismo.","Pontos negativos: Falta de confiabilidade, mutação, procrastinação, inconsistência, libidinosidade, confiança extrema e teimosia.","O cinco é o número dos criativos, dos ousados, dos agitados e dos amantes da liberdade. A característica deste número o impele a viajar pelo mundo sempre em busca de saber, de novas experiências e também prazer. É um ser sociável, agradável e sempre bem-vindo em festas e reuniões. Gosta de ocupações diferentes, aquelas que o permitem estar em contato com pessoas, com o público, e que o deixem agir e exprimir-se livremente.","Detesta receber ordens, principalmente de pessoas com estudo ou capacidade inferior às suas. Também não gosta de trabalhos pesados, enfadonhos, cansativos, preferindo os intelectuais, ou aqueles que o colocam em destaque, como chefe de vendas, de marketing, de criação, ou qualquer outro que implique no desejo de viver e pesquisar.","Possui grande capacidade para lidar com quaisquer tipos de pessoas, sejam elas ricas, influentes ou intelectuais. O cinco, às vezes, tem surtos extraordinários de energia e coragem que lhe permitem reagir rapidamente a situações e agarrar as oportunidades. Possui uma mente excelente e precisa e é capaz de ter pensamentos profundos, além de uma inclinação a pensar de forma técnica e analítica. O seu espírito independente o estimula a ver as coisas de uma maneira original e a buscar a liberdade pessoal.","Porém, deve evitar ser voluntarioso ou obstinado e se tornar negativo e pouco comunicativo."],"6":["Pontos positivos: mundanismo, amabilidade, compaixão, confiabilidade, compreensão, solidariedade, idealismo, vida doméstica, humanitarismo, senso artístico, equilíbrio.","Pontos negativos: descontentamento, ansiedade, timidez, teimosia, franqueza excessiva, perfeccionismo, dominação, egoísmo, desconfiança, cinismo e egocentrismo.","O seis é um número de certa maneira contraditório; é o número da confusão e junção, da união e sedução, do vício e da virtude, da incerteza no casamento, do amor, da atração dos sexos e da beleza. Significa todos os tipos de problemas e discórdias, mas também é capaz de purificação pelo conhecimento e de uma vida elevada.","A família é a base de sustentação de toda a sua vida. Amar e ser amado; eis o desejo maior do número seis.","E quando privado desse amor, sente-se completamente perdido, sem saber o que fazer e como agir.","Aparentemente calmo, pode explodir quando o contradizem ou criticam, principalmente quando nasce nos dias 29, 30, 31 ou primeiro de cada mês.","O seis quer ver todos saudáveis, alegres e repletos de sucesso e felicidade. É pródigo em favorecer os outros, nada esperando em retribuição, passando inúmeras vezes por 'otário', pois as pessoas que favorece dificilmente retribuem os favores recebidos.","Apesar de suas qualidades expressivas e brilhantes, pode ter dificuldades em fazer escolhas e tomar decisões. Como tem diversos interesses que o levam a diferentes direções. É muito importante ter um senso de propósito. Sem isso, pode ficar dividido entre os seus ideais e o desejo de satisfação material.","Um lado da sua natureza pode ter uma forte atração por dinheiro, luxo e um estilo de vida indolente, mas o outro tem um desejo inspirador que pode levá-lo a trabalhar duro para realizar seus ideais. Qualquer que seja a sua escolha, terá muitas oportunidades e a habilidade de driblar as situações difíceis, graças ao seu charme e persuasão.","Excelente marido, esposa ou amante, entrega-se por inteiro aos seus amores ou amizades, exigindo a mesma dedicação por parte dos outros, o que nem sempre acontece, frustrando-o e desestabilizando-o emocionalmente por longos períodos."],"7":["Pontos positivos: educação, confiança, meticulosidade, Idealismo, honestidade, poderes psíquicos, cientificidade, racionalidade, reflexão e pensador silencioso.","Pontos negativos: dissimulação, engano, pouco amável, fingimento, ceticismo, confusão e falta de sentimentos.","É o número da realeza e do triunfo, da fama e da honra, da reputação e da vitória.","O sete é perfeccionista, de certa maneira arredio, por vezes calado, demora a esquentar um relacionamento, interessado em filosofia, religiosidade, política e assuntos extrafísicos.","De grande intuição e discernimento, segue as ideias alheias e só faz o que acredita. É vibrante em seus propósitos, honesto, leal, amigo, profundo, elevado moralmente, não gostando de futilidades e nem de ilegalidades, e as atividades ou atos que as contenham, o deprimem e o entristecem.","Como é um ator natural, muitas vezes passa uma imagem de autoconfiança.","Em geral,é perspicaz e inteligente, com um forte sexto sentido, pode avaliar rapidamente as pessoas e situações. Isso faz com que tenha um desempenho melhor quando ocupa uma posição de liderança em vez de se desgastar em trabalhos físicos.","Mesmo que seja generoso, tanto quanto à sua disponibilidade de tempo quanto de dinheiro, pode se tornar expansivo e indulgente em excesso. Felizmente é aberto às críticas, o que lhe permite usar a auto-análise como uma ferramenta valiosa, com poder de influenciar os demais.","Por vezes é incompreendido, considerado estranho, um ser solitário, incomum, diferente."],"8":["Pontos positivos: liderança, meticulosidade, trabalho árduo, tradição, autoridade, proteção, poder de cura, bom juízo de valores.","Pontos negativos: impaciência, intolerância, mesquinhez, inquietude, excesso de trabalho, dominação, falta de planejamento, controlador.","O oito é considerado o número da atração e da repulsão, da vida, de todos os tipos de lutas, da separação, ruptura, destruição, expectativas e ameaças. Também é conhecido como o “portão da eternidade”.","Dificilmente consegue expressar seus sentimentos, parecendo frio e evasivo; a realidade é outra: é muito carinhoso, meigo, amoroso, carente de afeição e com muito calor humano. Em virtude destas características (ser uma coisa e parecer outra), tem tendência ao materialismo, ao acúmulo de bens materiais e também uma certa ganância de querer possuir a maior quantidade de dinheiro e bens possíveis.","É organizadíssimo e muito dedicado à profissão, sendo excelente para lidar com situações concretas que requerem discernimento e constância. É austero, prático, direto, seguro de si, por vezes generoso, mas também se pode tornar violento quando as coisas não correm como deseja.","Como é dotado de alto senso de justiça, jamais deve fazer qualquer transação comercial fraudulenta, pois essa “falta” poderá lhe ser muito prejudicial ao longo da existência. Normalmente não perde tempo lutando pela fortuna, pois sabe com absoluta certeza que conseguirá atingir seus objetivos.","Com excelente capacidade de avaliação, lida com o dinheiro e as questões materiais de forma instintiva. Pode ter golpes de sorte ocasionais, combinando o seu sexto sentido com informações inesperadas. Como pode passar por períodos de instabilidade financeira, precisa equacionar o problema de como viver bem sem ser extravagante. A sua autoridade natural o leva a ocupar posições de responsabilidade, nas quais pode usar a sua capacidade de organização. E será melhor se isso envolver algum tipo de atividade criativa."],"9":["Pontos positivos: Idealismo, humanitarismo, criatividade, sensibilidade, generosidade, sedução, caridade, desapego e popularidade.","Pontos negativos: frustração, nervosismo, fragmentação, insegurança, egoísmo, pouca praticidade, complexo de inferioridade, medos e preocupação exagerada.","O nove é misterioso, silencioso e liga-se ao plano astral. É o número da sabedoria, da virtude, da experiência, dos mistérios, da moralidade, do valor, da soberania, do amor humano, da obscuridade, da proteção e dos frutos do mérito. Enfim é o número dos universalistas, dos generosos, dos seres humanos sensíveis aos sofrimentos alheios e vivem constantemente em busca da 'verdade', da compreensão, adaptando-se a trabalhos que visam o engrandecimento do ser humano, não medindo esforços e sacrifícios para fazer o que pensa ser certo, ou seja, amar, proteger e defender o próximo.","O nove é um pensador nato e dispõe de grande capacidade de raciocínio, observação, criatividade e compreensão, levando- o a conhecer o âmago e as qualidades de coisas e fatos.","Deve sempre ser impessoal, pois como é universalista, o materialismo pode-lhe causar sérios desapontamentos e aborrecimentos, principalmente com respeito a “amigos” e parentes que considera íntegros e incapazes de ações ilícitas, mas que na realidade são falsos.","Tem excelente capacidade para ganhar dinheiro, e também para perdê-lo. Mas, o mais extraordinário é o fato de “nunca” lhe faltar dinheiro para as despesas do dia-a-dia.","A fé interior é um importante fator para a sua autoconfiança e sem ela pode passar por fases de insegurança, reserva ou falta de autoestima. Perspicaz e de mente aguçada, entende as coisas rapidamente e as utiliza em seu benefício. Embora às vezes possa se preocupar muito com questões materiais é através do uso da sabedoria interior e compreensão espiritual que pode superar a perspectiva fria ou cética. Ousando ser espontâneo e justo ao mesmo tempo, mas sem perder a competitividade, pode desafiar a si mesmo e aos outros sem se sentir arrogante ou poderoso.","Frequentemente atraído por indivíduos criativos, tem grande necessidade de amor e compreensão que se opõe à sua aparência forte e assertiva."],"11":["Pontos positivos: equilíbrio, concentração, objetividade, entusiasmo, espiritualidade, idealismo, intuitividade, inteligência, expansividade, inventividade, senso artístico, prestatividade, capacidade de cura, humanitarismo e poderes psíquicos.","Pontos negativos: complexo de superioridade, desonestidade, falta de objetivos, emotividade excessiva, magoa-se facilmente, falta de clareza, dominação e hipersensibilidade.","O onze é o número do poder, da bravura, da energia, do sucesso em aventuras destemidas, da liberdade.","Suas vibrações são lunares e seus possuidores são idealistas, intuitivos, sensíveis, místicos, imaginativos e pensadores inspirados. O ser onze dificilmente é bem-sucedido como negociante, sentindo-se mais à vontade em profissões agitadas, como política, marketing, administração de grandes empresas ou grandes projetos esotéricos, sociais e ideológicos.","Profundo conhecedor da mente humana, normalmente se destaca dos demais, pois sendo um 'número mestre', consegue vislumbrar em seus amigos e inimigos, defeitos e virtudes que em outros números seria impossível. Tem fé em seus ideais e dificilmente volta atrás em suas decisões. Procura sempre ser justo, leal, compreensivo e viver em harmonia com todos.","A vibração especial deste número sugere que o idealismo, a inspiração e a inovação são altamente importantes para o seu possuidor. Uma combinação de humildade e confiança o desafia a trabalhar para alcançar a independência financeira e espiritual. Através da experiência, pode aprender a lidar com os dois lados da sua natureza e desenvolver uma atitude menos extremista, acreditando nos seus sentimentos.","Em geral, o onze tem muita energia e gosta de vitalidade, mas deve evitar o excesso de ansiedade e a falta de sentido prático.","Se não seguir os dogmas esotéricos e estudos profundos do “hermetismo”, pode-se tornar indolente, indeciso e sujeito à vontade alheia, sendo sugado e feito de empregado por seres muito mais inferiores do que ele. Como é um ser superior, normalmente atrai inveja e conflito das pessoas ao seu redor, fazendo amizades e inimizades com grande facilidade e, assim, dificultando a conclusão dos seus objetivos."],"22":["Pontos positivos: Universalidade, direção, elevada intuição, habilidade manual, pragmatismo, praticidade, construção, realismo, capacidade de organização, resolução de problemas e empreendedor.","Pontos negativos: esquemas de enriquecimento rápido, nervosismo, autoritarismo, materialismo, egoísmo, falta de visão, autopromoção, arrogância e preguiça.","As pessoas cujos nomes correspondem a vinte e dois – o número supremo – possuem todas as qualidades boas dos outros números. Se desejar algo que em princípio pareça impossível, vá em frente, pois com certeza conseguirá atingir o seu objetivo, e até com certa facilidade, pois é habilidoso, idealista, organizado e tem grande potencial de realização.","Tem, ainda, outras qualidades: integridade moral, honestidade nata, inspiração divina, disciplina técnica e social, constância nos objetivos e grande capacidade para levar até ao fim um projeto ou um objetivo. Não é muito fácil conviver com ele, pois sendo “superior”, normalmente não se adapta a situações preconcebidas e muito menos gosta de aceitar ordens de quem quer que seja, gostando de trabalhar sozinho ou então em cargos de chefia.","A ambição pode levá-lo ao mundo dos negócios, no qual pode se sobressair graças à sua capacidade de organização e administração. Isto sugere também que pode vir a ser bem-sucedido nas áreas industrial, bancária, imobiliária e de merchandising. A sua visão e sua imaginação ativa podem levá-lo a seguir carreiras no teatro, fotografia, cinema ou decoração de interiores. A sua habilidade natural para lidar com as pessoas pode ser canalizada para profissões que envolvam o trato com o público, com comunicação, educação, medicina, trabalho social ou advocacia. O seu discernimento especial e compaixão podem levá-lo a trabalhar no mundo da cura, seja na medicina tradicional ou na alternativa."]},"expressao":{"1":["Pontos positivos: liderança, criatividade, atitudes progressistas, independência, vigor físico, convicções fortes, competitividade, otimismo e sociabilidade.","Pontos negativos: arrogância, tendência ao ciúme, egocentrismo, antagonismo, falta de controle em ocasiões que deveria manter a paciência, instabilidade emocional e certa impaciência.","O número um corresponde ao líder, às pessoas influentes, pioneiras, inventivas e planejadoras – embora muitas vezes essas pessoas realizem seus projetos sem levar em conta os envolvidos. Tendem a dominar, consciente ou inconscientemente, todos os seus conhecidos.","Em vista da sua tremenda ousadia, vive a sonhar com grandes empreendimentos, pioneiros, sempre à procura de novidades, visando o presente e o futuro.","O seu êxito profissional, afetivo ou pessoal, depende exclusivamente do seu modo de pensar, falar e proceder, pois como é individualista, dificilmente aceita conselhos ou sugestões de quem quer que seja.","Em virtude da sua personalidade de aspecto arrogante e ditatorial, encontrará, ao longo da vida inúmeras dificuldades de relacionamento, sejam elas de cunho afetivo, pessoal ou mesmo profissional, levando-o a fazer amigos e inimigos com grande facilidade.","Trabalhos subalternos, sem movimentação (como contador, caixa de banco, etc.), o deprimem, e diríamos até, o deixam 'estressado', pouco à vontade e insatisfeito. Deve trabalhar por conta própria ou em cargos de chefia, pois como tem os ouvidos 'sensíveis', não gosta de receber ordens, principalmente quando essa ordem parte de alguém com estudo inferior.","Possui emoções poderosas e habilidades para dar e receber amor. Logo é importante encontrar uma forma de expressar os seus sentimentos em vez de buscar realização em interesses financeiros. Se ficar desanimado, pode cair nos dramas emocionais de outras pessoas, pois a sua sensibilidade precisa encontrar uma via de escape. A ordem e o método são, em geral, benefícios para você, embora um plano de vida definido seja um pré-requisito para fazer bom uso do seu tremendo potencial.","ORIENTAÇÃO: Em vista de ter tendência a começar muitas coisas e não terminá-las, deve adquirir conhecimentos, prudência, ponderação e sabedoria, para poder desenvolver o seu imenso potencial de realização e levar a bom termo os seus objetivos."],"2":["Pontos positivos: boas parcerias, gentileza, tato, receptividade, intuição, consideração, harmonia, natureza agradável, que demonstra sempre boa vontade em ajudar os outros.","Pontos negativos: desconfiança, subserviência, timidez, egoísmo, ilusão tendência a se magoar facilmente e excesso de sensibilidade.","O dois, apesar de não ser ambicioso, consegue tudo que deseja, mas sempre pela persuasão, nunca pela força. No lado negativo de seu caráter, destaca-se a hesitação constante e a falta de iniciativa, tendo tendência para adiar decisões importantes por qualquer motivo, levando-o a situações delicadas, principalmente no âmbito profissional e afetivo.","Normalmente usa de sua destreza e sabedoria, trabalhando mais nos “bastidores”, ou seja, na retaguarda, para levar alegria e amor a todos os seus conhecidos. É cooperativo, de certa maneira tímido, vulnerável e até passivo, porém sempre atento a todos os detalhes de seu ambiente.","Nasceu para trabalhar em conjunto com outras pessoas, dificilmente se adaptando ao comando, seja de que nível for. É detalhista e prefere fazer uso das suas habilidades inatas lidando com pessoas e satisfazendo seu desejo de eterna harmonia.","Parte do seu sucesso provém do fato de aplicar suas habilidades e saber transformar a teoria em prática. Além disso, o ser dois é muito trabalhador, sempre pensando no sucesso; é, também, de certa forma ambicioso e com grande poder de liderança.","Atento aos detalhes, é inventivo e sabe como ninguém solucionar problemas, seja de que nível for. Como é uma pessoa leal, grande parte da sua segurança é construída com amor e amizade; bons relacionamentos são importantes para a sua realização.","ORIENTAÇÃO: O dois era chamado pelos antigos de a “mãe dos números e do casamento”. Como a sua grande virtude é a compreensão dos processos do conhecimento oculto, deve sempre cultivar este dom, a fim de poder viver condignamente sem esperar que alguém ou algo o faça movimentar-se."],"3":["Pontos positivos: humor, felicidade, amizade, lealdade, produtividade, criatividade, franqueza, talento artístico, força de vontade, amor à amizade e talento com as palavras.","Pontos negativos: excesso de imaginação, tendência a se entediar com facilidade, tendência a ser pouco afetivo, extravagância, comodismo, preguiça, hipocrisia, vaidade e ostentação.","O número 3 é da mais alta sabedoria e valor, da harmonia e da ação, do amor-perfeito, da ternura e da força d’alma.","É tremendamente apaixonado pela família (mesmo que não aparente), gosta de receber e dar amor e sente-se muito feliz em poder contribuir para a felicidade alheia. É ambicioso e dificilmente desiste dos seus ideais, seus objetivos.","É um ser criativo e normalmente tem muitos amigos divertidos, além de possuir uma elevada percepção de beleza, cor e forma. O aspecto leve e espirituoso da sua personalidade sugere que gosta de se divertir e de se comunicar, e esses predicados, quando num elemento culturalmente desenvolvido, leva-o à procura de respostas para as questões mais profundas da vida, o que, no final das contas, acaba levando-o a explorar áreas mais espirituais ou místicas.","Detesta receber ordens e trabalhar em uma profissão ou posição inferior, pois como sabe ter poderes e qualidades superiores, também sabe como tirar proveito de qualquer situação que o possa fazer feliz.","ORIENTAÇÃO: A vontade de aprender e a aversão à rotina indicam que você pode passar por diversas experiências na sua busca por uma carreira que o desafie mentalmente. Com a maneira persuasiva com que usa as palavras, pode ser bem-sucedido no mundo da comunicação, vendas, escrita, arte ou área editorial, sendo é claro, o chefe ou trabalhando por conta própria, pois tem grande aversão a ser mandado."],"4":["Pontos positivos: capacidade de organização, autodisciplina, firmeza de caráter, trabalhador, sincero, paciente, confiável, perseverante, obstinado e conservador.","Pontos negativos: comportamento destrutivo, pouco comunicativo, rígido, reprimido, pouca sensibilidade, procrastinação, muito econômico, autoritário, afeições ocultas e ressentimentos.","O quatro é o número da perseverança e da imortalidade, da descoberta e da consumação, da firmeza e do propósito, da realização das esperanças, das regras, dos poderes e da vontade.","O novo lhe assusta e sente-se mais à vontade lidando com atividades rotineiras e já consagradas pela experiência. Gosta de construir coisas, mesmo que aparentemente não tenham maior serventia, pois é dotado de grande habilidade manual.","Não suporta pessoas hipócritas, desonestas, preguiçosas e com falta de visão do futuro, e estas deficiências o tornam deprimido e triste.","Não gosta de discussões fúteis, sem motivo aparente. Jamais guarda rancor, ressentimentos ou ódio de qualquer espécie, esquecendo rapidamente qualquer ofensa ou constrangimento.","Sendo um espírito superior, o seu amor ao próximo é, simultaneamente, glória e dever. Usualmente, pode cooperar e se sair bem em trabalhos de equipe; entretanto, como não gosta de receber ordens é preferível trabalhar por conta própria.","É muito importante ser original, criar as suas próprias ideias e tomar as próprias decisões. Precisa aprender a ser persuasivo e não vigoroso ou autoritário.","ORIENTAÇÃO: Como gosta da sua liberdade, evite fazer julgamentos ou criticar demais as pessoas, pois elas podem ficar ressentidas com as suas decisões e, assim, não lhe prestarem bons serviços ou não colaborar em seus projetos."],"5":["Pontos positivos:Versatilidade, adaptabilidade, instintos fortes, sorte, sedução, ousadia, amor pela liberdade, espirituosidade, curiosidade, sociabilidade e misticismo.","Pontos negativos: Falta de confiabilidade, mutação, procrastinação, inconsistência, libidinosidade, confiança extrema e teimosia.","O cinco é o número dos criativos, dos ousados, dos agitados e dos amantes da liberdade. A característica deste número o impele a viajar pelo mundo sempre em busca de saber, de novas experiências e também prazer. É um ser sociável, agradável e sempre bem-vindo em festas e reuniões. Gosta de ocupações diferentes, aquelas que o permitem estar em contato com pessoas, com o público, e que o deixem agir e exprimir-se livremente.","Detesta receber ordens, principalmente de pessoas com estudo ou capacidade inferior às suas. Também não gosta de trabalhos pesados, enfadonhos, cansativos, preferindo os intelectuais, ou aqueles que o colocam em destaque, como chefe de vendas, de marketing, de criação, ou qualquer outro que implique no desejo de viver e pesquisar.","Possui grande capacidade para lidar com quaisquer tipos de pessoas, sejam elas ricas, influentes ou intelectuais. O cinco, às vezes, tem surtos extraordinários de energia e coragem que lhe permitem reagir rapidamente a situações e agarrar as oportunidades. Possui uma mente excelente e precisa e é capaz de ter pensamentos profundos, além de uma inclinação a pensar de forma técnica e analítica. O seu espírito independente o estimula a ver as coisas de uma maneira original e a buscar a liberdade pessoal.","Porém, deve evitar ser voluntarioso ou obstinado e se tornar negativo e pouco comunicativo.","ORIENTAÇÃO: Como terá muitas experiências na vida, deve usar essas experiências e o seu temperamento corajoso para levar até o fim os seus projetos, pois é de certa forma dispersivo, não conseguindo terminar o que começa, tendo mais começos do que fins."],"6":["Pontos positivos: mundanismo, amabilidade, compaixão, confiabilidade, compreensão, solidariedade, idealismo, vida doméstica, humanitarismo, senso artístico, equilíbrio.","Pontos negativos: descontentamento, ansiedade, timidez, teimosia, franqueza excessiva, perfeccionismo, dominação, egoísmo, desconfiança, cinismo e egocentrismo.","O seis é um número de certa maneira contraditório; é o número da confusão e junção, da união e sedução, do vício e da virtude, da incerteza no casamento, do amor, da atração dos sexos e da beleza. Significa todos os tipos de problemas e discórdias, mas também é capaz de purificação pelo conhecimento e de uma vida elevada.","A família é a base de sustentação de toda a sua vida. Amar e ser amado; eis o desejo maior do número seis.","E quando privado desse amor, sente-se completamente perdido, sem saber o que fazer e como agir.","Aparentemente calmo, pode explodir quando o contradizem ou criticam, principalmente quando nasce nos dias 29, 30, 31 ou primeiro de cada mês.","O seis quer ver todos saudáveis, alegres e repletos de sucesso e felicidade. É pródigo em favorecer os outros, nada esperando em retribuição, passando inúmeras vezes por 'otário', pois as pessoas que favorece dificilmente retribuem os favores recebidos.","Apesar de suas qualidades expressivas e brilhantes, pode ter dificuldades em fazer escolhas e tomar decisões. Como tem diversos interesses que o levam a diferentes direções é muito importante ter um senso de propósito. Sem isso, pode ficar dividido entre os seus ideais e o desejo de satisfação material.","Um lado da sua natureza pode ter uma forte atração por dinheiro, luxo e um estilo de vida indolente, mas o outro tem um desejo inspirador que pode levá-lo a trabalhar duro para realizar seus ideais. Qualquer que seja a sua escolha, terá muitas oportunidades e a habilidade de driblar as situações difíceis, graças ao seu charme e persuasão.","Excelente marido, esposa ou amante, entrega-se por inteiro aos seus amores ou amizades, exigindo a mesma dedicação por parte dos outros, o que nem sempre acontece, frustrando-o e desestabilizando-o emocionalmente por longos períodos.","ORIENTAÇÃO: Para se elevar e conquistar fama e fortuna deve procurar profissões de interesse humanitário, sempre incentivado pelos que ama. Deve, também, concentrar sua energia e não se preocupar com o que outras pessoas dizem ou fazem. Aprenda a dizer 'não' sem medo de ofender os outros."],"7":["Pontos positivos: educação, confiança, meticulosidade, Idealismo, honestidade, poderes psíquicos, cientificidade, racionalidade, reflexão e pensador silencioso.","Pontos negativos: dissimulação, engano, pouco amável, fingimento, ceticismo, confusão e falta de sentimentos.","É o número da realeza e do triunfo, da fama e da honra, da reputação e da vitória.","O sete é perfeccionista, de certa maneira arredio, por vezes calado, demora a esquentar um relacionamento, interessado em filosofia, religiosidade, política e assuntos extrafísicos.","De grande intuição e discernimento, segue as ideias alheias e só faz o que acredita. É vibrante em seus propósitos, honesto, leal, amigo, profundo, elevado moralmente, não gostando de futilidades e nem de ilegalidades, e as atividades ou atos que as contenham, o deprimem e o entristecem.","Como é um ator natural, muitas vezes passa uma imagem de autoconfiança.","Em geral,é perspicaz e inteligente, com um forte sexto sentido, pode avaliar rapidamente as pessoas e situações. Isso faz com que tenha um desempenho melhor quando ocupa uma posição de liderança em vez de se desgastar em trabalhos físicos.","Mesmo que seja generoso, tanto quanto à sua disponibilidade de tempo quanto de dinheiro, pode se tornar expansivo e indulgente em excesso. Felizmente, é aberto às críticas, o que lhe permite usar a auto-análise como uma ferramenta valiosa, com poder de influenciar os demais.","Por vezes é incompreendido, considerado estranho, um ser solitário, incomum, diferente.","ORIENTAÇÃO: Deve controlar a sua vida e estabelecer primeiro uma base sólida.","Deve aproveitar o que a vida tem de melhor e evitar o comodismo. Deve trabalhar em prol da humanidade, em serviços que beneficiem a coletividade e que de alguma maneira o satisfaçam intelectual e também espiritualmente. Precisa meditar e receber inspiração do eu interior."],"8":["Pontos positivos: liderança, meticulosidade, trabalho árduo, tradição, autoridade, proteção, poder de cura, bom juízo de valores.","Pontos negativos: impaciência, intolerância, mesquinhez, inquietude, excesso de trabalho, dominação, falta de planejamento, controlador.","O oito é considerado o número da atração e da repulsão, da vida, de todos os tipos de lutas, da separação, ruptura, destruição, expectativas e ameaças. Também é conhecido como o “portão da eternidade”.","Dificilmente consegue expressar seus sentimentos, parecendo frio e evasivo; a realidade é outra: é muito carinhoso, meigo, amoroso, carente
