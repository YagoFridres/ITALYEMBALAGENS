 de afeição e com muito calor humano. Em virtude destas características (ser uma coisa e parecer outra), tem tendência ao materialismo, ao acúmulo de bens materiais e também uma certa ganância de querer possuir a maior quantidade de dinheiro e bens possíveis.","É organizadíssimo e muito dedicado à profissão, sendo excelente para lidar com situações concretas que requerem discernimento e constância. É austero, prático, direto, seguro de si, por vezes generoso, mas também se pode tornar violento quando as coisas não correm como deseja.","Como é dotado de alto senso de justiça, jamais deve fazer qualquer transação comercial fraudulenta, pois essa “falta” poderá lhe ser muito prejudicial ao longo da existência. Normalmente não perde tempo lutando pela fortuna, pois sabe com absoluta certeza que conseguirá atingir seus objetivos.","Com excelente capacidade de avaliação, lida com o dinheiro e as questões materiais de forma instintiva. Pode ter golpes de sorte ocasionais, combinando o seu sexto sentido com informações inesperadas. Como pode passar por períodos de instabilidade financeira, precisa equacionar o problema de como viver bem sem ser extravagante. A sua autoridade natural o leva a ocupar posições de responsabilidade, nas quais pode usar a sua capacidade de organização. E será melhor se isso envolver algum tipo de atividade criativa.","ORIENTAÇÃO: Como é progressista, dá grande importância ao dinheiro, ao status social e deseja constantemente expressar livremente os seus sentimentos, deve evitar situações monótonas ou excesso de rigidez. Terá mais chance de se realizar como alto executivo, comerciante ou trabalhando por conta própria."],"9":["Pontos positivos:Idealismo, humanitarismo, criatividade, sensibilidade, generosidade, sedução, caridade, desapego e popularidade.","Pontos negativos: frustração, nervosismo, fragmentação, insegurança, egoísmo, pouca praticidade, complexo de inferioridade, medos e preocupação exagerada.","O nove é misterioso, silencioso e liga-se ao plano astral. É o número da sabedoria, da virtude, da experiência, dos mistérios, da moralidade, do valor, da soberania, do amor humano, da obscuridade, da proteção e dos frutos do mérito. Enfim, é o número dos universalistas, dos generosos, dos seres humanos sensíveis aos sofrimentos alheios e vivem constantemente em busca da 'verdade', da compreensão, adaptando-se a trabalhos que visam o engrandecimento do ser humano, não medindo esforços e sacrifícios para fazer o que pensa ser certo, ou seja, amar, proteger e defender o próximo.","O nove é um pensador nato e dispõe de grande capacidade de raciocínio, observação, criatividade e compreensão, levando- o a conhecer o âmago e as qualidades de coisas e fatos.","Deve sempre ser impessoal, pois como é universalista, o materialismo pode-lhe causar sérios desapontamentos e aborrecimentos, principalmente com respeito a “amigos” e parentes que considera íntegros e incapazes de ações ilícitas, mas que na realidade são falsos.","Tem excelente capacidade para ganhar dinheiro, e também para perdê-lo. Mas, o mais extraordinário é o fato de “nunca” lhe faltar dinheiro para as despesas do dia-a-dia.","A fé interior é um importante fator para a sua autoconfiança e sem ela pode passar por fases de insegurança, reserva ou falta de autoestima. Perspicaz e de mente aguçada, entende as coisas rapidamente e as utiliza em seu benefício. Embora às vezes possa se preocupar muito com questões materiais é através do uso da sabedoria interior e compreensão espiritual que pode superar a perspectiva fria ou cética. Ousando ser espontâneo e justo ao mesmo tempo, mas sem perder a competitividade, pode desafiar a si mesmo e aos outros sem se sentir arrogante ou poderoso.","Frequentemente atraído por indivíduos criativos, tem grande necessidade de amor e compreensão que se opõe à sua aparência forte e assertiva.","ORIENTAÇÃO: Como nasceu para ser livre, não deve se apegar a nada nem a ninguém, e sim amar e trabalhar em prol de toda a humanidade, sem nada esperar em troca. Evite ser destrutivo ou vingativo. Tente perceber a necessidade das outras pessoas e evite ser autocentrado ou crítico; evite dominar os outros com as suas opiniões. A compaixão e o amor trazem as maiores recompensas."],"11":["Pontos positivos: equilíbrio, concentração, objetividade, entusiasmo, espiritualidade, idealismo, intuitividade, inteligência, expansividade, inventividade, senso artístico, prestatividade, capacidade de cura, humanitarismo e poderes psíquicos.","Pontos negativos: complexo de superioridade, desonestidade, falta de objetivos, emotividade excessiva, magoa-se facilmente, falta de clareza, dominação e hipersensibilidade.","O onze é o número do poder, da bravura, da energia, do sucesso em aventuras destemidas, da liberdade.","Suas vibrações são lunares e seus possuidores são idealistas, intuitivos, sensíveis, místicos, imaginativos e pensadores inspirados. O ser onze dificilmente é bem sucedido como negociante, sentindo-se mais à vontade em profissões agitadas, como política, marketing, administração de grandes empresas ou grandes projetos esotéricos, sociais e ideológicos.","Profundo conhecedor da mente humana, normalmente se destaca dos demais, pois sendo um 'número mestre', consegue vislumbrar em seus amigos e inimigos, defeitos e virtudes que em outros números seria impossível. Tem fé em seus ideais e dificilmente volta atrás em suas decisões. Procura sempre ser justo, leal, compreensivo e viver em harmonia com todos.","A vibração especial deste número sugere que o idealismo, a inspiração e a inovação são altamente importantes para o seu possuidor. Uma combinação de humildade e confiança o desafia a trabalhar para alcançar a independência financeira e espiritual. Através da experiência, pode aprender a lidar com os dois lados da sua natureza e desenvolver uma atitude menos extremista, acreditando nos seus sentimentos.","Em geral, o onze tem muita energia e gosta de vitalidade, mas deve evitar o excesso de ansiedade e a falta de sentido prático.","Se não seguir os dogmas esotéricos e estudos profundos do “hermetismo”, pode-se tornar indolente, indeciso e sujeito à vontade alheia, sendo sugado e feito de empregado por seres muito mais inferiores do que ele. Como é um ser superior, normalmente atrai inveja e conflito das pessoas ao seu redor, fazendo amizades e inimizades com grande facilidade e, assim, dificultando a conclusão dos seus objetivos.","ORIENTAÇÃO: Como todos os grandes seres humanos, aqueles que se destacam dos demais, o onze também tem certas dificuldades de adaptação ao meio ambiente, ao convívio com seres de inferior categoria, que não o compreendem, não o apoiam e ainda o criticam. Deve ir em frente nos seus ideais sem se preocupar com o que os outros pensam de si."],"22":["Pontos positivos: Universalidade, direção, elevada intuição, habilidade manual, pragmatismo, praticidade, construção, realismo, capacidade de organização, resolução de problemas e empreendedor.","Pontos negativos: esquemas de enriquecimento rápido, nervosismo, autoritarismo, materialismo, egoísmo, falta de visão, autopromoção, arrogância e preguiça.","As pessoas cujos nomes correspondem a vinte e dois – o número supremo – possuem todas as qualidades boas dos outros números. Se desejar algo que em princípio pareça impossível, vá em frente, pois com certeza conseguirá atingir o seu objetivo, e até com certa facilidade, pois é habilidoso, idealista, organizado e tem grande potencial de realização.","Tem, ainda, outras qualidades: integridade moral, honestidade nata, inspiração divina, disciplina técnica e social, constância nos objetivos e grande capacidade para levar até ao fim um projeto ou um objetivo. Não é muito fácil conviver com ele, pois sendo “superior”, normalmente não se adapta a situações preconcebidas e muito menos gosta de aceitar ordens de quem quer que seja, gostando de trabalhar sozinho ou então em cargos de chefia.","A ambição pode levá-lo ao mundo dos negócios, no qual pode se sobressair graças à sua capacidade de organização e administração. Isto sugere também que pode vir a ser bem-sucedido nas áreas industrial, bancária, imobiliária e de merchandising. A sua visão e sua imaginação ativa podem levá-lo a seguir carreiras no teatro, fotografia, cinema ou decoração de interiores. A sua habilidade natural para lidar com as pessoas pode ser canalizada para profissões que envolvam o trato com o público, com comunicação, educação, medicina, trabalho social ou advocacia. O seu discernimento especial e compaixão podem levá-lo a trabalhar no mundo da cura, seja na medicina tradicional ou na alternativa.","ORIENTAÇÃO: Pode-se tornar famoso, tanto nacional como também internacionalmente, pois como tem grande capacidade de persuasão e destreza com as palavras, consegue convencer a todos com seus argumentos e ideias, que outras não devem ser se não as que visem o bem da humanidade. Todo e qualquer vício lhe é altamente prejudicial, principalmente o fumo."]},"impressao":{"1":["A impressão deste ser é exatamente isto: um ser superior que se destaca dos demais, fazendo com que todos, invariavelmente, se virem para ele.","É líder por natureza e vive patrocinando novas ideias, sejam elas suas ou de outrem. Nessa busca, sonha em ser corajoso, ousado, justo, leal e original, tanto nas qualidades profissionais, quanto no seu modo de se vestir e no falar. É persistente e dificilmente se deixa dominar pelo desânimo, por isso, para conseguir o que deseja, pode mostrar-se teimoso, egoísta, obstinado e por vezes opressor. Sabe mandar, dirigir e tem aparência sólida e autoconfiante.","Entre os amigos (que são muitos) é sempre escolhido para liderar, pois as suas ideias e posturas sólidas, lhe conferem as prerrogativas inerentes aos vencedores.","Mostra grande potencial e habilidade executiva e de liderança, que pode se manifestar em trabalhos de especialização na sua área de atuação ou em postos de gerenciamento e administração, na carreira militar ou política.","ORIENTAÇÃO: Precisa aprender que o mundo não gira ao seu redor, e a inclinação a ser autocentrado e ditatorial. Deve também policiar seus desejos gastronômicos, pois sendo o centro das atenções em festas e reuniões, pode-se deixar levar pela gula e sofrer de obesidade após os 50 anos."],"2":["O 2 quer amor, amizade, carinho, harmonia e paz. Tem feições que o destacam de todos os outros números: é ardoroso, idealista, calado, pacífico, diplomata, sendo muito hábil em conciliações de interesses seus e alheios. Na tentativa de agradar as pessoas de quem gosta, corre o risco de se tornar excessivamente dependente. Contudo, desenvolver a autoconfiança, pode superar essa tendência e vir a ser uma pessoa bem-sucedida, sem grandes problemas.","É também responsável, justo, gosta de calma, de legitimidade, esclarecimento e também inspiração. Gosta também de se sentir compreendido e confortado. Quando só, parece sonhador, trazendo a cabeça nas 'nuvens'.","Pelos modos calmos, gentis e agradáveis, desperta em todos a segurança e a confiança. Normalmente age com naturalidade e simplicidade, não gostando de se exibir, seja em família ou numa roda social.","A discrição é seu lema.","ORIENTAÇÃO: Infelizmente, em nossa sociedade, a simplicidade é vista como sinônimo de fraqueza. Por isso, deve aprender a ser mais dinâmico, arrojado, criativo e sempre procurando inovar, sem medo de errar ou ser diferente. Evite a estagnação ou a monotonia."],"3":["É do tipo social, amistoso, alegre e jovial. O 3 é popular, atraente, criativo, gostando de ser aplaudido, notado, admirado, ou seja, que o vejam como um verdadeiro artista. Normalmente cultiva a criatividade, os contatos sociais e a expressão de suas próprias ideias e sentimentos, especialmente através de alguma forma de arte.","Demonstra personalidade e um espírito de grande profundidade, justiça, esperança, filantropia, alegria e felicidade.","Abençoado e com charme, sensibilidade e imaginação fértil, o três precisa equilibrar essas qualidades com alguma forma de fundação sólida na vida.","Embora seja, em geral, artístico, charmoso e elegante, com excelentes relacionamentos, e tenha um bom-senso de humor, talvez precise desenvolver a auto-estima e evitar tendências à preocupação ou insegurança emocional.","ORIENTAÇÃO: deve evitar constrangimentos e aborrecimentos, além da preocupação excessiva em relação aos projetos futuros, pois esses sentimentos perniciosos podem lhe prejudicar sobremaneira o fígado e o coração."],"4":["O 4 é o número da consumação e da manifestação da luz. É o número do entendimento e da ordem; é a chave que abrirá muitas portas mágicas fechadas ao homem comum. É o número dos seres rígidos, fortes, seguros, objetivos, trabalhadores, conservadores e dignos de confiança; o sustentáculo da família, da empresa e dos amigos.","É naturalmente preciso, simples, comedido, sendo apreciador de boa música, teatro e gastronomia. Elegante no vestir, preferindo o clássico ao moderno.","A sólida estrutura e capacidade de organização mostra que o quatro precisa de estabilidade e ordem. Como a natureza o dotou de grande energia, habilidades práticas e forte determinação, com certeza conseguirá, com estes predicados, atingir seus objetivos.","É detalhista, ordeiro, natural no andar, de gestos simples e graciosos.","Bom ouvinte está sempre interessado nas conversas alheias quando estas lhe parecem sinceras e concretas.","ORIENTAÇÃO: Como é o esteio da família, deve ser empreendedor (colocar as ideias em ação), mesmo que a princípio pareçam 'loucas'. Cuidado com a obesidade, excesso de autoridade e de controlar em demasia a vida dos outros."],"5":["É um número mágico e peculiar, que era usado pelos gregos e romanos como amuleto para proteger o portador dos espíritos malignos. O dono deste número é normalmente intuitivo, fazendo-o normalmente conhecer o âmago, o caráter e sentimentos alheios.","É cativante, interessante, agradável e porque não dizer,magnético.","Sonha em viajar por todos os recantos do planeta levando uma vida de aventuras, sem vínculos ou até mesmo sem muita responsabilidade (não que não a tenha). Sabe se defender dos inimigos é esperto e dificilmente consegue ser enganado. É também muito leal e sabe fazer amizades e também inimizades com muita facilidade.","Está sempre à procura do que está além da superfície dos seres e das coisas, gostando de se mostrar antecipado, ora criando, descobrindo ou ditando modas. Uma das suas maiores virtudes é o entusiasmo com que encara qualquer inovação ou novidade, além de estar sempre bem informado sobre todas as coisas, sendo muito difícil surpreendê-lo.","Mesmo quando a idade chegar, terá sempre uma aparência alegre e juvenil. O desejo de explorar ou experimentar qualquer novidade e a abordagem entusiástica, sugerem que a vida tem muito a lhe oferecer.","O charme é dos seus atributos naturais e, por isso, não tem problemas em atrair admiradores e amantes.","ORIENTAÇÃO: Como tem grande senso de humor e é atrativo fisicamente, precisa ser seletivo na escolha de amizades e parceiros para seus projetos."],"6":["O seis é visto como a perfeição dos números pelos cabalistas e o filósofo grego Nicomachus o chama de Vênus, deusa a quem era consagrado e razão pela qual é tido como o número do amor. O portador deste número é elegante, atraente, do tipo paternal e em certas ocasiões, encantador. Sonha com uma família maravilhosa, uma bela casa, com varandas, flores e sempre pronta para receber os amigos.","É de certa maneira contraditório, pois enquanto tem o dom da harmonia, também atrai confusão; é o número da sedução, do vício e da virtude, das incertezas no casamento e também do amor puro e simples; gosta de segurança, tem senso de responsabilidade, ama o social (tem tendência à extravagância) e não suporta viver só.","O seis possui uma nobreza interior que se mostra especialmente quando ocupa posição de liderança ou de responsabilidade. Encara o trabalho com seriedade e dá o melhor de si quando tem liberdade de ação. Quando aprende a examinar todos os fatos de qualquer situação difícil ou a ceder em vez de se lançar em jogos de poder, tem resultados mais positivos.","ORIENTAÇÃO: Como é naturalmente generoso e por vezes ingênuo, dando valor a pessoas que não merecem, inclusive sendo explorado por eles, deve aprender a dizer 'não', a ouvir, meditar e só depois de muito pensar, tomar resoluções, ou seja, não agir precipitadamente. Como é digno de caráter, pensa que todos o são, mas não é verdade."],"7":["É um número classificado como próspero e geralmente é visto assim. É um número inteiramente religioso e como tal foi estimado pelos antigos; representa o triunfo do espírito sobre a matéria. Tem facilidade de adquirir numerosas simpatias no mundo social. Seu grande desejo é se ver cercado de livros numa atmosfera de paz, beleza e tranquilidade, e isso o leva a imaginar-se sábio e também o refúgio aonde todos venham consultar.","É tremendamente místico, de natureza meditativa e também solitária, apesar de gostar da companhia dos amigos e também de elogios, vivendo à procura do entendimento e também do esclarecimento de suas dúvidas e conflitos. Dispõe de natureza expressiva, única e imponente, pois a sua personalidade sete, não pode ser imitada pelos que não pertencem à mesma vibração. Possui personalidade exigente, sinceridade e honestidade com todos, exigindo, é claro, reciprocidade. Tem natureza distinta, delicada, sóbria, não gostando muito de aparecer.","Como é uma pessoa sensível, com sentimentos intensos e profundos, aprende a relaxar procurando ser alegre e evitando sobrecarregar sua mente quando enfrenta situações estressantes. A tendência a ser enigmático ou dissimulado, muitas vezes o leva a desenvolver a arte de fazer perguntas sutis sem deixar que ninguém saiba o que realmente está pensando.","ORIENTAÇÃO: Por ser detalhista, aparentemente descrente e de certa forma excêntrico, deve aprender a compreender os outros e aceitar como eles são, evitando a crítica, a calúnia ou dando conselhos a quem não lhe pediu."],"8":["Este número é peculiar e visto como de grande poder pelos antigos gregos e cabalistas, que diziam: 'Todas as coisas são oito'. O oito aparenta imponência e influência, mesmo que esteja com problemas pessoais ou financeiros. Tem raciocínio vivo e perspicaz, e seus modos são calmos e equilibrados.","Sonha em ser o comandante de grande empreendimento comercial, um poderoso executivo, sempre cercado de tudo e de todos e chefiando numerosos empregados.","É ordeiro, prático e está sempre procurando fazer do seu local de trabalho um lugar agradável e eficiente, onde existam todas as coisas necessárias ao bom desenvolvimento profissional.","Quando é atingido em seu amor-próprio é passível de impulsos de mau humor e até certas repulsas a brincadeiras.","Altamente criativo, o oito tem uma força vigorosa que o impele a sempre buscar novas formas de realização. Naturalmente dramático, mas com aversão a obedecer aos outros, não gosta de receber críticas.","Tem uma incrível habilidade para lidar com as pessoas e fazer contatos, mas pode alterar entre ser caloroso e atencioso e ser frio indiferente.","Gosta de ser notado e de dar impressão de estar bem financeiramente. Tem senso natural para os negócios e se beneficiará muito se desenvolver suas habilidades executivas e de organização.","ORIENTAÇÃO: Como a maioria das pessoas o vê como 'superior', tal superioridade não deve 'arrogante' nem servir para menosprezar quem quer que seja. É imperioso que estude as Ciências Ocultas, a espiritualidade e desenvolva qualquer atividade humanitária."],"9":["É o ser que atrai sempre simpatias e antipatias na mesma proporção. Sonha em ser um humanitarista, ávido por servir, compreensivo em relação aos sofrimentos alheios e uma fonte de conforto e aconselhamento.","Realiza-se pelo esforço que emprega em resolver os problemas alheios, dando-lhes amizade e carinho. É um visionário, sempre em busca de harmonia, esclarecimento e analisando tudo e todos, procurando desvendar os problemas mais obscuros e incompreendidos da Natureza.","Possui rara inteligência e também profundos conhecimentos sobre os mais diversos assuntos, mesmo que tenha tido uma educação insuficiente.","Pela sua aparência (imponente), personalidade marcante, sabedoria, bondade, compreensão e ponderação, normalmente inspira confiança em todos que o conhecem, podendo produzir admiráveis resultados, pois normalmente atinge o fim a que se propõe.","Quando vê as coisas correrem como quer, normalmente se sente leve e sabe julgar o caráter das pessoas. Isso lhe permite ser sociável e voltado para as coisas públicas, características que, quando combinadas, o levam a ajudar muitas pessoas.","ORIENTAÇÃO: Se tiver os seus desejos reprimidos ou limitados, tende a se comportar de forma rebelde ou a se tornar temperamental. Precisa ser mais flexível e menos orgulhoso. Adapte-se a situações novas e aprenda a esquecer o passado. Evite a cor preta, principalmente durante o dia."]},"destino":{"1":["PONTOS POSITIVOS: Pioneirismo, iniciativa, capacidade de liderança, inventividade, capacidade de comando e espírito executivo. Devido a estas características, o consulente com esta vibração, normalmente tem êxito e prosperidade em quase todas as atividades.","Normalmente é talentoso e espirituoso. Uma pessoa ativa e produtiva, dotada de uma inteligência aguçada e perspicaz. Se for estimulado por um projeto que considere valer a pena, tem o talento, a vitalidade e a capacidade para realizações extraordinárias.","O 1 necessita de brilho, de reconhecimento e sucesso. Para conseguir esse estágio, se dedicam exaustivamente ao trabalho e normalmente são os melhores na sua área de atuação. Quem com ele convive, fica muito intrigado, pois demonstra sempre um semblante bem feliz, alegre, descontraído e, acima de tudo, de muita confiança em suas realizações, mesmo que tudo isso não seja verdade.","PONTOS NEGATIVOS: Tendência à arrogância, egoísmo, prepotência, excesso de ânimo e dominação, por vezes achando que o sucesso do grupo dependeu exclusivamente dele.","Esse tipo de postura pode tornar difícil o convívio com os amigos e colegas de trabalho, além de dificultar o relacionamento a dois, pois não é nada fácil conviver com esse tipo de pessoa.","Um dos obstáculos à sua realização pessoal é a tendência a sobrecarregar o seu sistema nervoso com uma atitude crítica e preocupada. Como isso pode isolá-lo dos outros, precisa ter fé em si mesmo e nas suas habilidade e aproveitar ao máximo suas ideias originais e inventivas.","ORIENTAÇÃO: Como não gosta de receber ordens, deve sempre procurar trabalhar por conta própria ou em cargo de chefia. Sendo individualista, íntegro e honesto em seus propósitos, deve aprender a ser pioneiro, a trabalhar em grupo e a ser comandante, não ditador; a ouvir conselhos, analisar situações e, após meditar sobre o assunto, tomar decisões. Ou seja, não agir precipitadamente."],"2":["PONTOS POSITIVOS: É o número das associações com outras pessoas; aquele capaz de unir, juntar ideias e fatos e contribuir para a realização de qualquer projeto. Possui grande capacidade para assimilar ideias alheias, valorizá-las e condensá-las, de forma a criar um clima de satisfação em todos os envolvidos.","Tem habilidades diplomáticas naturais e sabe deixar os outros à vontade. Normalmente as pessoas se sentem atraídas por sua gentileza e maneiras refinadas e normalmente s e ajusta bem a trabalhos em conjunto. É amigo leal, excelente pai ou mãe e faz grande questão de proteger os familiares, amigos ou simplesmente colegas de trabalho.","Quando consegue ver as pessoas e situações a partir de uma perspectiva superior, pode dar muito de si, ao mesmo tempo em que se mantém distante, confiando que a vida irá naturalmente resolver as coisas no tempo devido.","PONTOS NEGATIVOS: Tem tendência ao acomodamento e a esperar que os outros tomem a iniciativa, procurando manter-se na retaguarda, aparecendo pouco.","Como não é pioneiro ou individualista quanto aos seus projetos de vida, é muito comum perder excelentes oportunidades por causa disso, não notando que o tempo vai passando e os projetos e ideais vão ficando cada vez mais distantes.","No lado psicológico, quando está com disposição negativa (o que não é raro), corre o risco de se sacrificar ou de se deixar levar pela autopiedade ou comodismo.","ORIENTAÇÃO: Precisa cultivar a paciência, cooperação, tato, lealdade, aplicação e capacidade de seguir a orientação dos outros.","Sendo o seu principal atributo a união, deve aprender a unir todos aqueles que desejam essa parceria. Porém, não deve interferir (o que normalmente faz) naqueles que não desejam estar unidos.","Trabalhe sempre em parceria; se não existir, procure. Não fique parado esperando que as coisas caiam do céu ou que apareça alguém do nada para lhe ajudar a resolver seus problemas."],"3":["PONTOS POSITIVOS: É o Destino da sociabilidade. O 3 é alegre, versátil e talentoso. É criativo, social e possui o dom artístico, seja falando, representando, escrevendo, pintando ou desenvolvendo qualquer outro tipo de arte.","Ao longo da sua existência deve sempre procurar cultivar esses dotes, ou seja, a criatividade, os contatos sociais e a expressão de suas ideias e sentimentos.","Tudo o que faz cresce e se multiplica. Tem, na comunicação, como um todo, o seu principal trunfo para ser próspero e feliz. A emoção e a criatividade são as razões do seu sucesso, pois tem extraordinária facilidade de expressão e também grande capacidade executiva.","Dinâmico e versátil, tem uma personalidade charmosa e habilidade para promover suas ideias. Quanto mais se dedicar ao trabalho, melhores serão os resultados e recompensas. Pode ser bem sucedido como vendedor, professor, relações públicas, nas artes plásticas ou cênicas ou em contato com o público.","PONTOS NEGATIVOS: Entedia-se facilmente é vaidoso em demasia, exagerado, impaciente, extravagante, esbanjador, com certa irresponsabilidade para cumprir horários e desprezar pessoas com nível inferior ao seu. Quando essas características se manifestam, torna-se completamente insociável, disperso e com grande tendência a se entediar, a se isolar e ter crises nervosas.","ORIENTAÇÃO: Como nasceu com o dom da palavra, da comunicação, deve usar esse dom intuitivo para alcançar sucesso em trabalhos mentais. Embora o dia 3 faça com que seja artístico e charmoso, dotado de um bom senso de humor, precisa desenvolver a auto-estima e evitar as tendências a se preocupar ou se sentir emocionalmente inseguro. Deve, ainda, manter sob controle suas necessidades de movimentação e os excessos de atividades corriqueiras. Seja mais seleto nas amizades, ou seja, procure qualidade à quantidade."],"4":["PONTOS POSITIVOS: O 4 é o Destino da conquista, por meio do trabalho duro e incansável. Necessita cultivar a paciência, a confiança e a disposição para servir. Sua vida, em geral, não é muito fácil, em termos de retorno e exigências. Terá de trabalhar muito, com muita dedicação para manter a vida financeira, afetiva e social. Porém, tudo o que consegue é sólido e eterno. Dedica-se de corpo e alma aos seus projetos e conquistas e quase sempre é bem-sucedido profissionalmente.","Tem poucos amigos, porém sinceros e não se interessa por quantidade, preferindo a qualidade em tudo e em todos. Sensível, cheio de ideias criativas e com senso de visão, tem potencial para expressar os seus conceitos originais e inspirados. Isso pode ajudá-lo a superar possíveis preocupações quanto à sua instabilidade financeira e a tomar as decisões corretas. Em si repousa a segurança e a estabilidade para manter tudo e todos que dele dependem.","PONTOS NEGATIVOS: Como é muito estruturado, conservador e inflexível, viver em grupo é extremamente difícil e quase sempre rejeita o novo, pois essa incerteza lhe transmite insegurança e possibilidades de perdas.","É perfeccionista ao extremo e cobra demais dos outros, sejam familiares, amigos ou subordinados, tornando-se por vezes chato e incompreendido. Se levar uma vida negativa, poderá se inclinar para assuntos fraudulentos, conspirações, orgulho demasiado ou a planos astutos e maléficos para enriquecer rapidamente às custas do sofrimento alheio.","ORIENTAÇÃO: Deve viver bem ponderadamente, desenvolver o senso de responsabilidade moral, equilíbrio no poder e correta aplicação do saber em todos os seus projetos e realizações.","Para viver sem muitos altos e baixos, precisa praticar a justiça, a ponderação e serviço a terceiros, sempre que a oportunidade se oferecer. Deve se relacionar positivamente com todos e respeitar o direito que eles tem de errarem. Deve, também, se relacionar com pessoas inteligentes e com as quais possa compartilhar os seus interesses."],"5":["PONTOS POSITIVOS: É o viajante, sempre desejoso de mudanças e de novidades. Esta vibração pertence às pessoas versáteis, no sentido de mudar, alterar e transformar. Está sempre à procura do que é novo, moderno, diferente. Esta procura também se estende pelo âmbito do saber, aprender e conhecer, muito mais do que por capricho ou prazer.","É alegre, comunicativo, inteligente e receptivo, sempre bem-vindo em qualquer roda. Curioso, dotado de capacidade de discernimento, em geral procura se fortalecer através do conhecimento. Com ele não existe “mau tempo”; está sempre de bem com a vida e, por isso, por vezes é confundido e até tachado de irresponsável, coisa que não é, em absoluto.","Como é mentalmente ativo, gosta de um bom desafio intelectual. Contudo, a sua inclinação para se envolver em disputas implica que quando não consegue o que quer pode ficar irascível.","PONTOS NEGATIVOS: Normalmente compra mais coisas do que necessita e pode pagar, levando-o a ter alguns problemas financeiros ao longo da vida. No lado sentimental, busca relações novas e intrigantes, que são as que o atraem, e às vezes se envolve em situações afetivas de que dificilmente se desvencilha. É um ser extrovertido com ampla visão de tudo e de todos, mas inconstante em seus objetivos, levando-o a ter muitos começos e poucos fins.","ORIENTAÇÃO: Para evitar os aspectos negativos prejudiciais ao desenvolvimento pessoal, deve desenvolver o poder de análise e seleção, aproveitando as experiências para aperfeiçoar e elevar seu caráter e sentir uma nobre afinidade humana isenta de interesses particulares, sexuais ou materiais. Como vive quase que exclusivamente no presente, é aconselhável trabalhar com um propósito definido, com um objetivo altruísta e levá-lo até o fim, aconteça o que acontecer.","Lembre-se que a desordem não faz parte do Universo; logo, quando encontrar desordem, mude; mude a desordem em uma nova ordem. Será um bom psicólogo, historiador, professor, jurista, conferencista ou carreiras que tenham contato com o público.","Como admira pessoa poderosas e independentes, precisa de um parceiro que o enfrente e que não se intimide com a sua personalidade vigorosa. Embora seja amigável e sociável, gosta de fazer as coisas sozinho e de enfrentar novos desafios. Como gosta de exercitar o seu poder cerebral, prefere a companhia de pessoas inteligentes."],"6":["PONTOS POSITIVOS: O 6 é normalmente dócil, educado, não suporta brigas e desentendimentos e quer sempre manter tudo calmo e tranquilo. É o número da harmonia, do lar e do amor. Compaixão, idealismo e natureza atenciosa são algumas das qualidades sugeridas por este dia admirável.","É o número do perfeccionista ou do amigo universal e em muitos casos, humanitário, responsável e amoroso. Adora crianças, plantas e animais.","A sua forte personalidade, combinada co m sua capacidade amorosa e seu charme, pode ser muito atraente para os demais. É ambicioso mas também compreensivo e encorajador, com disposição de fazer qualquer coisa pelas pessoas que ama. Detesta aglomerações e festividades excessivas, gosta da harmonia e de viver em paz. Geralmente se dá bem em relacionamentos afetivos, pois é amável e muito gentil.","PONTOS NEGATIVOS: É por demais sentimental, vulnerável e crédulo, sempre confiando nas aparências sem analisar os fatos friamente.","Tem, normalmente, dois problemas: o acomodamento e a falta de interesse.","Por ser profundo, necessita de tranquilidade para, no mínimo, aparentar estar bem consigo mesmo. Quanto ao interesse, vai necessitar ser constantemente incentivado, pois caso contrário tem uma tendência a deixar tudo a meio caminho. Na tentativa de manter tudo calmo e tranquilo, por vezes acaba interferindo de maneira não condizente com o momento, pois nem sempre a docilidade é o melhor remédio para certas situações, e isso o perturba sobremaneira, levando-o a se retrair e a acomodar-se, até que outro fato ou circunstância o incentivem.","ORIENTAÇÃO: Como é o Destino da responsabilidade e da liderança, necessita aprender a se ajustar a condições pouco harmoniosas, a assumir o fardo dos outros, a defender suas próprias ideias e a servir com alegria. Apesar de seus ideais elevados, precisa ser determinado, ter paciência e perseverança para atingir as suas metas.","Deve trabalhar com o público, pois conquista amizades e simpatias com grande facilidade, sendo respeitado e amado por todos."],"7":["PONTOS POSITIVOS: Normalmente é uma pessoa que busca na vida o entendimento, o conhecimento mais profundo e qualitativo. No desenrolar de sua vida sempre procurará ser eficiente, intuitivo, perfeccionista, meticuloso, racional, reflexivo, concentrado, reservado, compreensivo e amoroso, apesar de não demonstrar qualquer desses sentimentos altruístas. Busca sempre o lado oculto das coisas e das pessoas. Nunca se satisfaz com as aparências, preferindo conhecer a essência.","Com uma necessidade constante de ter uma maior autoconsciência, gosta de reunir informações e se interessa por ler, escrever por assuntos espirituais. A tendência a ser enigmático ou reservado sugere que pode ocasionalmente se sentir mal interpretado.","PONTOS NEGATIVOS: Por vezes tem espírito dominador, crítico, exigente, perfeccionista, angustiado, impaciente, orgulhoso e aparentemente descrente. Embora seja pragmático por natureza, pode, às vezes, ter ideias pouco convencionais; tome cuidado, porém, para que isso não vire uma desculpa para ser do contra somente para se fazer de difícil.","Deve, também, aprender a valorizar as pessoas como elas são, ou seja, respeitar o fato de os outros serem fruto daquilo que conseguiram absorver da vida e do convívio com os demais.","ORIENTAÇÃO: O 7 é o Destino da sabedoria e também o da solidão, por isso necessita desenvolver seus poderes mentais, estudar, meditar, buscar o significado último da vida. Enfim, tornar-se um especialista. Com sua inteligência arguta, sua habilidade de liderança e poder inerente a este dia, pode ter muitas oportunidades profissionais e ser bem-sucedido em qualquer uma delas. Pode ser escritor, advogado, pesquisador, religioso, pesquisador ou trabalhar simplesmente para desenvolver espiritualmente o planeta. Contudo, evite usar o poder de forma destrutiva e se rebelar contra os outros, pois o “tiro pode sair pela culatra”, ou seja, você ser o prejudicado no final."],"8":["PONTOS POSITIVOS: É aquele que tem capacidade para planejar, organizar e levar a efeito qualquer tipo de negócio. O seu Destino é o ganho financeiro e material. Individualista, inteligente e sensível, tem uma personalidade exigente. Embora seja ambicioso e vigoroso, e tenha coragem e lealdade aos seus ideais é também muito gentil e generoso com os que ama. Geralmente não apresenta problemas financeiros, pois caso não seja herdeiro será empreendedor. Objetividade é o seu lema. É justo, disciplinado, honesto, amigo, econômico, elegante e bom negociante.","A sua necessidade de crescimento e habilidade para rever o todo sugere que gosta de pensar em grandes termos. Confiante e curioso, não gosta de interferências de outras pessoas e, com a inclinação à teimosia, pode tornar-se inquieto e impaciente.","PONTOS NEGATIVOS: Como está sempre sendo impulsionado para ganhar dinheiro e para conquistas materiais, por vezes se esquece da família, do lado sentimental, social e, principalmente, de si próprio. Apresenta, também, acentuada dificuldade em demonstrar afeto e carinho, aparentando frieza nos relacionamentos em geral. Na realidade, é um ser altamente emotivo, necessitando de ajuda e compreensão por parte das pessoas mais chegadas.","ORIENTAÇÃO: Precisa cultivar a eficiência na arte de negociar e compreender as leis que comandam a acumulação, o poder e o uso do dinheiro.","Para aproveitar ao máximo a sua inteligência rápida, sua necessidade de expressão e o lado sociável da sua natureza, precisa superar a inclinação à incerteza ou à indecisão nos seus relacionamentos emocionais.","Necessita aprender que as pessoas precisam de atenção. Por isso, fique atento: quanto maior for a ostentação, mais as pessoas concluirão que você não precisa delas. E, se em algum momento você realmente precisar, elas não estarão por perto.","Como tem grande capacidade executiva, pode ser advogado, executivo de grandes empresas, vendedor (por conta própria), professor, político, missões religiosas ou conselheiro."],"9":["PONTOS POSITIVOS: É o Destino da universalidade. A pessoa com este Destino normalmente é espirituosa, charmosa, divertida e amorosa, mas o seu desejo de ser bem sucedido deriva de uma interessante mistura de materialismo e idealismo. Benevolência, ponderação e sensibilidade emocional estão associadas a este dia. Tolerante e gentil. É na maior parte das vezes generoso e liberal. Sua intuição e seu poder psíquico indicam uma receptividade universal que, se positivamente canalizada, pode inspirá-lo a buscar o caminho espiritual.","Necessita que as pessoas ao seu redor estejam bem, pois caso contrário tudo fará para que isso aconteça. Sua necessidade de auxílio é voltada para o todo, para a humanidade e não para uma pessoa ou um caso especial. Preocupa-se com tudo que esteja em desacordo com suas inspirações. É muito emotivo e por demais sentimental.","PONTOS NEGATIVOS: Como vive para o mundo, por várias vezes acaba perdendo excelentes oportunidades, principalmente no âmbito profissional. Embora seja idealista e generoso, pode ser reservado e, em algumas ocasiões, ocultar sentimentos profundos que podem se transformar em ressentimentos. Frustra-se com certa facilidade, pouco prático, de certa maneira egoísta, tem dias amargos, complexo de inferioridade, medos, preocupação exagerada e tendência ao isolamento.","ORIENTAÇÃO: Necessita servir e se divertir. Precisa aprender a amar o próximo, a livrar-se dos preconceitos, ser generoso, tolerante e compreensivo com seus semelhantes. Este número sugere a necessidade de superar desafios e a tendência a ser excessivamente sensível e passível de instabilidade emocional. Pode-se beneficiar de viagens internacionais e da interação com pessoas de diversos círculos sociais, mas deve evitar os sonhos irrealistas ou a inclinação ao escapismo.","Com sua grande capacidade para adquirir conhecimentos, pode ser bem sucedido no meio acadêmico ou nas áreas de advocacia, psicologia, medicina, literatura, ou ainda nas artes plásticas de um modo geral e, principalmente, no meio esotérico."],"11":["PONTOS POSITIVOS: É o Destino da inspiração. É o número das pessoas altamente sensíveis e intuitivas.","O 11 possui facilidade de ver, não somente a realidade atual, mas também os seus desdobramentos. Enxergam longe. Normalmente são impacientes e dotados de certo nervosismo. Sensível e idealista, normalmente uma pessoa enérgica, com enorme potencial mental quando está disposto a se disciplinar através da concentração nos seus objetivos. Versátil e imaginativo, precisa expressar o seu poder criativo e emocional. A compostura e a perseverança são frequentemente a chave para o seu sucesso, e pode impressionar quando se especializa em uma área específica.","O número-mestre 11 sugere que o idealismo, a inspiração e a inovação são altamente importantes para ele. Uma combinação de humildade e confiança o desafia a trabalhar para alcançar a independência financeira e espiritual.","É concentrado, objetivo, inspirador, muito espiritualizado, intuitivo, expansivo, prestativo, tem grande habilidade para curar, humanitário e psíquico.","PONTOS NEGATIVOS: Tendência a vícios, falta de objetivos, complexo de superioridade, magoa-se com facilidade, hipersensível, excessivamente emotivo, de certa forma egoísta e, quando as coisas não correm como quer, pode-se tornar desonesto no afã de conseguir o que quer.","Como é altamente sensível, capta com maior intensidade as imperfeições do mundo e das pessoas. Com isso, vai acumulando insatisfações e sofrimentos. Essas insatisfações e sofrimentos, devem servir para melhorar sempre os seus conceitos sobre tudo e todos.","ORIENTAÇÃO: Precisa investigar o misticismo, confiar na própria intuição, ter fé, conservar-se humilde diante da notoriedade e inspirar os outros através do seu exemplo.","Como a Natureza lhe dotou de certos atributos que não deu aos demais, deve usá-los para melhorar o planeta, os seus semelhantes e a própria vida. Não exija demais dos outros ou que eles compreendam ou façam o mesmo que você. Embora precise de liberdade para agir de forma independente, evite se preocupar demais consigo mesmo e aprenda a trabalhar com as outras pessoas. Quando combina seu pensamento imaginativo com sua habilidade e praticidade, pode obter resultados extraordinários."],"22":["PONTOS POSITIVOS: É o Destino do mestre construtor que se dedica altruisticamente à humanidade. É, também, o número da Sabedoria. As pessoas com esta vibração são normalmente precoces em todas as atividades, sejam elas de cunho material, social, mental ou espiritual. Conhecem da vida o superficial, o profundo e o invisível, e possuem uma capacidade nata para o ensino.","É orgulhoso, prático e altamente intuitivo. Normalmente honesto e trabalhador, com capacidade natural para a liderança, possui uma personalidade carismática e uma compreensão profunda das pessoas e de suas motivações. Apesar de ser reservado, muitas vezes tem uma preocupação atenciosa e protetora com o bem-estar das pessoas, mas nunca perde de vista a sua posição realista e pragmática. Em geral,culto e mundano, tem muitos amigos e admiradores. Os que são mais competitivos, podem alcançar o sucesso e a fortuna com a ajuda e o encorajamento dos amigos e familiares.","Charmoso, talentoso, comunicativo e diplomata natural, pode seguir carreiras nas áreas de vendas, promoções, agências ou de relações públicas. Da mesma forma, pode se dedicar ao mundo das comunicações, área editorial, política, educação, medicina e, principalmente, à área holística, ajudando a humanidade.","Além de todos estes dons, ainda possui facilidade de entender e desenvolver processos de alta magia, entendida como uma força extrafísica e não como uma forma racional.","PONTOS NEGATIVOS: Tendência à arrogância, ao nervosismo, à preguiça, ao egoísmo, à autopromoção, à traição e a menosprezar o semelhante.","ORIENTAÇÃO: Precisa aprender que justiça, cooperação e serviço prestado também fazem parte do cotidiano. Precisa aprender a penetrar nos problemas, até às suas últimas motivações de seus atos e as verdadeiras razões de seu proceder. Apesar de emocional e materialmente generoso, pode, às vezes, radicalizar, deixando-se levar por uma vida de luxo e glamour. Se cair no escapismo e se recusar a amadurecer, precisará aprender a ser responsável e a ter uma perspectiva mais madura. Porém, quando faz algo de que realmente gosta é capaz de trabalhar arduamente e, com dedicação e perseverança, pode se realizar e ser bem-sucedido.","Está destinado a ser Líder, pela sua capacidade executiva que se estende por vasto campo, atingindo mesmo as fronteiras internacionais. No tocante à Magia, a mesma poderá ser construtiva ou destrutiva; o que semear, colherá!"]},"missao":{"1":["Pontos positivos: liderança, criatividade, caráter progressista, vigor, otimismo, convicções fortes, competitividade, independência e espírito de união.","Pontos negativos: arrogância, ciúme, excesso de orgulho, antagonismo, falta de controle, egoísmo, instabilidade e impaciência.","As atribulações, contratempos, obstáculos e vitórias que obteve ou obterá na primeira metade da vida (até os 45 anos), servem ou serviram para desenvolver a força moral necessária na segunda metade, quando necessitará se estabilizar materialmente e cumprir seus deveres sociais e espirituais.","Com desejo de ser o primeiro e independente, o possuidor desta Missão tem inclinação a ser individualista, inovador e corajoso, com muita energia, predicados que deve cultivar ao longo da sua vida. O espírito pioneiro o encoraja a se aventurar sozinho nos seus empreendimentos. Esta força também pode estimulá-lo a desenvolver habilidades executivas, de organização, criatividade e originalidade.","A Missão 1 é a do ser inteligente, mas também o é do ambicioso e do agressivo. É confiante em seus propósitos, independente e, se quiser, poderá aspirar aos maiores cargos na sua profissão ou atividade.","Tem uma tendência para ser autoritário, dominador e inflexível em seus propósitos, o que lhe causará alguns problemas, principalmente com respeito aos subordinados e pessoas mais chegadas, como parentes e amigos. Será sempre invejado e deve se proteger espiritualmente contra essa inveja e contra inúmeras maledicências que dirão sobre sua pessoa.","Será também admirado, respeitado e terá a consideração dos outros. Se agir com prudência e sabedoria, poderá ser muito bem-sucedido na política, na administração de grandes empresas, como líder de povos ou excelente místico Idealista e sociável busca estabilidade emocional e segurança. Tem uma personalidade carismática e atrai sempre amigos e admiradores respeitáveis."],"2":["Pontos positivos:Gentileza, tato, receptividade, intuição, consideração, harmonia, solidez, inteligência, conservadorismo, economia e honestidade.","Pontos negativos: falta de confiança, subserviência, excesso de sensibilidade, mau-humor e se ofende com facilidade.","Paz e disposição ordenada como um todo é seu principal lema. A Missão 2 representa a solidificação do ser humano, a capacidade de trabalhar em grupo, a disposição em servir e também em querer que tudo esteja em perfeita ordem e em perfeito estado de funcionamento. Harmonia entre pesquisar e executar, coerência entre os propósitos e os objetivos são, com certeza, suas maiores virtudes.","Aparenta ser frio, calculista, obstinado, incrédulo, mas na realidade é muito afetuoso, bom amante e sempre pronto a ajudar aqueles que o procuram e também aqueles que necessitam sem o procurarem, ou seja, gosta de ajudar a todos indistintamente.","Em virtude desse seu procedimento, por vezes é enganado por aqueles em quem confia, pois como é íntegro e honesto em tudo e com todos, acha que os outros também o são. Tal procedimento o deprime e o chateia, mas como não sabe guardar rancor nem ódio, rapidamente se recupera desses inconvenientes, perdoando os elementos que lhe fizeram mal.","É o melhor mediador que existe e, em sua longa existência, será um excelente juiz, advogado, médico, professor ou trabalhando como elemento de retaguarda em uma grande organização, além é claro, de ser o melhor diplomata que se conhece.","Bebida alcoólica, cigarro e drogas de qualquer espécie, são venenos ao seu organismo."],"3":["Pontos positivos: amigável, criativo, artístico, amante da liberdade, engraçado, com excelente senso de humor, talento com as palavras e com grande poder de desejar.","Pontos negativos: entendia-se com facilidade, vaidoso, excessivamente imaginativo, exagerado, convencido, extravagante, comodista, preguiçoso e hipócrita.","É sociável, popular, criativo, artístico e imaginativo. A palavra que exprime seu número é a auto-expressão, seja na oratória, escrevendo ou mesmo representando. De excelente senso de humor, o 3 nasceu para brilhar, pois é dotado de grande imaginação e criatividade. Mesmo quando a idade chegar, parecerá sempre jovial e sonhador, procurando novas aventuras e criando novos projetos.","Se interpretar estas palavras corretamente, poderá ser ou conseguir tudo o que desejar. Durante sua longa vida, muitas oportunidades de sucesso surgirão; cabe a você interpretá-las e seguir a sua própria intuição, não se deixando seduzir ou levar pela conversa dos outros.","Como não se deixa jamais dominar pela depressão ou desânimo, quase sempre é bem-sucedido no que pretende realizar. Porém, de acordo com a sua personalidade extrovertida, que por vezes é interpretada como sendo irresponsável, estará exposto a críticas, do tipo: “Você é irresponsável, só pensa em farra...”","Deve evitar os trabalhos rotineiros e enfadonhos, como escriturário, caixa de banco, ou qualquer outro que não seja brilhar. Deve estimular a arte na sua plenitude, a oratória, a comunicação, a música, a literatura, o paisagismo, etc.","Mesmo quando muito tenso ou preocupado, jamais demonstra seus sentimentos, mostrando aos outros somente o que é belo e agradável em seu ser, o que na realidade é muito bom, dando vida à antiga máxima: “Demonstre sempre alegria; desse modo, deixarás os amigos sempre alegres e os inimigos perplexos e intrigados”. O convívio familiar, os compromissos sociais e o trabalho, normalmente serão tratados com espírito elevado e qualquer problema que surja, será resolvido com sabedoria e criatividade."],"4":["MISSÃO 4 (VONTADE ) Pontos positivos: organizado, disciplinado, estável, trabalhador, habilidoso, perseverante, sincero, íntegro, paciente, conservador, esperançoso, confiável, pragmático e autodisciplinado. Pontos negativos: pouco comunicativo, autoritário, muito econômico, rígido e guarda ressentimentos.","Sua Missão não é a de um visionário e sim de alguém com os pés no chão, alguém que persegue e consegue seus objetivos por métodos já consagrados e não por iniciativa própria, usando projetos inéditos. É um lutador; coragem e determinação não lhe faltam e enfrenta qualquer obstáculo com valentia e determinação. A sua Missão é construir coisas; porém, a sua realização pessoal será de âmbito mais coletivo e não em prazer próprio. O amor, a tolerância, a paciência, a harmonia, fazem parte desta Missão, pois todos estes predicados lhe serão exigidos durante toda a vida. Na maturidade, ou seja, após os 45 anos, tais virtudes deverão ficar muito mais latentes, pois será comparado a um pai ou a uma mãe, aonde todos virão se aconselhar.","Como é empreendedor, ambicioso e trabalhador, tem força de vontade e habilidade para perceber as oportunidades que podem ajudá-lo na sua escalada para o sucesso. A construção civil, a química, a metalurgia, a odontologia, a segurança pública, política, e as finanças de um modo geral, devem ou deveriam ser os seus principais objetivos. As parcerias serão sempre preferíveis à iniciativa individual.","Se compreender bem estas palavras e possuir tempo e discernimento compatíveis, conseguirá reconhecimento tanto no âmbito nacional como internacional, pois é carismático, amigo e interessado no bem-estar do seu semelhante, e o planeta necessita muito desse tipo de indivíduo."],"5":["Pontos positivos: versátil, adaptável, progressista, magnético, rápido, ousado, curioso, místico e sociável.","Pontos negativos:Instável, procrastinador, excessivamente confiante e inconsistente.","Além dos predicados acima expostos, esta Missão mostra um ser ousado, enérgico e amante da liberdade. Normalmente é atraente ao sexo oposto e está fadado a trocar várias vezes de parceiro durante a vida, pois também é bastante volúvel. Amante do novo gosta de viajar pelo mundo sempre em busca de novidades, estudando e tentando compreender seus semelhantes.","Tem mente investigadora, grande versatilidade mental, excelente memória e extraordinária capacidade para fazer várias coisas ou mesmo ler vários livros ao mesmo tempo. Tem, também, a tendência para começar várias coisas e não terminá- las, ou seja, tem muitos começos e poucos fins. Tal tendência deve-se principalmente ao desejo quase obstinado de conhecer, o que o torna por vezes dispersivo, instável e inquieto, mudando de atividade tão logo encontre outra que lhe proporcione mais prazer e interesse.","Como é adaptável e ousado, deve assumir responsabilidades, pois pode naturalmente ser levado a posições de autoridade. Sua inteligência aguçada e suas ideias originais podem levá-lo a seguir carreiras nas áreas de educação, filosofia ou pesquisa científica. Magnânimo e gentil, é excelente para lidar com as pessoas e normalmente sabe perceber as oportunidades. Como não gosta de obedecer a ordens de outros, prefere ocupar posições gerenciais ou trabalhar por conta própria, pois quer ter liberdade para agir do seu jeito. Seu humanitarismo e suas aspirações espirituais podem levá-lo a ter atividades ligadas a reformas sociais ou à religião. Mas o seu senso dramático natural pode fazer com que seja atraído pelo mundo do entretenimento.","Por ser muito popular, por vezes se deixa levar por palavras elogiosas e comete erros infantis de julgamento de seus semelhantes, sendo muitas vezes vítima de intrigas e ciúmes.","É inteligente e deve aprender a desligar-se das opiniões alheias e a seguir sua própria intuição, mesmo que a princípio lhe pareça tarefa das mais difíceis. Novos ambientes, novos amigos, novas paisagens, novos horizontes, farão parte ativa de sua vida."],"6":["Pontos positivos: fraternidade universal, compaixão, confiabilidade, solidariedade, idealismo, vida doméstica, humanitarismo, firmeza e temperamento artístico.","Pontos negativos: ansiedade, teimosia, perfeccionismo, desconfiança, timidez e egocentrismo","A família é sua principal fonte de preocupação. É extremamente prático, equilibrado, sentimental, leal, compreensivo e sempre pronto a ajudar aqueles que solicitam sua ajuda.","É honesto, digno de confiança, bondoso, alegre e muito amoroso. Sente-se muito feliz em cargos que requeiram alta responsabilidade, na qual possa contribuir para regularizar, ajustar e harmonizar as coisas — ocupações relacionadas com instituições de caridade, ensino de modo geral, treinamento, ocupações esotéricas, tanto em consulta como didáticas, ou trabalhos em comunidades que requeiram uma liderança justa e íntegra.","O Amor é a sua palavra mágica; amor pelas crianças, velhos, familiares, principalmente os filhos (se os tiver), pelos amigos e, em alguns casos, pelos inimigos.","Às vezes pode ser explosivo, principalmente quando duvidam de sua capacidade profissional ou põem à prova sua honestidade. Porém, logo esquece as ofensas e os desafetos e perdoa todos, indistintamente.","A sua Missão é, invariavelmente, o Amor Universal. Caso se desvie dela, sofrerá na maturidade o peso dessa negligência, culpando tudo e a todos pelos fracassos e decepções que por certo aparecerão, mesmo que, materialmente seja bem-sucedido.","Se atentar para estas palavras, terá êxito social e será muito popular, principalmente se se dedicar a algum tipo de Ciência Oculta ou à religião, pois é muito convincente e consegue facilmente fazer com que as pessoas o sigam. Cuidado com o fanatismo, pois ele poderá levá-lo a sofrer do mal que anunciar.","Amigável e perceptivo, prefere a companhia de pessoas inteligentes e enérgicas, com quem possa dialogar e ter estímulo mental. A sua natureza amigável e solidária sugere que os outros o procuram para pedir conselhos e apoio. Nos seus relacionamentos aparenta ser forte e enérgico, mas o lado sensível da sua natureza implica que pode, ocasionalmente, ficar inquieto e entediado. Embora tenha interesse por outros países e pessoas estrangeiras, prefere ter uma vida doméstica estável."],"7":["A Sabedoria é sua palavra de ordem. É um número por vezes enigmático, pois tanto pode ser profundo, calado e introspectivo, como estranho, sociável, falante e cativante.","À primeira impressão, as pessoas sentem até um certo receio de se aproximar dele, pois seu ar superior e até assustador, leva-as a se afastar em princípio. Porém após algumas horas ou somente minutos de convivência, todos lhe são simpáticos e anseiam por permanecer em sua companhia, e se alguns não o fazem é por pura inveja ou despeito.","O 7 a vibração da perfeição e da sabedoria, tanto na vida material como no mundo espiritual. É o número das qualidades psíquicas e também da sensibilidade.","Como não gosta de ser mandado, deve evitar qualquer trabalho subalterno, saindo-se melhor como educador guia espiritual, orador, pregador, pesquisador, explorador, historiador, ou em atividades ligadas ao saber, na mais pura expressão da verdade.","É autoritário e gosta por demais que os outros o venham consultar. Poderá também ser excelente escritor metafísico, de esoterismo, religião ou de assuntos relacionados à auto-ajuda. Existe tendência a tornar-se introvertido e meditativo, na maturidade. É fundamental que se cerque de pessoas inteligentes e, de preferência, que comunguem de seus ideais.","O sucesso mundano, ou seja, material, é importante para a sua realização espiritual, por isso, não deve ser negligenciado qualquer projeto que possa trazer benefícios financeiros, pois sua Missão depende, em muito, desse poder material para se desenvolver e obter o êxito que almeja.","Carismático e ambicioso, tem charme e calor humano. Como é sociável e generoso, se sai especialmente bem em atividades que envolvam o trato com as outras pessoas. Independente e voltado para o sucesso, gosta de se manter em atividade e pensa em termos grandiosos. Com as suas poderosas convicções e seu desejo de servir, pode se dedicar a um ideal ou liderar um movimento que seja de utilidade prática para as outras pessoas. Ainda que consiga demonstrar uma profunda compaixão, as suas emoções fortes podem indicar que precisa evitar extremos ou agir muito impulsivamente."],"8":["Pontos positivos: liderança, meticulosidade, autoritário, protetor, bons princípios, trabalhador, com grande poder de cura e justiça.","Pontos negativos: impaciente, dominador e intolerante.","É organizado, muito dedicado aos seus negócios, excelente para lidar com situações concretas, dominador, prático, direto, seguro de si e generoso. A sua meta principal é o progresso material; progresso sólido, feito com justiça e elevado senso moral.","É persistente, tem grande força de vontade e está sempre à espreita de oportunidades, dificilmente deixando que se lhe escapem. Tais características ficam, com o passar dos anos, cada vez mais acentuadas.","O grande problema que deve encontrar na primeira metade da vida (até aos 45 anos) é a disciplina. Caso não seja disciplinado nessa fase, sofrerá muito na segunda, onde as oportunidades já não serão tantas, e a vitalidade já não será tão grande. Se disciplinado, sempre encontrará meios de se locupletar, seja trabalhando com afinco e esperteza, seja fazendo os outros trabalharem em seu proveito.","Não é dado a discussões e a teimosias, preferindo contornar qualquer obstáculo que se interponha entre si e o objetivo desejado. Quanto aos amigos, poderá ter tantos quanto os que lhe querem bem, pois sabe fazer amizades e também sabe desfazê-las, tão logo perceba que são interesse iras.","Como dá grande importância à riqueza material, terá mais sucesso como alto executivo de uma grande empresa, proprietário de um complexo industrial, comércio em geral, advogado, político ou dedicar-se às Leis. Para que isso se concretize, deverá ter vontade firme, muita energia e autoridade.","Através da sua inspirada conscientização e autodisciplina, poderá ser muito feliz trabalhando em prol da humanidade. É necessário aprender a se desapegar em um nível profundo e pode ser que só compreenda isso numa idade avançada. Quando reconhece esta necessidade adquire liberdade interior e passa a ter ideais mais profundos e humanitários. Altamente intuitivo, tem necessidade de transcender o lado mundano da vida que pode estimulá-lo a produzir um trabalho original ou fazê-lo entrar em contato com outros países."],"9":["Pontos positivos: idealismo, criatividade, sensibilidade, generosidade, magnetismo, caridade, desapego e popularidade.","Pontos negativos: nervosismo, falta de praticidade, preocupação exagerada, egoísmo e frustração.","É aquele que ao longo da vida deve obter o máximo de conhecimentos possíveis, a fim de adquirir a Sabedoria. É universalista, generoso, sente compaixão por todos, quer melhorar a espécie humana e busca sempre a verdade.","Por ser universalista, tanto o passado, o presente e o futuro fazem parte do seu dia-a-dia, vivendo nessa eterna busca, sem nada encontrar, pois já sabe de antemão todas as respostas.","Como tem ampla visão do mundo e das coisas que o cercam, principalmente os seus semelhantes, sofre por demais quando percebe injustiças ou mesmo quando alguém é maltratado, mesmo que todos digam que merece, sejam eles quem forem.","Normalmente é impessoal, porque os interesses pessoais geralmente levam-no a desapontamentos. Por seu caráter, não deve ser egoísta e jamais esperar qualquer coisa dos outros, principalmente agradecimentos.","Como é incompreendido, por ser universal, vai encontrar alguma dificuldade de relacionamento afetivo, dificilmente se dando bem no amor.","Por vezes será chamado “irmão(ã) mais velho(a) da humanidade”, pois sua responsabilidade é quase sempre com os outros e muito pouco faz em prol de si mesmo.","Pelo seu caráter justo e humanitário, encontrará muitas pessoas boas e prosperará e terá sucesso e felicidade. O amor que dedicará ao seu semelhante voltará duplicado e encontrará paz e harmonia.","Na maturidade, caso tenha destinado a primeira parte da vida ao altruísmo, deve se dedicar ao ensino religioso, esotérico, a escrever ou a falar em público. Nessa fase, muitas pessoas dependerão de sua sabedoria e o (a) procurarão, esperando encontrar uma palavra de apoio, solidariedade e sabedoria. Deve, enfim, viver tão altruisticamente quanto possível e sempre buscar a harmonia entre seus irmãos."],"11":["Pontos positivos: equilibrado, concentrado, objetivo, entusiástico, espiritualizado, idealista, intuitivo, habilidade para cura, grande capacidade psíquica e humanitário.","Pontos negativos: complexo de superioridade, excessivamente emotivo, egoísta, dominador e magoa-se facilmente.","A grande virtude do 11 é a Fé. Esta Fé, em si mesmo, não representa propriamente religiosidade, mas também a Fé nos seus ideais, propósitos, pressentimentos, “sorte” ou em projetos que elabora.","Consciente ou inconscientemente, a Fé em alguma coisa é a sua “mola mestra” que lhe empurra para o destino.","Agindo corretamente, tem o potencial para inspirar as pessoas com seus ideais e imaginação; assim, evite investir suas energias mentais em coisas de pouca importância para não se desviar das suas metas positivas. Quando se concentra em suas energias positivas é capaz de obter resultados produtivos. Cuide da sua dieta e da sua saúde e aprenda a relaxar de vez em quando.","Tem a habilidade para encantar as pessoas, mas elas talvez não vejam que atrás da sua aparência ousada, sofre de confusão interior. Em idade avançada, terá uma sabedoria acumulada através do desenvolvimento espiritual, da compreensão universal e da potencial místico. Evite ser impulsivo, agir de forma extravagante ou se deixar levar por esquemas de enriquecimento rápido, investindo em planos de longo prazo.","É um diplomata por excelência e possui a rara capacidade da harmonia e compreensão. É justo e está sempre pronto a “arbitrar” qualquer divergência entre colegas de profissão, amigos ou discórdias familiares.","É incapaz de ferir propositadamente um seu semelhante e, quando isso acontece, prontamente pede desculpas e não repete mais o erro.","Com o passar dos anos, as suas capacidades de liderança ficarão mais latentes e sólidas e as oportunidades de sucesso, prosperidade e fama aparecerão e com certeza as aproveitará. Estas características poderão levá-lo a ser um famoso orador, um renomado político ou mesmo um diplomata, incumbido de uma grande missão, principalmente de Paz, que lhe será imposta e que terá de usar de toda a sua perspicácia e sua habilidade para saber concretizá-la a bom termo. A parte final da vida (após os 60 anos) será repleta de paz, harmonia e felicidade."],"22":["Pontos positivos: universalidade, intuição elevada, pragmatismo, praticidade, capacidade de organização e capacidade de resolução de problemas.","Pontos negativos: nervosismo, complexo de inferioridade, autoritarismo, preguiça e egoísmo. Número altruísta e voltado quase exclusivamente para a humanidade, para o todo, para a sabedoria. Vê tudo em larga escala e é altamente capaz de levar a bom termo qualquer projeto que vise o bem do Planeta.","Mentalmente arguto e intuitivo, gosta de tomar as próprias decisões. É uma pessoa humanitária, que tem uma visão realista da vida e, com sua força, pode dar apoio a quem precisa.","Com grande habilidade social, normalmente tem muitos amigos e admiradores. Para ter paz e harmonia, muitas vezes está disposto a fazer concessões ou sacrifícios. Considera a amizade e gosta de se dar com as pessoas que o inspirem a ser aventureiro e o divirtam. Se sente bem quando está na companhia dos que ama.","A sua existência se pautará por testes: financeiros, amorosos ou existenciais. Porém, como é um ser superior, uma vez ciente deste fato, conseguirá se sair bem em qualquer atividade ou profissão e terá grandes satisfações no decurso de sua longa existência. Pode-se dedicar à política, ciências, filosofia, relações públicas, filantropia, esoterismo ou religiosidade. Deverá aprender a ser prático e idealista, a ter os “pés no chão”, a estudar os princípios fundamentais do ser humano e a trabalhar para construir um mundo melhor. Quaisquer tipos de vício (bebida, cigarro, drogas) são verdadeiros venenos para o seu organismo."]},"licao":{"1":["Esta Lição mostra claramente que em vidas passadas você foi um ser preguiçoso, sem qualquer iniciativa, ambição ou originalidade, e muito menos competência para cuidar de seus próprios negócios. Em outras palavras, você ignorava o que ocorria à sua volta.","Provavelmente foi rico, gastador, esbanjador e sem qualquer criatividade ou objetivo concreto na vida, além de carecer de confiança em sua própria personalidade.","Em virtude dessas cruciais faltas, nesta existência precisa aprender a ser pioneiro, criativo, a tomar decisões e não esperar por ninguém, além de aprender a ter amor-próprio, a confiar na própria capacidade, a decidir e a concluir seus projetos e seus objetivos."],"2":["Em vidas passadas você foi um ser totalmente indisciplinado, negligente e nada colaborador. O dinheiro tinha pouca importância, gastando-o a torto e a direito, sem se importar com o dia de amanhã.","Nesta existência, em virtude dessas faltas no “passado”, poderá se tornar subserviente, introspectivo, com medo de tudo e de todos, evitando contatos com amigos e colegas. A Lição a aprender nesta existência é trabalhar em parcerias, grupos; deve, também, adquirir paciência e levar a bom termo os seus projetos e ambições. Deve ser econômico, poupador, pois caso contrário, terá graves problemas financeiros na velhice."],"3":["Provavelmente “pobre” e sem muito estudo na vida passada, você foi um ser sem qualquer ambição, expressão, imaginação, criatividade, além da falta de vontade de progredir, limitando-se à “vidinha” insignificante, não tendo qualquer talento e confiança em si próprio, mostrando-se, isto sim, nervoso, irritadiço e até violento. A Lição a aprender nesta existência é eliminar a timidez, seja ela no falar, representar, escrever ou mesmo tratando com estranhos. Deve cultivar também a imaginação, agir com segurança, criatividade, paciência e sempre positivamente."],"4":["Provavelmente “preguiçoso” na vida passada deixava tudo a meio caminho; não gostava de receber ordens, de trabalho metódico ou pesado. Tinha também certa dificuldade em terminar o que começava, ou seja, era dispersivo, imprudente e desajeitado. A Lição a aprender nesta existência é trabalhar metodicamente, ser constante (levar até o fim os seus objetivos), a ser concentrado, paciente e compenetrado no trabalho. Deve ainda aceitar qualquer tipo de trabalho, mesmo que em princípio não goste dele; ou seja, se não puder fazer o que gosta, deve gostar do que faz. Será bem sucedido na vida se seguir rigorosamente esta Lição."],"5":["Na vida passada as mudanças e as novidades o assustavam, preferindo agir com cautela exagerada e em situações já consagradas pelo uso. Agora, em virtude dessas fraquezas poderá se tornar incompreendido pelos que ama e convive, além de ter de enfrentar certas mudanças não desejadas, como mudança de casa, de trabalho, de parceiro, etc. A principal Lição a aprender nesta existência é enfrentar com naturalidade essas mudanças, a não ter medo de novidades e estar sempre por dentro da moda, da política, da moderna tecnologia, enfim, por dentro de tudo."],"6":["Na vida passada você foi em ser completamente alheio e, digamos, até irresponsável para com obrigações familiares. Não estava nem aí para ajudar familiares doentes e necessitados. Nesta atual existência, até que aprenda esta Lição, que é a de ser bom pai (ou mãe), irmão, parente, amigo ou cônjuge, poderá ser forçado a assumir responsabilidades domésticas (cuidar de doentes) ou mesmo prestar serviços a terceiros. Dever á ser compreensivo nessas ocasiões, pois os “parentes” e amigos pouco ou nada farão para ajudá-lo; muito pelo contrário, deverão sobrecarregá-lo com muitas exigências, até que aprenda definitivamente esta crucial Lição."],"7":["Em outra existência você foi um ser indeciso; buscava o lado espiritual, mas queria ser rico a qualquer custo. Também pouco ou nada fez em matéria educacional, sendo um ser de pouca cultura, sem conhecimento de si próprio e das Leis que regem o Universo. Até que aprenda a Lição que outra não é senão a de ser culto, espiritualizado, analítico e principalmente decidido na tomada de atitudes, a vida o tornará indeciso, sempre ponderando e adiando indefinidamente os projetos. Deve, também, treinar a sua mente em vista do futuro que rapidamente se aproxima, ou seja, estudar modernas técnicas e agir sem medo."],"8":["Provavelmente você foi “rico” na vida passada (herdeiro), sem qualquer capacidade ou vontade de ganhar dinheiro. Na verdade, era gastador, esbanjador, pouco se importando quem ganhava o dinheiro; só queria gastá-lo! Agora, nesta existência, até que aprenda esta Lição, a vida o levará a ter problemas financeiros, negócios fracassados e também longos períodos de paralisação. Deve dar valor ao dinheiro, gastá-lo com critério, sabedoria, sem esbanjá-lo, poupando-o, pois provavelmente terá de tratar de negócios e finanças próprias e também de outras pessoas, além de ter sérios problemas na velhice."],"9":["Você foi na vida passada um ser frio, sem amor e compreensão para com seus semelhantes. Não aparentava qualquer sentimento de afeto; era desumano, indiferente, pouco se importando com os outros. Em virtude dessa “apatia” emocional, nesta existência poderá sofrer alguns reveses na vida, como perda de propriedades, longos períodos desempregado, doenças diversas e também desapontamentos com amigos, parentes, sócios, cônjuge ou simplesmente companheiros. A Lição a aprender nesta vida é a de ser bondoso, amoroso, generoso, compreensivo e interessado em tudo e com todos."]},"desafio":{"1":["Idade:","Você precisará aprender a se situar num meio-termo entre um sentimento excessivo ou insuficiente de sua própria personalidade ou importância. Precisa aprender a ser firme, positivo independente e autoconfiante, sem impor sua vontade às outras pessoas ou esperar que tudo gire em torno de"],"2":["Idade:","Poderá tender a ser tão sensível em relação aos seus próprios sentimentos e a passar tanto tempo pensando neles, que você acabará não tomando conhecimento dos sentimentos dos outros. Pequenas coisas são ampliadas fora de qualquer proporção e nunca esquecidas ou perdoadas. Você precisa aprender a cuidar de si mesmo, a cultivar uma atitude mais liberal e tolerante em relação à vida e a parar de utilizar próprios sentimentos e emoções seus como ponto de referência para tudo."],"3":["Idade:","Precisará aprender a situar-se num meio-termo entre ter medo de contatos sociais e ser por demais festeiro. Tem de aprender a ser sociável e a exprimir suas ideias e sentimentos sem dispersar suas energias ou comportar-se como pessoa fútil."],"4":["Idade:","É o mais fácil de todos os desafios, visto que não há nenhum conflito envolvido. Precisa aprender a situar-se num meio-termo entre agir como um 'burro de carga' ou ser preguiçoso."],"5":["Idade:","Precisa aprender a situar-se num meio-termo - entre desejar uma liberdade Excessiva e ter um receio injustiçado dela - entre uma ânsia exagerada de experiências sensuais e o medo de tentar coisas novas. Precisa aprender a não buscar sexo, álcool e drogas e - o mais difícil de tudo - precisa aprender quando e como renunciar a pessoas ou coisas cuja presença na sua vida não tem mais razão de ser."],"6":["Idade:","Precisa aprender a situar-se num meio-termo entre comportar-se como um 'capacho' ou ser demasiado exigente e dominador. Precisa aprender a aceitar as pessoas como elas são sem esperar que elas vivam de acordo com os seus padrões; respeitar os pontos de vista de todos e não estabelecer regras além de você mesmo."],"7":["Idade:","Precisará aprender a situar-se num meio-termo entre o orgulho excessivo e a modéstia exagerada. Deveria tomar cuidado para não se refugiar dentro de si mesmo e nem tentar escapar das coisas desagradáveis da vida, recorrendo ao álcool e às drogas. É particularmente uma boa educação, aprender a compreender o que se passa no mundo à sua volta e - acima DE tudo - ter fé."],"8":["Idade:","Precisará aprender a situar-se num meio-termo entre uma preocupação excessiva com as questões materiais, e um desinteresse exagerado em relação a esse assunto. Precisa aprender a utilizar corretamente o poder e o dinheiro e a voltar seu pensamento para outras coisas que não o dinheiro e o que ele poderá fazer por você."],"0":["Idade:","É o desafio da escolha. Caso você tenha um desafio 0 (Zero), poderá ser altamente evoluído e terá de tomar suas próprias decisões. Deve atentar para todos os desafios sem uma ênfase especial em qualquer deles. Espera-se que você decida por si mesmo quais as armadilhas que a vida lhe reserva."]},"relInter":{"1":["Indica independência, ambição e interesses próprios. Também mostra egoísmo e possessividade."],"2":["Indica que a pessoa é dotada de tato e diplomacia, possui grande amor à música e as artes de um modo geral. É harmônico e tem capacidade de cooperação.","Por vezes, também indica insegurança e timidez."],"3":["Indica pessoa de rara capacidade de expressão, forte imaginação e senso de humor.","Às vezes é um sinal de irresponsabilidade e impaciência a uma atitude materialista ou realista."],"4":["Indica que a pessoa é econômica, honesta e tem tendência para o trabalho árduo. Porém, tem carência de concentração e julgamento imparcial; possibilidade de obstinação."],"5":["Indica pessoa impulsiva e nervosa, com grande desejo por sexo.","As viagens e as mudanças lhe são altamente favoráveis."],"6":["Indica uma capacidade de assumir grandes responsabilidades. É de confiança, caseiro, mãe/pai e um educador nato.","Tem tendência a polêmicas, brigas e instabilidade emocional."],"7":["Indica um poder de análise, agilidade mental, perfeccionismo, equilíbrio e cultura.","Grande inclinação pelos assuntos metafísicos e se retrair."],"8":["Indica capacidade para negócios, habilidade executiva, liderança, iniciativa, tato e grande senso de valores materiais. Tem tendências a se mostrar como dono da verdade."],"9":["Indica um modo de ver universal. Tem dons artísticos e literários. Adora viajar.","Em muitos casos, também indica visão estreita e egocentrismo, ou demasiado desapego e afastamento da realidade."]},"tendencia":{"1":["TENDÊNCIA OCULTA 1 É o desejo da individualidade. Há uma tendência a ser autoritário, dominador, arrogante e um tanto egoísta."],"2":["TENDÊNCIA OCULTA 2 É o desejo de associações. Há uma tendência para depender demasiado dos outros, principalmente da família e dos amigos, tanto monetariamente como emocionalmente."],"3":["TENDÊNCIA OCULTA 3 É o desejo da auto–expressão. Há uma tendência à vaidade, à impaciência, à presunção, a dispersar energias, viver sem objetivos concretos e buscando sempre diversões e festas, sem se preocupar muito com o dia de amanhã."],"4":["TENDÊNCIA OCULTA 4 É o desejo de trabalho. Há uma tendência para asfixiar sua personalidade com quantidade excessiva de detalhes (perfeccionista), de ser teimoso, intolerante e obstinado."],"5":["TENDÊNCIA OCULTA 5 É o desejo de mudança e também de liberdade pessoal. Há uma tendência para viver à custa dos outros, abusar do sexo, de algumas drogas (cigarro e álcool), para mudanças sem motivo aparente e para ser precipitado e impulsivo."],"6":["TENDÊNCIA OCULTA 6 É o desejo de realização e responsabilidade. Há uma tendência para se preocupar excessivamente com a família, principalmente com os filhos (se os tiver), com os deveres profissionais, para ser teimoso, perfeccionista e para apegar-se a modelos inflexíveis e obstinados."],"7":["TENDÊNCIA OCULTA 7 É o desejo de sabedoria e conhecimento. Há uma tendência para o fingimento, para a intriga e até para o alcoolismo, pois normalmente sente-se incompreendido e até rejeitado pelos parentes, amigos, cônjuge ou simplesmente conhecidos."],"8":["TENDÊNCIA OCULTA 8 É o desejo do materialismo. Há uma tendência para se preocupar excessivamente em como ganhar dinheiro, obter bens materiais e também poder."],"9":["TENDÊNCIA OCULTA 9 É o desejo de conhecimento e amor universal. Há uma tendência para se preocupar excessivamente com os problemas mundiais em detrimento de si próprio e da família."]},"respSub":{"2":["É um ser arrogante, mentiroso, que não respeita regras, querendo que tudo e todos girem em torno de si (egocêntrico)."],"3":["É dispersivo e até indisciplinado; normalmente reage de forma explosiva e até de certa destrutiva."],"4":["Normalmente é um ser que vive perdido num labirinto de detalhes. As suas reações são fracas, tem uma certa tendência a vacilar e até atrapalhar os outros."],"5":["É uma pessoa tensa e nervosa. Numa crise tem tendência a agir de forma confusa e impulsiva."],"6":["É um ser sentimental. Sua primeira preocupação numa crise é com os entes queridos, seus objetos de estimação e animais (se os tiver)."],"7":["Normalmente é arredio e não gosta de se envolver com problemas alheios. Em uma emergência, considerará analiticamente a situação e, então, normalmente se retirará para dentro de si mesmo e rezará. Se existirem perdas materiais ou de vidas, poderá se entregar a vícios, como a bebida ou drogas."],"8":["É eficiente e organizado. Numa crise ou em qualquer ocasião, pode-se contar com ele, pois é seguro e digno de confiança."],"9":["É um ser entediado. A maioria das coisas tem pouca importância para ele. Numa crise é melhor não contar com ele, pois é impessoal, filósofo, introspectivo, resignado e indeciso."]},"psiquico":{"1":["As pessoas de número psíquico 1 são regidas pelo sol, que lhes imprime firmeza de propósitos e de ideias.","Tendem a se ater às suas ideias, principalmente quando convencidos de que estão no rumo certo.","É difícil persuadi-los a mudar de comportamento, de modo, de opinião, de convicção ou decisão. São dotados de clareza de entendimento e de um ponto de vista particular que domina inteiramente tudo o que fazem na vida. Sóbrios, sólidos, minuciosos e cristalinos em suas manifestações. Sua personalidade forte faz com que necessitem de muita atenção e respeito; se preocupam com os outros e gostariam que os retribuíssem.","Autoritários e afortunados em receber ajuda de pessoas importantes. A boa estrela brilha em todos os momentos de suas vidas, e são conhecidos como pessoas de sorte. Amam a sua liberdade e odeiam restrições; não
