    <h1>Mapa Numerológico</h1><div class="h1b">Cabalístico</div>
    <div class="cname">${esc(c.nome)}</div>
    <div class="cdate">Nascimento: ${fmtDate(c.nasc)}</div><div class="rule"></div>
    <div class="by">Elaborado com carinho por<b>${esc(k.nome)}</b>${hoje}</div>
  </section>`;
}

/* monta a lista de "blocos" que serão distribuídos nas páginas */
function reportBlocks(c){
  const k=CFG(), nome=nomeMapa(c), r=NC.calcMapa(nome,c.nasc), S=NC.secoes(r).filter(s=>!isOff(c,s));
  const B=[]; const cell=(t,v,m)=>`<div class="rcell ${m?'m':''}"><small>${t}</small><b class="${String(v??'').length>4?'sm':''}">${v??'—'}</b></div>`;
  const list=a=>a&&a.length?a.join(', '):'—';
  B.push({t:'title',html:`<h2 class="pt">Seus números</h2>`});
  B.push({html:`<div class="rname">${nameBoxHTML(r.letras)}</div>`});
  B.push({html:`<div class="rgrid">${cell('Motivação',r.motivacao,1)}${cell('Impressão',r.impressao,1)}${cell('Expressão',r.expressao,1)}${cell('Destino',r.destino,1)}
    ${cell('Missão',r.missao)}${cell('Talento Oculto',r.talento)}${cell('Dia Natalício',r.diaNatal)}${cell('Nº Psíquico',r.psiquico)}
    ${cell('Resp. Subconsciente',r.respSub)}${cell('Lições Cármicas',list(r.licoes))}${cell('Tendências Ocultas',list(r.tendencias))}${cell('Dívidas Cármicas',list(r.dividas))}
    ${r.ciclos?cell('Ciclos de Vida',r.ciclos.map(x=>x.n).join(' · '))+cell('Desafios',r.desafios.join(' · '))+cell('Mom. Decisivos',r.momentos.map(x=>x.n).join(' · '))+cell('Ano Pessoal '+(r.anoRef||''),r.anoPessoal):''}
    ${cell('Harmonia Conjugal',r.harmonia)}${cell('Relação Intervalores',list(r.relInter))}${r.anjo?cell('Seu Anjo',r.anjo.nome.replace(/^\d+-/,'')):''}${r.diasFavoraveis?cell('Dias Favoráveis',r.diasFavoraveis):''}</div>`});
  if(r.numHarmonicos||r.cores) B.push({html:`<table class="rtable">${r.numHarmonicos?`<tr><th style="width:38mm">Números harmônicos</th><td>${esc(r.numHarmonicos)}</td></tr>`:''}${r.diasFavoraveis?`<tr><th>Dias favoráveis do mês</th><td>${esc(r.diasFavoraveis)}</td></tr>`:''}${r.cores?`<tr><th>Cores favoráveis</th><td>${esc(r.cores)}</td></tr>`:''}</table>`});
  if(c.obsPdf&&c.obsPdf.trim()){ B.push({html:`<div class="rblock"><h3>Observações da numeróloga</h3></div>`,keep:1}); c.obsPdf.trim().split(/\n\s*\n/).forEach(p=>B.push({html:`<p class="rp">${esc(p.trim())}</p>`})); }
  B.push({t:'break'});
  let grupo=null;
  S.forEach(s=>{
    if(s.secao&&s.secao!==grupo){ grupo=s.secao; B.push({html:`<div class="rsec">${esc(grupo)}</div>`,keep:2}); }
    B.push({html:`<div class="rblock"><h3>${s.n!=null&&s.n!==''?`<span class="n ${String(s.n).length>2?'l':''}">${esc(s.n)}</span>`:''}${esc(s.titulo)}</h3></div>`,keep:1});
    (s.intro||[]).forEach(p=>B.push({html:`<p class="rp intro">${esc(p)}</p>`}));
    getSecText(c,s).split(/\n\s*\n/).filter(p=>p.trim()).forEach(p=>{
      const t=p.trim(); const sub=/^[A-ZÁÉÍÓÚÂÊÔÃÕÇ0-9 \-–:>()º'’]{6,}$/.test(t)&&t.length<70;
      B.push({html:`<p class="rp ${sub?'sub':''}">${esc(t)}</p>`,keep:sub?1:0});
    });
  });
  if(k.incluirPiramide && r.letras.filter(x=>!x.gap).length>1){
    B.push({t:'break'});
    const P=NC.piramide(nome,c.nasc,'basica');
    B.push({html:`<h2 class="pt">Pirâmide Invertida</h2>`,keep:1});
    (NC.TX_PIR_INTRO||[]).slice(0,3).forEach(p=>B.push({html:`<p class="rp intro">${esc(p)}</p>`}));
    B.push({html:pyrRowsHTML(P,'rpyr')});
    B.push({html:`<p class="rp"><b>Base da pirâmide: ${P.base}</b>${P.baseTexto?' — '+esc(P.baseTexto):''}</p>`});
    if(P.arcanos.length) B.push({html:`<table class="rtable"><tr><th>Arcano</th><th>Carta</th><th>Período</th></tr>${P.arcanos.map(a=>`<tr><td><b>${a.n}</b></td><td>${esc(a.carta||'')}</td><td>${a.de} a ${a.ate} anos</td></tr>`).join('')}</table>`});
    P.arcanosUnicos.forEach(a=>{ B.push({html:`<div class="rblock"><h3><span class="n">${a.n}</span>${esc(a.carta||'Arcano '+a.n)}</h3></div>`,keep:1}); B.push({html:`<p class="rp">${esc(a.texto)}</p>`}); });
    if(P.seqTextos.length){ B.push({html:`<div class="rsec">Sequências negativas</div>`,keep:2}); P.seqTextos.forEach(t=>{ B.push({html:`<div class="rblock"><h3>${esc(t.titulo)}</h3></div>`,keep:1}); t.paras.forEach(p=>B.push({html:`<p class="rp">${esc(p)}</p>`})); }); }
  }
  return {B,r};
}

function buildSheets(c){
  const k=CFG(), hoje=new Date().toLocaleDateString('pt-BR');
  const {B}=reportBlocks(c);
  const contato=[k.whats?'WhatsApp '+fmtPhone(k.whats):'',k.instagram,k.email].filter(Boolean).join(' · ');
  const head=`<div class="rh"><b>${esc(k.nome)}</b><span>Mapa Numerológico · ${esc(c.nome)}</span></div>`;
  const foot=n=>`<div class="rf"><span>${esc(k.rodape||'')}</span><span>${esc(contato)}</span><span class="pg">${n}</span></div>`;
  const sheets=[coverHTML(c)];
  if(k.incluirCarta){
    const txt=fill(c.carta||k.carta,vars(c)).split(/\n\s*\n/).map(p=>`<p>${esc(p.trim()).replace(/\n/g,'<br>')}</p>`).join('');
    sheets.push(`<section class="sheet">${head}<div class="body" style="top:40mm"><h2 class="pt">Apresentação</h2><div class="letter">${txt}</div>
      <div class="sign">${esc(k.nome)}<small>${esc(k.subtitulo||'')}</small></div></div>${foot('{pg}')}</section>`);
  }
  // paginação: mede cada bloco num "molde" com a mesma largura do corpo da página
  const meas=document.createElement('div'); meas.className='measure';
  meas.innerHTML=`<section class="sheet"><div class="body" id="mb"></div></section>`; document.body.appendChild(meas);
  const mb=meas.querySelector('#mb'); const maxH=mb.clientHeight;
  let pages=[[]], cur=pages[0];
  mb.innerHTML='';
  for(let i=0;i<B.length;i++){
    const b=B[i];
    if(b.t==='break'){ if(cur.length){ pages.push(cur=[]); mb.innerHTML=''; } continue; }
    // mantém título junto com o(s) próximo(s) bloco(s)
    let group=[b]; let j=i; while(group[group.length-1].keep && B[j+1] && B[j+1].t!=='break'){ group.push(B[++j]); if(group.length>4) break; }
    const html=group.map(x=>x.html).join('');
    const tmp=document.createElement('div'); tmp.innerHTML=html; mb.appendChild(tmp);
    if(mb.scrollHeight>maxH && cur.length){ mb.removeChild(tmp); pages.push(cur=[]); mb.innerHTML=''; mb.appendChild(tmp); }
    cur.push(html); i=j;
  }
  meas.remove();
  pages.filter(p=>p.length).forEach(p=>sheets.push(`<section class="sheet">${head}<div class="body">${p.join('')}</div>${foot('{pg}')}</section>`));
  if(k.incluirFecho){
    sheets.push(`<section class="sheet closing"><svg width="70" height="70" style="color:var(--r-acc);margin-bottom:6mm"><use href="#star"/></svg><h2>Gratidão</h2>
      <p>${esc(fill('Obrigada pela confiança, {primeiro_nome}. Que este mapa seja luz no seu caminho e que você volte a ele sempre que precisar se reencontrar.',vars(c)))}</p>
      <div class="ct"><b style="font-family:var(--f-display);font-weight:400;font-size:15pt">${esc(k.nome)}</b><br>${esc(k.subtitulo||'')}<br>${k.whats?'WhatsApp: '+esc(fmtPhone(k.whats))+'<br>':''}${k.instagram?'Instagram: '+esc(k.instagram)+'<br>':''}${k.email?esc(k.email)+'<br>':''}<span style="font-size:8.5pt;color:#8a83a0">Mapa elaborado em ${hoje}</span></div></section>`);
  }
  let n=1; return sheets.map(s=>s.replace('{pg}',()=>String(n++)).replace(/\{pg\}/g,''));
}

async function openReport(c){
  applyTheme();
  try{ await document.fonts.ready; }catch(e){}
  const sheets=buildSheets(c);
  const R=$('#report'); R.className='preview';
  R.innerHTML=`<div class="bar noprint"><button class="btn gold" id="rPrint">🖨️ Imprimir / Salvar como PDF</button><button class="btn" id="rDown">⬇️ Baixar PDF</button><button class="btn wa" id="rWa">WhatsApp</button><button class="btn" id="rClose">✕ Fechar</button></div>
    <div class="sheets">${sheets.join('')}</div>`;
  document.body.style.overflow='hidden';
  $('#rPrint').onclick=()=>{ const t=document.title; document.title='Mapa Numerológico - '+c.nome; window.print(); setTimeout(()=>document.title=t,500); };
  $('#rDown').onclick=async()=>{ const blob=await makePdf(c); if(blob) download(`Mapa_Numerologico_${slug(c.nome)}.pdf`,blob); };
  $('#rWa').onclick=()=>whatsModal(c);
  $('#rClose').onclick=closeReport;
}
function closeReport(){ const R=$('#report'); R.className=''; R.innerHTML=''; document.body.style.overflow=''; }

      <div class="pd-head"><div class="pd-brand">${k.logo?`<img src="${k.logo}" alt="">`:`<svg width="40" height="40" style="color:var(--r-acc)"><use href="#star"/></svg>`}
        <div><b>${esc(k.nome)}</b><small>${esc(k.subtitulo||'Numerologia Cabalística')}</small></div></div>

/* captura o HTML de resultado de um módulo para impressão (remove elementos interativos) */
function grabResult(sel){
  const el=$(sel); if(!el) return '';
  const clone=el.cloneNode(true);
  clone.querySelectorAll('input,select,textarea,button,.accents,.toc').forEach(n=>n.remove());
  clone.querySelectorAll('[contenteditable]').forEach(n=>n.removeAttribute('contenteditable'));
  return clone.innerHTML;
}

/* PDF de verdade (arquivo), para baixar e enviar pelo WhatsApp */
let _libs=null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function pdfLibs(){
  if(!_libs) _libs=Promise.all([loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')]).catch(e=>{_libs=null;throw e;});
  return _libs;
}
async function makePdf(c){
  const busy=document.createElement('div'); busy.className='busy'; busy.innerHTML=`<div>Gerando o PDF de ${esc(primeiroNome(c.nome))}…<div class="bar"><i></i></div><small style="opacity:.7">pode levar alguns segundos</small></div>`;
  document.body.appendChild(busy);
  try{
    await pdfLibs();
    const opened=$('#report').classList.contains('preview');
    if(!opened) await openReport(c);
    const pages=$$('#report .sheet');
    const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
    for(let i=0;i<pages.length;i++){
      const cv=await html2canvas(pages[i],{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false});
      if(i) pdf.addPage();
      pdf.addImage(cv.toDataURL('image/jpeg',.9),'JPEG',0,0,210,297,undefined,'FAST');
      busy.querySelector('i').style.width=Math.round((i+1)/pages.length*100)+'%';
    }
    pdf.setProperties({title:'Mapa Numerológico - '+c.nome,author:CFG().nome,subject:'Numerologia Cabalística'});
    if(!opened) closeReport();
    return pdf.output('blob');
  }catch(e){ console.error(e); toast('Não foi possível gerar o arquivo PDF (precisa de internet na 1ª vez). Use “Imprimir / Salvar como PDF”.',5000); return null; }
  finally{ busy.remove(); }
}

/* =====================================================================
   WHATSAPP
   ===================================================================== */
function whatsModal(c){
  const k=CFG(); const msg=c.msgEditada||fill(k.msg,vars(c));
  const m=document.createElement('div'); m.className='modal';
  const canShare=!!(navigator.canShare && navigator.canShare({files:[new File([new Blob(['x'])],'t.pdf',{type:'application/pdf'})]}));
  m.innerHTML=`<div class="panel wide" style="display:grid;gap:12px"><h2 style="font-size:22px">Enviar mapa pelo WhatsApp</h2>
    <div class="grid2"><label class="f">WhatsApp do cliente<input id="wT" value="${esc(fmtPhone(c.tel||''))}" inputmode="tel" placeholder="(49) 99999-9999"><span class="hint">Deixe vazio para escolher o contato dentro do WhatsApp.</span></label>
      <label class="f">Enviando como<input value="${esc(k.nome)} · ${esc(fmtPhone(k.whats))}" readonly><span class="hint">Abra pelo celular/WhatsApp Web logado neste número. Altere em Configurações.</span></label></div>
    <label class="f">Mensagem (pode editar antes de enviar)<textarea id="wM" rows="12">${esc(msg)}</textarea></label>
    <div class="row"><button class="btn sm" id="wR">Voltar à mensagem do modelo</button><label class="ck" style="font-size:13px"><input type="checkbox" id="wS" ${c.msgEditada?'checked':''}> Guardar esta mensagem para este cliente</label></div>
    <div class="panel" style="background:#f7f5fb;padding:12px"><b>Como enviar o PDF junto:</b>
      <ol style="margin:6px 0 0 18px;padding:0;font-size:14px;line-height:1.6">
        ${canShare?'<li><b>No celular:</b> toque em “Compartilhar PDF + mensagem” e escolha o WhatsApp — o arquivo vai anexado.</li>':''}
        <li><b>No computador:</b> clique em “Baixar PDF e abrir WhatsApp”. O PDF é salvo e a conversa abre com a mensagem pronta; arraste o arquivo para a conversa (ou clique no clipe 📎).</li></ol></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" id="wX">Fechar</button>
      <button class="btn" id="wOnly">Só a mensagem</button>
      ${canShare?'<button class="btn gold" id="wShare">📲 Compartilhar PDF + mensagem</button>':''}
      <button class="btn wa" id="wGo">⬇️ Baixar PDF e abrir WhatsApp</button></div></div>`;
  document.body.appendChild(m);
  const q=s=>m.querySelector(s);
  m.onclick=e=>{ if(e.target===m) m.remove(); };
  q('#wX').onclick=()=>m.remove();
  q('#wR').onclick=()=>{ q('#wM').value=fill(k.msg,vars(c)); };
  const persist=()=>{ const t=onlyDigits(q('#wT').value); if(t!==c.tel){ c.tel=t; } c.msgEditada=q('#wS').checked?q('#wM').value:null; c.atualizado=Date.now(); DB.save(); };
  const link=()=>{ const n=waNumber(q('#wT').value); const t=encodeURIComponent(q('#wM').value); return n?`https://wa.me/${n}?text=${t}`:`https://wa.me/?text=${t}`; };
  const mark=()=>{ c.enviado=Date.now(); DB.save(); };
  q('#wOnly').onclick=()=>{ persist(); window.open(link(),'_blank'); mark(); };
  q('#wGo').onclick=async()=>{ persist(); const w=window.open('about:blank','_blank'); const blob=await makePdf(c);
    if(blob) download(`Mapa_Numerologico_${slug(c.nome)}.pdf`,blob);
    if(w) w.location.href=link(); else window.open(link(),'_blank'); mark(); toast('PDF baixado — anexe na conversa do WhatsApp',4000); };
  const sh=q('#wShare'); if(sh) sh.onclick=async()=>{ persist(); const blob=await makePdf(c); if(!blob) return;
    const file=new File([blob],`Mapa_Numerologico_${slug(c.nome)}.pdf`,{type:'application/pdf'});
    try{ await navigator.clipboard?.writeText(q('#wM').value); }catch(e){}
    try{ await navigator.share({files:[file],text:q('#wM').value,title:'Mapa Numerológico'}); mark(); }catch(e){ if(e.name!=='AbortError') toast('Compartilhamento indisponível — use Baixar PDF.'); } };
}
