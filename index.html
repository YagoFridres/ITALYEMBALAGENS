locá-lo em prática no seu ritmo. Uma das suas boas características é trabalhar em serviços comunitários, mas que os participantes não lhe tolham os passos ou a iniciativa.","Como confia em todos, por causa da sua boa-fé, normalmente é mal interpretado e enfrenta mais obstáculos que os demais, pois pensa que todos são como ele, honestos, retos e competentes, o que não é verdade e, assim, está sempre às voltas com problemas financeiros e também profissionais. O nativo deste dia vive num mundo só seu e a maioria das pessoas tem certa dificuldade em compreendê-lo e para viver bem em sua companhia, a pessoa deve ser leal e compreensiva. Faz amigos e inimigos com a mesma facilidade.","São suas características marcantes: trabalhar duro, ser honesto, leal, determinado e econômico. Jamais esquece um favor ou uma ofensa. Com o seu charme e sua habilidade para irradiar calor humano, atrai as pessoas, seja no trato individual ou público. Como é muito sociável, é um excelente anfitrião e tem compaixão pelos problemas alheios.","Normalmente se sente atraído por gente determinada, mas deve tomar cuidado para não se envolver em jogos de poder com os seus parceiros.","Normalmente as pessoas nascidas neste dia se esforçam muito para manter os relacionamentos harmoniosos, embora ambos os sexos tenham inclinação à inquietude. Se encontrar a sua cara-metade, deve se casar cedo, pois a vida de casado acalma-o. Como adora viajar, pura e simplesmente, o parceiro deve comungar desses ideais, caso contrário, a relação ficará tremendamente prejudicada, pois o nativo deste dia não suporta ser contrariado em seus desejos e opiniões."]},"anoPessoal":{"1":["yyyy ANO PESSOAL 1 - PLANTANDO AS SEMENTES","Este é o ano para começar coisas novas, o ano que estabelece o estilo de todo o ciclo de nove anos. É o momento de tomar iniciativa e mostrar coragem e determinação. Para ter sucesso e conquistar a felicidade, a pessoa precisa ser independente, criativa, segura, seletiva e seguir sua própria intuição. A armadilha a ser evitada é a falta de iniciativa, a qual poderá muito bem resultar numa apatia que se estenderá por todo o ciclo."],"2":["yyyy ANO PESSOAL 2 - AS SEMENTES CRIAM RAÍZES","Este é o ano de agir com discrição e ser paciente, mantendo-se receptivo às ideias dos outros e permanecendo em segundo plano. É uma fase muito boa para amizades e relacionamentos. Para ter sucesso e conquistar a felicidade, a pessoa precisa ser delicada, diplomática e cooperativa no trato com as outras pessoas. As armadilhas a serem evitadas são a hipersensibilidade e a propensão para envolver-se em discussões e/ou ser excessivamente atrevido."],"3":["yyyy ANO PESSOAL 3 - SURGEM OS PRIMEIROS BROTOS","Este é um ano de boa saúde e de intensa vida social que, no entanto, poderá trazer tensão emocional. É uma fase boa para divertimentos, viagens, crescimento pessoal e para cultivar novas amizades.","O sucesso e a felicidade resultam do fato de se dar vazão à própria criatividade e de expressar-se construtivamente através das palavras - escrevendo, lecionando, representando ou cantando. As armadilhas a serem evitadas são a extravagância (que pode acarretar dificuldades financeiras no ano “4” ) e a perda de oportunidades em decorrência da dispersão das energias. O “3” é também um ano propenso a romances, sendo que as pessoas casadas que sucumbirem a relacionamentos extraconjugais nesse ano é quase certo que estarão preparando o caminho para o divórcio ou separação no ano “4”."],"4":["yyyy ANO PESSOAL 4 - CAVANDO E CAPINANDO","Este é um ano de restrições, de trabalho duro e de grandes despesas. É o momento de se construir para o futuro. O sucesso e a felicidade resultam da autodisciplina, de ser metódico e de dar forma concreta às suas ideias. Esta é uma boa fase para lidar com propriedades e imóveis. A armadilha a ser evitada é a da negligência com a saúde - poderá haver algum problema com os ossos e/ou dentes."],"5":["yyyy ANO PESSOAL 5 - FORMAM-SE OS BOTÕES","Este é um ano para deixar - se levar por condições em constante mudança, para viver o presente sem fazer muitos planos para o futuro, para abandonar-se aos seus impulsos! É um ano em ritmo acelerado, propenso a acidentes e cheio de mudanças inesperadas - do bom para o ruim, do ruim para o bom. É um ano para divertimentos, sem se pensar no futuro. O sucesso e a felicidade resultam da pessoa ser adaptável, de procurar desenvolver a própria personalidade e de aproveitar as oportunidades antes que sejam perdidas. As armadilhas a serem evitadas são a dispersão de energias, o excesso de atividades sexuais e o mau uso da liberdade pessoal em prejuízo dos outros."],"6":["yyyy ANO PESSOAL 6 - FLORAÇÃO","Este é um ano para o casamento e as responsabilidades domésticas. É uma fase em que alguma doença crônica talvez se manifeste para que possa ser tratada. Pode também ser um ano de problemas relativos a viagens, tais como defeitos no carro, bagagem perdida e assim por diante. O sucesso e a felicidade resultam de uma dedicação altruísta à família e à comunidade. As armadilhas a serem evitadas consistem em ser excessivamente idealista ou propenso a discussões e em esperar demasiado dos outros."],"7":["yyyy ANO PESSOAL 7 - AS PLANTAS DÃO FRUTOS","Este é um ano para o isolamento e o descanso, um ano para o estudo e o aperfeiçoamento interior. Esta é uma fase de introspecção. O sucesso e a felicidade resultam do estudo dos significados últimos da vida. As atividades materialistas devem ser evitadas. O dinheiro só aparecerá se não se correr atrás dele. Quanto menor for a ambição melhor serão os resultados e vice-versa. As armadilhas a serem evitadas são as de negligenciar a saúde, forçar decisões, ser excessivamente crítico e permitir que temores e complexos submersos venham à tona."],"8":["yyyy ANO PESSOAL 8 - ÉPOCA DA COLHEITA","Este é um ano dinâmico e materialista. Os negócios provavelmente deverão prosperar. Poderá haver grandes perdas ou grandes ganhos, dependendo de como se lidou com os outros anos do ciclo. É uma excelente fase para se comprar e vender imóveis. É a hora de pagar e de cobrar as dívidas. O dinheiro pode surgir de fontes inesperadas. O sucesso e a felicidade resultam da coragem de ousar grandes feitos, de utilizar o bom-senso, de preocupar-se com o dinheiro, de ser organizado, prático e eficiente. As armadilhas a serem evitadas são as de ser emotivo e sentimental."],"9":["yyyy ANO PESSOAL 9 - PREPARAR A TERRA PARA UM NOVO PLANTIO","Este é um ano de faxina entre o fim de um ciclo e o começo do próximo. É o momento de livrar-se de tudo o que for desnecessário ou estiver gasto pelo uso - especialmente pessoas para as quais não existe mais lugar em sua vida. É uma boa fase para escrever, representar, viajar e para dedicar-se a estudos metafísicos. Haverá alguma espécie de perda - um relacionamento poderá terminar. O sucesso e a felicidade resultam da compaixão, das atividades humanitárias, do desapego emocional e de deixar que se vá o que quer que comece a sair da sua vida. As armadilhas a serem evitadas são as de ser ciumento e/ou possessivo."]},"mesPessoal":{"1":["mmmm/yyyy MÊS PESSOAL 1","É o mês dos pioneiros, das pessoas influentes, dos inventores e dos planejadores. Porém é um mês onde também as pessoas tendem a dominar, consciente ou inconscientemente, todos os envolvidos. Não é um bom mês para se fazer novos amigos e é melhor se ater à rotina nesse sentido. Para negócios e especulações será excelente."],"2":["mmmm/yyyy MÊS PESSOAL 2","É um mês passivo e receptivo. As pessoas devem se manter calmas, mais gentis, bondosas, organizadas e escrupulosas. Como é um mês de hesitações, aconselhamos que nenhum projeto seja iniciado neste período, sob pena de não dar certo. É também um mês de dúvidas e de resoluções bem importantes."],"3":["mmmm/yyyy MÊS PESSOAL 3","Alegria! É o mês dos extrovertidos, pessoas inteligentes, criativas e espirituosas. É um bom período para se fazer novos amigos, discutir, planejar e empreender ação às suas ideias. É o mês dos ambiciosos, dos orgulhosos e daqueles que procuram prazer pessoal."],"4":["mmmm/yyyy MÊS PESSOAL 4","É o mês dos realistas e dos equilibrados e também daqueles em quem se pode confiar. Deve ser mantida a justiça a todo custo, pois a pessoa estará sujeita a algumas depressões e até acessos de raiva, caso as coisas não lhe corram como deseja. Deve ser organizado, prático, racional e equilibrado em todos os sentidos, para poder driblar as adversidades."],"5":["mmmm/yyyy MÊS PESSOAL 5","É o mês dos inteligentes, espertos, brilhantes e impacientes. Será um mês movimentado e é um excelente período para conhecer e manter novas amizades. Novas sensações e novos projetos devem ser tentados, pois a colheita é certa. Como 5 é o número da sensualidade é um excelente período para novos relacionamentos e manter os já existentes."],"6":["mmmm/yyyy MÊS PESSOAL 6","Neste período deve se manter calma, serena e equilibrada. É um mês em que a pessoa deve manter a rotina, permanecer em casa ou trabalhando sem inovar. Não deve se meter em confusões, discussões ou iniciar novos projetos neste período."],"7":["mmmm/yyyy MÊS PESSOAL 7","É um mês de pura introspecção; os filósofos, os místicos e os ocultistas têm neste mês o seu apogeu, pois convida-os para que se mantenham isolados, mais contemplativos, compenetrados e discretos. As pessoas devem se manter calmas, evitar discussões e não decidir definitivamente sobre planos e projetos."],"8":["mmmm/yyyy MÊS PESSOAL 8","É o mês dos empresários, dos políticos e das pessoas que trabalham com o público em geral. Excelente período para iniciar ou concluir negócios, principalmente os que envolvem muito dinheiro. Porém, como os nervos estarão à flor da pele é aconselhável manter-se a calma e não discutir sob hipótese alguma. A pessoa estará cativante, analítica, diplomática e muito sensível."],"9":["mmmm/yyyy MÊS PESSOAL 9","É o mês da espiritualidade e da intelectualidade. Bom para o romantismo, para poesia, para as artes, filosofia e espiritualidade. Os objetivos, neste período, devem ser canalizados para a humanidade como um todo. As pessoas estão mais confiantes, independentes, corajosas e determinadas."],"11":["mmmm/yyyy MÊS PESSOAL 11","É o mês das grandes realizações e das revelações, sejam elas de cunho material, mental ou espiritual. É o período para se por as ideias em ordem, pois as pessoas estarão intuitivas, vibrantes, imaginativas e as ideias estarão aflorando neste período."],"22":["mmmm/yyyy MÊS PESSOAL 22","Normalmente, neste período a pessoa se sente prática, cordial, idealista, inspirada e eficiente. Logo, é uma excelente época para desenvolver novas ideias, pois os projetos iniciados neste período, quase sempre conseguem grandes êxitos, tanto materiais quanto espirituais. Sendo o número mais poderoso, não seria bom desperdiçar a oportunidade, pois ela pode nunca mais aparecer."]},"diaPessoal":{"1":["É um dia para se cultivar a sua individualidade, a independência e a sua capacidade de trabalhar sozinho. Deve terminar o que estiver fazendo e somente depois, começar algo novo. Como e o número da individualidade, a pessoa deve agir somente pelos seus pensamentos e não se deixar levar pelos 'conselhos' alheios."],"2":["É o dia das associações, da harmonia pessoal e de se procurar seguir os conselhos alheios. A pessoa deve cultivar a paciência, o tato, a cooperação e a lealdade."],"3":["Neste dia a pessoa necessita cultivar a sua criatividade, os contatos sociais e a expressão de seus ideais. Pode e deve ser ousado e expor suas ideias com clareza, de forma simples e sem rodeios. Faça tudo o que desejar e não abuse do: cigarro, álcool ou qualquer outra droga."],"4":["É um dia para o trabalho duro, para se conquistar aquilo que se deseja. Também, e por isso, deve, neste dia, cultivar a paciência, a confiança e a disposição para servir."],"5":["É o dia da adaptabilidade e da responsabilidade. Há necessidade da pessoa mudar seu ponto de vista e perceber que o mundo não gira em torno de si e que alguma mudança deve ser feita para que haja uma perfeita união entre seus desejos e os desejos alheios."],"6":["É um dia em que as suas ideias devem ser defendidas e de servir a todos com alegria. É um dia de grande responsabilidade profissional, onde deve lutar para manter a liderança que alcançou. Deve também manter a calma, ouvir mais do que falar e, assim, demonstrar seu ponto de vista sem qualquer alarde ou imposição."],"7":["É um dia para ficar só, para meditar e adquirir sabedoria. A pessoa necessita desenvolver seus poderes mentais estudar, meditar e buscar o significado último da vida e tornar-se um especialista em qualquer assunto. Procure não beber neste dia e fale o mínimo possível."],"8":["É o dia da eficiência e a pessoa deve desenvolver os seus projetos, principalmente aqueles que envolvem muito dinheiro. Neste dia estará eficiente e totalmente cônscio dos seus deveres, devendo falar com calma e pausadamente, não deixando qualquer dúvida quanto os seus planos e projetos."],"9":["A pessoa necessita, neste dia, colocar o interesse dos outros a frente dos seus. É um excelente dia para se pensar na humanidade, no próximo. Bom para se fazer doações, estudar, falar em público, dar e receber conselhos e não começar absolutamente nada."],"11":["É um dia de grande energia e poder. A pessoa deve confiar na própria intuição e não se deixar levar por conselhos de outras pessoas. Deve conservar-se humilde e inspirar os que os rodeiam com seu exemplo. Bom período para viajar, adquirir e conservar amizades, escrever aos amigos, perdoar os inimigos, cultivar a paciência e meditar sobre os novos projetos."],"22":["Dia em que a pessoa deve pensar altruisticamente, fazer somente o que e bom para a humanidade, ouvir as pessoas e praticar a justiça. Como e um número super poderoso, este dia deve ser aproveitado ao máximo e a pessoa d eve se levantar o mais cedo possível, fazer uma longa oração ao raiar do Sol, comer pouco, meditar muito, não usar qualquer tipo de droga (cigarro, álcool ou outras), ler algo sobre esoterismo e criar objetivos que sejam bons para toda a coletividade."]},"ciclo1":{"1":["Número 1 no 1º Ciclo","Idade:","O 1 (um) no primeiro Ciclo de Vida indica um período difícil. Quando criança, a pessoa necessita aprender a desenvolver sua individualidade, pois caso contrário, na juventude e adolescência ou mesmo até à entrada do 2º Ciclo, terá muitos problemas emocionais e grande dificuldade de se estabilizar profissionalmente e emocionalmente. O ideal é que a criança nesse Ciclo tenha liberdade acima do normal e não tolhê-la em hipótese alguma. No caso de pessoa maior de 18 anos e que ainda esteja no primeiro Ciclo e tenha sido reprimida, ou seja, não tenha tido educação condizente, que absorva estes ensinamentos e os coloque em prática imediatamente."],"2":["Número 2 no 1º Ciclo","Idade:","O número 2 no primeiro Ciclo de Vida, indica uma criança extremamente mimada, que possivelmente sofreu grande influência da mãe ou dos avós. É natural que na adolescência, em vista da possessividade familiar, pense em casar-se o mais cedo possível."],"3":["Número 3 no 1º Ciclo","Idade:","O 3 indica uma infância e adolescência feliz, despreocupada e com muitos amigos. Não é um período particularmente favorável ao aprendizado, que deverá ocorrer a partir do segundo Ciclo, mas haverá provavelmente muitas oportunidades para a expressão de ideias e emoções, após 18 anos (alguns com menos idade), através das artes em geral, da música, do teatro e escrita. Não é um bom período para contrair matrimônio."],"4":["Número 4 no 1º Ciclo","Idade:","O 4 é uma indicação de restrições familiares e de trabalho duro na escola. Normalmente tem pais severos que impõem seu comando não admitindo qualquer contestação. Na juventude e mesmo após os 18 anos, em vista dessa restrição, o jovem é pouco criativo, limitando-se a obedecer, pouco ou nada criando, levando-o a um tipo de relacionamento por vezes desastroso, onde normalmente o cônjuge é que manda e dita normas e leis."],"5":["Número 5 no 1º Ciclo","Idade:","O 5 no primeiro Ciclo de Vida indica muitas mudanças e uma liberdade que às vezes é demasiado grande para que se possa lidar com ela de maneira construtiva. Sem orientação adequada, o jovem nesse período pode ter problemas causados por envolvimentos precoces com sexo, álcool e drogas. É um péssimo período para o casamento e normalmente quando isso acontece, dura pouco. Também no lado profissional a pessoa tem uma certa dificuldade de se assentar, mudando continuamente de emprego ou atividade,que só terá término quando da entrada no 2º Ciclo."],"6":["Número 6 no 1º Ciclo","Idade:","O 6 indica infância e juventude restritiva, cheia de deveres e responsabilidades e, para fugir dessa restrição, normalmente casa-se cedo e muitas vezes esse casamento é um completo fracasso, pois não é escorado em bases sólidas do amor e sim como uma fuga. Tem, também, certas dificuldades em se ajustar à sociedade, pois é incompreendida nos seus planos e objetivos."],"7":["Número 7 no 1º Ciclo","Idade:","O 7 no primeiro Ciclo de Vida indica um período muito difícil. A criança e o jovem conservam-se retraídos e podem sofrer com a falta de compreensão dos pais, amigos e professores. Tal incompreensão leva, invariavelmente ao isolamento, retraimento e até medo de encarar a vida nessa fase. Na faixa dos 20 anos, em virtude dessa retração, pode desenvolver complexos de culpa e falta de auto-confiança, restringindo o seu progresso pessoal e profissional."],"8":["Número 8 no 1º Ciclo","Idade:","O 8 no primeiro Ciclo de Vida indica um período de realizações. É extraordinário para o aprendizado acerca dos aspectos materiais da vida. É nesse período que se forjam as mulheres de negócios, comércio, políticas, advogadas e todas aquelas que pensam mais no material do que no espiritual."],"9":["Número 9 no 1º Ciclo","Idade:","O 9 é o mais difícil dentre todos os Primeiros Ciclos. Quando criança, existem boas oportunidades educacionais, mas existe muita tensão. Quando adolescente, a mesma se sente confusa, assustada, nervosa e tem grandes dificuldades de concentração. O 9 é muito sensível, espiritualizado (por natureza) e normalmente incompreendido por todos que o cercam. Não deve se casar cedo, e caso o faça, normalmente esse enlace dura pouco. Profissionalmente tem grandes problemas de relacionamento e por isso permanece inativa longos períodos, até adentrar ao 2ºCiclo, quando então, poderá por em prática toda a sua potencialidade."],"11":["Número 11 no 1º Ciclo","Idade:","O 11 no primeiro Ciclo de Vida é um número demasiadamente enérgico e complicado para qualquer criança ou mesmo adolescente e aconselhamos a que seja reduzido a 2, onde poderá lidar melhor com ele.","DESCRIÇÃO DO NUMERO 2 NO PRIMEIRO CICLO:","O número 2 no primeiro Ciclo de Vida, indica uma criança extremamente mimada, que possivelmente sofreu grande influência da mãe ou dos avós. É natural que na adolescência, em vista da possessividade familiar, pense em casar-se o mais cedo possível."]},"ciclo2":{"1":["Número 1 no 2º Ciclo","Idade:","O 1 no segundo Ciclo de Vida mostra um período de ambições, um grande desejo de realizações e também de sucesso relativo. A pessoa necessita desenvolver seus próprios recursos, estudando e se dedicando o máximo possível, além de ter que lutar para tornar-se independente e chegar ao terceiro Ciclo já com definição profissional, social e financeira."],"2":["Número 2 no 2º Ciclo","Idade:","O 2 neste ciclo é indicador de sociabilidade e receptividade. É necessário cultivar a paciência, o tato, a diplomacia e a capacidade de perceber os sentimentos alheios. Pode indicar ainda, uma carreira diplomática, ser juíz, médico, professor ou consultor."],"3":["Número 3 no 2º Ciclo","Idade:","O 3 nos mostra uma fase agradável na vida, com certa despreocupação. É a fase da sociabilidade, na qual a criatividade e a originalidade podem exteriorizar suas ideias e sentimentos através de algum tipo de arte: pintura, música, teatro escrita , etc. É um magnífico período para se desenvolver a criatividade, porém não deve despender demasiada energia, principalmente em coisas fúteis."],"4":["Número 4 no 2º Ciclo","Idade:","O 4 é sinônimo de trabalho duro, de produtividade e de construção do alicerce que deverá se apoiar no futuro. É um período em que a pessoa necessita aprender a aceitar a rotina e a trabalhar em algo produtivo, sólido e a fazer grande economia."],"5":["Número 5 no 2º Ciclo","Idade:","O 5 é indicativo de um período de expansão de horizontes. Época propícia a viagens, mudanças, romances, liberdade, de novas atividades e também novos amigos. Quase sempre, neste período, a pessoa terá de encontrar as suas oportunidades, longe do domicílio. Precisa aprender a se adaptar, a procurar novas maneiras de ver as coisas e a evitar a tendência para fixar-se num determinado lugar. Em resumo é um período de grande movimentação, de grandes mudanças e de novos horizontes."],"6":["Número 6 no 2º Ciclo","Idade:","O 6 neste Ciclo nos mostra um período de ajustes e de responsabilidades nos assuntos domésticos em geral. É um bom momento para s e contrair matrimônio, ter filhos e solidificar a família. Em suma é um período familiar, de colocar a casa em ordem, de viver mais para a família, e deixar de ser tanto individualista."],"7":["Número 7 no 2º Ciclo","Idade:","O 7 indica um período de crescimento tranquilo, de estudos e de meditação. A menos que esteja casada, este não é um bom Ciclo para se contrair matrimônio, pois a pessoa necessita desenvolver seus recursos interiores e a incompreensão quase sempre aparece nesse período."],"8":["Número 8 no 2º Ciclo","Idade:","O 8 neste Ciclo mostra um período de preocupação com os aspectos materiais da vida. Normalmente a pessoa tem tendência a adquirir riqueza e poder material. Existe, ainda, a grande possibilidade de realizações no mundo dos negócios, a ganhar muito dinheiro com o trabalho e também através de especulações."],"9":["Número 9 no 2º Ciclo","Idade:","O 9 neste Ciclo traz a possibilidade de sucesso na vida pública. É um período altamente espiritual e a pessoa necessita aprender a cultivar a tolerância, o amor à humanidade, o altruísmo e o controle emocional.","Dificilmente um romance é bem-sucedido e os casamentos tendem a pouca duração caso sejam realizados neste período e também é indício de alguma perda, seja ela material, afetiva ou social."],"11":["Número 11 no 2º Ciclo","Idade:","O 11 nos mostra um período de ideais, de revelações, de grandeza e, possivelmente, de fama. Aconselha-se que a pessoa se mantenha longe de empreendimentos comerciais ou de especulações, sejam elas financeiras ou imobiliárias. É o momento certo de desenvolver a mente, de especializar- se em alguma coisa, de estudar, ensinar e também de inspirar as outras pessoas através do seu próprio exemplo."],"22":["Número 22 no 2º Ciclo","Idade:","O 22 no segundo Ciclo é indício de grandes realizações e de liderança em alto nível. O objetivo primordial da pessoa neste Ciclo deve ser o de beneficiar a humanidade como um todo. Em virtude do grande poder deste número, os nervos e as emoções serão testados durante todo o período e a pessoa deve se manter o mais calmo possível e seguir a orientação da sua intuição."]},"ciclo3":{"1":["Número 1 no 3º Ciclo","Idade:","O 1 nos indica um final de vida solitária. A pessoa precisa permanecer ativa e independente e contar com seus próprios recursos."],"2":["Número 2 no 3º Ciclo","Idade:","O 2 mostra um período de amor sincero e de amigos íntimos. A pessoa se sentirá impelida a colecionar coisas, tais como selos, moedas, antiguidades ou qualquer coisa extravagante."],"3":["Número 3 no 3º Ciclo","Idade:","O 3 no terceiro Ciclo de Vida indica um período de expressão de ideias e sentimentos através de diversas formas de arte, música, teatro e literatura. A criatividade vai se desenvolver. Haverá muitos amigos e grande atividade social."],"4":["Número 4 no 3º Ciclo","Idade:","O 4 neste Ciclo nos mostra que a pessoa, mesmo aposentada, deverá continuar trabalhando, seja por necessidade, seja por escolha, pois o 4 não o deixará levar uma vida monótona e rotineira."],"5":["Número 5 no 3º Ciclo","Idade:","O 5 é o período da liberdade pessoal, de viagens, mudanças, de novas atividades e variedade, seja de amigos, de atividades ou de residência."],"6":["Número 6 no 3º Ciclo","Idade:","O 6 poderá ser o mais agradável de todos os terceiros ciclos de vida - uma fase de felicidade e harmonia no lar - isso SE a pessoa tiver aprendido a adaptar-se e assumir responsabilidades. Caso não tenha aprendido com a 'vida', poderá ser sobrecarregado com muitos problemas domésticos."],"7":["Número 7 no 3º Ciclo","Idade:","O 7 indica um período de isolamento ou de semi - isolamento. Trata-se de uma fase tranquila, apropriada para se estudar em casa e adquirir sabedoria e conhecimento."],"8":["Número 8 no 3º Ciclo","Idade:","O 8 neste Ciclo mostra que a pessoa precisa agir com sabedoria, trabalhar e estudar duramente nos dois primeiros, quando terá grande possibilidade de ficar rica neste e ter poder e sucesso ilimitados no mundo dos negócios."],"9":["Número 9 no 3º Ciclo","Idade:","O 9 mostra um período de retiro para o estudo e o aprendizado. A pessoa precisa cultivar a tolerância e o amor pela humanidade. Neste Ciclo geralmente há alguma espécie de perda."],"11":["Número 11 no 3º Ciclo","Idade:","O 11 é o período de isolamento, de inspiração, de leitura, de alguma incursão na arte de escrever e, possivelmente de fama."],"22":["Número 22 no 3º Ciclo","Idade:","O 22 no terceiro ciclo de vida talvez torne a pessoa tensa e nervosa. Ela deve procurar manter-se ativa durante esse período e dedicar-se a um hobby, tal como a escultura, a pintura, as artes divinatórias, etc."]},"momentosA":{"1":["Idade:","Um Momento Decisivo 1 no primeiro Ciclo de Vida, indica uma criança agitada, voluntariosa e por vezes complicada, que será difícil controlar e compreender. Do período da adolescência em diante não será muito fácil; exige coragem, determinação e muita força de vontade. Esse é um momento propício para se 'cultivar': individualidade, independência e engenhosidade. Inúmeros acasos e situações inesperadas forçarão você a enfrentar a vida pensando e agindo por si mesmo."],"2":["Idade:","Um Momento Decisivo 2 no primeiro Ciclo de Vida é indício de uma 'mãe' forte e dominadora, ou pai ausente (por motivo de trabalho, separação ou morte). A criança pode se tornar excessivamente sensível e ter reflexos dessa sensibilidade na juventude e adolescência, obstruindo dessa maneira, as suas possibilidades de progresso. Traz consigo a oportunidade para 'cultivar' o tato e a compreensão.","Se for amigo, companheiro e atencioso com seus semelhantes, este será um período de amizades sinceras e de relacionamentos duradouros. Excelente fase para se contrair matrimônio.","Se for impaciente e desatencioso, poderá ser uma fase de relacionamentos difíceis, de grandes incompreensões, brigas, discussões, em que você poderá causar graves prejuízos às pessoas que o cercam."],"3":["Idade:","Um Momento Decisivo 3 no primeiro Ciclo de Vida, geralmente indica uma criança com dificuldade de se adaptar aos estudos.","Indica, também, oportunidades artísticas que se não alimentadas e direcionadas condizentemente, poderão ser desperdiçadas, fazendo com que a pessoa já adulta venha a se lamentar dessa negligência dos pais ou educadores.","É o momento de você expandir a vida social e 'cultivar' os próprios talentos. Trata-se de uma fase muito apropriada para a auto-expressão, novas amizades, fertilidade e romance.","A manifestação descuidada das suas emoções poderá ter consequências desagradáveis, pois existe, nesse estado, tendência ao desmando: discórdias, brigas, vícios. Cuidado com os 'amigos', pois apesar de serem necessários, por vezes são más companhias."],"4":["Idade: Um Momento Decisivo 4 no primeiro Ciclo de Vida, frequentemente indica que a pessoa poderá começar a trabalhar muito nova e a assumir grandes responsabilidades ainda na juventude. Este Momento Decisivo traz a oportunidade de se construir um sólido alicerce para o futuro.","É um período de trabalho duro e até de algumas restrições se é necessário 'cultivar' a paciência e os bons hábitos de trabalho.","Neste período, poderá haver alguns problemas econômicos, que serão superados com muita inteligência, trabalho e dedicação ao projeto final. A família e os parentes por afinidade podem se transformar num peso e você terá de ajudá-los, tanto financeiramente, como prestando ajuda humanitária, em uma doença, por exemplo.","As recompensas sempre aparecem a partir da aplicação dos preceitos corretos de vida e do esforço para se obter os resultados positivos."],"5":["Idade:","Um Momento Decisivo 5 no primeiro Ciclo de Vida, indica uma criança ousada,inquieta, esperta e pouco constante.","Geralmente empreende mudanças súbitas, ora gostando disto, ora daquilo, sem esperar as recompensas resultantes de um esforço ou trabalho empreendido.","Esse momento traz oportunidades para viagens, para experimentar novos empreendimentos, novas sensações, e para se livrar de tudo que está obsoleto ou que já não nos faz falta.","É uma fase de liberdade, de muitas mudanças e de desenvolvimento pessoal, principalmente se vier após um Momento decisivo 4 ou 6."],"6":["Idade:","Um Momento Decisivo 6 no primeiro Ciclo de Vida, geralmente indica uma responsabilidade de tomar conta dos pais ou de algum familiar ou casamento precoce. Esse é o momento para seus ajustes e das suas responsabilidades familiares.","Caso tenha consciência disso, este é o Momento de grande afetividade, de amor e de felicidade doméstica, além de sucesso e segurança material. Do contrário, ou seja, caso seja dispersivo ou inconstante, poderá ser um período de discussões, brigas, desgostos e graves problemas domésticos e até indício de separação. Caso a pessoa esteja solteira, este Momento trará a oportunidade para um novo amor e para o materialismo."],"7":["Idade:","Um Momento Decisivo 7 no primeiro Ciclo de Vida, nos indica uma criança retraída, solitária, pensativa e muito estudiosa.","Quando os pais são excessivamente rígidos e severos, a criança poderá, pela regressão de suas ideias e projetos, contrair algum tipo de doença psicossomática ou até mesmo depressão, ser temperamental e desenvolver algum tipo de complexo.","É uma fase de introspecção, de meditação e estudo do significado último da vida. Caso não esteja casado ainda, desaconselhamos o matrimônio nesta fase. Velhos relacionamentos que não produzem mais frutos, podem e devem ser deixados para trás.","Você sentirá vontade de se retirar para dentro de si mesmo, o que de certa forma poderá causar problemas de relacionamento, tanto ao nível pessoal como familiar."],"8":["Idade:","Um Momento Decisivo 8 no primeiro Ciclo de Vida, indica que a pessoa começará ainda jovem a se dedicar aos negócios, a trabalhar para se sustentar e também sustentar algum membro da família. É um período de grandes realizações no mundo dos dos negócios.","As despesas são muito altas, não obstante é uma excelente fase para se correr atrás dos objetivos, de conquistar poder, fama e sucesso material. Com dedicação, estudo e trabalho sistemático com objetivo definido e com colaboradores aptos e interessados, você dificilmente deixará de conseguir tudo o que deseja."],"9":["Idade:","Um Momento Decisivo 9 no primeiro Ciclo de Vida, normalmente não é dos mais afortunados, pois quase sempre a criança é incompreendida por colegas, amigos e até familiares, que por causa dessa incompreensão exigem muito e retribuem pouco, o que faz com que o jovem se retraia e fique tímido e introspectivo.","Traz a oportunidade para se 'cultivar' o amor, solidariedade, altruísmo e para se viajar para o exterior. Poderá haver algum tipo de perda e até desapontamentos, principalmente entre amigos.","Um bom investimento para você é fazer obras humanitárias durante este período, pois os frutos dessa plantação são certos, e o sucesso e a fama se farão presentes."],"11":["Idade:","Por ser um número altamente espiritual e elevado, você nesse período sentir-se-á tenso e muito nervoso.","É uma excelente fase para estudar esoterismo, espiritualismo e expandir seus horizontes.","Este momento traz inspiração, muita iluminação e, quase sempre, muita fama e prestígio nacional e até internacional.","Não faça nada nem diga por trás o que não teria coragem de dizer ou fazer na frente das pessoas."],"22":["Idade:","É sem dúvida alguma, o Número e o Momento mais poderoso. Você estará altamente criativo e neste estado serão possíveis todas as realizações. É uma fase de interesses pelos problemas mundiais e de grande expansão da consciência."]},"momentosB":{"1":["Idade:","Não é um período fácil; exige muita coragem, determinação e muita força de vontade. Esse é um momento propício para se 'cultivar': individualidade, independência e engenhosidade. Inúmeros acasos e situações inesperadas forçarão você a enfrentar a vida pensando e agindo por si mesmo."],"2":["Idade:","Traz consigo a oportunidade para 'cultivar' o tato e a compreensão. Se for amigo, companheiro e atencioso com seus semelhantes, este será um período de amizades sinceras e de relacionamentos duradouros.","Excelente fase para se contrair matrimônio. Se for impaciente e desatencioso, poderá ser uma fase de relacionamentos difíceis, de grandes incompreensões, brigas, discussões, em que você poderá causar graves prejuízos às pessoas que o cercam."],"3":["Idade:","É o momento de você expandir a vida social e 'cultivar' os próprios talentos. Trata-se de uma fase muito apropriada para a auto-expressão, novas amizades, novos romances e fertilidade.","A manifestação descuidada das suas emoções poderá ter consequências desagradáveis, pois existe, nesse estado, tendência ao desmando: vícios, brigas, discórdias. Cuidado com os 'amigos', pois apesar de serem necessários, por vezes são más companhias."],"4":["Idade:","Este Momento Decisivo traz a oportunidade de se construir um sólido alicerce para o futuro.","É um período de trabalho duro e até de algumas restrições se é necessário 'cultivar' a paciência e os bons hábitos de trabalho. Neste período, poderá haver alguns problemas econômicos, que serão superados com muito trabalho, inteligência e dedicação ao projeto final.","A família e os parentes por afinidade podem se transformar num peso e você terá de ajudá-los, tanto financeiramente, como prestando ajuda humanitária, em uma doença, por exemplo.","As recompensas sempre aparecem a partir da aplicação dos preceitos corretos de vida e do esforço para se obter os resultados positivos."],"5":["Idade:","Esse momento traz oportunidades para viagens, para experimentar novas sensações, novos empreendimentos e para se livrar de tudo que está obsoleto ou que já não nos faz falta.","É uma fase de liberdade, de desenvolvimento pessoal e de mudanças, principalmente se vier após um Momento decisivo 4 ou 6."],"6":["Idade:","Esse é o momento certo dos ajustes e das suas responsabilidades familiares.","Caso tenha consciência disso, este é o Momento de grande afetividade, de amor e de felicidade doméstica, além de sucesso e segurança material. Do contrário, ou seja, caso seja dispersivo ou inconstante, poderá ser um período de desgostos, discussões, brigas e graves problemas domésticos e até indício de separação.","Poderá trazer o reconhecimento o trabalho já feito. Caso a pessoa esteja solteira, este Momento trará a oportunidade para um novo amor e para o materialismo."],"7":["Idade:","É uma fase de introspecção, de meditação e estudo do significado último da vida.","Caso não esteja casado ainda, desaconselhamos o matrimônio nesta fase. Velhos relacionamentos que não produzem mais frutos, podem e devem ser deixados para trás.","Você sentirá vontade de se retirar para dentro de si mesmo, o que de certa forma poderá causar problemas de relacionamento, tanto a nível pessoal como familiar."],"8":["Idade:","É um período de grandes realizações no mundo dos negócios. As despesas são altas, não obstante é uma fase excelente para se correr atrás dos objetivos, de conquistar poder, fama e sucesso material.","Com muita dedicação, estudo e trabalho sistemático com objetivo definido e com colaboradores aptos e interessados, você dificilmente deixará de conseguir tudo o que deseja."],"9":["Idade:","Traz a oportunidade para se 'cultivar' o amor, a solidariedade, o altruísmo e para se viajar para o exterior. Poderá haver algum tipo de perda e até desapontamentos, principalmente entre amigos.","Um bom investimento para você é fazer obras humanitárias durante este período, pois os frutos dessa plantação são certos, e o sucesso e a fama se farão presentes."],"11":["Idade:","Por ser um número altamente espiritual e elevado, você nesse período sentir-se-á tenso e muito nervoso. É uma excelente fase para estudar esoterismo, espiritualismo e expandir seus horizontes.","Este momento traz inspiração, muita iluminação e, quase sempre, fama e prestígio nacional e até internacional.","Não faça nada nem diga por trás o que não teria coragem de dizer ou fazer na frente das pessoas."],"22":["Idade:","É sem dúvida alguma, o Número e o Momento mais poderoso. Você estará altamente criativo e neste estado serão possíveis todas as realizações. É uma fase de interesses pelos problemas mundiais e de grande expansão da consciência."]},"harmonia":{"1":["Vibra com: 9 Atrai: 4 e 8 É oposto: 6 e 7 É passivo em relação a : 2, 3 e 5","Este número é o do idílio (amor poético), mas a atração deve ter uma base intelectual.","Como este número também estimula a variedade, não será muito fácil chegar-se a uma união duradoura, pois haverá a tentação de se tratar de duas coisas ao mesmo tempo. Além disso, a tendência intelectual prejudicará o fogo da paixão, que você procura em vão.","Os casamentos podem ocorrer de repente, e também podem ocorrer encontros quando você estiver fazendo uma viagem bem longe de casa ou em um centro de estudos. A(o) possuidora(o) deste número deve ser sempre cautelosa(o) na vida matrimonial, pois pode haver o perigo de aventuras extraconjugais provocadas pelo tédio ou pela falta de liberdade mental."],"3":["Vibra com: 7 Atrai: 5, 6 e 9 É oposto a: 4 e 8 É passivo em relação a : 1 e 2","Às vezes você tem a infelicidade de conhecer seus parceiros ideais demasiadamente tarde, quando normalmente já estão casados e, se não tiver cuidado, pode tornar-se um lado de um triângulo, e vez de esperar outro parceiro que esteja livre.","Você é muito idealista para compartilhar seu casamento, mas o seu espírito de sacrifício pode ser explorado maldosamente por aqueles em quem confia.","Possivelmente, haverá um ou mais de um quase erro, porém você tem a proteção que impede de se prender a uma pessoa de gênio insuportável ou de mau caráter.","Se deixar agir a sua intuição, a sua escolha será correta, pois você compreende muito bem as motivações das pessoas e, em via de regra, escolherá alguém cujos interesses combinem com os seus, encontrando então o companheiro ideal para toda a vida."],"5":["Vibra com: 5 Atrai: 3 e 9 É oposto a: 2 e 4; profundamente oposto a 6 É passivo em relação a: 1, 7 e 8","Este número acarreta viagens, mudanças e muitas variedades.","É quase certo que a pessoa se casará e se separará mais de uma vez, devido à inquietação e gosto pela mudança.","Por outro lado, os dois cônjuges, mesmo separados, podem e normalmente mantêm negócios juntos, pois existe uma tendência à amizade.","Não costuma ser muito seletivo em seus relacionamentos, principalmente até os 25 anos e com isso vive trocando de parceiro constantemente, sempre à procura do “ideal”. Obstáculos e atrasos serão comuns na juventude, e o aconselhável é o casamento depois de trinta anos, e com uma pessoa da mesma idade ou até um pouco mais velha."],"6":["Vibra com: 4 Atrai: 3, 7 e 9 É oposto a: 1 e 8; profundamente oposto É passivo em relação a: 2","Não sendo muito precoces, as pessoas possuidoras deste número, embora ardentes no íntimo, são tímidas e pouco expressivas. No entanto, experimentam, provocados pelo ardor interior, períodos de exaltação, e se não houver cuidado, tais ardores poderão acarretar a formação de alianças de natureza não muito satisfatória que, se terminarem em casamento, podem provocar infelicidade.","É um número não muito forte, apresentando certa vacilação e variedade, e as pessoas regidas por ele devem ter muito cuidado para não desejarem novas companhias capazes de prejudicarem o estado conjugal, em particular quando elas se encontram afastadas do outro cônjuge. Se o casamento ocorrer depois de 33 anos de idade, haverá mais esperança de seu grande sucesso e estabilidade."],"7":["Vibra com: 3 Atrai: 2 e 6 É oposto a: 1 e 9 É passivo em relação a: 4,5 e 8","As pessoas regidas por este número são muitas vezes consideradas namoradeiras e até volúveis. Não é verdade. Embora não devam se casar muito jovens ou seja, antes que o seu caráter e os seus gostos estejam bem pronunciados, quase sempre isso acontece e em consequência, normalmente esses relacionamentos duram pouco. São tão ativas, quer mental, quer fisicamente, que a sua existência é muito variada e costumam conhecer um número muito maior de pessoas do que aqueles regidos pelos outros números, com exceção do cinco.","Frequentemente se casa mais de uma vez, e têm muitos casos amorosos, sem que procure aventuras, principalmente durante a vigência do casamento. Haverá muitas separações de pessoas amadas, amigas, e até mesmo mortes prematuras de pessoas queridas. Em via de regra têm muita responsabilidade desde a juventude."],"8":["Vibra com: 2 Atrai: 1 e 4 É oposto a: 3 e 6 É passivo em relação a : 5,7 e 9","As pessoas governadas por este número se casam para toda a vida, pois são sinceras e honradas, mas curiosamente, costumam ocorrer muitas vezes idílios desfeitos antes do casamento, por falta de sinceridade da outra parte. Se sofrer tal coisa, a pessoa pode custar a se recuperar e, se enviuvar depois de um casamento feliz, a pessoa regida por este número raramente se casa de novo.","A religião e a filosofia desempenham um papel importante em sua vida e embora o impulso sexual seja forte, há um sentimento de escrúpulo que evita a indulgência com o sexo antes do casamento.","O companheirismo é uma questão de importância vital para essas pessoas e, como o namoro, geralmente conduzido com muito critério e bom senso, o desempenho de atividades conjuntas, fará feliz e duradouro o casamento."],"9":["Vibra com: 1 Atrai: 2, 3, 5 e 6 É oposto a: 7 É passivo em relação a: 4 e 8","O casamento será a aspiração suprema e constante, e você a ele sacrificará todos os seus esperanças, pensamentos e aspirações, desde muito jovem.","Na juventude, a tendência é de gostar e até namorar com pessoas bem mais velhas do que você, o que poderá lhe acarretar alguns problemas, particularmente quando, com o correr dos tempos, você passe a se interessar por pessoas mais jovens.","Deve tomar cuidado para que os seus objetivos e atividades profissionais sejam compatíveis com os do seu cônjuge, pois, do contrário, terá muitas decepções e aborrecimentos."],"4|22":["HARMONIA CONJUGAL 4 Vibra com: 6 Atrai: 1 e 8 É oposto a: 3 e 5 É passivo em relação a: 2, 7 e 9","Você sentirá uma forte atração pelo casamento, devido à sua natureza emocional e afetiva, mas nem sempre terá a necessária discrição, e a sua escolha lhe poderá acarretar dificuldades.","Seu caminho será ainda mais dificultado pela inveja e despeito de outras pessoas, e também por sua tendência de julgar excessivamente os outros pela aparência. No casamento, embora procure um parceiro ativo e dominador, poderá haver atritos conjugais, com certa frequência, se houver muitas exigências de sua parte.","Seu parceiro terá interesse pelo ocultismo e poderá fazer com que você se interesse por sua superioridade intelectual."],"2|11":["Vibra com : 8 Atrai: 7 e 9 É oposto a: 5 É passivo em relação a: 1, 3, 4 e 6","Este número é discriminador na escolha de um cônjuge, principalmente por causa do seu acentuado interesse pelo conforto e pela estabilidade. A sugestão pode desempenhar um papel importante na sua vida e deve ter cuidado para impedir críticas indevidas por parte de parentes ou amigos, ou seja, na sua vida amorosa.","Pode haver também amizades secretas, de natureza puramente platônica, que devem ser encaradas com cautela, a fim de serem evitadas brigas- desavenças conjugais. Você há de querer uma pessoa inteligente, mas que seja acima de tudo prática e capaz de garantir a segurança financeira que você deseja."]},"arcano":{"1":["O Mago é 'o começo'; significa capacidade para falar, atuar, estudar e escrever. Significa também, habilidade, diplomacia, astucia, vontade, energia e poder.","Mostra claramente que o consulente deve aceitar riscos, pois tem a mente alerta e aberta, além de grande capacidade persuasiva.","O Arcano mostra ainda que o não fazer nada é pior do que fazer o mal. Logo é preferível se aventurar do que ficar passível esperando as coisas acontecerem e o consulente, guiado pela razão, pela firme vontade e a fé em si mesmo, conseguirá alcançar grandes realizações se perseverar em seus ideais."],"2":["A Papisa é a 'percepção espiritual e benéfica'; significa segredo, mistério, ciência, intuição, coisas escondidas, percepção das próprias necessidades espirituais e sentimento religioso.","A carta mostra que o consulente deve tornar-se mais receptivo, deve se pensar bem antes de decidir qualquer coisa, ou de parar, a fim de se aprimorar.","O lado negativo da carta mostra claramente que o consulente, se não se tornar um especialista, pode desenvolver a preguiça, algumas intenções hostis e excesso de fantasias."],"3":["A Imperatriz é a 'cornucópia', ou seja, a abundância, a fertilidade. Ela mostra claramente a sabedoria, a força espiritual, a ação, a inquietude, a evolução, o progresso das forças da civilização, a germinação, a fermentação, a incubação, a fecundidade, a geração e a iniciativa.","O Arcano mostra um ser compreensivo, elegante e com total domínio sobre si mesmo; representa, também, a feminilidade como forma de expressão, de criação e de poder exercido com sutileza. Simboliza, ainda, esplendor e mesmo a mulher amada.","A Imperatriz mostra ainda o êxito nas empresas, se o consulente for reto de pensamentos e a ações."],"4":["O Imperador é a 'majestade e o poder'. Ele significa apoio, poder, estabilidade, proteção, vontade, força de execução, riqueza material. Mostra também, forte autoridade ou necessidade de consulta a uma autoridade superior. Representa a Lei, o poder público, a perseverança, a força resoluta e a certeza.","O Imperador pode ser definido como a realização dos atos dirigidos pela Ciência da Verdade, o amor da Justiça, a força da vontade e o trabalho dos Órgãos. Ele também mostra que nada resiste a uma vontade firme, que tem como alavanca a ciência da verdade e da justiça.","Resumindo, o Imperador é aquele que dirige o fluxo das energias no sentido da realização e do sucesso em qualquer atividade."],"5":["É a 'opinião pública'; significa inspiração, indicação, ensino. Mostra também dever, consciência, disposição para vida religiosa, conselheiro, conselhos, generosidade, perdão, autoridade moral, doação dos conhecimentos. No sentido esotérico, representa a procura de um Mestre; necessidade de se conhecerem todas as facetas de um problema antes da decisão final.","É importante lembrar que nada resiste a uma vontade firme, que tem como alavanca a ciência da verdade e da justiça. Combater para assegurar a sua realização é mais que um direito é um dever.","Pode significar também que a realização das esperanças depende de um ser mais poderoso; é necessário conhecê-lo para obter seu apoio."],"6":["É a 'escolha emocional'; É a indecisão do ser humano frente a decisões difíceis, porém inevitáveis. Pode significar também, atração, beleza, idealismo. No mundo divino é a ciência do Bem e do Mal.","No mundo intelectual é o equilíbrio da Necessidade e da Liberdade.","No mundo físico é o antagonismo das forças naturais, o encadeamento das causas aos efeitos.","Mostra que o consulente deve ter muito cuidado com suas resoluções. Existem obstáculos que impedem o progresso. Os 'azares' pairam sobre a sua cabeça e a vontade vacila diante dos opostos. A indecisão é em tudo, mais funesta do que uma escolha má. Avança ou recua, jamais hesitando."],"7":["É o triunfo bem-merecido; é o ser humano equilibrado e, portanto, bem- sucedido, que foi capaz de decidir corretamente. Significa, também, providência, auxilio, triunfo e a domina ao do Espírito sobre a Natureza","O Carro mostra a capacidade humana de, através da mente, controlar o corpo (carro) num rumo certo e definido, apesar das emoções.","O Arcano O Carro encerra-se o conjunto das primeiras sete cartas, representativas do desenvolvimento das qualidades do 'homem' por meio de sua luta para sair-se vitorioso tanto sobre a matéria como sobre o espírito."],"8":["Esta lamina significa justiça, equidade, retidão, equilíbrio, plenitude, equilíbrio entre o bem e o mal, que deve ser conseguido pelo ser humano. E uma parada para pensar e analisar a situação.","No mundo intelectual ela representa a Atração e a Repulsão. No mundo Físico, a Justiça relativa, falível e limitada, que provém dos homens.","A Justiça, no seu lado positivo, mostra equilíbrio, regularidade, honra, harmonia, estabilidade, ordem, lei, virtude e integridade. No lado negativo, pode representar complicação, fanatismo, timidez, abuso, intolerância, desordem e injustiça."],"9":["Este Arcano significa prudência, proteção, sabedoria, meditação e espírito de sacrifício. Pode também, mostrar avareza, falta de sinceridade, atos imprudentes e imaturidade.","Sob o peso do saber, que não encontra aplicação prática no mundo materialista, o ser necessita de uma mudança ou abertura na vida, bem como de uma busca efetiva de autoconhecimento.","Resumindo, preocupações com o passado podem atrasar o desenvolvimento espiritual; exageros à parte, representam as bases desse mesmo desenvolvimento."],"10":["É a sorte e a recompensa cármica. Representa fortuna, destino, elevação, ascensão, supremacia; mas também pode significar falsidade, ilusão e instabilidade.","É necessário se saber que para poder é necessário querer; para querer com eficácia é preciso ousar; e para ousar com êxito é preciso saber calar ate o momento de agir. Para se conseguir o direito de Poder é preciso querer pacientemente e com perseverança infatigável.","Caso a pessoa que esteja consultando seja avarenta ou déspota, o sucesso conseguido pode ser ilusório, assim como ilusória será a vitória sobre a existência."],"11":["Representa a atuação de uma força superior (no caso, a vontade do ser humano) sobre a força bruta - os instintos, a parte animal do ser humano. Significa, ainda, energia, trabalho, a ao e vitalidade.","O consulente deve sempre se lembrar que para poder é preciso crer que se pode. Avança com fé; os obstáculos são fantasmas. Para que o ser humano se torne forte é necessário impor silêncio às fraquezas do coração; é preciso estudar o dever que é a regra do direito e praticar a justiça como se tivesse amor a ela."],"12":["Mostra sacrifício. O desconhecimento completo do caos interior ou exterior que cerca o consulente, que se esforça em não mudar de postura.","A carta mostra a predominância do mundo material sobre o espiritual; algo não-natural. Mostra, também, uma certa crise interna que se pede imediata resolução. Mais claramente, o 'homem' primeiro deve 'morrer' para a matéria a fim de poder ingressar no mundo espiritual, perdoando a todos aqueles que, de alguma maneira, ele pensa que lhe prejudicaram.","No mundo divino significa Lei revelada.","No mundo intelectual, o ensino do Dever.","No mundo físico, o Sacrifício voluntario, na tentativa de solucionar o problema, de autocorreção."],"13":["Representa uma transformação inevitável ou mesmo um rejuvenescimento. Mostra que algo deve terminar; oportunidade de uma vida nova, desde que se consiga abrir mão da antiga.","As coisas terrenas são efêmeras, e as mais altas potências são cortadas como as ervas dos campos.","A lâmina também significa 'morte' física, destruição e renovação.","Mostra a libertação dos instintos materiais por uma livre e voluntária adesão da alma às Leis do movimento Universal , que constitui em nós a criação de um segundo 'homem', o 'homem' celeste."],"14":["Mostra adaptação às circunstâncias, uma metamorfose, uma mutação. Também representa, na sua parte positiva, disciplina, autocontrole, viagem bem- sucedida e sociabilidade.","Na negativa, falta de personalidade, de controle e corrupção. No divino, representa o movimento perpétuo da Vida.","No mundo intelectual, a combinação das ideias que criam a vida moral.","No mundo físico, a combinação das forças da Natureza."],"15":["Evento irrevogável. Significa força maior, destino, magia negra, mistério, atrações secretas, período de estagnação, frustração total, sensação de barreira intransponível.","É a imagem da fatalidade que rebenta como a erupção de um vulcão sobre aquele que se deixa dominar pelas ilusões da matéria, quer seja ele forte ou fraco, grande ou pequeno, hábil ou ignorante.","No mundo divino representa a predestinação.","No mundo intelectual, o mistério."],"16":["O imprevisto. Representa catástrofes, excessos, imprevistos, desastres, perseguição de ideias genéricas, ruína e influências más. Pode, também, dependendo do caso, mostrar doenças, falta de rumo do consulente, perda da liberdade, injustiça e ausência de definição.","O consulente deve aceitar com resignação a Suprema Vontade do Onipotente, pois toda prova se encaminha para a recompensa final.","O consulente deve repensar seus projetos, suas opiniões, seus conceitos"],"17":["Renascimento da alegria, amor e esperança.","Mostra influência, ascendência, inspiração, criatividade, contato com alguma pessoa que inspirara o consulente.","Em casos especiais (se o consulente é comprovadamente avarento, egoísta e invejoso), a carta também pode mostrar doença mental, 'azar', emoções desenfreadas e mal conduzidas. O ser humano é o ponto central das lutas dos elementos, e somente poderá equilibrar-se e realizar-se quando estabelecer equilíbrio entre eles. Esta lâmina representa também a influência dos elementos e astros em nossa vida material, mental e espiritual."],"18":["É o mundo subconsciente dos sonhos. Representa trevas, sortilégios, enfeitiçamento, aviso de algo ruim, excesso de imaginação, influências perniciosas, decepções, fraudes e pequenos prejuízos. Também pode denotar tendência a drogas, alcoolismo.","O consulente deve se lembrar que aquele que afronta o desconhecido, procura a sua perda. Observa, escuta e cala-te.","No plano divino, representa os abismos do infinito.","No mundo intelectual, as trevas que envolvem o Espírito quando se submete ao domínio dos instintos.","No mundo físico, as decepções e os inimigos ocultos."],"19":["Triunfo e sucesso. Esta lâmina significa presságio favorável, grande sucesso, facilidade e clareza de expressão, boas relações, amizades leais, contentamento no amor, luz e desembaraço.","Do lado esotérico, mostra grande criatividade e felicidade, o paraíso, o altruísmo e a libertação.","No mundo divino, representa o Céu supremo.","No mundo intelectual, a Verdade sagrada.","No mundo físico, a Felicidade tranquila."],"20":["Renascimento de uma nova vida. Esta lâmina significa, no seu lado positivo, regeneração, sucesso frente a uma dificuldade, proteção, despertamento, surpresa e brilho.","No lado negativo, dependendo do caráter do consulente, pode significar falta de ajuda, divórcio, falha num empreendimento, indecisão e rompimento de um relacionamento.","No sentido esotérico nos diz que o sucesso nas relações ou nos empreendimentos criativos serão alcançados pelo consulente, se ele conseguir vencer a letargia, não adormecer na preguiça, nem no esquecimento."],"21":["É o sucesso, a segurança, a realização, a conclusão e a recompensa.","O Mundo é a carta mais poderosa do Taro; é uma reunião e síntese de todos os Arcanos Maiores. E a matéria dominada pelo espírito (circulo). Este, por sua vez, apresenta-se em equilíbrio entre atividade e passividade, rodeado pelos quatro elementos.","O Mundo não apresenta qualquer negatividade, porém, em casos extremos, ou seja, se o consulente for um ser sem qualquer espiritualidade e rancoroso, ele pode representar, na pior das hipóteses, um obstáculo a ser superado ou uma forte ligação às coisas terrenas."],"22":["Significa inconsciência, perturbação, loucura, novos horizontes se abrindo, entusiasmo juvenil. Também pode representar impulso cego, falta de direção e inconsequência.","Aconselha-se o consulente a olhar e avaliar o que possui e a tentar determinar um novo caminho, sem medo, mas com prudência.","O Louco é o símbolo do homem que se torna escravo da matéria, mas também demonstra que esse mesmo homem quer melhorar, quer conhecer o desconhecido."],"23":["É a carta da liderança, das novas ideias e das grandes mudanças na vida. Representa um homem do campo, bom e austero; pessoa bem-intencionada e honesta.","Mostra o poder adquirido pelo mérito e pelo trabalho, sendo o símbolo da proteção das pessoas bem colocadas profissionalmente. Mostra, ainda, que aquele que o tirar poderá, se tiver vontade e fé, encontrar um grande protetor, que tudo fará por ele."],"24":["É o símbolo de um nascimento em posição elevada ou da proteção de uma senhora da alta sociedade. Demonstra, também, a força da imaginação, da constância e da objetividade."],"25":["Esta lâmina significa partida, mudança, fuga, separação, abandono. Pode, também, representar mudança: de casa, de emprego, de ambiente; busca de novos horizontes.","O consulente não deve se esquecer que tanto no bem como no mal, todo trabalho produz frutos."],"26":["Pressagia grande agitação e inquietação. Este Arcano denota um aviso, advertência.","Ao lado de uma figura feminina, denuncia êxito nos empreendimentos. Ao lado de uma masculina, mostrará que alguém falará por ele. Seguido do escravo da Taça, há um rival perigoso.","É o símbolo da ruína por empreendimentos mal calculados e combinações errôneas. Mostra também profissões inferiores e mau emprego das faculdades.","Este Arcano demonstra que o consulente deve desconfiar dos interesses egoístas e das paixões que o rodeiam, se não quiser cair na servidão."],"27":["Este Arcano denota prosperidade, ganho êxito.","Se for seguida de nove Gládios, mostra insucesso e perda de processo.","Mostra, ainda, viagens, empreendimentos que tem toda a probabilidade de êxito e estabilidade, realizações de atos que darão muita alegria e segurança, estudos bem-sucedidos, mudança para melhor, e, se o consulente for artista ou cientista, terá toda a probabilidade de ficar famoso."],"28":["Esta lâmina significa atraso; suspensão; adiamento; demora; obstáculo; contrariedade; sucesso com perigo de estagnação, exigindo mudança de rumos. Mostra dinheiro a receber pelo trabalho. Ao lado de dez Moedas, alegria por dinheiro."],"29":["Esta lâmina significa campo, agricultura. Denota bens, imóveis, divertimento, alegria, paz e tranquilidade. É sinal de viagens por causa de dinheiro e de grandes negócios; felicidade certa.","Mostra, ainda, empreendimentos que podem trazer lutas e discussões, porém com final feliz."],"31":["Esta lâmina pressagia obstáculos, embaraços, atrasos, indecisões e, às vezes, insucesso nas empresas, se houver falta de vontade, firmeza e perseverança.","Os obstáculos ou dificuldades podem ser gerados a partir de ações internas(psíquicas, fisiológicas ou metabólicas) ou externas (problemas causados por outrem, situações imprevistas, acidentes, enganos)."],"32":["Representa ouro, riqueza, opulência, luxo e abundância. Concurso de circunstâncias favoráveis ao êxito das empresas, se o consulente não exceder o fim a que se propõe. Deve se evitar a cólera, o orgulho e as paixões brutais."],"33":["Significa aliança, associação, reunião, contrato. Mostra êxito nos empreendimentos, empresas sérias e estáveis."],"34":["Este Arcano mostra perfeição, possibilidade de sucesso, êxito nos empreendimentos, inovações felizes, espírito de invenção.","Término de um processo com final feliz."],"35":["Este Arcano denota sofrimento físico, doença, tristeza, melancolia, aflição, temor. Denota também divisão dos empreendimentos, obstáculos imprevistos. É a carta da dualidade, das dificuldades, da passividade."],"36":["Este Arcano denota inteligência criadora, trabalho útil, êxito, anuncia dinheiro, herança, fortuna próxima, êxito nos negócios financeiros.","Sendo seguido de Uma Moeda ou Sete de Bastões, indica lucro, grande êxito nos negócios e prosperidade no comércio."],"37":["Significa homem honesto, íntegro, trabalhador, justo e de posição. Mostra amizades sinceras, benevolência de um homem poderoso. Para uma mulher indica casamento com um homem de posição."],"38":["Mostra um casamento rico e feliz para um homem. Pode indicar amizade de uma mulher de posição."],"39":["Este Arcano significa acolhimento, viagem, proposta, convite.","Denota rivalidade no amor, lutas por causa de uma mulher (ou homem); adultério perigoso."],"40":["É indício de algo novo no plano afetivo, que pode ser um relacionamento ou uma nova perspectiva emocional dentro de um relacionamento existente, ou até mesmo o nascimento de uma criança.","Representa as emoções no plano do desejo e temor; proposta amorosa e oferta afetuosa; reconciliação, consideração e promoção.","Sensibilidade emocional.","Risco de sedução e zombaria."],"41":["Este é o Arcano da Fama e do prestígio. Pode indicar também alegria, contentamento, vida feliz e rodeada de afeições, muitos amigos, muitos amores na juventude e conservação de alguns."],"42":["Esta lâmina significa vitória, êxito , ganho, triunfo, prosperidade, lealdade, boa-fé, franqueza e verdade.","Denota união com pessoa mais velha, viúva, amores estranhos ou celibato. É necessária prudência nos desejos e na escolha das afeições, embora o conjunto seja favorável."],"43":["Novos e felizes horizontes. Este Arcano significa alegria, prazer, satisfação e é favorável aos negócios em geral.","Para os 'casados', pode significar escândalos amorosos, amores proibidos, paixões violentas, divórcio, mau casamento e perigo de sedução."],"44":["Representa o sonhador talentoso; mostra entendimento, reflexão, pensamento e espiritualidade.","Denota também êxito por meio de uma mulher, felicidade pelo encontro de uma mulher amorosa, porém depois de muitas lutas e perícias."],"45":["Esta lâmina afirma que o nosso fim está em nosso começo. É o passado, o anterior; também mostra novos conhecimentos, novas relações, novo meio.","Este Arcano denota união infeliz ou má escolha no casamento, por influência de parentes, por paixão desenfreada, por sedução ou desconhecimento efetivo do parceiro. Mostra, ainda, abandono, ruptura de casamento ou indiferença."],"46":["É a encruzilhada da vida. Significa legados, heranças, donativos, patrimônios e testamentos."],"47":["Mudanças para melhor. Esse Arcano significa parentesco, família, meio social. Também denota amores sólidos e duráveis, amizades sinceras, realização dos objetivos e aproximação de uma grande alegria."],"48":["Esperanças concretizadas. Este Arcano significa êxito, vitória, conclusão, realização, mostra, ainda, descoberta da cura, alívio da dor e do sofrimento físico.","Denota também afeições novas, ternura, poesia, amor por um(a) jovem virtuoso(a)."],"49":["Compromisso. Este Arcano denota amor, ou na pior das hipóteses, paixão, simpatia, atração, amizade, afeição, união e concórdia. No caso de paixão, este Arcano pressagia rivalidade e obstáculos."],"50":["Casamento. Este Arcano significa casa, residência, festa, convidados; também mostra assiduidade, perseverança e coragem. Nos assuntos do amor, pode significar perigo de sedução, paixão violenta e desenfreada que pode levar a conclusões precipitadas."],"51":["Desarranjo nos negócios. Mostra que o consulente poderá ter problemas com a justiça. Se a pergunta se referir a eventual doença, a resposta é que o consulente deve consultar um médico com a máxima urgência.","No caso do consulente ser militar (de qualquer arma), será bem-sucedido na carreira, mas fará muitos inimigos."],"52":["Este Arcano significa viuvez, privação, falta. Um pessoa triste e embaraçada nos seus negócios ou viúva. Se for mulher, poderá estar sendo traída pelo companheiro ou pela pessoa que ama. Se for um homem, poderá estar havendo lutas por causa de mulheres; ódios femininos, ciúmes e magia de alguma espécie."],"53":["Este Arcano denota ataque, agressão, crítica, sátira, zombaria, calúnia, difamação.","Mostra também, envolvimento com drogas, jogo, contrabando e negócios escusos.","Pressagia perigo pelo fogo ou por inimigos ocultos. Se militar (de qualquer arma), perigo de morte nessa profissão."],"54":["Este Arcano significa espião, vigilante, observador, traição de pessoa próxima. Denota perigo de morte pública ou assassinato, grande perigo por inimigos ocultos e maus."],"55":["Significa lágrimas, tristezas, lamentos, aflição. Denota também alternativas de lucro e de perdas, vida cheia de infortúnios, desgostos e/ou doenças."],"56":["Significa decepção, desengano, atraso nos negócios. Mostra ainda, desgostos, inimizades poderosas, lutas misteriosas e até perigo de ser assinado, e que é necessária prudência e discrição para vencer os obstáculos. No nível de saúde, pode denotar doença grave.","Se seguida pelo Nove de Moedas ou de Um de Bastão, poderá receber dinheiro com atraso."],"57":["É a carta do desgosto e da ansiedade.","Este Arcano significa crítica, posição duvidosa, conflito, combate, portador de más notícias. Poderá significar lágrimas, discórdia, perda de emprego e de reputação. Pode denotar também perda de processo, condenação."],"58":["Arcano mostra catástrofes imprevistas, perda de posição e esperanças irrealizáveis. Mostra ainda, a possibilidade de quedas de lugares elevados."],"59":["Este Arcano significa indecisão, instabilidade. Denota grandes desgostos por falta de firmeza e iniciativa. Contundo é um Arcano favorável para as viagens e notícias agradáveis e favoráveis."],"60":["Necessidade de se encarar as próprias limitações e de reconhecer que a vida deve ser vivida dentro dos limites das próprias capacidades. Representa derrotas, traições e aflições; infâmia e perfídia; o lado negro extrapolado. A derrota, tanto a sua quanto do seu adversário.","Risco de humilhar os outros tendo-os como adversários."],"61":["Significa solidão, retiro, segurança. Mostra um ser simples, econômico e de boa conduta.","Pressagia, também, afastamento da vida social em consequência de desgostos e contrariedades."],"62":["Este Arcano significa afastamento, partida, ausência, incidente, horror, desprezo, aversão, antipatia.","Pode indicar lutas, controvérsias, desgostos e empresas embaraçosas."],"63":["Este Arcano denota rivalidades, afeição, ternura, simpatia, atração, afabilidade, benevolência. Pode também significar proteção contra os inimigos, grandes lutas por associações humanitárias e partidárias."],"64":["Arcano das relações, das conquistas, êxito no amor e paixão violenta.","Mostra também vantagens conquistadas com muita luta. Seguida por Dez ou Nove de Gládios, poderá ter notícia de morte, grandes tristezas, de traições íntimas, roubo."],"65":["Este Arcano denota ascensão, proteção de um homem muito rico. Para as mulheres: casamento feliz e proteções importantes de um homem."],"66":["Arcano denota opulência, riqueza luxo, segurança, liberdade. Para um homem: casamento (ou enlace) com uma mulher influente e de posição."],"67":["Este Arcano significa chegada inesperada, visita. Mostra ainda lucros, ganhos, vantagens, interesses, paz e tranquilidade. Denota êxito nos empreendimentos, porém depois de muitas lutas. Mostra que obterá fortuna apesar dos obstáculos. Paz e tranquilidade final."],"68":["Denota noticias favoráveis sobre dinheiro. Denota também trabalho, ocupação, aplicação e generosidade."],"69":["É o Arcano da família, da casa, da mudança benéfica, da aquisição de bens pelo trabalho, do êxito em propriedades e terras. Mostra ainda, dinheiro, ganho, grande alegria."],"70":["Período de autossatisfação justificada em vista de tudo aquilo que se conseguiu. Representa riqueza material e sucesso econômico; vislumbre, golpe de sorte, lucro e abundância. O ganho pelos feitos do esforço no trabalho.","Risco de autossuficiência."],"71":["Este Arcano denota processo, contestação. O consulente estará sujeito a dificuldades e até com perigo de ser roubado.","Mostra muitas esperanças, porém pouco resultado."],"72":["Arcano de boas notícias, dinheiro, riqueza, compra, especulação, negócio. Mostra riqueza adquirida por meio de trabalho pessoal íntegro e honesto."],"73":["Este Arcano denota aspirações, ambições, esperanças, desejos. Bens inesperados, porém perigo de perdê-los por meio de amigos falsos."],"74":["Este Arcano denota pensamentos, inspiração, da prodigalidade e também da dissipação de energia."],"75":["Denota recompensa, presente, herança, benefício e generosidade. Mostra que poderá ter a chance de adquirir riqueza e fortuna estável."],"76":["É o Arcano do nascimento, grandeza de alma, da nobreza, da celebridade, do renome. Denota também fortuna por empresas habilmente dirigidas, pelo trabalho feito com perfeição e amor."],"77":["Arcano denota correspondência, bilhete, carta. Pressagia obstáculos, embaraços, fortuna dividida, porém grandes chances de associação benéfica."],"78":["Este Arcano significa contentamento perfeito, felicidade, êxtase, ouro, alegria. Vida perfeita e com muita saúde."],"79":["Reinício de uma atividade."],"80":["Na Numerologia Cabalística o Arcano 80 não existe - deve Reportar-se ao Arcano 8 (A Justiça).","Significa mente equilibrada, resolução judicial favorável; recompensa justa. Personalidade desejosa de livrar-se do supérfluo, de ideias equivocadas ou errôneas, de conhecimentos inúteis; necessidade do pensamento equilibrado e de tomada de decisões imparciais.","Representa a lei de causa e efeito, a busca pelo equilíbrio pessoal e universal; igualdade, equanimidade e justiça; razão, objetividade, realismo, sinceridade e recompensas."],"81":["Poderá haver problemas com a justiça; ou da lei de causa e efeito."],"82":["Poderá servir de escada para os outros, voluntária ou involuntariamente."],"83":["Associação intelectual ou cultural; progresso."],"84":["Trabalhar com e para o povo – político, filantropo ou humanitário."],"85":["Significa afastamento da vida social ou perda temporária de bens ou da própria vida."],"86":["Significa vitória sobre alguma coisa conseguida após muita luta e determinação."],"87":["Na Numerologia Cabalística o Arcano 87 não existe - deve Reportar-se ao Arcano 15 (O Diabo).","Evento irrevogável. Significa força maior, destino, magia negra, mistério, atrações secretas, período de estagnação, frustração total, sensação de barreira intransponível.","É a imagem da fatalidade que rebenta como a erupção de um vulcão sobre aquele que se deixa dominar pelas ilusões da matéria, quer seja ele forte ou fraco, grande ou pequeno, hábil ou ignorante.","No mundo divino representa a predestinação.","No mundo intelectual, o mistério.","No mundo físico, o imprevisto, a fatalidade."],"88":["Na Numerologia Cabalística o Arcano 88 não existe - deve Reportar-se ao Arcano 16 (A Torre).","O imprevisto. Representa catástrofes, excessos, imprevistos, desastres, perseguição de ideias genéricas, ruína e influências más. Pode, também, dependendo do caso, mostrar doenças, falta de rumo do consulente, perda da liberdade, injustiça e ausência de definição.","O consulente deve aceitar com resignação a Suprema Vontade do Onipotente, pois toda prova se encaminha para a recompensa final.","O consulente deve repensar seus projetos, suas opiniões, seus conceitos sobre tudo e com todos."],"89":["Significa mérito não reconhecido."],"90":["Na Numerologia Cabalística o Arcano 90 não existe - deve Reportar-se ao Arcano 9 (O Eremita).","Significa iluminação, conselho silencioso e prudente; discrição; sabedoria que nos vem do alto. Um período de solitude, de exílio voluntário das coisas mundanas, da agitação da vida, de forma a obtermos paciência e sabedoria. Esse momento representa a grande oportunidade de erguer e fortalecer a personalidade se estiver disposto a esperar.","Representa a sabedoria e o recolhimento necessário para alcança-la; introspecção e busca interior, prudência e paz de espírito; também resoluções e finalizações."],"91":["Período de solidão enquanto perdurar a influência do Arcano."],"92":["União tardia ou uma associação com grupos ou pessoas."],"93":["Período de sabedoria e bons resultados."],"94":["Solidão na velhice ou morte de pessoa idosa."],"95":["Reconhecimento intelectual."],"96":["Amores secretos e que poderão causar graves problemas."],"97":["Decisão difícil ou solidão a muito esperada que se concretiza."],"98":["Alto cargo e grande influência."],"99":["Muito dinheiro e riqueza material."]},"arcanoCurto":{"1":["É 'o começo'; significa capacidade para falar, atuar, estudar e escrever. Significa também, habilidade, diplomacia, astucia, vontade, energia e poder."],"2":["Arcano 2 é a 'percepção espiritual e benéfica' - significa segredo, mistério, ciência, intuição, coisas escondidas, percepção das próprias necessidades espirituais e sentimento religioso."],"3":["O Arcano da Imperatriz é a abundância e a fertilidade. Ela mostra a sabedoria, a força espiritual, a ação, a inquietude, a evolução, o progresso das forças da civilização, a germinação, a fermentação, a incubação, a fecundidade, a geração e a iniciativa."],"4":["Arcano do Imperador é a 'majestade e o poder'. Ele significa apoio, poder, estabilidade, proteção, vontade, força de execução, riqueza material. Mostra também, forte autoridade ou necessidade de consulta a uma autoridade superior. Representa a Lei, o poder público, a perseverança, a força resoluta e a certeza.","Imperador dirige o fluxo das energias no sentido da realização e do sucesso em qualquer atividade."],"5":["É a 'opinião pública'; significa inspiração, indicação, ensino. Mostra também dever, consciência, disposição para vida religiosa, conselheiro, conselhos, generosidade, perdão, autoridade moral, doação dos conhecimentos. No sentido esotérico, representa a procura de um Mestre; necessidade de se conhecerem todas as facetas de um problema antes da decisão final."],"6":["É a 'escolha emocional'; É a indecisão do ser humano frente a decisões difíceis, porém inevitáveis. Pode significar também, atração, beleza, idealismo. No mundo divino é a ciência do Bem e do Mal."],"7":["É o triunfo bem- merecido; é o ser humano equilibrado e, portanto, bem-sucedido, que foi capaz de decidir corretamente. Significa, também, providência, auxilio, triunfo e a domina ao do Espírito sobre a Natureza","O Carro mostra a capacidade humana de, através da mente, controlar o corpo (carro) num rumo certo e definido, apesar das emoções.","O Arcano O Carro encerra-se o conjunto das primeiras sete cartas, representativas do desenvolvimento das qualidades do 'homem' por meio de sua luta para sair-se vitorioso tanto sobre a matéria como sobre o espírito."],"8":["Esta lâmina significa justiça, equidade, retidão, equilíbrio, plenitude, equilíbrio entre o bem e o mal, que deve ser conseguido pelo ser humano. E uma parada para pensar e analisar a situação."],"9":["Este Arcano significa prudência, proteção, sabedoria, meditação e espírito de sacrifício. Pode também, mostrar avareza, falta de sinceridade, atos imprudentes e imaturidade."]},"sequenciaA":{"1":["Problemas com a iniciativa e determinação.","A pessoa fica limitada, perdendo a coragem de se aventurar em algo novo.","Pode, também, ficar um longo período inativo, desempregado ou mesmo impotente para realizar o que quer que seja, permanecendo nesse estado o tempo que durar o Arcano que domina o período.","Tal sequência pode ainda provocar doenças cardíacas de vários tipos."],"2":["Problemas com a autoconfiança","Esta configuração provoca timidez e indecisão, podendo levar a pessoa que possui esta, a ser subjugada por aqueles mais próximos, sejam eles amigos, sócios, colegas de trabalho ou simplesmente conhecidos.","Faz a pessoa perder a auto-estima, limitando-a quanto a seus projetos e realizações.","Pode ainda causar doenças que provocam dependência."],"3":["Problemas com a comunicação.","A pessoa torna-se incompreendida, falta diálogo sobre tudo e com todos, principalmente com colegas de trabalho e com o companheiro.","Tem dificuldade de se impor em seus projetos e é difícil convencer as pessoas.","Esta sequência, pode ainda causar doenças respiratórias ou de articulações."],"4":["Problemas com o trabalho.","Torna difícil qualquer realização profissional.","Normalmente é mal remunerado e as perspectivas profissionais são difíceis ou tem dificuldade em se manter no emprego ou se dar bem em qualquer atividade.","Pode, ainda, causar doenças reumáticas e também arteriais."],"5":["Problemas com a instabilidade financeira e pessoal.","Causa mudanças não desejadas de casa, de profissão e de meio social.","Sob esta influência, a pessoa tem muitos “altos e baixos”, não se fixando profissionalmente, sempre à procura de melhores oportunidades, sem contudo as encontrar.","Pode também causar “fuga” do meio social em que habita e contrair doenças superficiais , destrutivas e até doenças de pele."],"6":["Problemas com os afetos e sentimentos","Causa decepções com amigos, sócios, parentes e e até com o cônjuge (namorado ou companheiro), que não a compreende em seus propósitos e sentimentos.","Alguma tipo de doença cardíaca pode aparecer nesse estado."],"7":["Problemas com o medo e a intolerância.","Faz com que a pessoa se afaste de tudo e de todos.","Pode levar ao desmando, transformar as pessoas em seres dependentes, vaidosos, arrogantes e, consequentemente, vítima da sua própria intolerância.","Provoca sentimentos de muita solidão, doenças, nervosas dependentes e possivelmente algum tipo de câncer."],"8":["Problemas emocionais e também financeiros.","Esta sequência torna a pessoa arredia, afastando-a das atividades sociais.","Caso não seja evoluído espiritualmente, pode se descontrolar emocionalmente com muita facilidade.","Sob esta vibração, a pessoa pode oscilar entre a riqueza e a pobreza e, como consequência, pode contrair graves doenças ou mesmo ter algum de seus dependentes com tais sintomas."],"9":["Problemas com relação a finanças.","A pessoa passa por sérios problemas financeiros, tem perda de bens (móveis ou imóveis), as empresas fracassam e passa por vários tipos de provações provocados por longos períodos de paralisação.","Tudo isto pode afetar o sistema nervoso e o coração.","Você não tem Sequência Repetida(3 vezes o mesmo número)"]},"divida":{"13":["Esta Dívida representa a morte em todas as suas concepções. Com absoluta certeza, em vidas passadas cometeu transgressões às Leis Naturais, tais como: a- foi suicida, ou b- foi assassino(a), ou c- foi passivo(a) e negligente com a própria vida, ou d- com a vida alheia, ou e- por vícios apressou a própria morte. Uma coisa é certa: qualquer que tenha sido o caso ou os casos, os mesmos foram cometidos conscientemente, não sofrendo, em absoluto, qualquer influência externa.","Nesta existência, em virtude dessas transgressões, pode se tornar preguiçoso, indiferente ao que acontece à sua volta e tender para a crítica, seja ela de cunho pessoal, político ou existencial. Elimina-se esta crucial Dívida Cármica “trabalhando”; trabalhando duro em qualquer atividade profissional. Durante sua existência muito lhe será exigido e terá de lutar contra as adversidades da vida, administrar bens (seus e alheios), as más atitudes (suas e alheias) e contra o descontentamento e, desta maneira, além de “pagar a Dívida”, terá menos pro
