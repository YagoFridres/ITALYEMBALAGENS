blemas financeiros ao longo da vida."],"14":["É a Dívida que trata dos bens materiais. A pessoa com esta Dívida Cármica terá ao longo da sua existência ou até que aprenda a “lição”, inúmeras atribulações: troca constante de emprego, de residência, perda de bens: móveis ou imóveis e negócios fracassados. Em vidas passadas, locupletou-se financeiramente em detrimento de outras pessoas, ou seja, para subir na vida, agiu fraudulentamente, prejudicando sócios, amigos e companheiros de jornada, arruinando-os e levando-os à miséria, à desgraça e à destruição moral.","Nesta existência, terá de arcar com o peso de todos esses crimes hediondos, causados pela ambição desmedida e total inconsequência dos fatos.","Tais crimes, até serem completamente “pagos”, lhe trarão sérios aborrecimentos nesta existência e certas perturbações, tais como, desapontamentos com amigos, sócios, familiares e também muitos obstáculos que se interporão aos seus objetivos.","Tais desacertos na vida passada deve-se à sua total falta de compreensão e ambição desmedida. Ainda agora, ou seja, nesta vida atual, caso não seja espiritualmente desenvolvido, pode cometer os mesmos delitos e, assim, ter de passar pelos mesmos sacrifícios.","A principal “lição” a aprender nesta vida é o desapego. Não se apegue a nada nem a ninguém e cultive a compreensão até às últimas consequências. Somente desta maneira, compreendendo o seu semelhante e desapegando-se de tudo e de todos, conseguirá desenvolver a humildade suficiente, o amor e a compaixão para resgatar essa tão triste e cruel Dívida Cármica."],"16":["Esta Dívida Cármica é a manifestação do orgulho, do autoritarismo, da traição e da vaidade.","Com absoluta certeza em vidas passadas você viveu exclusivamente para seu deleite (bem estar), pouco se importando com o direito ou sentimento do próximo, subjugando todos e agindo com desmedido autoritarismo, frieza e até violência.","Nesta existência, em virtude dessas “faltas”, deverá sofrer vários contratempos ou algumas calamidades, tais como: acidentes os mais diversos, decepções com amigos, colegas de trabalho, parentes, cônjuge (namorado ou companheiro), fracasso nos negócios e também problemas com a justiça.","Este Carma ainda carrega o peso de traições conjugais, crimes passionais e uniões ilegítimas. Além dos contratempos acima citados, poderá passar por momentos muito angustiantes nesta existência, como trabalhar e não conseguir atingir os objetivos, perder a fortuna ou o poder, além de ser traído pelos que ama e confia.","Para eliminar este Carma, deve ser compreensivo, justo e solidário com seu semelhante. Deve andar na mais perfeita retidão e não se desviar deste caminho, sob pena de continuar indefinidamente sofrendo dos mesmos males."],"19":["É o número do “equilíbrio”. Como sabemos, a lei da Causa e Efeito é perfeita e aqueles que a transgridem com absoluta certeza pagarão caro por essa transgressão.","Em vidas passadas você agiu contrário a essa Lei e, agora, deve pagar o preço da iniquidade ou então repor aquilo que tirou aos outros. Mais claramente, você se locupletou financeiramente e socialmente, usando de artifícios fraudulentos, prejudicando pessoas e até fazendo que sofressem por sua causa, ou seja, levando culpas que deveriam ser imputadas a você, como serem aprisionados, terem seus bens confiscados e se verem desonrados por sua causa. Mais ainda, ganhou notoriedade e premiações que em absoluto lhe eram de direito, e sim de outrem.","Nesta existência, poderá ter segredos desvendados, ser traído por sócios e companheiros e, principalmente, ter de conviver com o sucesso e fracasso contínuos, até que aprenda a lição que é a que só colhemos aquilo que semearmos. Basicamente, é o aviso para que não seja dominador, orgulhoso, egoísta, autoritário e exerça a tolerância em tudo e com todos.","Elimina-se esta Dívida Cármica levando uma vida reta e elevada, altruísta, carregada de amor, afeto, bondade e voltada para o bem-estar de toda a humanidade. Agindo desta maneira, ou seja, plantando bem e cuidando da horta, a colheita será farta de sucesso e prosperidade."]},"anjo":{"Vehuiah":["Categoria do anjo: Serafim Horário mais indicado para preces: 00:00 a 00:20 Dia da semana mais indicado para preces: 3ª-feira Vela: Amarela Cristal: Rubi Incenso: Flor de Laranjeira e Lavanda 2-Jeliel"],"Jeliel":["Categoria do anjo: Serafim Horário mais indicado para preces: 00:20 a 00:40 Dia da semana mais indicado para preces: 6ª-feira Vela: Branca Cristal: Água-Marinha Incenso: Benjoin 3-Sitael"],"Sitael":["Categoria do anjo: Serafim Horário mais indicado para preces: 00:40 a 01:00 Dia da semana mais indicado para preces: domingo Vela: Amarela Cristal: Àgata Incenso: Patchoulli 4-Elemiah"],"Elemiah":["Categoria do anjo: Serafim Horário mais indicado para preces: 01:00 a 01:20 Dia da semana mais indicado para preces: 2ª-feira Vela: Amarela Cristal: Olho-de-Tigre Incenso: Sândalo 5-Mahasiah"],"Mahasiah":["Categoria do anjo: Serafim Horário mais indicado para preces: 01:20 a 01:40 Dia da semana mais indicado para preces: 6ª-feira Vela: branca Cristal: Quartzo Rosa Incenso: Lavanda e Alecrim 6-Lelahel"],"Lelahel":["Categoria do anjo: Serafim Horário mais indicado para preces: 01:40 a 02:00 Dia da semana mais indicado para preces: domingo Vela: Lilás Cristal: Ametista Incenso: Rosas 7-Achaiah"],"Achaiah":["Categoria do anjo: Serafim Horário mais indicado para preces: 02:00 a 02:20 Dia da semana mais indicado para preces: 6ª-feira Vela: Amarela Cristal: Hematita Incenso: Lavanda e flor de laranjeira 8-Cahethel"],"Cahethel":["Categoria do anjo: Serafim Horário mais indicado para preces: 02:20 a 02:40 Dia da semana mais indicado para preces: 5ª-feira Vela: Branca Cristal: Pedra da Lua Incenso: Hortelã 9-Haziel"],"Haziel":["Categoria do anjo: Querubim Horário mais indicado para preces: 02:40 às 03:00 Dia da semana mais indicado para preces: 2ª-feira Vela: Branca Cristal: Opala Incenso: Alecrim 10-Aladiah"],"Aladiah":["Categoria do anjo: Querubim Horári : Branca Cristal: Pedra-da-Lua Incenso: Jasmim 21-Nelchael"],"Nelchael":["Categoria do anjo: Trono Horário mais indicado para preces: 06:40 às 07:00 Dia da semana mais indicado para preces: segunda-feira Vela: Lilás Cristal: Ametista 22-Yeiaiel"],"Yeiaiel":["Categoria do anjo: Trono Horário mais indicado para preces: 07:00 às 07:20 Dia da semana mais indicado para preces: segunda-feira Vela: Branca Cristal: Ágata Incenso: Eucalipto 23-Melahel"],"Melahel":["Categoria do anjo: Trono Horário mais indicado para preces: 07:20 às 07:40 Dia da semana mais indicado para preces: segunda-feira Vela: branca Cristal: Turquesa 24-Haheuiah"],"Haheuiah":["Categoria do anjo: Trono Horário mais indicado para preces: 07:40 às 08:00 Dia da semana mais indicado para preces: segunda-feira Vela: Verde Cristal: Topázio Incenso: Cipreste 25-NithHaiah"],"NithHaiah":["Categoria do anjo: Dominação Horário mais indicado para preces: 08:00 às 08:20 Dia da semana mais indicado para preces: domingo Vela: Lilás Cristal: Ametista Incenso: Alecrim e Sândalo 26-Haaiah"],"Haaiah":["Categoria do anjo: Dominação Horário mais indicado para preces: 08:20 às 08:40 Dia da semana mais indicado para preces: sábado Vela: Branca Cristal: Pedra-da-Lua 27-Ierathel"],"Ierathel":["Categoria do anjo: Dominação Horário mais indicado para preces: 08:40 às 09:00 Dia da semana mais indicado para preces: quarta-feira Vela: Amarela Cristal: Pérola 28-Seheiah"],"Seheiah":["Categoria do anjo: Dominação Horário mais indicado para preces: 09:00 às 09:20 Dia da semana mais indicado para preces: quinta-feira Vela: Verde Cristal: Amazonita Incenso: Olíbano 29-Reyel"],"Reyel":["Categoria do anjo: Dominação Horário mais indicado para preces: 09:20 às 09:40 Dia da semana mais indicado para preces: quarta-feira Vela: Azul Cristal: Lápis-Lazúli Incenso: Sândalo e Rosas 30-Omael"],"Omael":["Categoria do anjo: Dominação Horário mais indicado para preces: 09:40 às 10:00 Dia da semana mais indicado para preces: quinta-feira Cristal: Rubi momentos da sua vida.","ATENÇÃO: Se um Ciclo de Vida seu tiver o MESMO número que uma das LIÇÕES CÁRMICAS, este será um período difícil até que a 'Lição' seja aprendida."],"destino":["NÚMERO DE DESTINO","Este é um dos números mais importantes do Mapa Numerológico. Ele descreve as influências na personalidade, oportunidades e os obstáculos que uma pessoa irá encontrar ao longo da sua vida. Indica, ainda, as alternativas disponíveis e o provável resultado de cada uma delas.","DESTINO"],"motivacao":["NÚMERO DE MOTIVAÇÃO","Descreve os motivos que estão por trás das decisões que uma pessoa toma e do seu modo de proceder. É o número que corresponde à ação e a maneira que essa ação é desenvolvida.","MOTIVAÇÃO"],"expressao":["NÚMERO DE EXPRESSÃO","Descreve a maneira como um ser humano interage com outro. Ele diz quais são seus verdadeiros talentos e qual a melhor forma de expressá-los.","EXPRESSÃO"],"missao":["MISSÃO A Numerologia Cabalística dá grande importância a este número, sendo considerado mesmo de “alta importância”, pois reflete, na essência o que a pessoa veio fazer neste planeta, nesta existência. É fundamental e muito importante esclarecer que toda e qualquer pessoa tem “livre arbítrio” e pode fazer o que bem entender com a sua vida, porém, também é importante se saber que os números obedecem a uma ordem rigorosa de harmonia, compatibilidade, neutralidade e incompatibilidade que, se não respeitada, pode causar ao seu portador inúmeros aborrecimentos ou mesmo derrocadas na vida. Lembre-se de que a Numerologia Cabalística existe para facilitar a vida das pessoas e não para complicá-la.","Todos nós temos uma “Missão” sobre a Terra, nesta e em outras existências (Deus jamais desejou que qualquer dos seus filhos viesse a sofrer; e se tal fato acontece a culpa é exclusiva do ser humano); logo, este item é de grande utilidade, pois a sua essência mostra como podemos tirar o melhor proveito da vida, sem que com isso prejudiquemos qualquer outro ser humano."],"momentosA":["MOMENTOS DECISIVOS","Indica qual será sua atitude em relação à vida em um determinado momento.","ATENÇÃO:","Se o número de um dos MOMENTOS DECISIVOS for IGUAL o número de MOTIVAÇÃO, seus desejos e necessidades serão atendidos durante os anos em vigor deste Momento Decisivo.","Se o número de um dos MOMENTOS DECISIVOS for IGUAL ao número da EXPRESSÃO significa que durante os anos do Momento Decisivo a pessoa poderá receber ajuda na realização da sua vocação profissional.","Se o número de um dos MOMENTOS DECISIVOS for IGUAL ao seu número de DESTINO você terá muitas oportunidades para realizar o seu DESTINO durante os anos em que estiver em vigor este Momento Decisivo.","Se o número de um dos MOMENTOS DECISIVOS for IGUAL a um dos números da LIÇÕES CÁRMICAS, os anos durante os quais este Momento Decisivo estiver em vigor, serão difíceis e conterão a 'lição' até que a mesma seja aprendida."],"impressao":["NÚMERO DE IMPRESSÃO OU 'APARÊNCIA'","É o número que descreve o que está oculto no ser humano e a imagem que uma pessoa tem de si mesma (geralmente sem perceber). Revela, ainda, a primeira impressão que os outros têm de nós, antes de nos conhecerem na realidade, ou seja, a condenação ou a absolvição antes do julgamento.","IMPRESSÃO"],"psiquico":["NÚMERO PSÍQUICO","É o número que mostra as qualidades psíquicas que influenciam as pessoas nascidas em determinados dias em comum, mostrando certos padrões interiores comuns entre elas.","Esse número revela as qualidades que influenciam nas escolhas pessoais, como amizades, sexo, casamentos, relacionamentos, profissões, desejos, ambições e até alimentos.","Mostra como nos vemos em nosso interior e como nós lidamos com as forças interiores de nossa personalidade."],"respSub":["RESPOSTA SUBCONSCIENTE","Esse número mostra como será sua reação instintiva e automática em uma situação de emergência."],"cores":["Todos os Tons de Amarelo e Laranja, Castanho, Dourado, Verde, Creme e Branco. Todos os Tons de Verde, Creme, Branco e Cinza     s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#e8cf8e" stroke-width="1.2" opacity=".7"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#f6e2a8"/>`).join('');
    s+=`<circle cx="420" cy="470" r="118" fill="url(#moon)"/><circle cx="468" cy="440" r="104" fill="#1b1846"/>`;
    s+=`<circle cx="420" cy="470" r="150" fill="none" stroke="#e8cf8e" stroke-width="1" opacity=".5"/><circle cx="420" cy="470" r="168" fill="none" stroke="#e8cf8e" stroke-width=".6" opacity=".35" stroke-dasharray="3 7"/>`;
    s+=`<path d="M0 ${H-260} Q 210 ${H-330} 420 ${H-280} T ${W} ${H-300} V ${H} H 0 Z" fill="#120f33" opacity=".85"/><path d="M0 ${H-200} Q 260 ${H-250} 520 ${H-205} T ${W} ${H-215} V ${H} H 0 Z" fill="#0c0a26"/>`;
    const defs=`<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0b2b"/><stop offset=".55" stop-color="#2a2468"/><stop offset="1" stop-color="#4b3a86"/></linearGradient>
      <radialGradient id="moon" cx="40%" cy="40%" r="70%"><stop offset="0" stop-color="#fff7dc"/><stop offset="1" stop-color="#e3c47a"/></radialGradient>`;
    return wrap(defs,s,`<rect width="${W}" height="${H}" fill="url(#sky)"/>`);
  }

  // 3 · Árvore da Vida (lilás claro, diagrama das sefirot)
  function arvore(){
    const P=[[420,150],[560,250],[280,250],[560,420],[280,420],[420,510],[560,620],[280,620],[420,730],[420,880]];
    const L=[[0,1],[0,2],[0,5],[1,2],[1,3],[2,4],[1,5],[2,5],[3,4],[3,5],[4,5],[3,6],[4,7],[5,6],[5,7],[6,7],[6,8],[7,8],[5,8],[8,9],[6,9],[7,9]];
    let s=L.map(([a,b])=>`<line x1="${P[a][0]}" y1="${P[a][1]}" x2="${P[b][0]}" y2="${P[b][1]}" stroke="#8d74b8" stroke-width="3" opacity=".55"/>`).join('');
    s+=P.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="44" fill="url(#sf)" stroke="#a87b2a" stroke-width="2.2"/><circle cx="${p[0]}" cy="${p[1]}" r="34" fill="none" stroke="#fff" stroke-width="1.2" opacity=".8"/><text x="${p[0]}" y="${p[1]+11}" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#4c3a70">${i+1}</text>`).join('');
    const r=rng(3); for(let i=0;i<70;i++){s+=`<circle cx="${(r()*W).toFixed(0)}" cy="${(r()*H*.8).toFixed(0)}" r="${(r()*2+.6).toFixed(1)}" fill="#a87b2a" opacity="${(r()*.5+.2).toFixed(2)}"/>`;}
    const defs=`<radialGradient id="bg3" cx="50%" cy="35%" r="80%"><stop offset="0" stop-color="#fbf8ff"/><stop offset=".7" stop-color="#ece3f7"/><stop offset="1" stop-color="#dccdef"/></radialGradient>
      <radialGradient id="sf" cx="38%" cy="35%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e6d8f5"/></radialGradient>`;
    return wrap(defs,s,`<rect width="${W}" height="${H}" fill="url(#bg3)"/><rect x="30" y="30" width="${W-60}" height="${H-60}" rx="18" fill="none" stroke="#8d74b8" stroke-width="1.4" opacity=".6"/>`);
  }

  // 4 · Aquarela Rosé (manchas suaves e ramos)
  function aquarela(){
    let s='';
    const blobs=[[160,190,260,'#f4b9c4'],[690,250,240,'#f7d3b0'],[420,140,200,'#e9c6ef'],[120,1010,280,'#f7d3b0'],[720,980,300,'#f4b9c4'],[430,1110,220,'#e9c6ef']];
    s+=blobs.map(([x,y,r,c])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" opacity=".55" filter="url(#bl)"/>`).join('');
    const branch=(x,y,rot,sc)=>{let b=`<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sc})"><path d="M0 0 C 40 -60 90 -110 170 -150" fill="none" stroke="#b88a4a" stroke-width="2.2"/>`;
      for(let i=1;i<=6;i++){const t=i/7,px=170*t,py=-150*t*t-10*t;b+=`<ellipse cx="${px}" cy="${py-14}" rx="9" ry="22" transform="rotate(-35 ${px} ${py-14})" fill="#c98b9a" opacity=".75"/><ellipse cx="${px+10}" cy="${py+8}" rx="8" ry="20" transform="rotate(55 ${px+10} ${py+8})" fill="#d9a7a0" opacity=".7"/>`;}
      return b+'</g>';};
    s+=branch(70,330,-10,1.3)+branch(770,300,190,1.2)+branch(90,960,10,1.1)+branch(760,900,170,1.3);
    s+=`<circle cx="420" cy="560" r="210" fill="none" stroke="#b88a4a" stroke-width="1.4" opacity=".7"/><circle cx="420" cy="560" r="222" fill="none" stroke="#b88a4a" stroke-width=".6" opacity=".5"/>`;
    const defs=`<filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>`;
    return wrap(defs,s,`<rect width="${W}" height="${H}" fill="#fffaf7"/>`);
  }

  // 5 · Geometria Sagrada (verde profundo com Flor da Vida dourada)
  function geometria(){
    const cx=420,cy=470,r=62; let s='';
    const centers=[[0,0]];
    for(let ring=1;ring<=2;ring++) for(let k=0;k<6;k++) for(let j=0;j<ring;j++){
      const a1=k*Math.PI/3,a2=(k+2)*Math.PI/3;
      centers.push([ring*r*Math.cos(a1)+j*r*Math.cos(a2),ring*r*Math.sin(a1)+j*r*Math.sin(a2)]);
    }
    s+=centers.map(([x,y])=>`<circle cx="${(cx+x).toFixed(1)}" cy="${(cy+y).toFixed(1)}" r="${r}" fill="none" stroke="url(#g5)" stroke-width="1.8"/>`).join('');
    s+=`<circle cx="${cx}" cy="${cy}" r="${r*3}" fill="none" stroke="url(#g5)" stroke-width="2.6"/><circle cx="${cx}" cy="${cy}" r="${r*3+14}" fill="none" stroke="url(#g5)" stroke-width="1"/>`;
    for(let i=0;i<6;i++){const a=i*Math.PI/3+Math.PI/6;s+=`<line x1="${cx}" y1="${cy}" x2="${(cx+r*3.6*Math.cos(a)).toFixed(1)}" y2="${(cy+r*3.6*Math.sin(a)).toFixed(1)}" stroke="#d6b46a" stroke-width=".8" opacity=".5"/>`;}
    const tri=(rad,up)=>{let p=[];for(let i=0;i<3;i++){const a=(up?-Math.PI/2:Math.PI/2)+i*2*Math.PI/3;p.push(`${(cx+rad*Math.cos(a)).toFixed(1)},${(cy+rad*Math.sin(a)).toFixed(1)}`);}return `<polygon points="${p.join(' ')}" fill="none" stroke="#e8cf8e" stroke-width="1.4" opacity=".75"/>`;};
    s+=tri(r*3.5,true)+tri(r*3.5,false);
    const defs=`<linearGradient id="g5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0d995"/><stop offset=".5" stop-color="#c49a45"/><stop offset="1" stop-color="#f3e2b3"/></linearGradient>
      <radialGradient id="bg5" cx="50%" cy="40%" r="80%"><stop offset="0" stop-color="#1f5a52"/><stop offset=".6" stop-color="#123c37"/><stop offset="1" stop-color="#0a2522"/></radialGradient>`;
    return wrap(defs,s,`<rect width="${W}" height="${H}" fill="url(#bg5)"/><rect x="34" y="34" width="${W-68}" height="${H-68}" fill="none" stroke="#c49a45" stroke-width="1.6" opacity=".8"/>`);
  }

  return [
    {id:'pronta-mandala',  nome:'Mandala Dourada',  svg:mandala(),  pos:'bottom', tone:'dark'},
    {id:'pronta-noite',    nome:'Noite Estrelada',  svg:noite(),    pos:'bottom', tone:'light'},
    {id:'pronta-arvore',   nome:'Árvore da Vida',   svg:arvore(),   pos:'bottom', tone:'dark'},
    {id:'pronta-aquarela', nome:'Aquarela Rosé',    svg:aquarela(), pos:'center', tone:'dark'},
    {id:'pronta-geometria',nome:'Geometria Sagrada',svg:geometria(),pos:'bottom', tone:'light'},
  ].map(c=>({...c, pronta:true, src:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(c.svg)}));
})();

<script>/* =====================================================================
   NÚCLEO DE CÁLCULO — Numerologia Cabalística (NumCabala)
   Reconstruído fielmente a partir do programa original (VB6), função a função.
   Referências de endereço (0x……) e regras conferidas no desassembly.
   ===================================================================== */
const NC = (()=>{
"use strict";

/* ---- Tabela de letras (FUN_010c4df0). Letras acentuadas já trazem o valor reduzido. ---- */
const LETTERVAL={};
(function(){
  const T={
   1:"A I Q J Y Ë Õ È", 2:"B K R Ä Ï À Ì Ÿ", 3:"C G L S Í Á Ê Ý Ü Ù",
   4:"D M T Ã Û", 5:"E H N Ô Ö Ò &", 6:"U V W X Ç", 7:"O Z É",
   8:"F P Ú Â Å Ñ Î", 9:"Ó"};
  for(const v in T) T[v].split(' ').forEach(ch=>{ if(ch) LETTERVAL[ch]=+v; });
})();
function letterValue(ch){ ch=(ch||'').toUpperCase(); return LETTERVAL[ch]||0; }

/* Marcas de acento digitadas separadamente (°+7, '+2, ¨×2, ^+7, ~+3, `×2, ´+2). */
const MARKS=new Set(['°',"'",'¨','^','~','`','´','́','̀','̃','̈','̂']);
const VOWELS=new Set(('A E I O U Y Á Ã É Í Ó Ô Ú Â À Ü Ë Ä Ï Ö Ý È Ì Ò Ù Ÿ Õ Ê Î Û &').split(' '));
function isVowel(ch){ return VOWELS.has((ch||'').toUpperCase()); }
function isMark(ch){ return MARKS.has(ch); }
function applyMark(v,m){
  m=m.normalize('NFC');
  if(m==='°') return v+7;
  if(m==="'"||m==='´'||m==='́') return v+2;
  if(m==='¨'||m==='̈'||m==='`'||m==='̀') return v*2;
  if(m==='^'||m==='̂') return v+7;
  if(m==='~'||m==='̃') return v+3;
  return v;
}

/* reduções */
const digitsum=n=>String(Math.abs(n)).split('').reduce((a,b)=>a+ +b,0);
function reduceOnce(n){                 // um passo (como o programa): 19→10, 29→11, 99→18
  if(n>9 && n!==11 && n!==22) n=digitsum(n);
  return n;
}
function reduceImp(n){ return n>9?digitsum(n):n; }   // Impressão: sem proteção de mestre
function fullKeepM(n){ while(n>9 && n!==11 && n!==22) n=digitsum(n); return n; }  // reduz até 1..9/11/22
function full1(n){ while(n>9) n=digitsum(n); return n; }  // reduz até 1..9 (sem mestre)

/* ---- Varredura das letras do nome (para exibição/caixas e somas) ---- */
function scanLetters(nome){
  const s=(nome||'').normalize('NFC'); const out=[];
  for(let i=0;i<s.length;i++){
    let ch=s[i];
    if(ch===' '){ if(out.length && !out[out.length-1].gap) out.push({gap:true}); continue; }
    if(isMark(ch)){ // marca digitada após a letra
      for(let j=out.length-1;j>=0;j--){ if(out[j].gap) break; const L=out[j];
        L.v=applyMark(L.v,ch); if(L.v>9) L.v=digitsum(L.v); L.disp=(L.disp+ch).normalize('NFC'); break; }
      continue;
    }
    const base=letterValue(ch);
    const L={ch:ch.toUpperCase(),base,v:base,vowel:isVowel(ch),disp:ch};
    out.push(L);
  }
  while(out.length && out[out.length-1].gap) out.pop();
  return out;
}

/* =====================================================================
   DATA
   ===================================================================== */
function parseDate(str){
  const m=(str||'').replace(/\D/g,''); if(m.length!==8) return null;
  const d=+m.slice(0,2), mo=+m.slice(2,4), y=+m.slice(4);
  if(mo<1||mo>12||d<1||d>31||y<1000) return null;
  const dt=new Date(y,mo-1,d); if(dt.getMonth()!==mo-1||dt.getDate()!==d) return null;
  return {d,m:mo,y,dd:m.slice(0,2),mm:m.slice(2,4),yyyy:m.slice(4)};
}

/* =====================================================================
   NÚMEROS DO NOME  (FUN_010a5710)
   Divide o nome em partes (palavras). Mantém mestres 11 e 22.
   Redução de UMA passada (fiel ao original): pode gerar 10,12..18.
   ===================================================================== */
function nameNumbers(nome){
  const words=(nome||'').normalize('NFC').trim().split(/\s+/).filter(Boolean);
  let totV=0,totC=0,totE=0;           // somas brutas (todas as letras)
  let partV=[],partE=[];              // valores reduzidos por parte (mantêm mestre)
  for(const w of words){
    let vs=0,cs=0;
    const chars=[...w];
    for(let i=0;i<chars.length;i++){
      const c=chars[i]; if(isMark(c)) continue;
      let v=letterValue(c);
      const nx=chars[i+1];
      if(nx&&isMark(nx)){ v=applyMark(v,nx); if(v>9) v=digitsum(v); i++; }
      if(isVowel(c)){ vs+=v; } else { cs+=v; }
    }
    totV+=vs; totC+=cs; totE+=vs+cs;
    partV.push(fullKeepM(vs)); partE.push(fullKeepM(vs+cs));
  }
  const rawV=totV, rawC=totC, rawE=totE;
  const tV=fullKeepM(totV), pV=fullKeepM(partV.reduce((a,b)=>a+b,0));
  const I =full1(totC);                                    // Impressão: reduz sem mestre
  const tE=fullKeepM(totE), pE=fullKeepM(partE.filter(x=>x!==0).reduce((a,b)=>a+b,0));
  // Motivação
  let M=tV; if(tV===11)M=11; if(tV===22)M=22; if(pV===11)M=11; if(pV===22)M=22;
  // Expressão
  let E=pE; if(tE===11)E=11; if(tE===22)E=22; if(pE===11)E=11; if(pE===22)E=22;
  if(I+tV===11)E=11; if(I+tV===22)E=22;
  // Espírito (consoantes brutas vs vogais brutas)
  const espirito= rawC>rawV?'Espírito em Ascensão': rawC===rawV?'Espírito Elevado':'Espírito Rebaixado';
  return {motivacao:M, impressao:I, expressao:E, motTotal:tV, espirito,
          somas:{motivacao:rawV,impressao:rawC,expressao:rawE}};
}

/* Contagem de valores das letras (lb_letra1): por nome todo e pelo 1º nome. */
function letterCounts(nome){
  const L=scanLetters(nome).filter(x=>!x.gap);
  const all=Array(10).fill(0);                 // valor reduzido 1..9
  L.forEach(x=>{ const v=full1(x.v); if(v>=1&&v<=9) all[v]++; });
  // primeiro nome
  const firstWord=(nome||'').normalize('NFC').trim().split(/\s+/)[0]||'';
  const F=scanLetters(firstWord).filter(x=>!x.gap);
  const first=Array(10).fill(0);
  F.forEach(x=>{ const v=full1(x.v); if(v>=1&&v<=9) first[v]++; });
  return {all,first};
}

/* Lições (contagem 0), Tendências (contagem ≥4), Resposta Subconsciente */
function carmicNumbers(counts){
  const licoes=[], tend=[];
  for(let d=1;d<=9;d++){ if(counts.all[d]===0) licoes.push(d); if(counts.all[d]>3) tend.push(d); }
  const rs= licoes.length? (9-licoes.length) : 0;   // 0 → "Nenhuma"
  return {licoes,tendencias:tend,respSub:rs};
}

/* Relação Intervalores (contagem do primeiro nome) */
function relacaoIntervalores(counts){
  const c=counts.first;
  let max=0; for(let d=1;d<=9;d++) if(c[d]>=max) max=c[d];
  if(max===0) return '9';
  let v=0; for(let d=1;d<=9;d++) if(c[d]===max) v=d;   // maior dígito com a contagem máxima
  const half=max/2;
  for(let d=1;d<=9;d++) if(c[d]!==0 && d!==v && c[d]>half) return 'Nenhuma';
  return String(v);
}

/* =====================================================================
   DESTINO / MISSÃO / PESSOAIS / CICLOS / DESAFIOS / MOMENTOS (datas)
   ===================================================================== */
function destino(dt){
  // soma dos 8 dígitos; reduz mantendo mestre; método alternativo se der 2 ou 4
  const digits=(dt.dd+dt.mm+dt.yyyy).split('').reduce((a,b)=>a+ +b,0);
  let D=fullKeepM(digits);
  if(D===2||D===4){
    const red=s=>{ let n=+s; if(n>9){ if(n!==11&&n!==22){ n=digitsum(n); if(n!==11&&n!==22) n=digitsum(n);} } return n; };
    let d=red(dt.dd), m=red(dt.mm);
    let y=digitsum(+dt.yyyy); while(y>9 && y!==11 && y!==22) y=digitsum(y);
    D=d+m+y;
  }
  D=fullKeepM(D);
  return {destino:D, somaDestino:digits};
}
function psiquico(dia){
  const map={1:1,10:1,19:1,28:1,2:2,11:2,20:2,29:2,3:3,12:3,21:3,30:3,4:4,13:4,22:4,31:4,
    5:5,14:5,23:5,6:6,15:6,24:6,7:7,16:7,25:7,8:8,17:8,26:8,9:9,18:9,27:9};
  return map[dia]||full1(dia);
}
function anoPessoal(dt, hoje){
  const mmdd=(String(hoje.getMonth()+1).padStart(2,'0')+String(hoje.getDate()).padStart(2,'0'));
  const bmmdd=(dt.mm+dt.dd);
  const Y = mmdd < bmmdd ? hoje.getFullYear()-1 : hoje.getFullYear();
  let n=+dt.dd + +dt.mm + Y;
  let AP=digitsum(n);
  if(String(AP).length>=2) AP=digitsum(AP);   // exatamente 2 passadas, sem mestre
  return {ano:AP, anoRef:String(Y)};
}
function mesPessoal(AP, hoje){
  // mês atual: reduz totalmente, mas mantém "11"/"22" só se o mês já for esses literais
  let mc=String(hoje.getMonth()+1).padStart(2,'0');
  let mcv=+mc;
  if(mc!=='22'&&mc!=='11') mcv=full1(mcv);
  // soma com o Ano Pessoal; mantém mestre só se a SOMA inicial for 11/22
  let s=AP+mcv;
  if(s!==11&&s!==22) s=full1(s);   // intermediários 11/22 NÃO são mantidos
  return s;
}
function diaPessoal(MP, hoje){
  let d=hoje.getDate();
  if(d>9 && d!==11 && d!==22) d=reduceOnce(d);   // UMA passada: 19,28→10; 29→11
  let r=MP + d;
  while(r>9 && r!==11 && r!==22) r=digitsum(r);  // reduz mantendo mestre
  return r;
}
function missao(D, E){
  let M=D+(+E);
  while(M>9 && M!==11 && M!==22) M=digitsum(M);
  return M;
}
function talentoOculto(motTotal, E){
  let t=motTotal+(+E);
  while(t>9 && t!==11 && t!==22) t=digitsum(t);
  return t;
}
/* Ciclos de Vida: números + faixas etárias. destinoFinal pode ser 11/22. */
function ciclos(dt, destinoFinal){
  const red1m=n=>{ if(n!==11&&n>9){ let x=digitsum(n); while(x>9 && x!==11 && x!==22) x=digitsum(x); return x; } return n; };
  const c1disp=(()=>{ let c=+dt.mm; if(c!==11 && c>9) c=digitsum(c); return c; })(); // exibido (1 passada)
  const c1=red1m(+dt.mm);
  const c2disp=(()=>{ let c=+dt.dd; if(c!==22&&c!==11&&c>9) c=digitsum(c); return c; })();
  let c2=+dt.dd; if(c2!==22&&c2!==11&&c2>9) c2=digitsum(c2); c2=(()=>{let x=c2; while(x>9){ if(x===11||x===22)break; x=digitsum(x);} return x;})();
  let y=digitsum(+dt.yyyy); let c3disp=y; if(y!==22&&y!==11&&y>9) c3disp=digitsum(y);
  let c3=c3disp; c3=(()=>{let x=c3; while(x>9){ if(x===11||x===22)break; x=digitsum(x);} return x;})();
  const fim1=37-destinoFinal;
  const fim2=fim1+27;
  return [
    {n:c1disp, de:0, ate:fim1},
    {n:c2disp, de:fim1, ate:fim2},
    {n:c3disp, de:fim2, ate:null}
  ];
}
/* Desafios */
function desafios(dt){
  let a=digitsum(+dt.dd); while(a>9) a=digitsum(a);
  let b=digitsum(+dt.mm);
  let c=digitsum(+dt.yyyy); while(c>9) c=digitsum(c);
  const D1=Math.abs(a-b), D2=Math.abs(c-a), D3=Math.abs(D2-D1);
  return [D1,D2,D3];
}
/* Momentos Decisivos: números + faixas */
function momentos(dt, destinoFinal){
  const red=n=>{ while(n>9){ if(n===11||n===22) break; n=digitsum(n);} return n; };
  const M1=red(digitsum(+(dt.dd+dt.mm)));
  const M2=red(digitsum(+(dt.yyyy+dt.dd)));
  const M3=red(M1+M2);
  const M4=red(digitsum(+(dt.yyyy+dt.mm)));
  const fim1=37-destinoFinal;
  return [
    {n:M1, de:0, ate:fim1},
    {n:M2, de:fim1, ate:fim1+9},
    {n:M3, de:fim1+9, ate:fim1+18},
    {n:M4, de:fim1+18, ate:null}
  ];
}

/* =====================================================================
   PIRÂMIDE INVERTIDA + ARCANOS + SEQUÊNCIAS
   ===================================================================== */
function pyrFirstRow(letras, mode, dt){
  // valores das letras da pirâmide básica (1..9, acentos já reduzidos)
  const base=letras.filter(x=>!x.gap).map(x=>{ let v=x.v; if(v>9) v=digitsum(v); return v; }).filter(v=>v!==0);
  if(mode==='basica' || !dt) return base;
  const d1=full1(+dt.dd), m1=full1(+dt.mm);
  let add;
  if(mode==='pessoal') add=d1;
  else if(mode==='social') add=m1;
  else add=full1(d1+m1);                  // destino: dia + mês reduzidos (1..9)
  return base.map(v=>full1(v+add));        // cada célula reduzida a 1..9
}
function pyrRows(first){
  const rows=[first.slice()];
  while(rows[rows.length-1].length>1 && rows.length<57){
    const p=rows[rows.length-1], n=[];
    for(let i=0;i<p.length-1;i++){ let s=p[i]+p[i+1]; if(s>9) s=digitsum(s); n.push(s); } // 10..18 → 1..9
    rows.push(n);
  }
  return rows;
}
function negativeSeqs(rows){
  const found=[];
  rows.forEach((r,ri)=>{ let i=0; while(i<r.length){ let j=i; while(j+1<r.length && r[j+1]===r[i]) j++;
    if(j-i>=2 && r[i]!==0) found.push({row:ri,from:i,to:j,d:r[i]}); i=j+1; } });
  return found;
}
const SPECIAL=new Set([116,118,119,123,168,252,518,575,637,665,667,757,922,923,924,925,926,927]);
function specialSeqs(rows){
  const hits=[];
  rows.forEach((r,ri)=>{ for(let i=0;i+2<r.length;i++){ const n=r[i]*100+r[i+1]*10+r[i+2];
    if(SPECIAL.has(n)) hits.push({n,row:ri+1}); } });
  return hits;
}
/* Arcanos por idade: Arcano k = valor Mid(digitosBasica,k,2) (letra k e k+1 concatenadas). */
function arcanos(letras, dt, hoje){
  const base=letras.filter(x=>!x.gap).map(x=>{ let v=x.v; if(v>9) v=digitsum(v); return v; });
  const digits=base.filter(v=>v!==0).join('');
  const n=base.filter(v=>v!==0).length;
  const list=[];
  if(n<2) return {list,atual:null,unicos:[]};
  const I=Math.round(90/(n-1)*100)/100;
  // arcanos: pares de letras adjacentes (2 dígitos)
  const arcs=[];
  for(let k=0;k<n-1;k++){ const two=+(digits.substr(k,2)); if(digits.substr(k,2).length<2) break; arcs.push(two); }
  let lo=0, idade=null;
  if(dt){ const t=+(String(hoje.getFullYear())+String(hoje.getMonth()+1).padStart(2,'0')+String(hoje.getDate()).padStart(2,'0'));
    const b=+(dt.yyyy+dt.mm+dt.dd); idade=(t-b)/10000; }
  let atual=null;
  for(let k=0;k<arcs.length;k++){
    let hi=Math.round((lo+I)*100)/100; if(hi>91 && k>0) { /* ainda inclui o último começado */ }
    const de=Math.round(lo), ate=Math.round(hi);
    const entry={n:arcs[k], carta:(window.NC_TEXTS&&window.NC_TEXTS.texts.arcanoNome[arcs[k]])||'', de, ate, deEx:lo, ateEx:hi};
    if(idade!=null && idade>=lo && idade<hi && !atual){ atual=entry; entry.atual=true; }
    list.push(entry);
    lo=hi; if(hi>=91) break;
  }
  const seen={}, unicos=[];
  list.forEach(a=>{ if(!seen[a.n]){ seen[a.n]=1; unicos.push({n:a.n,carta:a.carta,
    texto:arcanoTexto(a.n)}); } });
  return {list,atual,unicos,intervalo:90/(n-1)};
}
function arcanoTexto(n){
  const T=window.NC_TEXTS&&window.NC_TEXTS.texts;
  if(!T) return '';
  const a=T.arcano&&T.arcano[String(n)];
  return a? a.join('\n\n') : (n>78?`Não existe referência de Carta para Arcanos acima de 78.`:'');
}
const BASE_TEXT={1:'Poder de LIDERANÇA',2:'Poder de DIPLOMACIA',3:'Poder de COMUNICAÇÃO',4:'Poder de CONSTRUÇÃO',
 5:'Poder da VERSATILIDADE',6:'Poder da RESPONSABILIDADE',7:'Poder de ANÁLISE',8:'Poder de DETERMINAÇÃO',9:'Poder de FRATERNIDADE'};
function piramide(nome, nascStr, mode, hoje){
  hoje=hoje||new Date();
  const dt=parseDate(nascStr);
  const letras=scanLetters(nome);
  const first=pyrFirstRow(letras,mode,dt);
  const linhas=pyrRows(first);
  const seqs=negativeSeqs(linhas);
  const base=linhas.length?linhas[linhas.length-1][0]:null;
  const arc=arcanos(letras,dt,hoje);
  const esp=specialSeqs(linhas);
  const T=window.NC_TEXTS&&window.NC_TEXTS.texts;
  const seqTextos=[...new Set(seqs.map(s=>s.d))].sort().map(d=>({titulo:`Sequência repetida ${String(d).repeat(3)}`,
    paras:(T&&T.sequenciaA&&T.sequenciaA[String(d)])||[]}));
  const especiais=esp.map(h=>({n:h.n,texto:((T&&T.seqEspecial&&T.seqEspecial[String(h.n)])||[]).join(' ')}));
  return {letras:letras.filter(x=>!x.gap), linhas, seqs, base, baseTexto:base?BASE_TEXT[base]:'',
    arcanos:arc.list, arcanosUnicos:arc.unicos, arcanoAtual:arc.atual,
    idade:dt?Math.floor((+(String(hoje.getFullYear())+String(hoje.getMonth()+1).padStart(2,'0')+String(hoje.getDate()).padStart(2,'0'))-+(dt.yyyy+dt.mm+dt.dd))/10000):null,
    seqTextos, especiais};
}

/* =====================================================================
   TABELAS (datas) — window.NC_TABLES
   ===================================================================== */
function anjo(dt){ const T=window.NC_TABLES; if(!T) return null;
  const key=dt.dd+'/'+dt.mm; const nm=T.anjoPorData[key]; if(!nm) return null;
  const m=nm.trim().match(/^(\d+)-(.+)$/);
  return {raw:nm.trim(), numero:m?+m[1]:null, nome:m?m[2]:nm.trim()}; }
function cores(E){ const T=window.NC_TABLES; if(!T) return ''; const a=T.cores[String(E)]; return a?a.join(' '):''; }
function numHarmonicos(dia){ const T=window.NC_TABLES; return T?(T.numHarmonicos[String(dia)]||''):''; }
function diasFavoraveis(dt){ const T=window.NC_TABLES; return T?(T.diasFavoraveis[dt.dd+dt.mm]||''):''; }
function harmonia(missaoNum){ const T=window.NC_TABLES; if(!T) return null;
  let k=missaoNum; if(k===11)k=11; if(k===22)k=22; const h=T.harmonia[String(k)]; return h||null; }
function dividas(r){
  // r: {expressao,motivacao,destino, somaExpr,somaMot,somaDest, dia}
  const slots={}; const add=v=>{ if([13,14,16,19].includes(v)) slots[v]=v; };
  const map=(num, rawShown)=>{ if(num===1) return 19; if(num===4) return 13; if(num===5) return 14; if(num===7) return 16;
    if(num===22) return String(rawShown).trim()==='22'?null:13; return null; };
  if([13,14,16,19].includes(r.dia)) add(r.dia);
  [[r.expressao,r.somaExpr],[r.motivacao,r.somaMot],[r.destino,r.somaDest]].forEach(([num,raw])=>{ const v=map(num,raw); if(v) add(v); });
  const arr=Object.keys(slots).map(Number).sort((a,b)=>a-b);
  return arr;
}

/* =====================================================================
   MAPA COMPLETO
   ===================================================================== */
const LABELS={motivacao:'Motivação',impressao:'Impressão',expressao:'Expressão',destino:'Destino',missao:'Missão',
  diaNatal:'Dia Natalício',psiquico:'Número Psíquico',talento:'Talento Oculto',respSub:'Resposta Subconsciente',
  anoPessoal:'Ano Pessoal',mesPessoal:'Mês Pessoal',diaPessoal:'Dia Pessoal',harmonia:'Harmonia Conjugal'};
const PIR_TIPOS=[{k:'basica',nome:'Básica'},{k:'pessoal',nome:'Pessoal'},{k:'social',nome:'Social'},{k:'destino',nome:'Destino'}];

function calcMapa(nome, nascStr, hoje){
  hoje=hoje||new Date();
  const letras=scanLetters(nome);
  const nn=nameNumbers(nome);
  const counts=letterCounts(nome);
  const carm=carmicNumbers(counts);
  const r={ letras, somas:nn.somas, espirito:nn.espirito,
    motivacao:nn.motivacao, impressao:nn.impressao, expressao:nn.expressao,
    licoes:carm.licoes, tendencias:carm.tendencias, respSub:carm.respSub,
    relInter:[], };
  r.talento=talentoOculto(nn.motTotal, nn.expressao);
  const ri=relacaoIntervalores(counts);
  r.relInter = (ri==='Nenhuma') ? [] : [ri];
  r.relacaoIntervalores=ri;
  r.harmonia=null; r.cores=''; r.numHarmonicos=''; r.diasFavoraveis=''; r.anjo=null;
  const dt=parseDate(nascStr);
  if(dt){
    const dd=dt.d;
    const de=destino(dt); r.destino=de.destino; r.somaDestino=de.somaDestino;
    r.somas.destino=+(dt.dd+dt.mm+dt.yyyy).split('').reduce((a,b)=>a+ +b,0);
    r.missao=missao(r.destino, r.expressao);
    r.diaNatal=dd;
    r.psiquico=psiquico(dd);
    const ap=anoPessoal(dt,hoje); r.anoPessoal=ap.ano; r.anoRef=ap.anoRef;
    r.mesPessoal=mesPessoal(ap.ano,hoje);
    r.diaPessoal=diaPessoal(r.mesPessoal,hoje);
    r.ciclos=ciclos(dt,r.destino);
    r.desafios=desafios(dt);
    r.momentos=momentos(dt,r.destino);
    r.idade=hoje.getFullYear()-dt.y-((hoje.getMonth()+1<dt.m||(hoje.getMonth()+1===dt.m&&hoje.getDate()<dt.d))?1:0);
    r.harmonia=(()=>{ const h=harmonia(r.missao); return h?r.missao:null; })();
    r.harmoniaTab=harmonia(r.missao);
    r.cores=cores(r.expressao);
    r.numHarmonicos=numHarmonicos(dd);
    r.diasFavoraveis=diasFavoraveis(dt);
    r.anjo=anjo(dt);
    r.dividas=dividas({expressao:r.expressao,motivacao:r.motivacao,destino:r.destino,
      somaExpr:r.somas.expressao,somaMot:r.somas.motivacao,somaDest:r.somaDestino,dia:dd});
  } else {
    r.dividas=[];
  }
  return r;
}

/* seções de interpretação para a tela/relatório */
function pick(obj,n){ return (obj&&obj[String(n)])||null; }
function secoes(r){
  const T=window.NC_TEXTS?window.NC_TEXTS.texts:{}, IN=window.NC_TEXTS?window.NC_TEXTS.intros:{};
  const S=[]; const add=(o)=>{ if(o&&o.paras&&o.paras.length) S.push(o); };
  const mk=(key,titulo,grupo,n,tx,secao,curto,introKey)=>({key,titulo,grupo,n:(n==null?'':n),
    paras:(pick(tx,n)||['Texto de interpretação.']), intro:introKey&&IN[introKey]?[IN[introKey][0]]:[], secao, curto});
  add(mk('motivacao','Motivação','Motivação',r.motivacao,T.motivacao,'Os Números do Nome','Motivação','motivacao'));
  add(mk('impressao','Impressão ou Aparência','Impressão',r.impressao,T.impressao,null,'Impressão','impressao'));
  add(mk('expressao','Expressão','Expressão',r.expressao,T.expressao,null,'Expressão','expressao'));
  if(r.destino!=null) add(mk('destino','Número de Destino','Destino',r.destino,T.destino,'Os Números da Data','Destino','destino'));
  if(r.missao!=null) add(mk('missao','Missão','Missão',r.missao,T.missao,null,'Missão','missao'));
  if(r.talento!=null) add(mk('talento','Talento Oculto','Talento Oculto',r.talento,T.talento,null,'Talento','talento'));
  // lições / tendências / dívidas (texto por número)
  if(r.licoes&&r.licoes.length){ r.licoes.forEach(d=>add(mk('licao'+d,'Lição Cármica '+d,'Lições Cármicas',d,T.licao,'Lições e Tendências','Lição '+d,'licao'))); }
  if(r.tendencias&&r.tendencias.length){ r.tendencias.forEach(d=>add(mk('tend'+d,'Tendência Oculta '+d,'Tendências Ocultas',d,T.tendencia,null,'Tend. '+d))); }
  if(r.dividas&&r.dividas.length){ r.dividas.forEach(d=>add(mk('div'+d,'Dívida Cármica '+d,'Dívidas Cármicas',d,T.divida,null,'Dívida '+d))); }
  if(r.respSub){ add(mk('respSub','Resposta Subconsciente','Resposta Subconsciente',r.respSub,T.respSub,null,'Resp. Subc.','respSub')); }
  if(r.relInter&&r.relInter.length){ r.relInter.forEach(d=>add(mk('relint'+d,'Relação Intervalores '+d,'Relação Intervalores',d,T.relInter,null,'Rel. Interv.'))); }
  if(r.psiquico!=null) add(mk('psiquico','Número Psíquico','Número Psíquico',r.psiquico,T.psiquico,null,'Psíquico','psiquico'));
  if(r.diaNatal!=null){ const key=r.diaNatal>=16?'diaNatal2':'diaNatal1'; add(mk('diaNatal','Dia Natalício','Dia Natalício',r.diaNatal,T[key],null,'Dia Natalício')); }
  if(r.anoPessoal!=null) add(mk('anoPessoal','Ano Pessoal','Ano Pessoal',r.anoPessoal,T.anoPessoal,'Momento Atual','Ano Pessoal','anoPessoal'));
  if(r.mesPessoal!=null) add(mk('mesPessoal','Mês Pessoal','Mês Pessoal',r.mesPessoal,T.mesPessoal,null,'Mês Pessoal'));
  if(r.diaPessoal!=null) add(mk('diaPessoal','Dia Pessoal','Dia Pessoal',r.diaPessoal,T.diaPessoal,null,'Dia Pessoal'));
  if(r.ciclos){ r.ciclos.forEach((c,i)=>{ const tx=[T.ciclo1,T.ciclo2,T.ciclo3][i]; add(mk('ciclo'+i,`Número ${c.n} no ${i+1}º Ciclo de Vida`,'Ciclos de Vida',c.n,tx, i===0?'Ciclos e Desafios':null,`Ciclo ${i+1}`,i===0?'ciclo1':null)); }); }
  if(r.desafios){ r.desafios.forEach((d,i)=>add(mk('desafio'+i,`Desafio ${i+1} → ${d}`,'Desafios',d,T.desafio,null,`Desafio ${i+1}`))); }
  if(r.momentos){ r.momentos.forEach((m,i)=>{ const tx=i===0?T.momentosA:T.momentosB; add(mk('momento'+i,`Momento Decisivo ${i+1} (nº ${m.n})`,'Momentos Decisivos',m.n,tx,null,`Momento ${i+1}`)); }); }
  if(r.harmonia!=null){ add({key:'harmonia',titulo:'Harmonia Conjugal '+r.harmonia,grupo:'Harmonia Conjugal',n:r.harmonia,
    secao:'Relacionamentos',curto:'Harmonia',paras:(pick(T.harmonia,r.harmonia)||[]),
    intro:r.harmoniaTab?[`Vibra com: ${r.harmoniaTab.vibra} · Atrai: ${r.harmoniaTab.atrai} · É oposto a: ${r.harmoniaTab.oposto} · É passivo em relação a: ${r.harmoniaTab.passivo}`]:[]}); }
  if(r.anjo){ const key=r.anjo.raw; const paras=(window.NC_TEXTS.texts.anjo_full&&window.NC_TEXTS.texts.anjo_full[key])||[];
    add({key:'anjo',titulo:'Seu Anjo Cabalístico — '+r.anjo.nome,grupo:'Seu Anjo',n:r.anjo.numero||'',secao:'Proteção Espiritual',curto:'Anjo',paras}); }
  return S;
}

return {letterValue, scanLetters:scanLetters, letters:scanLetters, parseDate, calcMapa, piramide, secoes,
  nameNumbers, LABELS, PIR_TIPOS, TAB:LETTERVAL,
  reduceOnce, fullKeepM, full1, harmonia, cores, anjo,
  TX_PIR_INTRO:(window.NC_TEXTS&&window.NC_TEXTS.intros&&window.NC_TEXTS.intros.arcanoVida)||[]};
})();
</script>
<script>/* =====================================================================
   MÓDULOS EXTRAS — Bebê, Empresarial, Placa/Endereço, Vocacional,
   e consultas (Arcanos, Anjos, Harmonia)
   ===================================================================== */

/* ---------- MAPA BEBÊ ---------- */
function moduloBebe(){
  const c=cliente(state.cliente);
  const nm=c?nomeMapa(c):(state.avulso.nome||''), dn=c?c.nasc:(state.avulso.nasc||'');
  $('#main').innerHTML=`<div class="top"><div><h1>Mapa Bebê</h1><p>Mapa para orientar a escolha ou a análise do nome de um bebê</p></div><div class="row"><button class="btn gold" id="bPrint">🖨️ Imprimir / PDF</button></div></div>
    <div class="panel grid2">
      <label class="f">Nome completo do bebê<input id="bn" value="${esc(nm)}" placeholder="Nome e sobrenomes"><div class="accents" id="bacc"></div><span class="hint">Experimente diferentes nomes/sobrenomes para comparar as vibrações.</span></label>
      <label class="f">Data de nascimento (se já nasceu)<input id="bd" value="${dn?fmtDate(dn):''}" placeholder="DD/MM/AAAA" inputmode="numeric"></label>
    </div>
    <div class="panel noprint" style="margin-top:12px;background:#fbf8f1;border-color:#eadfc6"><b>Como usar:</b> o mapa do bebê mostra os mesmos números do mapa cabalístico. Procure um nome cujo <b>Expressão</b> e <b>Motivação</b> sejam harmônicos entre si e com o <b>Destino</b> (data de nascimento), e sem muitas <b>Dívidas Cármicas</b>.</div>
    <div id="bout"></div>`;
  accentBar($('#bacc'),$('#bn'));
  const upd=()=>renderMapa($('#bout'),$('#bn').value,onlyDigits($('#bd').value),null);
  $('#bn').oninput=upd; $('#bd').oninput=e=>{maskDate(e.target);upd();}; upd();
  $('#bPrint').onclick=()=>moduleReport('Mapa Bebê', $('#bn').value.trim()+($('#bd').value?' · '+$('#bd').value:''), grabResult('#bout'));
}

/* ---------- EMPRESARIAL ---------- */
const AREAS_EMPRESA={
  1:'Liderança, pioneirismo, tecnologia, indústria, grandes empreendimentos',
  2:'Parcerias, sociedades, diplomacia, serviços, cooperativas',
  3:'Comunicação, arte, moda, publicidade, entretenimento, beleza',
  4:'Construção, engenharia, organização, serviços estruturados, imóveis',
  5:'Vendas, viagens, turismo, mudanças, variedade, comunicação',
  6:'Alimentação, saúde, educação, família, estética, hotelaria',
  7:'Pesquisa, tecnologia, ciência, espiritualidade, consultoria especializada',
  8:'Finanças, negócios de grande porte, administração, poder, luxo',
  9:'Humanitário, arte, filantropia, serviços amplos, exportação',
  11:'Inspiração, ensino, espiritualidade, projetos visionários',
  22:'Grandes construções, projetos de alcance amplo, realizações materiais'
};
function moduloEmpresa(){
  $('#main').innerHTML=`<div class="top"><div><h1>Numerologia Empresarial</h1><p>Análise da Razão Social, Nome Fantasia e Marca</p></div><div class="row"><button class="btn gold" id="ePrint">🖨️ Imprimir / PDF</button></div></div>
    <div class="panel grid2">
      <label class="f">Razão Social<input id="eRz" placeholder="Nome completo da empresa"><div class="accents" id="eacc1"></div></label>
      <label class="f">Nome Fantasia<input id="eFa" placeholder="Opcional"><div class="accents" id="eacc2"></div></label>
      <label class="f">Área de atuação (vibração desejada 1–9, 11, 22)<select id="eAr">${Object.entries(AREAS_EMPRESA).map(([n,t])=>`<option value="${n}">${n} — ${esc(t.split(',')[0])}</option>`).join('')}</select></label>
      <label class="f">Data de abertura (opcional)<input id="eDt" placeholder="DD/MM/AAAA" inputmode="numeric"></label>
    </div>
    <div id="eout"></div>`;
  accentBar($('#eacc1'),$('#eRz')); accentBar($('#eacc2'),$('#eFa'));
  const upd=()=>{
    const rz=$('#eRz').value.trim(); const fa=$('#eFa').value.trim(); const area=+$('#eAr').value;
    if(!rz){ $('#eout').innerHTML='<div class="panel empty" style="margin-top:14px">Digite a Razão Social.</div>'; return; }
    const calc=nome=>{ const n=NC.nameNumbers(nome); return n; };
    const r=calc(rz); const f=fa?calc(fa):null;
    const dt=NC.parseDate(onlyDigits($('#eDt').value));
    const harm=(num)=>{ // harmônico com a área?
      const map={1:[1,2,4,9],2:[1,2,3,4,5,6,7,8,9],3:[2,3,6,8,9],4:[1,2,6,7],5:[2,5,6,7,9],6:[2,3,4,5,6,9],7:[2,4,5,7],8:[2,3,9],9:[1,2,3,5,6,8,9],11:[2,4,9],22:[1,2,6,7]};
      const base=map[area]||map[NC.full1(area)]||[]; return base.includes(NC.full1(num))||base.includes(num); };
    const linha=(lab,n)=>`<div class="rcellx ${harm(n.expressao)?'ok':'warn'}"><small>${lab}</small><b class="num">${n.expressao}</b><span>${harm(n.expressao)?'Harmônico com a área ✓':'Não harmônico com a área'}</span></div>`;
    $('#eout').innerHTML=`<div class="panel" style="margin-top:14px"><h2>Resultado</h2>
      <div class="grid3" style="margin-top:10px">
        <div class="stat"><small>Vibração da área desejada</small><b class="num">${area}</b></div>
        <div class="stat"><small>Expressão da Razão Social</small><b class="num">${r.expressao}</b></div>
        ${f?`<div class="stat"><small>Expressão do Nome Fantasia</small><b class="num">${f.expressao}</b></div>`:''}
        ${dt?`<div class="stat"><small>Vibração da data de abertura</small><b class="num">${(()=>{const d=NC.calcMapa('x',onlyDigits($('#eDt').value));return d.destino;})()}</b></div>`:''}
      </div>
      <p class="hint" style="margin-top:12px"><b>Área ${area}:</b> ${esc(AREAS_EMPRESA[area]||'')}</p>
      <table class="t" style="margin-top:10px"><tr><th>Nome</th><th>Expressão</th><th>Análise</th></tr>
        <tr><td>${esc(rz)}</td><td class="num" style="font-size:18px;font-weight:700">${r.expressao}</td><td>${harm(r.expressao)?'<span class="badge ok">Harmônico com a área</span>':'<span class="badge">Rever — não harmônico</span>'}</td></tr>

function toast(m,ms=2600){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),ms); }
const fmtDate=s=>{ const d=NC.parseDate(s); return d?`${String(d.d).padStart(2,'0')}/${String(d.m).padStart(2,'0')}/${d.y}`:'—'; };
const onlyDigits=s=>String(s||'').replace(/\D/g,'');

function fmtPhone(p){ const d=onlyDigits(p); if(d.length===13) return `+${d.slice(0,2)} (${d.slice(2,4)}) ${d.slice(4,9)}-${d.slice(9)}`; if(d.length===12) return `+${d.slice(0,2)} (${d.slice(2,4)}) ${d.slice(4,8)}-${d.slice(8)}`; if(d.length===11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; return p||''; }
function waNumber(p){ let d=onlyDigits(p); if(!d) return ''; if(d.length===10||d.length===11) d='55'+d; // DDD + número
  if(d.length===12 && d.startsWith('55')) d=d.slice(0,4)+'9'+d.slice(4); // acrescenta o 9 do celular

function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
async function compressImage(file,maxW=1240,maxH=1754,q=.85){
  const src=await readFile(file); const img=await loadImg(src);
  const s=Math.min(1,maxW/img.width,maxH/img.height); const c=document.createElement('canvas');
  c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
  const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q);
}
async function sha(s){ try{ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }catch(e){ return 'b64:'+btoa(unescape(encodeURIComponent(s.split('').reverse().join('')))); } }

      $('#cl').innerHTML=list.length?list.map(c=>{const r=NC.calcMapa(nomeMapa(c),c.nasc);return `
        <div class="citem"><div class="av num">${r.expressao||'·'}</div>
          <div style="min-width:0"><h3>${esc(c.nome)} ${c.enviado?`<span class="badge ok" title="Enviado em ${new Date(c.enviado).toLocaleString('pt-BR')}">enviado</span>`:''}</h3>
            <div class="meta">${fmtDate(c.nasc)}${c.tel?' · '+esc(fmtPhone(c.tel)):''}${r.idade!=null?' · '+r.idade+' anos':''}</div>
            <div class="chips"><span class="chip">Mot <b>${r.motivacao}</b></span><span class="chip">Imp <b>${r.impressao}</b></span><span class="chip">Exp <b>${r.expressao}</b></span>${r.destino?`<span class="chip">Dest <b>${r.destino}</b></span><span class="chip">Missão <b>${r.missao}</b></span>`:''}</div></div>
          <div class="row acts"><button class="btn sm" data-a="open" data-id="${c.id}">Abrir mapa</button><button class="btn sm gold" data-a="pdf" data-id="${c.id}">PDF</button><button class="btn sm wa" data-a="wa" data-id="${c.id}">WhatsApp</button><button class="btn sm" data-a="edit" data-id="${c.id}">Editar</button></div></div>`}).join('')
        :`<div class="empty panel">${cs.length?'Nenhum cliente encontrado.':'Nenhum cliente ainda.<br>Clique em <b>+ Novo cliente</b> para criar o primeiro mapa.'}</div>`;
    };
    $('#q').oninput=render; $('#ord').onchange=render; render();
    $('#novo').onclick=()=>editCliente();
    $('#avulso').onclick=()=>{state.cliente=null;go('mapa');};
    $('#cl').onclick=e=>{
      const b=e.target.closest('button[data-a]'); if(!b) return;
      const c=cliente(b.dataset.id); if(!c) return;
      ({open:()=>{state.cliente=c.id;go('mapa');}, pdf:()=>openReport(c), wa:()=>whatsModal(c), edit:()=>editCliente(c)})[b.dataset.a]();
    };
  },

  /* ---------- MAPA ---------- */
  mapa(){
    const c=cliente(state.cliente);
    const nome=c?nomeMapa(c):state.avulso.nome, nasc=c?c.nasc:state.avulso.nasc;
    $('#main').innerHTML=`
      <div class="top"><div><h1>Mapa Cabalístico</h1><p>${c?'Cliente: <b>'+esc(c.nome)+'</b>':'Mapa rápido — salve como cliente para guardar as alterações'}</p></div>
        <div class="row">${c?`<button class="btn" id="bEdit">Editar dados</button><button class="btn" id="bPir">△ Pirâmides</button><button class="btn gold" id="bPdf">📄 Gerar PDF</button><button class="btn wa" id="bWa">WhatsApp</button>`:'<button class="btn pri" id="bSalvar">Salvar como cliente</button>'}</div></div>
      <div class="panel grid2">
        <label class="f">Nome completo (como no registro)<input id="nm" value="${esc(nome)}" placeholder="Ex.: Maria Aparecida da Silva" ${c?'readonly title="Use Editar dados para alterar"':''}>${c?'':'<div class="accents" id="acc"></div>'}<span class="hint">Acentos contam: ´ e ' (+2), ~ (+3), ^ e º (+7), \` e ¨ (×2).</span></label>
        <label class="f">Data de nascimento<input id="dn" value="${esc(fmtDate(nasc)!=='—'?fmtDate(nasc):'')}" placeholder="DD/MM/AAAA" inputmode="numeric" ${c?'readonly':''}></label>
      </div>
      <div id="out"></div>`;
    if(!c) accentBar($('#acc'),$('#nm'));
    const upd=()=>{ if(!c){ state.avulso={nome:$('#nm').value,nasc:onlyDigits($('#dn').value)}; } renderMapa($('#out'),$('#nm').value,onlyDigits($('#dn').value),c); };
    if(!c){ $('#nm').oninput=upd; $('#dn').oninput=e=>{maskDate(e.target);upd();}; }
    upd();
    if(c){ $('#bEdit').onclick=()=>editCliente(c); $('#bPdf').onclick=()=>openReport(c); $('#bWa').onclick=()=>whatsModal(c); $('#bPir').onclick=()=>go('piramide'); }
    else $('#bSalvar').onclick=()=>editCliente({nome:$('#nm').value,nasc:onlyDigits($('#dn').value)});
  },

  /* ---------- PIRÂMIDE ---------- */
  piramide(){
    const c=cliente(state.cliente);
    const nm=c?nomeMapa(c):(state.avulso.nome||''), dn=c?c.nasc:(state.avulso.nasc||'');
    $('#main').innerHTML=`
      <div class="top"><div><h1>Pirâmide Invertida</h1><p>Triângulo da Vida, arcanos por período e sequências negativas</p></div>
        <div class="row">${c?`<button class="btn" onclick="go('mapa')">← Voltar ao mapa</button>`:''}<button class="btn gold" id="pPrint">🖨️ Imprimir / PDF</button></div></div>
      <div class="panel grid2"><label class="f">Nome<input id="pn" value="${esc(nm)}"><div class="accents" id="acc"></div></label>
      <label class="f">Data de nascimento<input id="pd" value="${dn?fmtDate(dn):''}" placeholder="DD/MM/AAAA" inputmode="numeric"><span class="hint">A data é usada nas pirâmides Pessoal, Social e Destino e nas idades dos arcanos.</span></label></div>
      <div class="tabs" style="margin:16px 0" id="pt">${NC.PIR_TIPOS.map(m=>`<button data-m="${m.k}" class="${state.pyrMode===m.k?'on':''}">${m.nome}</button>`).join('')}</div>
      <div id="po"></div>`;
    accentBar($('#acc'),$('#pn'));
    const upd=()=>{
      const nome=$('#pn').value, nasc=onlyDigits($('#pd').value);
      if(NC.letters(nome).filter(x=>!x.gap).length<2){ $('#po').innerHTML='<div class="panel empty">Digite o nome.</div>'; return; }
      const P=NC.piramide(nome,nasc,state.pyrMode);
      $('#po').innerHTML=pyrPanelHTML(P);
    };
    $('#pn').oninput=upd; $('#pd').oninput=e=>{maskDate(e.target);upd();};
    $('#pPrint').onclick=()=>{ const tipo=NC.PIR_TIPOS.find(x=>x.k===state.pyrMode); const nome=$('#pn').value.trim();
      moduleReport('Pirâmide Invertida — '+(tipo?tipo.nome:''), nome+($('#pd').value?' · '+$('#pd').value:''), grabResult('#po')); };
    $('#pt').onclick=e=>{const b=e.target.closest('button');if(!b)return;state.pyrMode=b.dataset.m;$$('#pt button').forEach(x=>x.classList.toggle('on',x===b));upd();};
    upd();
  },

  /* ---------- MÓDULOS EXTRAS ---------- */
  bebe(){ moduloBebe(); },
  empresa(){ moduloEmpresa(); },
  endereco(){ moduloPlaca(); },
  vocacional(){ moduloVocacional(); },
  arcanos(){ moduloArcanos(); },
  anjos(){ moduloAnjos(); },
  harmonias(){ moduloHarmonias(); },
  tabela(){
    const cols={};Object.entries(NC.TAB).forEach(([l,v])=>(cols[v]=cols[v]||[]).push(l));
    const extra={1:[],2:["´ +2","' +2","` ×2","¨ ×2"],3:["~ +3"],7:["^ +7","º +7"]};
    $('#main').innerHTML=`<div class="top"><div><h1>Tabela Cabalística</h1><p>Valores das letras e dos acentos</p></div><div class="row"><button class="btn gold" id="tPrint">🖨️ Imprimir / PDF</button></div></div>
      <div id="tout"><div class="panel scroll"><table class="t" style="text-align:center"><tr>${[1,2,3,4,5,6,7,8].map(n=>`<th style="text-align:center;font-size:20px" class="num">${n}</th>`).join('')}</tr>
      ${Array.from({length:7},(_,i)=>`<tr>${[1,2,3,4,5,6,7,8].map(n=>{const a=[...(cols[n]||[]),...(extra[n]||[])];return `<td style="text-align:center;font-weight:600">${a[i]||''}</td>`}).join('')}</tr>`).join('')}</table>

    $('#tPrint').onclick=()=>moduleReport('Tabela Cabalística','Valores das letras e dos acentos',grabResult('#tout'));
  },

  capas(){

    $('#main').innerHTML=`<div class="top"><div><h1>Capas</h1><p>Escolha a capa padrão dos PDFs ou envie as suas próprias imagens</p></div>

        </div></div>
      <div class="panel" style="margin-top:14px"><h2>Texto sobre a capa</h2>
        <label class="ck"><input type="checkbox" id="cvTxt" ${k.capaTexto?'checked':''}> Escrever “Mapa Numerológico”, o nome do cliente e a data sobre a imagem</label>
        <p class="hint">Desmarque se a sua imagem já tiver o texto pronto (por exemplo, uma arte feita no Canva).</p>
        <div id="cvEdit"></div></div>
      <p class="hint" style="margin-top:10px">As imagens são reduzidas automaticamente para o tamanho A4 e ficam salvas neste navegador (entram no backup). Espaço usado: ${(DB.size()/1048576).toFixed(1)} MB de ~5 MB.</p>`;
    $('#cvs').onclick=e=>{
      const d=e.target.closest('[data-del]');
      if(d){ e.stopPropagation(); if(confirmBox('Excluir esta capa?')){ DB.data.capas=DB.data.capas.filter(x=>x.id!==d.dataset.del); if(k.capaPadrao===d.dataset.del) k.capaPadrao='pronta-mandala'; DB.data.clientes.forEach(c=>{if(c.capa===d.dataset.del) c.capa='auto';}); DB.save(); VIEWS.capas(); } return; }
      const b=e.target.closest('.cov'); if(!b) return; k.capaPadrao=b.dataset.id; DB.save(); toast('Capa padrão definida'); VIEWS.capas();
    };
    $('#cvTxt').onchange=e=>{k.capaTexto=e.target.checked;DB.save();};
    const sel=DB.data.capas.find(x=>x.id===k.capaPadrao);
    if(sel){ $('#cvEdit').innerHTML=`<div class="grid3" style="margin-top:12px"><label class="f">Nome da capa<input id="cvN" value="${esc(sel.nome)}"></label>
        <label class="f">Posição do texto<select id="cvP"><option value="top">Em cima</option><option value="center">No meio</option><option value="bottom">Embaixo</option></select></label>
        <label class="f">Cor do texto<select id="cvT"><option value="light">Clara (para imagem escura)</option><option value="dark">Escura (para imagem clara)</option></select></label></div>`;
      $('#cvP').value=sel.pos||'bottom'; $('#cvT').value=sel.tone||'light';
      $('#cvN').onchange=e=>{sel.nome=e.target.value;DB.save();}; $('#cvP').onchange=e=>{sel.pos=e.target.value;DB.save();}; $('#cvT').onchange=e=>{sel.tone=e.target.value;DB.save();};
    }
    $('#cvUp').onchange=async e=>{
      const fs=[...e.target.files]; if(!fs.length) return;
      for(const f of fs){ try{ const src=await compressImage(f); const c={id:uid(),nome:f.name.replace(/\.[^.]+$/,'').slice(0,40),src,pos:'bottom',tone:'light'}; DB.data.capas.push(c); if(!DB.save()){ DB.data.capas.pop(); break; } k.capaPadrao=c.id; }catch(err){ toast('Não consegui ler '+f.name); } }
      DB.save(); toast(fs.length>1?'Capas adicionadas':'Capa adicionada e definida como padrão'); VIEWS.capas();
    };
  },

      <div class="panel" style="margin-top:14px"><h2>Mensagem do WhatsApp</h2>

        <span class="hint">Variáveis: {primeiro_nome}, {nome}, {o_a} (o/a), {a_o}, {voce_a} (você), {querida_o} (querida/querido), {cliente_a} (cliente), {numerologa}, {whats_numerologa}, {subtitulo}. Antes de enviar você ainda pode editar a mensagem de cada cliente.</span></label>

    $('#thm').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;k.tema=b.dataset.t;DB.save();applyTheme();$$('#thm .theme').forEach(x=>x.classList.toggle('on',x===b));};
    $('#cfL').onchange=async e=>{const f=e.target.files[0];if(!f)return;k.logo=await compressImage(f,600,600,.9);DB.save();toast('Logo salvo');VIEWS.config();};

  /* ---------- BACKUP ---------- */
  backup(){
    const k=CFG();
    $('#main').innerHTML=`<div class="top"><div><h1>Importar / Exportar</h1><p>Cópias de segurança dos clientes, mapas, capas e configurações</p></div></div>
      <div class="grid2">
        <div class="panel"><h2>Exportar tudo</h2><p class="hint">Baixa um arquivo <b>.json</b> com todos os clientes, textos editados, capas e configurações. Guarde no Google Drive ou no computador.</p>
          <div class="row"><button class="btn pri" id="exp">Baixar backup completo</button><button class="btn" id="expL">Sem as imagens (arquivo menor)</button></div>
          <p class="hint">Último backup: ${k.ultimoBackup?new Date(k.ultimoBackup).toLocaleString('pt-BR'):'nunca'}</p></div>
        <div class="panel"><h2>Importar</h2><p class="hint">Carrega um backup do NumCabala (este sistema ou a versão anterior).</p>
          <label class="ck"><input type="radio" name="impm" value="merge" checked> Juntar com os dados atuais (clientes iguais são atualizados)</label>
          <label class="ck"><input type="radio" name="impm" value="replace"> Substituir tudo pelos dados do arquivo</label>
          <div class="row" style="margin-top:10px"><label class="btn gold" style="cursor:pointer">Escolher arquivo…<input type="file" id="imp" accept=".json,application/json" hidden></label></div></div>
        <div class="panel"><h2>Exportar clientes (planilha)</h2><p class="hint">Lista de clientes com os números principais em <b>.csv</b> (abre no Excel).</p><button class="btn" id="csv">Baixar planilha</button></div>
        <div class="panel"><h2>Armazenamento</h2><p class="hint">Usado: <b>${(DB.size()/1048576).toFixed(2)} MB</b> de aproximadamente 5 MB disponíveis neste navegador.</p>
          <button class="btn danger" id="wipe">Apagar todos os dados deste navegador…</button></div>
      </div>`;
    const exp=(semImg)=>{const d=JSON.parse(JSON.stringify(DB.data)); d.app='NumCabala'; d.versao=2; d.exportado=new Date().toISOString(); if(semImg){ d.capas=[]; d.config.logo=''; }
      download(`numcabala-backup-${new Date().toISOString().slice(0,10)}${semImg?'-sem-imagens':''}.json`,new Blob([JSON.stringify(d,null,1)],{type:'application/json'}));
      k.ultimoBackup=Date.now(); DB.save(); toast('Backup exportado'); };
    $('#exp').onclick=()=>exp(false); $('#expL').onclick=()=>exp(true);
    $('#imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;
      try{ const j=JSON.parse(await readFile(f,'text')); const modo=document.querySelector('input[name=impm]:checked').value;
        if(!j||!Array.isArray(j.clientes)) throw 0;
        if(modo==='replace'){ if(!confirmBox('Substituir TODOS os dados atuais pelo arquivo?')) return; const d=DB.defaults(); d.clientes=j.clientes; d.capas=j.capas||[]; Object.assign(d.config,j.config||{}); DB.data=d; }
        else { j.clientes.forEach(c=>{ if(!c.id) c.id=uid(); const i=DB.data.clientes.findIndex(x=>x.id===c.id); if(i>=0) DB.data.clientes[i]=c; else DB.data.clientes.push(c); });
          (j.capas||[]).forEach(c=>{ if(!DB.data.capas.find(x=>x.id===c.id)) DB.data.capas.push(c); });
          if(j.config){ const keep=DB.data.config.senha; Object.assign(DB.data.config,j.config); if(keep&&!j.config.senha) DB.data.config.senha=keep; } }
        DB.save(); refreshBrand(); toast(j.clientes.length+' cliente(s) importado(s)'); VIEWS.backup();
      }catch(err){ toast('Arquivo inválido'); } };
    $('#csv').onclick=()=>{ const H=['Nome','Nome no mapa','Nascimento','Telefone','E-mail','Motivação','Impressão','Expressão','Destino','Missão','Enviado em'];
      const rows=DB.data.clientes.map(c=>{const r=NC.calcMapa(nomeMapa(c),c.nasc);return [c.nome,c.nomeMapa||'',fmtDate(c.nasc),c.tel||'',c.email||'',r.motivacao,r.impressao,r.expressao,r.destino??'',r.missao??'',c.enviado?new Date(c.enviado).toLocaleString('pt-BR'):''];});
      const csv='﻿'+[H,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
      download('numcabala-clientes.csv',new Blob([csv],{type:'text/csv'})); };
    $('#wipe').onclick=()=>{ if(confirmBox('Apagar TODOS os clientes, capas e configurações deste navegador? Faça um backup antes!') && confirmBox('Tem certeza? Esta ação não pode ser desfeita.')){ localStorage.removeItem(KEY); localStorage.removeItem(OLDKEY); DB.load(); DB.save(); toast('Dados apagados'); go('clientes'); } };
  },
};
function confirmBox(m){ return window.confirm(m); }

   COMPONENTES DO MAPA

function nameBoxHTML(letras){
  return letras.map(x=>x.gap?'<div class="lt gap"></div>':`<div class="lt ${x.vowel?'vow':''}"><span>${esc(x.disp)}</span><span>${x.v}</span></div>`).join('');
}
function accentBar(box,input){
  if(!box) return;
  [['´','́'],['`','̀'],['~','̃'],['¨','̈'],['^','̂'],["'","'"],['º','º']].forEach(([lab,ch])=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=lab; b.title='Inserir acento após a letra';
    b.onclick=()=>{const p=input.selectionStart??input.value.length; input.value=(input.value.slice(0,p)+ch+input.value.slice(p)).normalize('NFC'); input.focus(); input.dispatchEvent(new Event('input'));};
    box.appendChild(b);
  });
}
function getSecText(c,s){ return (c&&c.textos&&c.textos[s.key]!=null)?c.textos[s.key]:s.paras.join('\n\n'); }
function isOff(c,s){ return !!(c&&c.ocultar&&c.ocultar[s.key]); }

function renderMapa(out,nome,nasc,c){
  if(!nome.trim()){ out.innerHTML='<div class="panel empty" style="margin-top:16px">Digite o nome para calcular o mapa.</div>'; return; }
  const r=NC.calcMapa(nome,nasc);
  const S=NC.secoes(r);
  const tile=(lab,v,sub='',cls='')=>`<button class="tile ${[11,22].includes(v)?'master':''}" data-go="${esc(lab)}"><small>${lab}</small><div class="v ${cls}">${v??'—'}</div>${sub?`<div class="s">${sub}</div>`:''}</button>`;
  const list=a=>a&&a.length?a.join(', '):'nenhuma';
  out.innerHTML=`
    <div class="panel" style="margin-top:16px"><div class="namebox">${nameBoxHTML(r.letras)}</div>
      <div class="hint">Vogais destacadas em dourado · soma das vogais ${r.somas.motivacao} · consoantes ${r.somas.impressao} · total ${r.somas.expressao}${r.somas.destino?` · data ${r.somas.destino}`:''}${r.idade!=null?` · idade ${r.idade} anos`:''}</div></div>
    <div class="tiles">
      ${tile('Motivação',r.motivacao)}${tile('Impressão',r.impressao)}${tile('Expressão',r.expressao)}
      ${tile('Destino',r.destino)}${tile('Missão',r.missao)}${tile('Talento Oculto',r.talento)}
      ${tile('Dia Natalício',r.diaNatal)}${tile('Número Psíquico',r.psiquico)}${tile('Resposta Subconsciente',r.respSub)}
      ${tile('Lições Cármicas',list(r.licoes),'','sm')}${tile('Tendências Ocultas',list(r.tendencias),'','sm')}${tile('Dívidas Cármicas',list(r.dividas),'','sm')}
      ${r.ciclos?`${tile('Ciclos de Vida',r.ciclos.map(x=>x.n).join(' · '),'','sm')}${tile('Desafios',r.desafios.join(' · '),'','sm')}${tile('Momentos Decisivos',r.momentos.map(x=>x.n).join(' · '),'','sm')}
      ${tile('Ano Pessoal',r.anoPessoal,r.anoRef)}${tile('Mês Pessoal',r.mesPessoal)}${tile('Dia Pessoal',r.diaPessoal)}`:''}
      ${tile('Harmonia Conjugal',r.harmonia)}${tile('Relação Intervalores',list(r.relInter),'','sm')}
      ${r.numHarmonicos?tile('Números Harmônicos',r.numHarmonicos,'','xs'):''}${r.diasFavoraveis?tile('Dias Favoráveis',r.diasFavoraveis,'','xs'):''}
      ${r.cores?tile('Cores Favoráveis',r.cores,'','xs'):''}${r.anjo?tile('Seu Anjo',r.anjo.nome,r.anjo.categoria||'','xs'):''}
    </div>
    <div class="sect"><h2>Interpretação</h2><p class="hint">Clique no texto para alterar. ${c?'As alterações ficam salvas só neste cliente. Use <b>Ocultar do PDF</b> para tirar uma parte do mapa entregue.':'<b>Salve como cliente</b> para guardar alterações.'}</p>
      <div class="toc">${S.map(s=>`<a href="#s_${s.key}">${esc(s.curto||s.titulo)}</a>`).join('')}</div>
      ${S.map(s=>{const ed=c&&c.textos&&c.textos[s.key]!=null;return `
      <div class="interp ${isOff(c,s)?'off':''}" id="s_${s.key}" data-k="${s.key}">
        <header><span class="n">${s.n??''}</span><h3>${esc(s.titulo)}</h3>${ed?'<span class="edited">editado</span>':''}
          ${c?`<div class="acts"><button class="btn sm ghost" data-a="hide">${isOff(c,s)?'Mostrar no PDF':'Ocultar do PDF'}</button>${ed?'<button class="btn sm ghost" data-a="reset">Restaurar original</button>':''}</div>`:''}</header>
        ${s.intro&&s.intro.length?`<div class="hint" style="font-style:italic;margin-bottom:6px">${esc(s.intro.join(' '))}</div>`:''}
        <div class="txt" contenteditable="${c?'true':'false'}" spellcheck="true">${esc(getSecText(c,s))}</div></div>`}).join('')}
    </div>
    ${c?`<div class="sect panel"><h2>Observações da numeróloga</h2><p class="hint">Texto pessoal que entra no PDF logo após “Seus números” (deixe vazio para não incluir).</p>
      <label class="f"><textarea id="obsPdf" rows="5" placeholder="Ex.: Querida Maria, observei no seu mapa que…">${esc(c.obsPdf||'')}</textarea></label></div>`:''}`;
  out.querySelectorAll('.tile[data-go]').forEach(t=>t.onclick=()=>{
    const lab=t.dataset.go; const s=S.find(x=>x.grupo===lab)||S.find(x=>x.titulo.toLowerCase().includes(lab.toLowerCase().split(' ')[0]));
    if(s) document.getElementById('s_'+s.key)?.scrollIntoView({behavior:'smooth',block:'start'});
  });
  if(!c) return;
  out.querySelectorAll('.interp').forEach(box=>{
    const s=S.find(x=>x.key===box.dataset.k); const txt=box.querySelector('.txt');
    txt.onblur=()=>{ const v=txt.innerText.replace(/\n{3,}/g,'\n\n').trim(); const orig=s.paras.join('\n\n');
      c.textos=c.textos||{}; if(v===orig.trim()) delete c.textos[s.key]; else c.textos[s.key]=v; c.atualizado=Date.now(); DB.save(); };
    box.querySelector('[data-a=hide]').onclick=()=>{ c.ocultar=c.ocultar||{}; c.ocultar[s.key]=!c.ocultar[s.key]; c.atualizado=Date.now(); DB.save(); renderMapa(out,nome,nasc,c); document.getElementById('s_'+s.key)?.scrollIntoView({block:'center'}); };
    const rs=box.querySelector('[data-a=reset]'); if(rs) rs.onclick=()=>{ delete c.textos[s.key]; DB.save(); renderMapa(out,nome,nasc,c); document.getElementById('s_'+s.key)?.scrollIntoView({block:'center'}); toast('Texto original restaurado'); };
  });
  const ob=$('#obsPdf'); if(ob) ob.onchange=()=>{ c.obsPdf=ob.value; c.atualizado=Date.now(); DB.save(); toast('Observação salva'); };
}

function pyrRowsHTML(P,cls='pyr'){
  const inSeq=(ri,i)=>P.seqs.some(s=>s.row===ri&&i>=s.from&&i<=s.to);
  return `<div class="${cls}"><div class="r letters">${P.letras.map(l=>`<span>${esc(l.disp)}</span>`).join('')}</div>${P.linhas.map((r,ri)=>`<div class="r ${ri===0?'base':''}" style="padding-left:${ri*0.725}em">${r.map((d,i)=>`<span class="${inSeq(ri,i)?'seq':''}">${d}</span>`).join('')}</div>`).join('')}</div>`;
}
function pyrPanelHTML(P){
  return `<div class="panel">${pyrRowsHTML(P)}
    <p style="text-align:center;margin:6px 0 0"><b>Base da pirâmide:</b> ${P.base} ${P.baseTexto?'— '+esc(P.baseTexto):''}</p></div>
    <div class="grid2" style="margin-top:14px">
      <div class="panel"><h2>Arcanos por período</h2><div class="scroll"><table class="t"><tr><th>Arcano</th><th>Carta</th><th>Idade</th></tr>
        ${P.arcanos.map(a=>`<tr><td class="num" style="font-size:18px;font-weight:700">${a.n}</td><td>${esc(a.carta||'')}</td><td>${a.de} a ${a.ate} anos</td></tr>`).join('')}</table></div>
        ${P.arcanoAtual?`<p class="hint">Arcano atual (idade ${P.idade}): <b>${P.arcanoAtual.n}</b> ${esc(P.arcanoAtual.carta||'')}</p>`:''}</div>
      <div class="panel"><h2>Sequências negativas</h2>${P.seqTextos.length?P.seqTextos.map(t=>`<div class="interp" style="margin:8px 0"><header><h3>${esc(t.titulo)}</h3></header><div class="txt">${esc(t.paras.join('\n\n'))}</div></div>`).join(''):'<p>Nenhuma sequência negativa encontrada. ✨</p>'}
      ${P.especiais&&P.especiais.length?`<h2 style="margin-top:12px">Sequências especiais</h2>${P.especiais.map(t=>`<p><b>${t.n}</b> — ${esc(t.texto)}</p>`).join('')}`:''}</div>
    </div>
    ${P.arcanos.length?`<div class="sect"><h2>Significado dos arcanos</h2>${P.arcanosUnicos.map(a=>`<div class="interp"><header><span class="n">${a.n}</span><h3>${esc(a.carta||'Arcano '+a.n)}</h3></header><div class="txt">${esc(a.texto)}</div></div>`).join('')}</div>`:''}`;
}

function editCliente(c){
  const isNew=!c||!c.id; c=c||{};
  const m=document.createElement('div'); m.className='modal';
  const cps=allCapas();
  m.innerHTML=`<form class="panel wide" style="display:grid;gap:12px"><h2 style="font-size:22px">${isNew?'Novo cliente':'Editar cliente'}</h2>
    <div class="grid2">
      <label class="f">Nome completo<input id="eN" required value="${esc(c.nome||'')}"></label>
      <label class="f">Nome para o mapa <span class="hint">(se diferente — ex.: nome de assinatura)</span><input id="eM" value="${esc(c.nomeMapa||'')}"></label>
      <label class="f">Data de nascimento<input id="eD" required placeholder="DD/MM/AAAA" inputmode="numeric" value="${c.nasc?fmtDate(c.nasc):''}"></label>
      <label class="f">Tratamento na mensagem<select id="eG"><option value="f">Feminino (querida, a cliente)</option><option value="m">Masculino (querido, o cliente)</option></select></label>
      <label class="f">WhatsApp do cliente<input id="eT" value="${esc(fmtPhone(c.tel||''))}" inputmode="tel" placeholder="(49) 99999-9999"></label>
      <label class="f">E-mail<input id="eE" value="${esc(c.email||'')}" type="email"></label>
      <label class="f">Capa do PDF<select id="eC"><option value="auto">Usar a capa padrão</option><option value="padrao">Capa clássica</option>${cps.map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join('')}</select></label>
      <label class="f">Observações internas<textarea id="eO" rows="2" placeholder="Não aparecem no PDF">${esc(c.obs||'')}</textarea></label>
    </div>
    <div class="accents" id="eAcc"></div><span class="hint" style="margin-top:-8px">Botões de acento inserem no “Nome completo”.</span>
    <div class="row" style="justify-content:space-between"><div>${isNew?'':'<button type="button" class="btn danger" id="eDel">Excluir cliente</button>'}</div>
    <div class="row"><button type="button" class="btn" id="eX">Cancelar</button><button class="btn pri">Salvar</button></div></div>
    <div id="eConf" hidden class="panel" style="background:#fff4ef;border-color:#f0c9b8">Excluir este cliente e todos os textos editados? <div class="row" style="margin-top:8px"><button type="button" class="btn danger" id="eYes">Sim, excluir</button><button type="button" class="btn" id="eNo">Não</button></div></div></form>`;
  document.body.appendChild(m);
  const q=s=>m.querySelector(s);
  q('#eG').value=c.genero||'f'; q('#eC').value=c.capa||'auto';
  accentBar(q('#eAcc'),q('#eN'));
  q('#eD').oninput=e=>maskDate(e.target);
  q('#eX').onclick=()=>m.remove();
  m.onclick=e=>{ if(e.target===m) m.remove(); };
  if(!isNew){ q('#eDel').onclick=()=>q('#eConf').hidden=false; q('#eNo').onclick=()=>q('#eConf').hidden=true;
    q('#eYes').onclick=()=>{DB.data.clientes=DB.data.clientes.filter(x=>x.id!==c.id);DB.save();m.remove();toast('Cliente excluído');state.cliente=null;go('clientes');}; }
  q('form').onsubmit=e=>{
    e.preventDefault();
    const nasc=onlyDigits(q('#eD').value);
    if(!NC.parseDate(nasc)){ toast('Data inválida (use DD/MM/AAAA)'); return; }
    const nomeAnt=nomeMapa(c), nascAnt=c.nasc;
    Object.assign(c,{nome:q('#eN').value.trim(),nomeMapa:q('#eM').value.trim(),nasc,genero:q('#eG').value,tel:onlyDigits(q('#eT').value),email:q('#eE').value.trim(),capa:q('#eC').value,obs:q('#eO').value,atualizado:Date.now()});
    if(!isNew && (nomeAnt!==nomeMapa(c)||nascAnt!==nasc) && c.textos && Object.keys(c.textos).length){
      if(confirmBox('O nome ou a data mudou. Descartar os textos editados (para usar os textos dos novos números)?')) c.textos={};
    }
    if(isNew){ c.id=uid(); c.criado=Date.now(); DB.data.clientes.push(c); }
    DB.save(); m.remove(); toast('Cliente salvo'); state.cliente=c.id; go(isNew?'mapa':state.view);
  };
  setTimeout(()=>q('#eN').focus(),50);
}

const fill=(tpl,v)=>String(tpl||'').replace(/\{(\w+)\}/g,(m,k)=>v[k]!=null?v[k]:m);

  const k=CFG(), cp=capaDoCliente(c), hoje=new Date().toLocaleDateString('pt-BR');
